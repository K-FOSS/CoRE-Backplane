{{ if .Values.harbor.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: registry-routes

  labels:
    wan-mode: 'public'
    lan-mode: 'private'

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: '{{ .Values.gateway.namespace }}'
      name: '{{ .Values.gateway.name }}'
      sectionName: '{{ .Values.gateway.sectionName }}'

  hostnames:
    - 'registry.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.writemy.codes'

  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /api

      - path:
          type: PathPrefix
          value: /service

      - path:
          type: PathPrefix
          value: /v2

      - path:
          type: PathPrefix
          value: /chartrepo

      - path:
          type: PathPrefix
          value: /c
      
      timeouts:
        backendRequest: 1800s
        request: 1800s

      backendRefs:
        - group: ''
          kind: Service
          name: {{ .Release.Name }}-harbor-helm-core
          port: 80
          weight: 1



    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Release.Name }}-harbor-helm-portal
          port: 80
          weight: 1

      timeouts:
        backendRequest: 1800s
        request: 1800s

      matches:
        - path:
            type: PathPrefix
            value: /
{{- end }}
