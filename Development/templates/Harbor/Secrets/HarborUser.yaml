{{ if .Values.harbor.enabled }}
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: harbor-user

  annotations:
    argocd.argoproj.io/sync-wave: '0'

spec:
  name: 'Harbor {{ .Values.cluster.name }}'

  username: 'harbor-{{ .Values.cluster.name }}'

  psql:
    enabled: true
    createUserDatabase: true
    crossplane:
      terraformProvider: 'psql-{{ .Values.datacenter }}-{{ .Values.region }}'
      crossplaneProvider: 'psql-{{ .Values.datacenter }}-{{ .Values.region }}'

  writeConnectionSecretToRef:
    name: harbor-user
{{- end }}
