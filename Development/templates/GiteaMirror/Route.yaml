{{- if (index .Values "gitea-mirror").enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: 'gitea-mirror'
  annotations:
    forecastle.stakater.com/expose: 'true'
    forecastle.stakater.com/instance: 'core'
    forecastle.stakater.com/appName: 'Gitea Mirror {{ .Values.cluster.name }}'
    forecastle.stakater.com/group: 'Tools'
  labels:
    wan-mode: 'public'
    lan-mode: 'private'
spec:
  parentRefs:
    - group: 'gateway.networking.k8s.io'
      kind: Gateway
      namespace: 'core-prod'
      name: 'main-gw'
      sectionName: 'https-myloginspace'
  hostnames:
    - '{{ .Values.giteaMirror.hostname }}'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: '/'
      backendRefs:
        - name: 'gitea-mirror'
          port: 4321
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: 'gitea-mirror-outpost'
spec:
  parentRefs:
    - group: 'gateway.networking.k8s.io'
      kind: Gateway
      namespace: 'core-prod'
      name: 'main-gw'
      sectionName: 'https-myloginspace'
  hostnames:
    - '{{ .Values.giteaMirror.hostname }}'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: '/outpost.goauthentik.io'
      backendRefs:
        - name: 'aaa-myloginspace-proxy'
          namespace: 'core-prod'
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: 'gitea-mirror'
spec:
  targetRefs:
    - group: 'gateway.networking.k8s.io'
      kind: HTTPRoute
      name: 'gitea-mirror'
  extAuth:
    failOpen: false
    headersToExtAuth:
      - 'cookie'
    http:
      headersToBackend:
        - 'set-cookie'
        - 'x-authentik-*'
        - 'authorization'
        - 'Content-Type'
        - 'Location'
      backendSettings:
        loadBalancer:
          type: 'ConsistentHash'
          consistentHash:
            type: 'SourceIP'
      backendRefs:
        - group: ''
          kind: Service
          namespace: 'core-prod'
          name: 'aaa-myloginspace-proxy'
          port: 80
      path: '/outpost.goauthentik.io/auth/envoy'
{{- end }}
