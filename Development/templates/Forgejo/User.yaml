{{- if .Values.forgejo.enabled }}
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: 'forgejo-user'
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  name: 'Forgejo {{ .Values.cluster.name }}'
  username: 'forgejo-{{ .Values.cluster.name }}'
  psql:
    enabled: true
    createUserDatabase: true
    crossplane:
      terraformProvider: 'psql-{{ .Values.datacenter }}-{{ .Values.region }}'
      crossplaneProvider: 'psql-{{ .Values.datacenter }}-{{ .Values.region }}'
  {{- if eq .Values.region "yxl" }}
  s3:
    enabled: true
    backend: 'garage'
    createUserBucket: false
    createBuckets: true
    buckets:
      - 'forgejo-{{ .Values.cluster.name }}'
    createCredentials: false
    createServiceAccount: true
    garage:
      clusterName: 'lab-garage-local'
      namespace: 'core-testing'
      endpoint: 'http://lab-garage-local.core-testing.svc.{{ .Values.cluster.domain }}:3900'
    writeServiceAccountCredentialsSecretRef:
      namespace: '{{ .Release.Namespace }}'
      name: 'forgejo-garage-s3'
  {{- end }}
  writeConnectionSecretToRef:
    name: 'forgejo-user'
{{- end }}
