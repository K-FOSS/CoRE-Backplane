{{- if .Values.forgejoRunner.enabled }}
{{- if .Values.forgejo.enabled }}
{{- range .Values.forgejoRunner.locations }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: 'forgejo-runner-{{ .name }}'
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  length: 20
  encoding: 'hex'
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: 'forgejo-runner-{{ .name }}'
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  refreshPolicy: 'CreatedOnce'
  target:
    name: 'forgejo-runner-{{ .name }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: 'forgejo-runner-{{ .name }}'
---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: 'forgejo-runner-{{ .name }}-vault-sync'
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  refreshInterval: '1h'
  secretStoreRefs:
    - name: 'mainvault-core'
      kind: ClusterSecretStore
  selector:
    secret:
      name: 'forgejo-runner-{{ .name }}'
  data:
    - match:
        secretKey: 'password'
        remoteRef:
          remoteKey: 'Forgejo/{{ $.Values.cluster.name }}/Runner/{{ .name }}'
          property: 'password'
{{- end }}
{{- end }}
{{- range .Values.forgejoRunner.targets }}
{{- $targetName := .name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: 'forgejo-runner-{{ .name }}'
  namespace: '{{ $.Values.forgejoRunner.namespace }}'
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  refreshPolicy: 'Periodic'
  refreshInterval: '1h'
  secretStoreRef:
    name: 'mainvault-core'
    kind: ClusterSecretStore
  target:
    name: 'forgejo-runner-{{ .name }}'
    template:
      engineVersion: 'v2'
      data:
        password: '{{ `{{ .password }}` }}'
        config.yaml: |-
          log:
            level: 'info'
            job_level: 'info'
          runner:
            capacity: 1
            timeout: '12h'
            shutdown_timeout: '12h'
            insecure: false
            fetch_timeout: '5s'
            fetch_interval: '2s'
            report_interval: '1s'
            envs:
              DOCKER_HOST: 'tcp://127.0.0.1:2376'
              DOCKER_TLS_VERIFY: '1'
              DOCKER_CERT_PATH: '/certs/client'
          cache:
            enabled: true
          container:
            network: 'host'
            privileged: false
            options: '--volume /certs/client:/certs/client:ro --volume /usr/local/bin/docker:/usr/local/bin/docker:ro'
            valid_volumes:
              - '/certs/client'
              - '/usr/local/bin/docker'
            docker_host: '-'
            force_pull: true
          server:
            connections:
              local:
                url: '{{ .url }}'
                uuid: '{{ `{{ printf "%x-%x-%x-%x-%x" (substr 0 4 .password) (substr 4 6 .password) (substr 6 8 .password) (substr 8 10 .password) (substr 10 16 .password) }}` }}'
                token_url: 'file:/var/run/secrets/forgejo-runner/password'
                labels:
                  - 'docker:docker://{{ $.Values.forgejoRunner.jobImage.repository }}:{{ $.Values.forgejoRunner.jobImage.tag }}'
                  - 'ubuntu-latest:docker://{{ $.Values.forgejoRunner.jobImage.repository }}:{{ $.Values.forgejoRunner.jobImage.tag }}'
  data:
    - secretKey: 'password'
      remoteRef:
        key: 'Forgejo/{{ .name }}/Runner/{{ $.Values.cluster.name }}'
        property: 'password'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 'forgejo-runner-{{ .name }}'
  namespace: '{{ $.Values.forgejoRunner.namespace }}'
  labels:
    app.kubernetes.io/name: 'forgejo-runner'
    app.kubernetes.io/instance: 'forgejo-{{ $.Values.cluster.name }}'
    app.kubernetes.io/component: 'actions-runner'
    forgejo.mylogin.space/target: '{{ .name }}'
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  replicas: {{ $.Values.forgejoRunner.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: 'forgejo-runner'
      app.kubernetes.io/instance: 'forgejo-{{ $.Values.cluster.name }}'
      forgejo.mylogin.space/target: '{{ .name }}'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 'forgejo-runner'
        app.kubernetes.io/instance: 'forgejo-{{ $.Values.cluster.name }}'
        app.kubernetes.io/component: 'actions-runner'
        forgejo.mylogin.space/target: '{{ .name }}'
      annotations:
        secret.reloader.stakater.com/reload: 'forgejo-runner-{{ .name }}'
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 43230
{{- with $.Values.forgejoRunner.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: 'forgejo-runner'
                  app.kubernetes.io/component: 'actions-runner'
                  forgejo.mylogin.space/target: '{{ $targetName }}'
              topologyKey: 'kubernetes.io/hostname'
{{- end }}
      containers:
        - name: 'runner'
          image: '{{ $.Values.forgejoRunner.image.repository }}:{{ $.Values.forgejoRunner.image.tag }}@{{ $.Values.forgejoRunner.image.digest }}'
          imagePullPolicy: 'IfNotPresent'
          command:
            - '/bin/sh'
            - '-ec'
          args:
            - |-
              until nc -z '127.0.0.1' '2376'; do
                echo 'Waiting for the site-local Docker daemon.'
                sleep 2
              done
              exec /bin/forgejo-runner --config '/etc/forgejo-runner/config.yaml' daemon
          env:
            - name: 'DOCKER_HOST'
              value: 'tcp://127.0.0.1:2376'
            - name: 'DOCKER_TLS_VERIFY'
              value: '1'
            - name: 'DOCKER_CERT_PATH'
              value: '/certs/client'
          resources:
{{ toYaml $.Values.forgejoRunner.resources.runner | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - 'ALL'
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: 'runner-config'
              mountPath: '/etc/forgejo-runner'
              readOnly: true
            - name: 'runner-credentials'
              mountPath: '/var/run/secrets/forgejo-runner'
              readOnly: true
            - name: 'docker-certs'
              mountPath: '/certs'
              readOnly: true
            - name: 'runner-data'
              mountPath: '/data'
            - name: 'runner-tmp'
              mountPath: '/tmp'
        - name: 'dind'
          image: '{{ $.Values.forgejoRunner.dind.image.repository }}:{{ $.Values.forgejoRunner.dind.image.tag }}@{{ $.Values.forgejoRunner.dind.image.digest }}'
          imagePullPolicy: 'IfNotPresent'
          env:
            - name: 'DOCKER_TLS_CERTDIR'
              value: '/certs'
          resources:
{{ toYaml $.Values.forgejoRunner.resources.dind | indent 12 }}
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          startupProbe:
            exec:
              command:
                - 'docker'
                - 'info'
            failureThreshold: 30
            periodSeconds: 2
          volumeMounts:
            - name: 'docker-certs'
              mountPath: '/certs'
            - name: 'docker-data'
              mountPath: '/var/lib/docker'
      volumes:
        - name: 'runner-config'
          secret:
            secretName: 'forgejo-runner-{{ .name }}'
            items:
              - key: 'config.yaml'
                path: 'config.yaml'
        - name: 'runner-credentials'
          secret:
            secretName: 'forgejo-runner-{{ .name }}'
            items:
              - key: 'password'
                path: 'password'
        - name: 'docker-certs'
          emptyDir: {}
        - name: 'docker-data'
{{ include "development-core.forgejoRunnerVolume" $.Values.forgejoRunner.volumes.docker | indent 10 }}
        - name: 'runner-data'
{{ include "development-core.forgejoRunnerVolume" $.Values.forgejoRunner.volumes.runner | indent 10 }}
        - name: 'runner-tmp'
{{ include "development-core.forgejoRunnerVolume" $.Values.forgejoRunner.volumes.tmp | indent 10 }}
{{- end }}
{{- end }}

{{- define "development-core.forgejoRunnerVolume" -}}
{{- if eq .type "emptyDir" }}
emptyDir:
{{ toYaml .emptyDir | indent 2 }}
{{- else if eq .type "persistentVolumeClaim" }}
persistentVolumeClaim:
{{ toYaml .persistentVolumeClaim | indent 2 }}
{{- else }}
{{- fail (printf "unsupported forgejoRunner volume type %q; use emptyDir or persistentVolumeClaim" .type) }}
{{- end }}
{{- end }}
