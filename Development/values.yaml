hub: false


# Cluster identity used by local routes, service DNS, and identity resources.
domain: writemy.codes

cluster:
  name: k8s
  domain: cluster.local

gateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

datacenter: dc1
region: yxl


# Artifact Hub is disabled by every current fleet override. These values remain
# as the complete intentional configuration for a future enabled deployment.
artifact-hub:
  enabled: true

  type: 'hub'
  dynamicResourceNamePrefixEnabled: true
  fullnameOverride: artifacthub-prod

  log:
    level: panic

  db:
    host: psql-int.mylogin.space
    database: <path:CORE0_SITE1/data/ArtifactHub/Database#Database>
    user: <path:CORE0_SITE1/data/ArtifactHub/Database#Username>
    password: <path:CORE0_SITE1/data/ArtifactHub/Database#Password>

  email:
    from: bots@mail.mylogin.space
    replyTo: bots@mail.mylogin.space

    smtp:
      host: mail.mylogin.space

  creds:
    dockerUsername: <path:CORE0_SITE1/data/ArtifactHub/Docker#Username>
    dockerPassword: <path:CORE0_SITE1/data/ArtifactHub/Docker#Password>

  events:
    trackingErrors: true

  dbMigrator:
    loadSampleData: false

  hub:
    ingress:
      enabled: false

    service:
      type: ClusterIP

    deploy:
      livenessProbe:
        httpGet:
          path: /api/v1/packages/stats
          port: 8000
        initialDelaySeconds: 60
        periodSeconds: 30
      replicaCount: 2

      resources:
        requests:
          cpu: 15m
          memory: 127M
        limits:
          cpu: 15m
          memory: 127M

    server:
      allowPrivateRepositories: true
      baseURL: https://artifacthub.int.mylogin.space

      oauth:
        oidc:
          enabled: true
          issuerURL: https://idp.mylogin.space/application/o/k0s-dc1/
          clientID: <path:CORE0_SITE1/data/ArtifactHub/OIDC#ClientID>
          clientSecret: <path:CORE0_SITE1/data/ArtifactHub/OIDC#ClientSecret>
          redirectURL: https://artifacthub.int.mylogin.space/oauth/oidc/callback
          skipEmailVerifiedCheck: true

  scanner:
    enabled: false

  tracker:
    concurrency: 1
    repositoryTimeout: 12h

  trivy:
    enabled: false

    deploy:
      image: aquasec/trivy:0.43.1

  postgresql:
    enabled: false

    persistence:
      mountPath: /data
    postgresqlUsername: postgres
    postgresqlPassword: postgres
    postgresqlDatabase: hub
    postgresqlDataDir: /data/pgdata


# GitLab uses platform PostgreSQL, cache, object storage, LDAP, OIDC, and mail.
# Only values that differ from gitlab 9.5.1 defaults are kept below.
gitlab:
  enabled: true

  global:
    priorityClassName: system-cluster-critical

    pod:
      labels:
        logs: loki-myloginspace
    edition: ce

    monitoring:
      enabled: true

    hosts:
      domain: git.writemy.codes

    ingress:
      enabled: false
      configureCertmanager: false

    psql:
      host: psql-int.mylogin.space

      load_balancing:
        hosts:
          - psql.mylogin.space
          - psql-int-rep.mylogin.space
      database: gl-core
      username: gl-core
      keepalives: 1
      keepalivesIdle: 5
      keepalivesInterval: 3
      keepalivesCount: 3
      tcpUserTimeout: 13000
      connectTimeout: 10
      preparedStatements: false

      password:
        useSecret: true
        secret: gitlab-user
        key: password

    redis:
      auth:
        enabled: false
      host: redis.mylogin.space
      database: 130
      port: 6379

    praefect:
      enabled: true

      psql:
        host: psql.mylogin.space
        port: 5432
        dbName: gl-repos
        user: gl-praefect

      dbSecret:
        secret: gl-praefect-creds
        key: password

    minio:
      enabled: false

    appConfig:
      enableUsagePing: false
      applicationSettingsCacheSeconds: 900
      defaultCanCreateGroup: true

      defaultProjectsFeatures:
        containerRegistry: false

      object_store:
        proxy_download: false
        connection:
          key: connection
          secret: gitlab-s3-prod

      lfs:
        enabled: false
        proxy_download: false
        bucket: 623579a1-8adc-0b12-dd3f-f24793c3a00f-imy3gs

      artifacts:
        enabled: false
        proxy_download: false
        bucket: 56c4bfd0-20f8-93d7-476f-a86435dde7df-w8qn40

      uploads:
        enabled: false
        proxy_download: false

      packages:
        enabled: false
        proxy_download: false

      externalDiffs:
        proxy_download: false
        bucket: 4781a816-7416-d012-9a2a-6dbe65624e17-ykv7qk

      terraformState:
        proxy_download: false
        bucket: 29f1e5ee-1b9c-14da-cc79-6ebe911caa7b-p3e18b

      ciSecureFiles:
        proxy_download: false

      dependencyProxy:
        proxy_download: false
        bucket: b5085eee-d81c-6a15-4a33-6a32a2c325d0-9ejn31

      ldap:
        servers:
          main:
            label: Authentik LDAP
            host: ldap.mylogin.space
            port: 636
            bind_dn: cn=gl-core,ou=users,dc=ldap,dc=mylogin,dc=space
            password:
              secret: gitlab-user
              key: password
            uid: cn
            base: ou=users,dc=ldap,dc=mylogin,dc=space
            group_base: ou=groups,dc=ldap,dc=mylogin,dc=space
            active_directory: false
            attributes:
              username: cn
              first_name: name
              last_name: lastname
              name: displayName
              email: mail
            encryption: simple_tls

      gitlab_kas:
        enabled: true
        secret: gitlab-kas-prod
        key: kas_shared_secret

      omniauth:
        enabled: true
        syncProfileAttributes:
          - uid
        autoLinkLdapUser: true
        allowSingleSignOn:
          - openid_connect
        providers:
          - secret: gitlab-oidc-prod

    kas:
      enabled: false

    shell:
      authToken:
        key: shared_secret
        secret: gitlab-shell-prod

    registry:
      enabled: false

    smtp:
      enabled: true
      address: mail.mylogin.space
      port: 465
      tls: false
      from: gl-core@mail.mylogin.space
      user_name: gl-core

      password:
        secret: gitlab-user
      domain: mail.mylogin.space
      authentication: login

    email:
      from: gl-core@mail.mylogin.space
      reply_to: august@mylogin.space

    workhorse:
      secret: gitlab-workhorse-prod
      key: shared_secret

    webservice:
      extraEnv:
        GITLAB_RAILS_RACK_TIMEOUT: '60'
        GITLAB_RAILS_WAIT_TIMEOUT: '90'

    serviceAccount:
      enabled: true
  installCertmanager: false

  certmanager:
    installCRDs: false

  nginx-ingress:
    enabled: false

  prometheus:
    install: false

    alertmanagerFiles:
      alertmanager.yml: {}

    kubeStateMetrics:
      enabled: false

    nodeExporter:
      enabled: false

    pushgateway:
      enabled: false

  redis:
    install: false
    existingSecret: gitlab-redis-secret
    existingSecretKey: redis-password
    usePasswordFile: true

  postgresql:
    install: false
    postgresqlDatabase: gitlabhq_production
    usePasswordFile: true
    existingSecret: bogus

  registry:
    enabled: false

  gitlab-runner:
    install: false

    runners:
      cache:
        secretName: gitlab-s3-runner

  gitlab:
    migrations:

      annotations:
        helm.sh/hook: pre-install
        helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded

    webservice:
      workerProcesses: 2
      replicaCount: 1

      hpa:
        minReplicas: 1
        maxReplicas: 3

      puma:
        threads:
          min: 4
          max: 8

      resources:
        requests:
          cpu: '1'
          memory: 4G

    praefect:
      replicas: 1

    gitlab-exporter:
      enabled: true

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    sidekiq:
      concurrency: 10
      maxReplicas: 2
      minReplicas: 1

      resources:
        requests:
          cpu: 48m
          memory: 1239M
        limits:
          cpu: '4'
          memory: 6G

    gitlab-shell:
      enabled: false
      maxReplicas: 1
      minReplicas: 1
      replicaCount: 1

      resources:
        requests:
          cpu: 162m
          memory: 105M
        limits:
          cpu: '1'
          memory: 256M

    toolbox:
      enabled: true

      backups:
        cron:
          enabled: false
          concurrencyPolicy: Replace
          failedJobsHistoryLimit: 1
          schedule: 0 1 * * *
          successfulJobsHistoryLimit: 3
          suspend: false
          backoffLimit: 6
          restartPolicy: OnFailure
          extraArgs: --maximum-backups=15
          resources:
            requests:
              cpu: 50m
              memory: 350M
          persistence:
            enabled: false
        objectStorage:
          backend: s3
          config:
            secret: gitlab-s3-backups-prod
            key: config


env: prod


# Harbor uses platform PostgreSQL, cache, and S3. Fleet values replace the
# database and object-storage endpoints per target cluster.
harbor:
  enabled: true

  ldap:
    server: 'ldap.k8s.dc1.yxl.mylogin.space'

  expose:
    type: clusterIP

    tls:
      certSource: secret

      secret:
        secretName: writemycodes-default-certificates

    ingress:
      hosts:
        core: 'registry.k8s.dc1.yxl.writemy.codes'
  externalURL: 'https://registry.k8s.dc1.yxl.writemy.codes'

  persistence:
    enabled: false

    imageChartStorage:
      type: s3

      s3:
        existingSecret: harbor-core-s3
        region: us-east-1
        bucket: harbor-core
        regionendpoint: https://s3.mylogin.space
  existingSecretAdminPassword: harbor-user
  existingSecretAdminPasswordKey: password
  existingSecretSecretKey: harbor-core

  nginx:
    replicas: 2
    revisionHistoryLimit: 3

  portal:
    revisionHistoryLimit: 3

  core:
    secretName: writemycodes-default-certificates
    revisionHistoryLimit: 3
    existingSecret: harbor-core-core
    existingXsrfSecret: harbor-core-core
    existingXsrfSecretKey: XSRFKey
    podAnnotations:
      secret.reloader.stakater.com/reload: 'harbor-redis-config'

  jobservice:
    revisionHistoryLimit: 3
    podAnnotations:
      secret.reloader.stakater.com/reload: 'harbor-redis-config'

    jobLoggers:
      - stdout
    existingSecret: harbor-core-jobservice
    existingSecretKey: SecretKey

  registry:
    revisionHistoryLimit: 3
    existingSecret: harbor-core-registry
    existingSecretKey: secret
    podAnnotations:
      secret.reloader.stakater.com/reload: 'harbor-redis-config'

    credentials:
      htpasswdString: harbor_registry_user:$2y$10$L4LTCe2fG2H42qquClN5.e6L4PnL68.LaRAVfxPW37HAKm2vX9iX.

  trivy:
    enabled: false
    priorityClassName: ''

  database:
    type: external

    external:
      host: 'psql-local.k8s.dc1.yxl.mylogin.space'
      username: 'harbor-k8s'
      coreDatabase: 'harbor-k8s'
      existingSecret: harbor-user
      sslmode: require
    maxIdleConns: 10
    maxOpenConns: 64

  redis:
    type: external

    external:
      addr: 'dragonfly.k8s.dc1.yxl.mylogin.space:6379'
      tlsOptions:
        enable: true
      coreDatabaseIndex: '0'
      jobserviceDatabaseIndex: '70'
      registryDatabaseIndex: '71'
      trivyAdapterIndex: '72'
      harborDatabaseIndex: '73'
      cacheLayerDatabaseIndex: '74'

  exporter:
    revisionHistoryLimit: 3
    podAnnotations:
      secret.reloader.stakater.com/reload: 'harbor-redis-config'


# Forgejo uses a site-local User claim, PostgreSQL, and Dragonfly. Production
# hostnames and service identities are injected by the fleet ApplicationSet.
forgejo:
  enabled: false

  image:
    tag: '14.0.4'
    digest: 'sha256:bca6943cdd8a50f5befaf1d654bec32c9a3b6da400d23a77a829bd41f88a7263'

  persistence:
    enabled: true
    size: '50Gi'

  test:
    enabled: false

  httpRoute:
    enabled: true
    parentRefs:
      - group: 'gateway.networking.k8s.io'
        kind: Gateway
        namespace: 'core-prod'
        name: 'main-gw'
        sectionName: 'https-myloginspace'
    hostnames:
      - 'forgejo.k8s.dc1.yxl.writemy.codes'
    port: 3000
    terminate: true

  gitea:
    admin:
      existingSecret: 'forgejo-admin'
      passwordMode: 'initialOnlyNoReset'

    podAnnotations:
      secret.reloader.stakater.com/reload: 'forgejo-user,forgejo-admin,forgejo-oidc,forgejo-runner,dragonfly-core-password'

    ldap:
      - name: 'authentik-ldap'
        securityProtocol: 'ldaps'
        host: 'ldap.k8s.dc1.yxl.mylogin.space'
        port: '636'
        userSearchBase: 'ou=users,dc=ldap,dc=mylogin,dc=space'
        userFilter: '(&(objectClass=user)(cn=%[1]s))'
        usernameAttribute: 'cn'
        firstnameAttribute: 'name'
        surnameAttribute: 'lastname'
        emailAttribute: 'mail'

    oauth:
      - name: 'authentik'
        provider: 'openidConnect'
        existingSecret: 'forgejo-oidc'
        autoDiscoverUrl: 'https://idp.mylogin.space/application/o/forgejo-k8s/.well-known/openid-configuration'
        scopes: 'email profile'

    config:
      actions:
        ENABLED: true
        DEFAULT_ACTIONS_URL: 'https://data.forgejo.org'
      database:
        DB_TYPE: 'postgres'
        HOST: 'psql-local.k8s.dc1.yxl.mylogin.space:5432'
        NAME: 'forgejo-k8s'
        USER: 'forgejo-k8s'
        SSL_MODE: 'require'
      server:
        DOMAIN: 'forgejo.k8s.dc1.yxl.writemy.codes'
        ROOT_URL: 'https://forgejo.k8s.dc1.yxl.writemy.codes/'
        SSH_DOMAIN: 'forgejo.k8s.dc1.yxl.writemy.codes'
        LANDING_PAGE: 'explore'

    # Kubernetes expands the preceding Secret-backed password variables in
    # later env entries before Forgejo's environment-to-ini conversion.
    additionalConfigFromEnvs:
      - name: 'FORGEJO__DATABASE__PASSWD'
        valueFrom:
          secretKeyRef:
            name: 'forgejo-user'
            key: 'password'
      - name: 'DRAGONFLY_PASSWORD'
        valueFrom:
          secretKeyRef:
            name: 'dragonfly-core-password'
            key: 'password'
      - name: 'FORGEJO__QUEUE__TYPE'
        value: 'redis'
      - name: 'FORGEJO__QUEUE__CONN_STR'
        value: 'rediss://default:$(DRAGONFLY_PASSWORD)@dragonfly.k8s.dc1.yxl.mylogin.space:6379/90'
      - name: 'FORGEJO__CACHE__ADAPTER'
        value: 'redis'
      - name: 'FORGEJO__CACHE__HOST'
        value: 'rediss://default:$(DRAGONFLY_PASSWORD)@dragonfly.k8s.dc1.yxl.mylogin.space:6379/91'
      - name: 'FORGEJO__SESSION__PROVIDER'
        value: 'redis'
      - name: 'FORGEJO__SESSION__PROVIDER_CONFIG'
        value: 'rediss://default:$(DRAGONFLY_PASSWORD)@dragonfly.k8s.dc1.yxl.mylogin.space:6379/92'


# One site-local global Actions runner is deployed beside every enabled Forgejo
# instance. Its registration credential is generated in-cluster and is not a
# deployable value. The DinD sidecar is privileged, while workflow containers
# are confined to that pod's disposable Docker daemon.
forgejoRunner:
  enabled: false
  replicaCount: 1

  image:
    repository: 'code.forgejo.org/forgejo/runner'
    tag: '12.13.2'
    digest: 'sha256:eb6e7bc21973382d261e6eb883dbd27b8cb56939d33a3bfd79a1352b7f9a33a0'

  dind:
    image:
      repository: 'docker.io/library/docker'
      tag: '29.3.1-dind'
      digest: 'sha256:686d2c5464787b0ca42420e0aa03a94fc9781ff9bf8b5ff947614b9fa4c3c3e0'
    storage: '20Gi'

  jobImage:
    repository: 'data.forgejo.org/oci/node'
    digest: 'sha256:934240a162082fd8b8a2f90cd5114446443f1eba1c5378f6687167ca405e6584'

  resources:
    runner:
      requests:
        cpu: '100m'
        memory: '128Mi'
      limits:
        cpu: '1'
        memory: '1Gi'
    dind:
      requests:
        cpu: '200m'
        memory: '512Mi'
      limits:
        cpu: '2'
        memory: '4Gi'


