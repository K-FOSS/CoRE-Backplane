apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: 'headlamp-corevault-client-id'
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  refreshInterval: '1h'
  secretStoreRefs:
    - name: 'corevault-rootsecrets'
      kind: 'ClusterSecretStore'
  selector:
    secret:
      name: 'core-headlamp-oidc'
  data:
    - match:
        secretKey: 'OIDC_CLIENT_ID'
        remoteRef:
          remoteKey: 'Operations/Clusters/OIDC/Headlamp/{{ .Values.cluster.name }}'
          property: 'ClientID'
