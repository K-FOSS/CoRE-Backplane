apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: headlamp

  labels:
    wan-mode: 'public'
    lan-mode: 'private'

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.gateway.namespace }}
      name: {{ .Values.gateway.name }}
      sectionName: {{ .Values.gateway.sectionName }}

  hostnames:
    - headlamp.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.resolvemy.host
  rules:
    # Keep websocket sessions open; the Service declares kubernetes.io/ws so
    # Envoy Gateway upgrades the upstream connection as well.
    - matches:
        - path:
            type: PathPrefix
            value: '/'
          headers:
            - name: 'Upgrade'
              value: 'websocket'
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              # Headlamp uses this only to enable its UI session. The forwarded
              # ID token supplies the user's Kubernetes identity and RBAC.
              - name: 'X-Forwarded-User'
                value: 'OIDC authenticated'
      backendRefs:
        - group: ''
          kind: Service
          name: {{ .Release.Name }}-headlamp
          port: 80
          weight: 1
      timeouts:
        backendRequest: '0s'
        request: '0s'

    - matches:
        - path:
            type: PathPrefix
            value: '/'
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: 'X-Forwarded-User'
                value: 'OIDC authenticated'
      backendRefs:
        - group: ''
          kind: Service
          name: {{ .Release.Name }}-headlamp
          port: 80
          weight: 1
      timeouts:
        backendRequest: '30s'
        request: '60s'
