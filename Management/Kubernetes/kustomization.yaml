apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml

patches:
  - target:
      kind: ConfigMap|DaemonSet|Role|RoleBinding|ServiceAccount
      labelSelector: app.kubernetes.io/part-of=inspektor-gadget
    patch: |-
      - op: add
        path: /metadata/namespace
        value: gadget

  - target:
      kind: ClusterRoleBinding
      labelSelector: app.kubernetes.io/part-of=inspektor-gadget
    patch: |-
      - op: add
        path: /subjects/0/namespace
        value: gadget

