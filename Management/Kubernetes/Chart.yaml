apiVersion: v2
version: 1.1.0

name: core-management-kubernetes

dependencies:
  #
  # Headlamp
  #
  - name: headlamp
    version: 0.44.0
    repository: https://kubernetes-sigs.github.io/headlamp/
    condition: headlamp.enabled

  #
  # Inspektor Gadget daemon and OCI-based debugging tools
  #
  - name: gadget
    version: 0.54.1
    repository: https://inspektor-gadget.github.io/charts
    condition: gadget.enabled
