{{- if eq .Release.Name "core-home1-talos-prod-core-vault-prod" }}
allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: vault-longhorn
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
parameters:
  dataEngine: 'v1'
  fsType: 'xfs'
  migratable: 'false'
  numberOfReplicas: '2'
provisioner: 'driver.longhorn.io'
reclaimPolicy: 'Retain'
volumeBindingMode: 'WaitForFirstConsumer'
{{- end }}
