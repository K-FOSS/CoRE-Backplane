consul:
  enabled: true
  address: dc1-k3s-node1-ui.core-prod.svc.cluster.local:80

velero:
  resources:
    requests:
      cpu: 22m
      memory: 105M
    limits:
      cpu: 288m
      memory: 2416M

  fullnameOverride: velero-core

  initContainers:
    - name: velero-plugin-for-aws
      image: velero/velero-plugin-for-aws:v1.8.0
      imagePullPolicy: IfNotPresent
      volumeMounts:
        - mountPath: /target
          name: plugins

  configuration:
    backupStorageLocation:
      - name: cloudflare-s3
        provider: aws
        bucket: velero-backup
        default: true
        credential:
          name: backups-velero-cloudflare-s3
          key: cloud
        config:
          region: us-east-1
          s3forcepathstyle: 'true'
          s3Url: <path:CORE0_SITE1/data/Backups/Velero/CloudFlare#URL>

  snapshotsEnabled: false
  deployNodeAgent: true

  schedules:
    core-prod:
      schedule: '0 * * * *'
      useOwnerReferencesInBackup: true
      template:
        ttl: '24h'
        storageLocation: cloudflare-s3
        defaultVolumesToFsBackup: true
        labelSelector:
          matchLabels:
            resolvemy.host/env: prod

    core:
      schedule: '0 0 * * *'
      useOwnerReferencesInBackup: true
      template:
        ttl: '240h'
        storageLocation: cloudflare-s3
