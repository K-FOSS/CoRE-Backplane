{{- if index .Values "mimir-distributed" "enabled" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: 'core-mimir-cluster-resource-rules'
  labels:
    app.kubernetes.io/name: 'mimir'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/component: 'ruler'
data:
  cluster-resource.rules.yaml: |
    groups:
      - name: 'cluster-resource-usage'
        interval: 1m
        rules:
          - record: 'node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m'
            expr: 'sum by (cluster, namespace, pod, container) (rate(container_cpu_usage_seconds_total{job="kubelet", container!="", container!="POD"}[5m]))'
          - record: 'cluster:node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m'
            expr: 'sum(node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate5m) by (cluster)'
          - record: 'cluster:node_namespace_pod_container:container_memory_working_set_bytes:sum'
            expr: 'sum(node_namespace_pod_container:container_memory_working_set_bytes) by (cluster)'
          - record: 'cluster:container_memory_rss:sum'
            expr: 'sum by (cluster) (max by (cluster, namespace, pod, container) (container_memory_rss{job="kubelet", metrics_path="/metrics/cadvisor", container!="", container!="POD"}))'
{{- end }}
