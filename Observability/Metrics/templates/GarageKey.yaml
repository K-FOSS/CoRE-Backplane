{{- if and .Values.garage.enabled (not .Values.garage.useUserCredentials) }}
apiVersion: garage.rajsingh.info/v1beta1
kind: GarageKey
metadata:
  name: {{ printf "mimir-garage-s3%s" .Values.garage.resourceSuffix | squote }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  clusterRef:
    name: {{ .Values.garage.clusterName | squote }}
  bucketPermissions:
    - bucketRef:
        name: {{ printf "mimir-blocks%s" .Values.garage.resourceSuffix | squote }}
      read: true
      write: true
    - bucketRef:
        name: {{ printf "mimir-alertmanager%s" .Values.garage.resourceSuffix | squote }}
      read: true
      write: true
    - bucketRef:
        name: {{ printf "mimir-ruler%s" .Values.garage.resourceSuffix | squote }}
      read: true
      write: true
  secretTemplate:
    name: {{ .Values.garage.s3SecretName | squote }}
    accessKeyIdKey: 'access-key-id'
    secretAccessKeyKey: 'secret-access-key'
    hostKey: 'host'
    includeEndpoint: true
    includeRegion: true
{{- end }}
