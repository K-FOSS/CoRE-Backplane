{{- if .Values.oidc.enabled }}
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: {{ required "oidc.resourceName is required when OIDC is enabled" .Values.oidc.resourceName }}

spec:
  providerConfigRef:
    name: {{ required "oidc.providerConfigRef is required when OIDC is enabled" .Values.oidc.providerConfigRef }}

  writeConnectionSecretToRef:
    namespace: {{ .Release.Namespace }}
    name: {{ .Values.oidc.resourceName }}

  forProvider:
    source: Inline
    module: |
      data "authentik_flow" "default-authorization-flow" {
        slug = {{ required "oidc.authorizationFlowSlug is required when OIDC is enabled" .Values.oidc.authorizationFlowSlug | quote }}
      }

      data "authentik_flow" "default-provider-invalidation-flow" {
        slug = {{ required "oidc.invalidationFlowSlug is required when OIDC is enabled" .Values.oidc.invalidationFlowSlug | quote }}
      }

      data "authentik_property_mapping_provider_scope" "scope" {
        name = {{ required "oidc.scopeMappingName is required when OIDC is enabled" .Values.oidc.scopeMappingName | quote }}
      }      

      data "authentik_property_mapping_provider_scope" "scopes" {
        managed_list = [
          "goauthentik.io/providers/oauth2/scope-email",
          "goauthentik.io/providers/oauth2/scope-openid",
          "goauthentik.io/providers/oauth2/scope-profile"
        ]
      }

      data "authentik_user" "akadmin" {
        username = {{ required "oidc.bootstrapUsername is required when OIDC is enabled" .Values.oidc.bootstrapUsername | quote }}
      }

      data "authentik_certificate_key_pair" "cert" {
        name = {{ required "oidc.signingCertificateName is required when OIDC is enabled" .Values.oidc.signingCertificateName | quote }}
      }

      resource "random_password" "client-secret" {
        length  = 128
        lower   = true
        numeric = true
        upper   = true
        special = true
      }

      resource "authentik_provider_oauth2" "auth-provider" {
        name          = {{ required "oidc.providerName is required when OIDC is enabled" .Values.oidc.providerName | quote }}
        client_id     = {{ required "oidc.clientId is required when OIDC is enabled" .Values.oidc.clientId | quote }}
        client_secret = random_password.client-secret.result
        signing_key = data.authentik_certificate_key_pair.cert.id
        allowed_redirect_uris = [
          {
            matching_mode = "regex",
            url           = {{ required "oidc.redirectUriRegex is required when OIDC is enabled" .Values.oidc.redirectUriRegex | quote }},
          },
        ]

        property_mappings  = concat([data.authentik_property_mapping_provider_scope.scope.id], tolist(data.authentik_property_mapping_provider_scope.scopes.ids))
        authorization_flow = data.authentik_flow.default-authorization-flow.id
        invalidation_flow = data.authentik_flow.default-provider-invalidation-flow.id
      }

      resource "authentik_application" "application" {
        name              = {{ required "oidc.applicationName is required when OIDC is enabled" .Values.oidc.applicationName | quote }}
        slug              = {{ required "oidc.applicationSlug is required when OIDC is enabled" .Values.oidc.applicationSlug | quote }}
        protocol_provider = authentik_provider_oauth2.auth-provider.id
        meta_launch_url   = "blank://blank"
      }

      output "client_id" {
        value     = {{ .Values.oidc.clientId | quote }}
        sensitive = true
      }

      output "client-secret" {
        value     = random_password.client-secret.result
        sensitive = true
      }
{{- end }}
