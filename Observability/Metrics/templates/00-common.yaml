---
{{- include "bjw-s.common.loader.init" . }}

{{- define "app-template.hardcodedValues" -}}
{{- $dataVolumeIsPVC := eq .Values.mimir.dataVolume.type "persistentVolumeClaim" -}}
{{- $tmpVolumeIsPVC := eq .Values.mimir.tmpVolume.type "persistentVolumeClaim" -}}

{{- if and .Values.mimir.enabled (ne .Values.mimir.dataVolume.type "emptyDir") (ne .Values.mimir.dataVolume.type "persistentVolumeClaim") }}
{{- fail "mimir.dataVolume.type must be emptyDir or persistentVolumeClaim" }}
{{- end }}
{{- if and .Values.mimir.enabled (ne .Values.mimir.tmpVolume.type "emptyDir") (ne .Values.mimir.tmpVolume.type "persistentVolumeClaim") }}
{{- fail "mimir.tmpVolume.type must be emptyDir or persistentVolumeClaim" }}
{{- end }}

# Set the nameOverride based on the release name if no override has been set
{{ if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{ end }}

{{ if or .Values.mimir.enabled .Values.mimirBridge.enabled }}

controllers:
  {{- if .Values.mimir.enabled }}
  mimir:
    annotations:
      secret.reloader.stakater.com/reload: '{{ $.Release.Name }}-s3-creds,{{ $.Release.Name }}-creds'

    # For Deployments, valid values are Recreate (default) and RollingUpdate.
    # For StatefulSets, valid values are OnDelete and RollingUpdate (default).
    # DaemonSets/CronJobs ignore this.
    type: {{ if or $dataVolumeIsPVC $tmpVolumeIsPVC }}'statefulset'{{ else }}'deployment'{{ end }}
    strategy: RollingUpdate

    rollingUpdate:
      unavailable: 1
      surge: 1

    podDisruptionBudget:
      maxUnavailable: 1

    pod:
      terminationGracePeriodSeconds: 120

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: '{{ $.Release.Name }}'
                    app.kubernetes.io/controller: mimir
                topologyKey: kubernetes.io/hostname

      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001

      {{- with .Values.mimir.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}

    replicas: {{ .Values.mimir.replicas }}

    {{- if or $dataVolumeIsPVC $tmpVolumeIsPVC }}
    statefulset:
      serviceName:
        identifier: 'mimir'
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: 'Retain'
        whenScaled: 'Retain'
      volumeClaimTemplates:
        {{- if $dataVolumeIsPVC }}
        - name: 'mimir-data'
          accessMode: {{ .Values.mimir.dataVolume.accessMode | squote }}
          size: {{ .Values.mimir.dataVolume.size | squote }}
          storageClass: {{ .Values.mimir.dataVolume.storageClass | squote }}
          advancedMounts:
            mimir:
              - path: '/data'
        {{- end }}
        {{- if $tmpVolumeIsPVC }}
        - name: 'mimir-tmp'
          accessMode: {{ .Values.mimir.tmpVolume.accessMode | squote }}
          size: {{ .Values.mimir.tmpVolume.size | squote }}
          storageClass: {{ .Values.mimir.tmpVolume.storageClass | squote }}
          advancedMounts:
            mimir:
              - path: '/tmp'
        {{- end }}
    {{- end }}

    containers:
      mimir:
        image:
          repository: {{ .Values.mimir.image.repository }}
          tag: {{ .Values.mimir.image.tag | quote }}
          pullPolicy: {{ .Values.mimir.image.pullPolicy }}

        resources:
          {{- toYaml .Values.mimir.resources | nindent 10 }}

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

        ports:
          - name: http
            containerPort: 8080
          - name: grpc
            containerPort: 9095

        args:
          - -config.file=/etc/mimir.yaml
          - -config.expand-env=true

        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: {{ $.Release.Name }}-s3-creds
                key: AccessKey

          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ $.Release.Name }}-s3-creds
                key: SecretAccessKey

          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ $.Release.Name }}-s3-creds
                key: SessionToken

          - name: S3_BUCKET
            valueFrom:
              secretKeyRef:
                name: {{ $.Release.Name }}-creds
                key: username

        probes:
          startup:
            enabled: true
            custom: false
            type: HTTP
            path: /ready
            port: http
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60

          liveness:
            enabled: true
            custom: false
            type: TCP
            port: http
            spec:
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 4

          readiness:
            enabled: true
            custom: false
            path: /ready
            port: http
            type: HTTP
            spec:
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 5

  querier:
    annotations:
      secret.reloader.stakater.com/reload: '{{ $.Release.Name }}-s3-creds,{{ $.Release.Name }}-creds'

    type: {{ if or $dataVolumeIsPVC $tmpVolumeIsPVC }}'statefulset'{{ else }}'deployment'{{ end }}
    strategy: RollingUpdate

    rollingUpdate:
      unavailable: 1
      surge: 1

    podDisruptionBudget:
      maxUnavailable: 1

    pod:
      terminationGracePeriodSeconds: 120

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/instance: '{{ $.Release.Name }}'
                    app.kubernetes.io/controller: querier
                topologyKey: kubernetes.io/hostname

      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001

      {{- with .Values.mimir.nodeSelector }}
      nodeSelector:
        {{ toYaml . | nindent 8 }}
      {{- end }}

    replicas: {{ .Values.mimir.querier.replicas }}

    {{- if or $dataVolumeIsPVC $tmpVolumeIsPVC }}
    statefulset:
      serviceName:
        identifier: 'mimir'
      persistentVolumeClaimRetentionPolicy:
        whenDeleted: 'Retain'
        whenScaled: 'Retain'
      volumeClaimTemplates:
        {{- if $dataVolumeIsPVC }}
        - name: 'mimir-data'
          accessMode: {{ .Values.mimir.dataVolume.accessMode | squote }}
          size: {{ .Values.mimir.dataVolume.size | squote }}
          storageClass: {{ .Values.mimir.dataVolume.storageClass | squote }}
          advancedMounts:
            querier:
              - path: '/data'
        {{- end }}
        {{- if $tmpVolumeIsPVC }}
        - name: 'mimir-tmp'
          accessMode: {{ .Values.mimir.tmpVolume.accessMode | squote }}
          size: {{ .Values.mimir.tmpVolume.size | squote }}
          storageClass: {{ .Values.mimir.tmpVolume.storageClass | squote }}
          advancedMounts:
            querier:
              - path: '/tmp'
        {{- end }}
    {{- end }}

    containers:
      querier:
        image:
          repository: {{ .Values.mimir.image.repository }}
          tag: {{ .Values.mimir.image.tag | quote }}
          pullPolicy: {{ .Values.mimir.image.pullPolicy }}

        resources:
          {{- toYaml .Values.mimir.querier.resources | nindent 10 }}

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true

        ports:
          - name: http
            containerPort: 8080
          - name: grpc
            containerPort: 9095

        args:
          - -config.file=/etc/mimir.yaml
          - -config.expand-env=true
          - -target=querier

        env:
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: {{ $.Release.Name }}-s3-creds
                key: AccessKey

          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ $.Release.Name }}-s3-creds
                key: SecretAccessKey

          - name: AWS_SESSION_TOKEN
            valueFrom:
              secretKeyRef:
                name: {{ $.Release.Name }}-s3-creds
                key: SessionToken

          - name: S3_BUCKET
            valueFrom:
              secretKeyRef:
                name: {{ $.Release.Name }}-creds
                key: username

        probes:
          startup:
            enabled: true
            custom: false
            type: HTTP
            path: /ready
            port: http
            spec:
              periodSeconds: 5
              timeoutSeconds: 3
              failureThreshold: 60

          liveness:
            enabled: true
            custom: false
            type: TCP
            port: http
            spec:
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 4

          readiness:
            enabled: true
            custom: false
            path: /ready
            port: http
            type: HTTP
            spec:
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 5
  {{- end }}

  {{- if .Values.mimirBridge.enabled }}
  mimir-bridge:
    forceRename: core-mimir-proxy
    strategy: RollingUpdate
    podDisruptionBudget:
      maxUnavailable: 1
    pod:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    replicas: {{ int .Values.mimirBridge.replicas }}
    containers:
      proxy:
        image:
          repository: {{ .Values.mimirBridge.image.repository }}
          tag: '{{ .Values.mimirBridge.image.tag }}@{{ .Values.mimirBridge.image.digest }}'
          pullPolicy: {{ .Values.mimirBridge.image.pullPolicy }}
        command:
          - /usr/sbin/nginx
        args:
          - -g
          - 'daemon off;'
        ports:
          - name: http
            containerPort: 8080
            protocol: TCP
        probes:
          liveness:
            enabled: true
            custom: false
            type: HTTP
            path: /-/healthy
            port: http
            spec:
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 3
          readiness:
            enabled: true
            custom: false
            type: HTTP
            path: /-/healthy
            port: http
            spec:
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 3
        resources:
          {{- toYaml .Values.mimirBridge.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      {{- if .Values.mimirBridge.queryFilter.enabled }}
      cluster-query-filter:
        image:
          repository: {{ .Values.mimirBridge.queryFilter.image.repository }}
          tag: '{{ .Values.mimirBridge.queryFilter.image.tag }}@{{ .Values.mimirBridge.queryFilter.image.digest }}'
          pullPolicy: {{ .Values.mimirBridge.queryFilter.image.pullPolicy }}
        args:
          - -enable-label-apis
          - -error-on-replace
          - -insecure-listen-address=0.0.0.0:8081
          - -label=cluster
          - -label-value={{ required "cluster.name is required when the Mimir bridge query filter is enabled" .Values.cluster.name }}
          - -upstream=http://{{ .Values.mimirBridge.upstream.service }}:{{ int .Values.mimirBridge.upstream.port }}/prometheus
        ports:
          - name: filter-cluster
            containerPort: 8081
            protocol: TCP
        probes:
          liveness:
            enabled: true
            type: TCP
            port: filter-cluster
          readiness:
            enabled: true
            type: TCP
            port: filter-cluster
        resources:
          {{- toYaml .Values.mimirBridge.queryFilter.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          # The image declares USER nobody. Kubernetes cannot prove that a
          # named user is non-root, so preserve that identity numerically.
          runAsGroup: 65534
          runAsUser: 65534
      {{- end }}
  {{- end }}

service:
  mimir:
    # -- Enables or disables the service
    enabled: true

    # -- Configure which controller this service should target
    controller: {{ ternary "mimir" "mimir-bridge" .Values.mimir.enabled }}

    # -- Make this the primary service for this controller (used in probes, notes, etc...).
    # If there is more than 1 service targeting the controller, make sure that only 1 service is
    # marked as primary.
    primary: false

    {{- with .Values.mimir.service.name }}
    forceRename: {{ . | quote }}
    {{- end }}

    # -- Set the service type
    type: ClusterIP

    # -- Specify the ip policy. Options: SingleStack, PreferDualStack, RequireDualStack
    ipFamilyPolicy:
    # -- The ip families that should be used. Options: IPv4, IPv6
    ipFamilies: []

    annotations:
      {{- toYaml .Values.mimir.service.annotations | nindent 6 }}

    # -- Provide additional labels which may be required.
    labels: {}

    # -- Allow adding additional match labels
    {{- if not .Values.mimir.enabled }}
    # The common chart requires a controller-backed selector. This extra label
    # intentionally matches no bridge Pod, leaving Cilium's synchronized
    # remote EndpointSlices as the only backends and preventing a proxy loop.
    extraSelectorLabels:
      app.kubernetes.io/global-service-backend: remote
    {{- else }}
    extraSelectorLabels: {}
    {{- end }}

    ports:
      http:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 port, make sure that only 1 port is marked as primary.
        primary: false

        # -- The port number
        port: 8080

        # -- Port protocol.
        # Supported values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        protocol: TCP

        # -- Specify the appProtocol value for the Service.
        appProtocol:

  {{- if .Values.mimir.enabled }}
  mimir-gossip:
    # -- Enables or disables the service
    enabled: true

    # -- Configure which controller this service should target
    controller: mimir

    # -- Make this the primary service for this controller (used in probes, notes, etc...).
    # If there is more than 1 service targeting the controller, make sure that only 1 service is
    # marked as primary.
    primary: false

    suffix: gossip

    nameOverride: mimir-stuff

    # -- Set the service type
    type: ClusterIP

    # -- Specify the externalTrafficPolicy for the service. Options: Cluster, Local
    # -- [[ref](https://kubernetes.io/docs/tutorials/services/source-ip/)]
    #externalTrafficPolicy: Local

    # -- Specify the ip policy. Options: SingleStack, PreferDualStack, RequireDualStack
    ipFamilyPolicy:
    # -- The ip families that should be used. Options: IPv4, IPv6
    ipFamilies: []

    clusterIP: None

    # -- Provide additional annotations which may be required.
    annotations: {}

    # -- Provide additional labels which may be required.
    labels: {}

    # -- Allow adding additional match labels
    extraSelectorLabels: {}

    publishNotReadyAddresses: true

    ports:
      gossip-tcp:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 service, make sure that only 1 port is marked as primary.
        primary: false

        # -- The port number
        port: 7946

        # -- Port protocol.
        # Support values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        # HTTP and HTTPS spawn a TCP service and get used for internal URL and name generation
        protocol: TCP

        # -- Specify the appProtocol value for the Service.
        # [[ref]](https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol)
        appProtocol:
  {{- end }}

  {{- if .Values.mimirBridge.enabled }}
  mimir-bridge:
    enabled: true
    controller: mimir-bridge
    primary: true
    forceRename: core-mimir-proxy
    type: ClusterIP

    labels:
      headlamp-prometheus: 'true'

    ports:
      http:
        enabled: true
        primary: true
        port: 8080
        protocol: TCP
        targetPort: http

  {{- end }}

configMaps:
  {{- if .Values.mimir.enabled }}
  mimir-alertmanager-fallback:
    enabled: true

    data:
      alertmanager_fallback_config.yaml: |
        receivers:
            - name: default-receiver
        route:
          receiver: default-receiver

  mimir-configs:
    enabled: true

    data:
      mimir.yaml: |
        # Keep the write path, query frontend/scheduler, storage components,
        # and optional services together. Queriers run in their own Deployment.
        target: all

        activity_tracker:
          filepath: /data/metrics-activity.log

        multitenancy_enabled: false
        no_auth_tenant: {{ .Values.mimir.tenant }}

        limits:
          max_global_series_per_user: {{ int .Values.mimir.limits.maxGlobalSeriesPerUser }}
          ingestion_rate: {{ int .Values.mimir.limits.ingestionRate }}
          ingestion_burst_size: {{ int .Values.mimir.limits.ingestionBurstSize }}
          out_of_order_time_window: {{ .Values.mimir.limits.outOfOrderTimeWindow }}
          compactor_blocks_retention_period: {{ .Values.mimir.limits.compactorBlocksRetentionPeriod }}

        # Configure Mimir to use Minio as object storage backend.
        common:
          storage:
            backend: s3
            s3:
              endpoint: {{ required "mimir.storage.s3Endpoint is required when mimir is enabled" .Values.mimir.storage.s3Endpoint }}
              access_key_id: "${AWS_ACCESS_KEY_ID}"
              secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
              session_token: "${AWS_SESSION_TOKEN}"
              insecure: false
              bucket_name: ${S3_BUCKET}
              http:
                max_idle_connections: 200
                max_idle_connections_per_host: 200

        # Blocks storage requires a prefix when using a common object storage bucket.
        blocks_storage:
          backend: s3
          storage_prefix: blocks
          s3:
            bucket_name: ${S3_BUCKET}
          bucket_store:
            sync_dir: /data/tsdb-sync
            tenant_sync_concurrency: 4
            block_sync_concurrency: 8
            {{ if .Values.mimir.cache.enabled }}
            index_cache:
              backend: memcached
              memcached:
                addresses: '{{ required "mimir.cache.address is required when Mimir caching is enabled" .Values.mimir.cache.address }}'
                tls_enabled: {{ .Values.mimir.cache.tls.enabled }}
                {{ if .Values.mimir.cache.tls.caSecretName }}
                tls_ca_path: '/etc/mimir-dragonfly-ca/{{ .Values.mimir.cache.tls.caSecretKey }}'
                {{ end }}
                tls_server_name: '{{ required "mimir.cache.tls.serverName is required when Mimir caching is enabled" .Values.mimir.cache.tls.serverName }}'
            chunks_cache:
              backend: memcached
              memcached:
                addresses: '{{ .Values.mimir.cache.address }}'
                tls_enabled: {{ .Values.mimir.cache.tls.enabled }}
                {{ if .Values.mimir.cache.tls.caSecretName }}
                tls_ca_path: '/etc/mimir-dragonfly-ca/{{ .Values.mimir.cache.tls.caSecretKey }}'
                {{ end }}
                tls_server_name: '{{ .Values.mimir.cache.tls.serverName }}'
            metadata_cache:
              backend: memcached
              memcached:
                addresses: '{{ .Values.mimir.cache.address }}'
                tls_enabled: {{ .Values.mimir.cache.tls.enabled }}
                {{ if .Values.mimir.cache.tls.caSecretName }}
                tls_ca_path: '/etc/mimir-dragonfly-ca/{{ .Values.mimir.cache.tls.caSecretKey }}'
                {{ end }}
                tls_server_name: '{{ .Values.mimir.cache.tls.serverName }}'
            {{ end }}
          tsdb:
            dir: /data/ingester
            ship_concurrency: {{ int .Values.mimir.blocksStorage.shipConcurrency }}

        querier:
          max_concurrent: 32

        query_scheduler:
          max_outstanding_requests_per_tenant: 1024
          # The query frontend/scheduler and querier no longer share a process.
          # Discover scheduler replicas through the existing memberlist ring.
          service_discovery_mode: ring
          ring:
            kvstore:
              store: memberlist

        {{ if .Values.mimir.cache.enabled }}
        frontend:
          cache_results: true
          results_cache:
            backend: memcached
            memcached:
              addresses: '{{ required "mimir.cache.address is required when Mimir caching is enabled" .Values.mimir.cache.address }}'
              tls_enabled: {{ .Values.mimir.cache.tls.enabled }}
              {{ if .Values.mimir.cache.tls.caSecretName }}
              tls_ca_path: '/etc/mimir-dragonfly-ca/{{ .Values.mimir.cache.tls.caSecretKey }}'
              {{ end }}
              tls_server_name: '{{ required "mimir.cache.tls.serverName is required when Mimir caching is enabled" .Values.mimir.cache.tls.serverName }}'
          results_cache_ttl: '{{ .Values.mimir.cache.resultsTtl }}'
          results_cache_ttl_for_labels_query: '{{ .Values.mimir.cache.labelsTtl }}'
          results_cache_ttl_for_cardinality_query: '{{ .Values.mimir.cache.cardinalityTtl }}'
        {{ end }}

        compactor:
          data_dir: /data/compactor

        # Use memberlist, a gossip-based protocol, to enable the 3 Mimir replicas to communicate
        memberlist:
          join_members:
            - dns+{{ $.Release.Name }}-mimir-gossip.{{ .Release.Namespace }}.svc.{{ .Values.cluster.domain }}.:7946


        alertmanager_storage:
          s3:
            bucket_name: mimir-alertmanager
        
        ruler_storage:
          backend: local
          local:
            directory: /rules
          s3:
            bucket_name: mimir-ruler

        ruler:
          rule_path: /data/ruler
          alertmanager_url: http://127.0.0.1:8080/alertmanager

        alertmanager:
          data_dir: /data/alertmanager
          fallback_config_file: /etc/alertmanager-fallback-config.yaml
          external_url: http://localhost:9009/alertmanager

        server:
          log_level: warn
          grpc_server_max_concurrent_streams: 1000
  {{- end }}

  {{- if .Values.mimirBridge.enabled }}
  mimir-bridge:
    enabled: true
    forceRename: core-mimir-proxy
    data:
      default.conf: |
        server {
            listen 8080;

            location = /-/healthy {
                access_log off;
                add_header Content-Type text/plain;
                return 200 'ready\n';
            }

            # Compatibility endpoint for existing external checks.
            location = /healthz {
                access_log off;
                add_header Content-Type text/plain;
                return 200 'ok\n';
            }

            location / {
                # Expose the Prometheus API at the bridge root. Continue to
                # accept the old /prometheus prefix without sending Mimir a
                # duplicated /prometheus/prometheus path.
                {{- if .Values.mimirBridge.queryFilter.enabled }}
                rewrite ^/prometheus/?(.*)$ /$1 break;
                {{- else }}
                rewrite ^/prometheus/?(.*)$ /$1;
                {{- end }}
                proxy_http_version 1.1;
                proxy_connect_timeout 5s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
                proxy_set_header Connection '';
                proxy_set_header Authorization '';
                proxy_set_header X-Scope-OrgID $http_x_scope_orgid;
                proxy_set_header Host {{ .Values.mimirBridge.upstream.service }};
                {{- if .Values.mimirBridge.queryFilter.enabled }}
                # prom-label-proxy receives the unprefixed API path and adds
                # /prometheus through its configured upstream URL.
                proxy_pass http://127.0.0.1:8081;
                {{- else }}
                # Without the filter, add Mimir's prefix before forwarding.
                rewrite ^/(.*)$ /prometheus/$1 break;
                proxy_pass http://{{ .Values.mimirBridge.upstream.service }}:{{ int .Values.mimirBridge.upstream.port }};
                {{- end }}
            }
        }
  {{- end }}

persistence:
  {{- if .Values.mimir.enabled }}
  {{- if not $dataVolumeIsPVC }}
  mimir-data:
    enabled: true
    type: 'emptyDir'
    {{- with .Values.mimir.dataVolume.medium }}
    medium: {{ . | squote }}
    {{- end }}
    sizeLimit: {{ .Values.mimir.dataVolume.sizeLimit | squote }}
    advancedMounts:
      mimir:
        mimir:
          - path: '/data'
      querier:
        querier:
          - path: '/data'
  {{- end }}
  {{- if not $tmpVolumeIsPVC }}
  mimir-tmp:
    enabled: true
    type: 'emptyDir'
    {{- with .Values.mimir.tmpVolume.medium }}
    medium: {{ . | squote }}
    {{- end }}
    sizeLimit: {{ .Values.mimir.tmpVolume.sizeLimit | squote }}
    advancedMounts:
      mimir:
        mimir:
          - path: '/tmp'
      querier:
        querier:
          - path: '/tmp'
  {{- end }}
  mimir-alertmanager:
    enabled: true

    type: configMap

    name: '{{ $.Release.Name }}-mimir-alertmanager-fallback'

    defaultMode: 0755

    advancedMounts:
      mimir: # the controller with the "main" identifier
        mimir: # the container with the "main" identifier
          - path: /etc/alertmanager-fallback-config.yaml
            readOnly: true
            subPath: alertmanager_fallback_config.yaml

  mimir-config:
    enabled: true

    type: configMap

    name: '{{ $.Release.Name }}-mimir-configs'

    defaultMode: 0755

    advancedMounts:
      mimir: # the controller with the "main" identifier
        mimir: # the container with the "main" identifier
          - path: /etc/mimir.yaml
            readOnly: true
            subPath: mimir.yaml
      querier:
        querier:
          - path: /etc/mimir.yaml
            readOnly: true
            subPath: mimir.yaml

  {{- if and .Values.mimir.cache.enabled .Values.mimir.cache.tls.caSecretName }}
  mimir-dragonfly-ca:
    enabled: true
    type: secret
    name: {{ .Values.mimir.cache.tls.caSecretName | quote }}
    advancedMounts:
      mimir:
        mimir:
          - path: /etc/mimir-dragonfly-ca
            readOnly: true
      querier:
        querier:
          - path: /etc/mimir-dragonfly-ca
            readOnly: true
  {{- end }}


  mimir-rules:
    enabled: true

    type: configMap

    name: {{ required "mimir.rules.configMapName is required when mimir is enabled" .Values.mimir.rules.configMapName | quote }}

    defaultMode: 0755

    advancedMounts:
      mimir: # the controller with the "main" identifier
        mimir: # the container with the "main" identifier
          - path: /rules/{{ .Values.mimir.rules.tenant }}


{{- end }}

  {{- if .Values.mimirBridge.enabled }}
  mimir-bridge-config:
    enabled: true
    type: configMap
    name: core-mimir-proxy
    advancedMounts:
      mimir-bridge:
        proxy:
          - path: /etc/nginx/conf.d/default.conf
            readOnly: true
            subPath: default.conf

  mimir-bridge-tmp:
    enabled: true
    type: emptyDir
    sizeLimit: 64Mi
    advancedMounts:
      mimir-bridge:
        proxy:
          - path: /tmp
  {{- end }}

{{- end -}}
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "app-template.hardcodedValues" . | fromYaml) -}}

{{- if and .Values.mimir.enabled .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.gateway.routeName }}

  {{- with .Values.gateway.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}

spec:
  parentRefs:
    {{- toYaml .Values.gateway.parentRefs | nindent 4 }}

  hostnames:
    {{- toYaml .Values.gateway.hostnames | nindent 4 }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: '{{ ((include "bjw-s.common.lib.service.getByIdentifier" (dict "rootContext" . "id" "mimir")) | fromYaml).name }}'
          port: 8080
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
{{- end }}
