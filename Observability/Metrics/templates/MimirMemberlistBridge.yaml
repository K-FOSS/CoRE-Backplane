{{- if index .Values "mimir-distributed" "enabled" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 'memberlist-bridge-zone-{{ .Values.region }}'
  labels:
    app.kubernetes.io/name: 'mimir'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/component: 'memberlist-bridge'
    app.kubernetes.io/part-of: 'memberlist'
    topology.kubernetes.io/region: '{{ .Values.region }}'
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: 'mimir'
      app.kubernetes.io/instance: '{{ .Release.Name }}'
      app.kubernetes.io/component: 'memberlist-bridge'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 'mimir'
        app.kubernetes.io/instance: '{{ .Release.Name }}'
        app.kubernetes.io/component: 'memberlist-bridge'
        app.kubernetes.io/part-of: 'memberlist'
        topology.kubernetes.io/region: '{{ .Values.region }}'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/component: 'memberlist-bridge'
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
              topologyKey: 'kubernetes.io/hostname'
      containers:
        - name: 'mimir'
          image: '{{ (index .Values "mimir-distributed").image.repository }}:{{ (index .Values "mimir-distributed").image.tag }}'
          imagePullPolicy: '{{ (index .Values "mimir-distributed").image.pullPolicy }}'
          args:
            - '-target=memberlist-kv'
            - '-server.http-listen-port=8080'
            - '-activity-tracker.filepath=/tmp/metrics-activity.log'
            - '-memberlist.cluster-label=core-observability-mimir'
            - '-memberlist.join=dns+core-mimir-gossip-ring-global.{{ .Release.Namespace }}.svc.{{ trimSuffix "." .Values.clusterDomain }}.:7946'
            - '-memberlist.zone-aware-routing.enabled=true'
            - '-memberlist.zone-aware-routing.instance-availability-zone={{ .Values.region }}'
            - '-memberlist.zone-aware-routing.role=bridge'
          ports:
            - name: 'http'
              containerPort: 8080
            - name: 'memberlist'
              containerPort: 7946
              protocol: TCP
          readinessProbe:
            httpGet:
              path: '/ready'
              port: 'http'
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            tcpSocket:
              port: 'memberlist'
            periodSeconds: 15
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - 'ALL'
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: 'tmp'
              mountPath: '/tmp'
          resources:
            requests:
              cpu: '10m'
              memory: '32Mi'
            limits:
              cpu: '100m'
              memory: '128Mi'
      volumes:
        - name: 'tmp'
          emptyDir: {}
{{- end }}
