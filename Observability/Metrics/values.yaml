cluster:
  name: k8s
  domain: cluster.local

datacenter: ''
region: ''

global: {}

oidc:
  enabled: false
  resourceName: ''
  providerConfigRef: ''
  secretStoreRef: ''
  remoteKey: ''
  authorizationFlowSlug: ''
  invalidationFlowSlug: ''
  scopeMappingName: ''
  bootstrapUsername: ''
  signingCertificateName: ''
  providerName: ''
  clientId: ''
  redirectUriRegex: ''
  applicationName: ''
  applicationSlug: ''

mimir:
  enabled: false
  replicas: 3
  tenant: anonymous

  service:
    name: ''
    annotations: {}

  storage:
    s3Endpoint: ''

  rules:
    configMapName: ''
    tenant: anonymous

  limits:
    maxGlobalSeriesPerUser: 5000000
    ingestionRate: 500000
    ingestionBurstSize: 1550000
    outOfOrderTimeWindow: 24h
    compactorBlocksRetentionPeriod: 24h

  blocksStorage:
    shipConcurrency: 20

  image:
    repository: grafana/mimir
    tag: 3.0.6
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

  # The WAL, head blocks, and index working set are memory-backed. S3 is the
  # durable store; emptyDir use counts against the container memory limit.
  dataVolume:
    sizeLimit: 2Gi
  tmpVolume:
    sizeLimit: 512Mi

  nodeSelector: {}

gateway:
  enabled: false
  routeName: mimir
  labels: {}
  parentRefs: []
  hostnames: []

securityPolicy:
  enabled: false
  jwt: {}

s3User:
  enabled: false

# No selected cluster currently uses the distributed dependency. Keep its
# condition explicit without copying thousands of upstream default values.
mimir-distributed:
  enabled: false
