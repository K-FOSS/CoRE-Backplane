apiVersion: v2

name: core-backplane-observability-exporters

version: 1.0.0

dependencies:
  - name: kube-prometheus-stack
    version: '77.7.0'
    repository: https://prometheus-community.github.io/helm-charts

  - name: prometheus-smartctl-exporter
    version: '0.16.0'
    repository: https://prometheus-community.github.io/helm-charts

  - name: prometheus-ipmi-exporter
    version: '0.8.0'
    repository: https://prometheus-community.github.io/helm-charts

  - name: drm-exporter
    version: '0.3.3'
    repository: 'oci://ghcr.io/home-operations/charts'
    condition: 'drm-exporter.enabled'

  - name: dcgm-exporter
    version: '4.8.3'
    repository: 'https://nvidia.github.io/dcgm-exporter/helm-charts'
    condition: 'dcgm-exporter.enabled'
