apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

patches:
  - target:
      kind: ConfigMap
      labelSelector: 'app=kube-prometheus-stack-grafana,grafana_dashboard=true'

    patch: |
      - op: add
        path: /metadata/labels/grafana_dashboard_global
        value: 'true'

  - target:
      labelSelector: 'app.kubernetes.io/name=prometheus-smartctl-exporter'

    patch: |
      - op: replace
        path: /metadata/namespace
        value: kube-system

  - target:
      kind: ServiceMonitor
      labelSelector: 'app.kubernetes.io/name=prometheus-smartctl-exporter'
      
    patch: |
      - op: replace
        path: /spec/namespaceSelector/matchNames/0
        value: kube-system
