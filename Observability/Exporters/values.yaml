kube-prometheus-stack:
  # Alloy/Collectors owns the Prometheus Operator CRDs consumed by both
  # stacks. Keep this release from creating a second CRD owner.
  crds:
    enabled: false

  alertmanager:
    alertmanagerSpec:
      image:
        tag: 'v0.28.0'

  defaultRules:
    rules:
      kubeApiserverAvailability: false
      kubeApiserverBurnrate: false
      kubeApiserverHistogram: false
      kubeApiserverSlos: false

  grafana:
    forceDeployDashboards: true

  kubeApiServer:
    enabled: false
    serviceMonitor:
      enabled: false

  kubelet:
    serviceMonitor:
      enabled: false
      interval: '30s'

  nodeExporter:
    forceDeployDashboards: true

  prometheus-node-exporter:
    namespaceOverride: 'kube-system'
    extraArgs:
      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)'
      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$'
      - '--collector.netdev.device-exclude=^lxc.*'
      - '--collector.arp.device-exclude=^lxc.*'
      - '--collector.ethtool.device-exclude=^lxc.*'
    prometheus:
      monitor:
        interval: '30s'

  prometheusOperator:
    kubeletEndpointSliceEnabled: true

  prometheus:
    prometheusSpec:
      replicas: 0
      # Alloy consumes ServiceMonitors from this release. Do not require the
      # Prometheus release label, since the scrape is performed externally.
      serviceMonitorSelectorNilUsesHelmValues: false

prometheus-smartctl-exporter:
  serviceMonitor:
    enabled: true

prometheus-ipmi-exporter:
  enabled: true
  modules:
    default:
      # These are upstream example values. Replace them with a Secret-backed
      # mechanism before enabling IPMI collection in production.
      user: 'default_user'
      pass: 'example_pw'
  scrapeConfig:
    enabled: true
    mode: 'remote'
    staticConfigs:
      - targets:
          - '172.31.193.100'

drm-exporter:
  enabled: false
  # Intel iGPU and dGPU telemetry through the host DRM interfaces (i915/xe).
  # NFD must publish this label on YVR GPU nodes.
  hostAccess:
    devDri: '/dev/dri'
    sys: '/sys'
  nodeSelector:
    kubernetes.io/arch: 'amd64'
    feature.node.kubernetes.io/pci-0300_8086.present: 'true'
  monitoring:
    serviceMonitor:
      enabled: true
      interval: '30s'
      scrapeTimeout: '10s'
  config:
    intervalSeconds: 5

dcgm-exporter:
  enabled: false

  namespaceOverride: 'kube-system'

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
    - key: load
      operator: Exists
      effect: NoSchedule

  # NVIDIA DCGM exposes CUDA/NVIDIA device, utilization, memory, power,
  # thermals, PCIe, and error metrics. The NVIDIA device runtime/driver and
  # device plugin are prerequisites on matching nodes.
  image:
    tag: '4.6.0-4.8.3-distroless'

  runtimeClassName: nvidia

  nodeSelector:
    kubernetes.io/arch: 'amd64'
    acceleratable.feature.gpustack.ai/nvidia: 'true'

  serviceMonitor:
    enabled: true
    interval: '30s'
    scrapeTimeout: '25s'
