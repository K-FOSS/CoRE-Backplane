apiVersion: v2

version: 1.0.1

name: core-backplane-observeability-collectors

dependencies:
  # Grafana Alloy
  - name: alloy
    version: '1.10.0'
    repository: https://grafana.github.io/helm-charts

  # Node-local collection is split by signal and isolated from the HA gateway.
  - name: alloy
    alias: alloy-logs
    version: '1.10.0'
    repository: https://grafana.github.io/helm-charts

  - name: alloy
    alias: alloy-metrics
    version: '1.10.0'
    repository: https://grafana.github.io/helm-charts

  - name: alloy
    alias: alloy-otlp
    version: '1.10.0'
    repository: https://grafana.github.io/helm-charts

  - name: alloy-mixin
    version: '0.3.2'
    repository: https://charts.portefaix.xyz/

  # Vector normalizes device and Talos syslog before OTLP ingestion by Alloy.
  - name: vector
    version: '0.57.0'
    repository: https://helm.vector.dev
    condition: vector.enabled

  # Prometheus Operator
  - name: prometheus-operator-crds
    version: '30.0.1'
    repository: https://prometheus-community.github.io/helm-charts
