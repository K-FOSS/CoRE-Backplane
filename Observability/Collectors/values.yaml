alloy-logs:
  crds:
    create: false
  alloy:
    stabilityLevel: public-preview
    # Node-local log agents send OTLP to the central gateway and do not peer.
    clustering:
      enabled: false
    mounts:
      varlog: false
    configMap:
      content: |
        logging {
          level  = "info"
          format = "json"
        }

        {{- if .Values.alloy.podLogsEnabled }}
        discovery.kubernetes "pod_logs" {
          role = "pod"

          selectors {
            role = "pod"
            label = "logs=loki-myloginspace"
          }
        }

        discovery.relabel "pod_logs" {
          targets = discovery.kubernetes.pod_logs.targets

          rule {
            source_labels = ["__meta_kubernetes_pod_uid"]
            target_label  = "__pod_uid__"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_uid"]
            target_label  = "pod_uid"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "__pod_namespace__"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label  = "namespace"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "__pod_name__"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label  = "pod"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "__pod_container_name__"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label  = "container"
          }
        }

        loki.source.kubernetes "pod_logs" {
          targets    = discovery.relabel.pod_logs.output
          forward_to = [loki.process.pod_logs.receiver]
        }

        loki.process "pod_logs" {
          stage.static_labels {
            values = {
              cluster = sys.env("CLUSTER"),
              dc      = sys.env("DC"),
            }
          }

          forward_to = [otelcol.receiver.loki.pod_logs.receiver]
        }

        otelcol.receiver.loki "pod_logs" {
          output {
            logs = [otelcol.exporter.otlp.main.input]
          }
        }

        otelcol.exporter.otlp "main" {
          client {
            endpoint = sys.env("OTLP_ENDPOINT")

            tls {
              insecure = true
            }
          }
        }
        {{- end }}

    podLogsEnabled: false
    extraEnv:
    - name: DC
      value: dc1
    - name: CLUSTER
      value: k8s
  rbac:
    create: false
    rules:
      - apiGroups: ['']
        resources: ['pods']
        verbs: ['get', 'list', 'watch']
      - apiGroups: ['']
        resources: ['pods/log']
        verbs: ['get']
    clusterRules:
      - apiGroups: ['']
        resources: ['namespaces']
        verbs: ['get', 'list', 'watch']
  serviceAccount:
    automountServiceAccountToken: false
  service:
    enabled: true
  serviceMonitor:
    enabled: true
  controller:
    tolerations:
    - key: 'load'
      operator: 'Equal'
      value: 'testing'
      effect: 'NoSchedule'

alloy-metrics:
  crds:
    create: false
  alloy:
    # Node-local metric agents send OTLP to the central gateway and do not peer.
    clustering:
      enabled: false
    configMap:
      content: |
        logging {
          level  = "info"
          format = "json"
        }

        prometheus.exporter.self "alloy" {}

        prometheus.scrape "node" {
          targets = prometheus.exporter.self.alloy.targets
          scrape_interval = "30s"
          forward_to = [prometheus.relabel.node.receiver]
        }

        prometheus.relabel "node" {
          rule {
            target_label = "cluster"
            replacement  = sys.env("CLUSTER")
          }
          rule {
            target_label = "dc"
            replacement  = sys.env("DC")
          }
          rule {
            // Preserve the originating node through the OTLP gateway. The
            // central k8sattributes processor may otherwise label every
            // sample with the node hosting the receiving Alloy pod.
            target_label = "node"
            replacement  = sys.env("K8S_NODE_NAME")
          }
          rule {
            target_label = "source_node"
            replacement  = sys.env("K8S_NODE_NAME")
          }
          forward_to = [otelcol.receiver.prometheus.node.receiver]
        }

        otelcol.receiver.prometheus "node" {
          output {
            metrics = [otelcol.processor.batch.metrics.input]
          }
        }

        otelcol.processor.batch "metrics" {
          // Larger, bounded batches reduce OTLP request and serialization
          // overhead without allowing an unbounded cAdvisor burst.
          send_batch_size = 8192
          send_batch_max_size = 8192
          timeout = "5s"

          output {
            metrics = [otelcol.exporter.otlp.gateway.input]
          }
        }

        otelcol.exporter.otlp "gateway" {
          client {
            endpoint = sys.env("OTLP_ENDPOINT")
            tls {
              insecure = true
            }
          }
          retry_on_failure {
            enabled          = true
            max_elapsed_time = "0s"
          }
        }
    extraEnv:
    - name: DC
      value: dc1
    - name: CLUSTER
      value: k8s
    - name: K8S_NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
  rbac:
    create: true
  serviceAccount:
    automountServiceAccountToken: true
  service:
    enabled: true
  serviceMonitor:
    enabled: true
  controller:
    tolerations:
    - key: 'load'
      operator: 'Equal'
      value: 'testing'
      effect: 'NoSchedule'
alloy-host:
  crds:
    create: false
  alloy:
    listenPort: 12346
    stabilityLevel: public-preview
    clustering:
      enabled: false
    securityContext:
      privileged: true
      allowPrivilegeEscalation: true
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
    configMap:
      content: |
        logging {
          level  = "info"
          format = "json"
        }

        prometheus.exporter.unix "host" {
          rootfs_path = "/host/root"
          procfs_path = "/host/proc"
          sysfs_path = "/host/sys"
          set_collectors = [
            "diskstats",
            "filesystem",
            "cpu",
            "ethtool",
            "netdev",
            "netstat",
            "softnet",
            "sockstat",
            "tcpstat",
            "udp_queues",
            "cpufreq",
            "hwmon",
            "loadavg",
            "meminfo",
            "stat",
            "time",
            "uname",
          ]
        }

        discovery.relabel "host" {
          targets = prometheus.exporter.unix.host.targets

          rule {
            target_label = "cluster"
            replacement  = sys.env("CLUSTER")
          }
          rule {
            target_label = "dc"
            replacement  = sys.env("DC")
          }
          rule {
            target_label = "node"
            replacement  = sys.env("K8S_NODE_NAME")
          }
          rule {
            target_label = "source_node"
            replacement  = sys.env("K8S_NODE_NAME")
          }
          rule {
            target_label = "instance"
            replacement  = sys.env("K8S_NODE_NAME")
          }
          rule {
            target_label = "nodename"
            replacement  = sys.env("K8S_NODE_NAME")
          }
          rule {
            target_label = "job"
            replacement  = "node-exporter"
          }
        }

        prometheus.scrape "host" {
          targets = discovery.relabel.host.output
          job_name = "node-exporter"
          scrape_interval = "30s"
          forward_to = [otelcol.receiver.prometheus.host.receiver]
        }

        // Use the existing privileged host-networked agent to scrape the
        // local kubelet directly. The fixed node-IP target survives API-server
        // discovery/proxy outages and retries on the next scrape interval.
        prometheus.scrape "kubelet_cadvisor" {
          targets = [{
            "__address__" = sys.env("K8S_NODE_IP") + ":10250",
            "__metrics_path__" = "/metrics/cadvisor",
            "cluster" = sys.env("CLUSTER"),
            "dc" = sys.env("DC"),
            "instance" = sys.env("K8S_NODE_NAME"),
            "node" = sys.env("K8S_NODE_NAME"),
            "source_node" = sys.env("K8S_NODE_NAME"),
            "metrics_path" = "/metrics/cadvisor",
            "job" = "kubelet",
          }]
          job_name = "kubelet"
          scheme = "https"
          scrape_interval = "60s"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          tls_config {
            ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          }

          forward_to = [otelcol.receiver.prometheus.host.receiver]
        }

        otelcol.receiver.prometheus "host" {
          output {
            metrics = [otelcol.processor.batch.host.input]
          }
        }

        otelcol.processor.batch "host" {
          send_batch_size = 4096
          send_batch_max_size = 8192
          timeout = "5s"

          output {
            metrics = [otelcol.exporter.otlp.gateway.input]
          }
        }

        otelcol.exporter.otlp "gateway" {
          client {
            endpoint = sys.env("OTLP_ENDPOINT")
            tls {
              insecure = true
            }
          }
          retry_on_failure {
            enabled          = true
            max_elapsed_time = "0s"
          }
        }
    extraEnv:
      - name: DCx
        value: dc1
      - name: CLUSTER
        value: k8s
      - name: K8S_NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
      - name: K8S_NODE_IP
        valueFrom:
          fieldRef:
            fieldPath: status.hostIP
      - name: OTLP_ENDPOINT
        value: alloy-otlp.core-prod.svc.cluster.local:4317
    mounts:
      extra:
        - name: host-root
          mountPath: /host/root
          readOnly: true
        - name: host-proc
          mountPath: /host/proc
          readOnly: true
        - name: host-sys
          mountPath: /host/sys
          readOnly: true
  controller:
    type: daemonset
    hostNetwork: true
    hostPID: true
    dnsPolicy: ClusterFirstWithHostNet
    tolerations:
      - key: 'load'
        operator: 'Equal'
        value: 'testing'
        effect: NoSchedule
    volumes:
      extra:
        - name: host-root
          hostPath:
            path: /
            type: Directory
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
  rbac:
    create: true
    clusterRules:
      - apiGroups: ['']
        resources: ['nodes/proxy']
        verbs: ['get']
  serviceAccount:
    automountServiceAccountToken: true
  service:
    enabled: false
  serviceMonitor:
    enabled: false

alloy-otlp:
  crds:
    create: false
  alloy:
    # Node-local OTLP receivers forward to the central gateway and do not peer.
    clustering:
      enabled: false
    configMap:
      content: |
        logging {
          level  = "info"
          format = "json"
        }

        otelcol.receiver.otlp "node" {
          grpc {
            endpoint = "0.0.0.0:4317"
          }
          http {
            endpoint = "0.0.0.0:4318"
          }
          output {
            traces  = [otelcol.processor.batch.forward.input]
            metrics = [otelcol.processor.batch.forward.input]
            logs    = [otelcol.processor.batch.forward.input]
          }
        }

        otelcol.receiver.otlp "infrastructure" {
          http {
            endpoint = "0.0.0.0:4328"
          }
          output {
            logs = [otelcol.exporter.otlp.gateway.input]
          }
        }

        otelcol.processor.batch "forward" {
          output {
            traces  = [otelcol.exporter.otlp.gateway.input]
            metrics = [otelcol.exporter.otlp.gateway.input]
            logs    = [otelcol.exporter.otlp.gateway.input]
          }
        }

        otelcol.exporter.otlp "gateway" {
          client {
            endpoint = sys.env("OTLP_ENDPOINT")
            tls {
              insecure = true
            }
          }
          retry_on_failure {
            enabled          = true
            max_elapsed_time = "0s"
          }
        }
    extraPorts:
    - name: otel-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
      appProtocol: grpc
    - name: otel-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: infra-otel-http
      port: 4328
      targetPort: 4328
      protocol: TCP
  rbac:
    create: false
  serviceAccount:
    automountServiceAccountToken: false
  service:
    internalTrafficPolicy: Cluster
    trafficDistribution: PreferClose
  serviceMonitor:
    enabled: true
  controller:
    tolerations:
    - key: 'load'
      operator: 'Equal'
      value: 'testing'
      effect: 'NoSchedule'
alloy-services:
  crds:
    create: false
  alloy:
    stabilityLevel: experimental
    clustering:
      enabled: true
    configMap:
      content: |
        logging {
          level = "info"
          format = "json"
        }

        prometheus.operator.servicemonitors "services" {
          allow_arbitrary_file_access = true
          clustering {
            enabled = true
          }
          forward_to = [prometheus.relabel.services.receiver]
        }

        prometheus.operator.probes "probes" {
          clustering {
            enabled = true
          }
          forward_to = [prometheus.relabel.services.receiver]
        }

        prometheus.operator.scrapeconfigs "scrapeconfigs" {
          clustering {
            enabled = true
          }
          forward_to = [prometheus.relabel.services.receiver]
        }

        prometheus.relabel "services" {
          rule {
            target_label = "cluster"
            replacement = sys.env("CLUSTER")
          }
          rule {
            target_label = "dc"
            replacement = sys.env("DC")
          }
          forward_to = [otelcol.receiver.prometheus.services.receiver]
        }

        otelcol.receiver.prometheus "services" {
          output {
            metrics = [otelcol.processor.batch.services.input]
          }
        }

        otelcol.processor.batch "services" {
          output {
            metrics = [otelcol.exporter.otlp.gateway.input]
          }
        }

        otelcol.exporter.otlp "gateway" {
          client {
            endpoint = sys.env("OTLP_ENDPOINT")
            tls {
              insecure = true
            }
          }
          retry_on_failure {
            enabled = true
            max_elapsed_time = "0s"
          }
        }
    extraEnv:
    - name: DC
      value: dc1
    - name: CLUSTER
      value: k8s
  rbac:
    create: true
  serviceAccount:
    automountServiceAccountToken: true
  controller:
    type: statefulset
    replicas: 3
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
  serviceMonitor:
    enabled: true

alloy-rules:
  # The fleet owner enables this only where the cluster-local/global Mimir
  # Service exists. The legacy K3s collector target has no such Service.
  enabled: false
  crds:
    create: false
  alloy:
    clustering:
      enabled: true
    configMap:
      content: |
        logging {
          level = "info"
          format = "json"
        }

        // Synchronize every rule that has not explicitly opted into namespace
        // scoping. Query and result labels are constrained to this source
        // cluster, while the Mimir namespace prefix prevents another cluster's
        // Alloy reconciler from owning or deleting these rule namespaces.
        mimir.rules.kubernetes "cluster" {
          address = sys.env("MIMIR_RULES_URL")
          tenant_id = sys.env("MIMIR_TENANT")
          sync_interval = "5m"
          mimir_namespace_prefix = "alloy-" + sys.env("CLUSTER") + "-cluster"
          mimir_namespace_separator = "-"

          external_labels = {
            cluster = sys.env("CLUSTER"),
          }

          extra_query_matchers {
            matcher {
              name = "cluster"
              match_type = "="
              value = sys.env("CLUSTER")
            }
          }

          rule_selector {
            match_expression {
              key = "observability.core-backplane/query-namespace"
              operator = "DoesNotExist"
            }
          }
        }

        // Namespace filtering is opt-in because the Kubernetes namespace that
        // stores a PrometheusRule is not necessarily the namespace queried by
        // that rule. For example, the kube-prometheus rules in core-prod must
        // continue evaluating workload metrics from every namespace.
        mimir.rules.kubernetes "namespaced" {
          address = sys.env("MIMIR_RULES_URL")
          tenant_id = sys.env("MIMIR_TENANT")
          sync_interval = "5m"
          mimir_namespace_prefix = "alloy-" + sys.env("CLUSTER") + "-namespaced"
          mimir_namespace_separator = "-"

          external_labels = {
            cluster = sys.env("CLUSTER"),
          }

          extra_query_matchers {
            matcher {
              name = "cluster"
              match_type = "="
              value = sys.env("CLUSTER")
            }
            matcher {
              name = "namespace"
              match_type = "="
              value_from_label = "observability.core-backplane/query-namespace"
            }
          }

          rule_selector {
            match_expression {
              key = "observability.core-backplane/query-namespace"
              operator = "Exists"
            }
          }
        }
    extraEnv:
      - name: CLUSTER
        value: k8s
      - name: MIMIR_RULES_URL
        value: 'http://core-mimir.core-prod.svc.cluster.local:8080'
      - name: MIMIR_TENANT
        value: core
  rbac:
    create: true
    clusterRules:
      - apiGroups: ['']
        resources: ['namespaces']
        verbs: ['get', 'list', 'watch']
      - apiGroups: ['monitoring.coreos.com']
        resources: ['prometheusrules']
        verbs: ['get', 'list', 'watch']
  serviceAccount:
    automountServiceAccountToken: true
  controller:
    type: statefulset
    replicas: 2
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
  serviceMonitor:
    enabled: true

alloy:
  destinations:
    lokiUrl: 'http://loki-core:3100/loki/api/v1/push'
    mimirUrl: http://10.44.2.161:8080/api/v1/push
    tempoEndpoint: 'tempo-core.core-prod.svc.{{ .Values.clusterDomain }}:4317'

  alloy:
    configMap:
      content: | # js
        logging {
          level = "info"
          format = "json"
        }

        // Export a sample of the gateway's own traces through Tempo.
        tracing {
          sampling_fraction = 0.1
          write_to = [otelcol.exporter.otlp.tempo.input]
        }

        // Cluster-wide PodMonitor discovery is owned by the clustered central
        // Alloy StatefulSet so node-local agents only process host telemetry.
        prometheus.operator.podmonitors "pods" {
          clustering {
            enabled = true
          }
          scrape {
            default_scrape_interval = "5m"
          }
          forward_to = [prometheus.remote_write.mimir.receiver]
        }

        {{- if false }}
        // not on any node-local DaemonSet.
        discovery.kubernetes "pod" {
          role = "pod"
        }

        discovery.kubernetes "services" {
          role = "service"
        }

        // Scrape every node directly. The kubelet ServiceMonitor is disabled
        // because the headless Service path was resolving to only one node in
        // the Alloy target set.
        discovery.kubernetes "nodes" {
          role = "node"
        }

        discovery.relabel "kubelet_cadvisor" {
          targets = discovery.kubernetes.nodes.targets

          rule {
            target_label = "__address__"
            replacement = "kubernetes.default.svc.{{ .Values.clusterDomain }}:443"
          }

          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            regex = "(.+)"
            replacement = "/api/v1/nodes/$1/proxy/metrics/cadvisor"
            target_label = "__metrics_path__"
          }

          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label = "instance"
          }

          rule {
            source_labels = ["__meta_kubernetes_node_name"]
            target_label = "__tmp_hash"
          }

          rule {
            target_label = "job"
            replacement = "kubelet"
          }
        }

        prometheus.scrape "kubelet_cadvisor" {
          targets = discovery.relabel.kubelet_cadvisor.output
          job_name = "kubelet"
          scheme = "https"
          scrape_interval = "30s"
          bearer_token_file = "/var/run/secrets/kubernetes.io/serviceaccount/token"

          tls_config {
            server_name = "kubernetes"
            ca_file = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
          }

          clustering {
            enabled = true
          }

          forward_to = [prometheus.remote_write.mimir.receiver]
        }

        {{- end }}
        // Backend writers remain centralized so node agents carry no backend
        // addresses or credentials.
        loki.write "loki" {
          endpoint {
            url = {{ required "alloy.destinations.lokiUrl is required" .Values.destinations.lokiUrl | quote }}
            tenant_id = {{ required "alloy.destinations.orgId is required" .Values.destinations.orgId | quote }}
          }
        }

        {{- if false }}
          forward_to = [prometheus.remote_write.mimir.receiver]
          clustering {
            enabled = true
          }
        }

        prometheus.operator.servicemonitors "services" {
          forward_to = [prometheus.remote_write.mimir.receiver]
          clustering {
            enabled = true
          }
        }

        prometheus.operator.probes "probes" {
          forward_to = [prometheus.remote_write.mimir.receiver]
          clustering {
            enabled = true
          }
        }

        // Generic scrape of pods annotated with prometheus.io/scrape=true.
        discovery.relabel "annotation_autodiscovery_pods" {
          targets = discovery.kubernetes.pod.targets
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scrape"]
            regex = "true"
            action = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_job"]
            action = "replace"
            target_label = "job"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_instance"]
            action = "replace"
            target_label = "instance"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_path"]
            action = "replace"
            target_label = "__metrics_path__"
          }

          // Choose the pod port
          // The discovery generates a target for each declared container port of the pod.
          // If the metricsPortName annotation has value, keep only the target where the port name matches the one of the annotation.
          rule {
            source_labels = ["__meta_kubernetes_pod_container_port_name"]
            target_label = "__tmp_port"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_portName"]
            regex = "(.+)"
            target_label = "__tmp_port"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_port_name"]
            action = "keepequal"
            target_label = "__tmp_port"
          }

          // If the metrics port number annotation has a value, override the target address to use it, regardless whether it is
          // one of the declared ports on that Pod.
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
            regex = "(\\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})"
            replacement = "[$2]:$1" // IPv6
            target_label = "__address__"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_port", "__meta_kubernetes_pod_ip"]
            regex = "(\\d+);((([0-9]+?)(\\.|$)){4})" // IPv4, takes priority over IPv6 when both exists
            replacement = "$2:$1"
            target_label = "__address__"
          }

          rule {
            source_labels = ["__meta_kubernetes_pod_annotation_prometheus_io_scheme"]
            action = "replace"
            target_label = "__scheme__"
          }


          // add labels
          rule {
            source_labels = ["__meta_kubernetes_pod_name"]
            target_label = "pod"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_container_name"]
            target_label = "container"
          }
          rule {
            source_labels = ["__meta_kubernetes_pod_controller_name"]
            target_label = "controller"
          }

          rule {
            source_labels = ["__meta_kubernetes_namespace"]
            target_label = "namespace"
          }


          rule {
            source_labels = ["__meta_kubernetes_pod_label_app"]
            target_label = "app"
          }

          // map all labels
          rule {
            action = "labelmap"
            regex  = "__meta_kubernetes_pod_label_(.+)"
          }
        }

        // Generic scrape of Services annotated with prometheus.io/scrape=true.
        discovery.relabel "annotation_autodiscovery_services" {
          targets = discovery.kubernetes.services.targets
          rule {
            source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scrape"]
            regex = "true"
            action = "keep"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_job"]
            action = "replace"
            target_label = "job"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_instance"]
            action = "replace"
            target_label = "instance"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_path"]
            action = "replace"
            target_label = "__metrics_path__"
          }

          // Choose the service port
          rule {
            source_labels = ["__meta_kubernetes_service_port_name"]
            target_label = "__tmp_port"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_portName"]
            regex = "(.+)"
            target_label = "__tmp_port"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_port_name"]
            action = "keepequal"
            target_label = "__tmp_port"
          }

          rule {
            source_labels = ["__meta_kubernetes_service_port_number"]
            target_label = "__tmp_port"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_port"]
            regex = "(.+)"
            target_label = "__tmp_port"
          }
          rule {
            source_labels = ["__meta_kubernetes_service_port_number"]
            action = "keepequal"
            target_label = "__tmp_port"
          }

          rule {
            source_labels = ["__meta_kubernetes_service_annotation_prometheus_io_scheme"]
            action = "replace"
            target_label = "__scheme__"
          }
        }

        prometheus.scrape "metrics" {
          job_name   = "integrations/autodiscovery_metrics"
          targets  = array.concat(discovery.relabel.annotation_autodiscovery_pods.output, discovery.relabel.annotation_autodiscovery_services.output)
          honor_labels = true
          clustering {
            enabled = true
          }
          forward_to = [prometheus.remote_write.mimir.receiver]
        }

        {{- end }}
        prometheus.remote_write "mimir" {
          endpoint {
            url = {{ required "alloy.destinations.mimirUrl is required" .Values.destinations.mimirUrl | quote }}
            headers = {
              "X-Scope-OrgID" = {{ required "alloy.destinations.orgId is required" .Values.destinations.orgId | quote }},
            }
          }
          external_labels = {
            cluster = sys.env("CLUSTER"),
            dc = sys.env("DC"),
            region = sys.env("REGION"),
            // Mimir uses this label to deduplicate samples during Alloy failover.
            __replica__ = sys.env("HOSTNAME"),
          }
        }

        {{- if false }}
        // producers and keep backend addressing in the central Alloy tier.
        prometheus.receive_http "internal" {
          http {
            listen_address = "0.0.0.0"
            listen_port    = 9090
          }
          forward_to = [prometheus.remote_write.mimir.receiver]
        }
        {{- end }}

        // Convert gateway OTLP metrics into the existing Prometheus
        // remote-write pipeline.
        otelcol.exporter.prometheus "mimir" {
          forward_to = [prometheus.remote_write.mimir.receiver]
        }

        otelcol.receiver.otlp "gateway" {
          http {
            endpoint = "0.0.0.0:4318"
          }
          grpc {
            endpoint = "0.0.0.0:4317"
          }

          output {
            traces  = [otelcol.processor.k8sattributes.gateway.input]
            logs    = [otelcol.processor.transform.logs.input]
            // Prometheus metrics already carry their source labels. Do not
            // associate them with the Alloy gateway pod through the OTLP
            // connection; that would rewrite source metadata to the receiver.
            metrics = [otelcol.processor.transform.metrics_metadata.input]
          }
        }

        // Convert attributes carried by the Loki-to-OTLP bridge into
        // canonical Kubernetes resource attributes before pod association.
        otelcol.processor.transform "logs" {
          error_mode = "ignore"

          log_statements {
            context = "log"
            statements = [
              `set(resource.attributes["k8s.pod.uid"], attributes["pod_uid"]) where attributes["pod_uid"] != nil`,
              `set(resource.attributes["k8s.namespace.name"], attributes["namespace"]) where attributes["namespace"] != nil`,
              `set(resource.attributes["k8s.pod.name"], attributes["pod"]) where attributes["pod"] != nil`,
              `set(resource.attributes["k8s.container.name"], attributes["container"]) where attributes["container"] != nil`,
              `set(resource.attributes["k8s.cluster.name"], attributes["cluster"]) where attributes["cluster"] != nil`,
              `set(resource.attributes["dc"], attributes["dc"]) where attributes["dc"] != nil`,
              `set(resource.attributes["loki.resource.labels"], "cluster, dc, k8s.cluster.name, k8s.namespace.name, k8s.pod.name, k8s.container.name")`,
              `delete_key(attributes, "pod_uid")`,
              `delete_key(attributes, "namespace")`,
              `delete_key(attributes, "pod")`,
              `delete_key(attributes, "container")`,
              `delete_key(attributes, "cluster")`,
              `delete_key(attributes, "dc")`,
            ]
          }

          output {
            logs = [otelcol.processor.k8sattributes.gateway.input]
          }
        }

        // Vector has already enriched infrastructure logs. Keep them out of
        // k8sattributes so they are not associated with the Vector pod.
        otelcol.receiver.otlp "infrastructure" {
          http {
            endpoint = "0.0.0.0:4328"
          }

          output {
            logs = [otelcol.processor.batch.gateway.input]
          }
        }

        otelcol.processor.k8sattributes "gateway" {
          extract {
            metadata = [
              "k8s.namespace.name",
              "k8s.pod.name",
              "k8s.pod.uid",
              "k8s.container.name",
              "k8s.node.name",
              "k8s.deployment.name",
              "k8s.replicaset.name",
              "k8s.statefulset.name",
              "k8s.daemonset.name",
              "k8s.job.name",
              "k8s.cronjob.name",
            ]
          }

          pod_association {
            source {
              from = "resource_attribute"
              name = "k8s.pod.uid"
            }
          }

          output {
            traces  = [otelcol.processor.batch.gateway.input]
            logs     = [otelcol.processor.batch.gateway.input]
          }
        }

        // Keep the standard Prometheus label names used by Grafana's
        // Kubernetes dashboards while retaining the full k8s.* resource
        // attributes on OTLP logs and traces.
        otelcol.processor.transform "metrics_metadata" {
          error_mode = "ignore"

          metric_statements {
            context = "datapoint"
            statements = [
              `set(attributes["namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil`,
              `set(attributes["pod"], resource.attributes["k8s.pod.name"]) where resource.attributes["k8s.pod.name"] != nil`,
              `set(attributes["container"], resource.attributes["k8s.container.name"]) where resource.attributes["k8s.container.name"] != nil`,
              `set(attributes["node"], attributes["source_node"]) where attributes["source_node"] != nil`,
              `set(attributes["instance"], attributes["source_node"]) where attributes["source_node"] != nil`,
              `set(attributes["node"], resource.attributes["k8s.node.name"]) where attributes["source_node"] == nil and resource.attributes["k8s.node.name"] != nil`,
              `delete_key(attributes, "source_node")`,
              `set(attributes["deployment"], resource.attributes["k8s.deployment.name"]) where resource.attributes["k8s.deployment.name"] != nil`,
              `set(attributes["statefulset"], resource.attributes["k8s.statefulset.name"]) where resource.attributes["k8s.statefulset.name"] != nil`,
              `set(attributes["daemonset"], resource.attributes["k8s.daemonset.name"]) where resource.attributes["k8s.daemonset.name"] != nil`,
              `set(attributes["cluster"], resource.attributes["k8s.cluster.name"]) where resource.attributes["k8s.cluster.name"] != nil`,
            ]
          }

          output {
            metrics = [otelcol.processor.batch.gateway.input]
          }
        }

        otelcol.processor.batch "gateway" {
          output {
            traces  = [otelcol.exporter.otlp.tempo.input]
            metrics = [otelcol.exporter.prometheus.mimir.input]
            logs    = [otelcol.exporter.loki.loki.input]
          }
        }

        otelcol.exporter.otlp "tempo" {
          client {
            endpoint = {{ required "alloy.destinations.tempoEndpoint is required" .Values.destinations.tempoEndpoint | quote }}

            headers = {
              "X-Scope-OrgID" = {{ required "alloy.destinations.orgId is required" .Values.destinations.orgId | quote }},
            }

            tls {
              insecure = true
            }
          }
        }

        otelcol.exporter.loki "loki" {
          forward_to = [loki.write.loki.receiver]
        }

        // Retain legacy Jaeger protocols on the central gateway for endpoint
        // compatibility; new node-local clients should use alloy-otlp.
        otelcol.receiver.jaeger "compatibility" {
          protocols {
            grpc {
              endpoint = "0.0.0.0:14250"
            }
            thrift_http {
              endpoint = "0.0.0.0:14268"
            }
            thrift_binary {
              endpoint = "0.0.0.0:6832"
            }
            thrift_compact {
              endpoint = "0.0.0.0:6831"
            }
          }

          output {
            traces = [otelcol.processor.k8sattributes.gateway.input]
          }
        }

    stabilityLevel: experimental
    extraPorts:
    - name: otel-grpc
      port: 4317
      targetPort: 4317
      protocol: TCP
      appProtocol: grpc
    - name: otel-http
      port: 4318
      targetPort: 4318
      protocol: TCP
    - name: infra-otel-http
      port: 4328
      targetPort: 4328
      protocol: TCP
    - name: 'prom-write'
      port: 9090
      targetPort: 9090
      protocol: 'TCP'
      appProtocol: 'http'
    - name: jaeger-grpc
      port: 14250
      targetPort: 14250
      protocol: TCP
      appProtocol: grpc
    - name: jaeger-http
      port: 14268
      targetPort: 14268
      protocol: TCP
    - name: jaeger-binary
      port: 6832
      targetPort: 6832
      protocol: UDP
    - name: jaeger-compact
      port: 6831
      targetPort: 6831
      protocol: UDP
  configReloader:
    resources:
      requests:
        cpu: 1m
        memory: 5Mi
  controller:
    type: statefulset
    replicas: 3
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: alloy
            topologyKey: kubernetes.io/hostname
    podDisruptionBudget:
      enabled: true
      maxUnavailable: 1
  serviceMonitor:
    enabled: true
alloy-mixin:
  additionalLabels:
    grafana_dashboard: 'true'

vector:
  enabled: false
  role: Stateless-Aggregator

  # Vector 0.57 disables configuration environment interpolation by default.
  # This deployment deliberately retains it for the ApplicationSet-injected
  # VECTOR_OTLP_LOGS_ENDPOINT; no secret values are interpolated.
  args:
    - --config-dir
    - /etc/vector/
    - --dangerously-allow-env-var-interpolation

  # Vector does not read Kubernetes resources, so do not create RBAC or mount
  # API credentials into the pod.
  rbac:
    create: false
  serviceAccount:
    automountToken: false

  # customConfig replaces the chart defaults, including its API configuration.
  # Keep the API pod-local to the cluster network and use its gRPC health service
  # for kubelet probes; it is not exposed by either Service.
  livenessProbe:
    grpc:
      port: 8686
  readinessProbe:
    grpc:
      port: 8686
  startupProbe:
    grpc:
      port: 8686

  service:
    enabled: false

  serviceHeadless:
    enabled: false

  syslogService:
    annotations:
      argocd.argoproj.io/sync-wave: '0'
      purelb.io/addresses: 10.1.1.14
      purelb.io/allow-local: 'true'
      purelb.io/allow-shared-ip: syslog.dc1.mylogin.space
    ports:
      - name: syslog-udp
        port: 514
        protocol: UDP
        targetPort: 1514
      - name: syslog-tcp
        port: 514
        protocol: TCP
        targetPort: 1514
      - name: talos-kernel
        port: 6050
        protocol: UDP
        targetPort: 6050
      - name: talos-service
        port: 6051
        protocol: UDP
        targetPort: 6051

  customConfig:
    data_dir: /vector-data-dir

    api:
      enabled: true
      address: 0.0.0.0:8686

    sources:
      net_syslog_udp:
        type: socket
        address: 0.0.0.0:1514
        mode: udp
        max_length: 102400
        host_key: source_address

      net_syslog_tcp:
        type: socket
        address: 0.0.0.0:1514
        mode: tcp
        max_length: 102400
        host_key: source_address

      talos_kernel_logs:
        type: socket
        address: 0.0.0.0:6050
        mode: udp
        max_length: 102400
        decoding:
          codec: json
        host_key: __host

      talos_service_logs:
        type: socket
        address: 0.0.0.0:6051
        mode: udp
        max_length: 102400
        decoding:
          codec: json
        host_key: __host

    transforms:
      tag_network_syslog_udp:
        type: remap
        inputs:
          - net_syslog_udp
        source: '.network_transport = "udp"'

      tag_network_syslog_tcp:
        type: remap
        inputs:
          - net_syslog_tcp
        source: '.network_transport = "tcp"'

      normalize_network_syslog:
        type: remap
        inputs:
          - tag_network_syslog_udp
          - tag_network_syslog_tcp
        source: |-
          raw = string!(.message)
          transport = string!(.network_transport)

          cisco, cisco_error = parse_grok(
            raw,
            "^<%{NUMBER:syslog_pri}>%{NUMBER:sequence}: %{DATA:device}: %{MONTH:month} %{NUMBER:day} %{TIME:time}: %%{DATA:message_id}: %{GREEDYDATA:message}",
          )

          if cisco_error == null {
            .message = cisco.message
            .device_name = cisco.device
            .event_code = cisco.message_id
            .observer_vendor = "Cisco"
            .service_name = "cisco.syslog"
          } else {
            parsed, syslog_error = parse_syslog(raw)
            if syslog_error == null {
              . = merge(., parsed)
            }

            app = downcase(to_string(.appname) ?? "")
            body = downcase(to_string(.message) ?? raw)
            is_idrac = contains(app, "idrac") || contains(body, "idrac") || match(body, r'\brac\d{3,}\b')
            .observer_vendor = if is_idrac { "Dell" } else { "unknown" }
            .service_name = if is_idrac { "dell.idrac" } else { "network.syslog" }
            .device_name = to_string(.hostname) ?? to_string(.host) ?? to_string(.source_address) ?? "unknown"
            .event_code = to_string(.msgid) ?? to_string(.appname) ?? "syslog"
          }

          .event_dataset = .service_name
          .event_timestamp = to_timestamp(.timestamp) ?? now()
          .network_transport = transport
          .syslog_facility = to_string(.facility) ?? "unknown"
          .syslog_severity = to_string(.severity) ?? "unknown"

      normalize_talos_kernel:
        type: remap
        inputs:
          - talos_kernel_logs
        source: |-
          .__host = replace!(.__host, r'172\.16\.20\..+', "infra2")
          .__host = replace!(.__host, r'172\.31\.241\..+', "node2")
          .device_name = to_string(.__host) ?? "unknown"
          .event_code = "kernel"
          .event_dataset = "talos.kernel"
          .event_timestamp = to_timestamp(.timestamp) ?? now()
          .network_transport = "udp"
          .observer_vendor = "Sidero Labs"
          .service_name = "talos.kernel"
          .syslog_facility = to_string(.facility) ?? "kernel"
          .syslog_severity = to_string(.level) ?? "unknown"

      normalize_talos_service:
        type: remap
        inputs:
          - talos_service_logs
        source: |-
          .__host = replace!(.__host, r'172\.16\.20\..+', "infra2")
          .__host = replace!(.__host, r'172\.31\.241\..+', "node2")
          .device_name = to_string(.__host) ?? "unknown"
          .event_code = to_string(.service) ?? "service"
          .event_dataset = "talos.service"
          .event_timestamp = to_timestamp(.timestamp) ?? now()
          .network_transport = "udp"
          .observer_vendor = "Sidero Labs"
          .service_name = "talos.service"
          .syslog_facility = to_string(.facility) ?? "daemon"
          .syslog_severity = to_string(.level) ?? "unknown"

      encode_otlp_logs:
        type: remap
        inputs:
          - normalize_network_syslog
          - normalize_talos_kernel
          - normalize_talos_service
        source: |-
          body = to_string(.message) ?? encode_json(.)
          cluster = get_env_var!("VECTOR_CLUSTER")
          dc = get_env_var!("VECTOR_DC")

          . = {
            "resourceLogs": [{
              "resource": {
                "attributes": [
                  { "key": "service.name", "value": { "stringValue": string!(.service_name) } },
                  { "key": "service.namespace", "value": { "stringValue": "infrastructure" } },
                  { "key": "host.name", "value": { "stringValue": string!(.device_name) } },
                  { "key": "observer.vendor", "value": { "stringValue": string!(.observer_vendor) } },
                  { "key": "cluster", "value": { "stringValue": cluster } },
                  { "key": "dc", "value": { "stringValue": dc } },
                  { "key": "loki.resource.labels", "value": { "stringValue": "service.name,service.namespace,host.name,observer.vendor,cluster,dc" } }
                ]
              },
              "scopeLogs": [{
                "scope": { "name": "vector.syslog" },
                "logRecords": [{
                  "timeUnixNano": to_unix_timestamp!(.event_timestamp, unit: "nanoseconds"),
                  "body": { "stringValue": body },
                  "severityText": upcase(string!(.syslog_severity)),
                  "attributes": [
                    { "key": "event.code", "value": { "stringValue": string!(.event_code) } },
                    { "key": "event.dataset", "value": { "stringValue": string!(.event_dataset) } },
                    { "key": "network.transport", "value": { "stringValue": string!(.network_transport) } },
                    { "key": "source.address", "value": { "stringValue": to_string(.source_address) ?? "unknown" } },
                    { "key": "syslog.facility", "value": { "stringValue": string!(.syslog_facility) } }
                  ]
                }]
              }]
            }]
          }

    sinks:
      otlp_logs:
        type: opentelemetry
        inputs:
          - encode_otlp_logs
        batch:
          max_events: 1000
          timeout_secs: 1
        buffer:
          type: memory
          max_events: 5000
          when_full: block
        protocol:
          type: http
          uri: ${VECTOR_OTLP_LOGS_ENDPOINT}
          encoding:
            codec: otlp
