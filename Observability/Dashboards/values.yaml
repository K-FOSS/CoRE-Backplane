hub: true

cluster:
  # ApplicationSet replaces these chart defaults for each target cluster.
  name: 'k8s'
  domain: 'cluster.local'
  datacenter: 'dc1'
  region: 'yxl'

grafana:
  fullnameOverride: 'grafana-core'

  revisionHistoryLimit: 3

  route:
    main:
      enabled: true
      labels:
        wan-mode: 'public'
      hostnames:
        - 'grafana.int.mylogin.space'
      parentRefs:
        - group: 'gateway.networking.k8s.io'
          kind: 'Gateway'
          namespace: 'core-prod'
          name: 'main-gw'
      timeouts:
        backendRequest: 3600s
        request: 0s

  service:
    # Gateway API uses this backend protocol marker to preserve Grafana Live
    # WebSocket upgrades through Envoy Gateway.
    appProtocol: 'kubernetes.io/ws'

  admin:
    existingSecret: 'core-grafana-creds'
    userKey: 'username'
    passwordKey: 'password'

  envValueFrom:
    DRAGONFLY_PASSWORD:
      secretKeyRef:
        name: 'dragonfly-core-password'
        key: 'password'
    GF_DATABASE_URL:
      secretKeyRef:
        name: 'core-grafana-creds'
        key: 'psqlURI'
    OIDC_CLIENT_ID:
      secretKeyRef:
        name: 'grafana-core-authentik'
        key: 'client_id'
    OIDC_CLIENT_SECRET:
      secretKeyRef:
        name: 'grafana-core-authentik'
        key: 'client-secret'

  env:
    GF_PLUGINS_PREINSTALL_SYNC: 'grafana-advisor-app@1.0.2,grafana-llm-app@1.0.8,opennms-opennms-app@12.0.1'

  grafana.ini:
    live:
      ha_engine: 'redis'
      ha_engine_address: 'rediss://$__env{DRAGONFLY_ADDRESS}'
      ha_engine_password: '$__env{DRAGONFLY_PASSWORD}'
    remote_cache:
      type: 'redis'
      connstr: 'addr=$__env{DRAGONFLY_ADDRESS},pool_size=50,db=132,password=$__env{DRAGONFLY_PASSWORD},ssl=true'
    database:
      type: 'postgres'
      max_idle_conn: 10
      max_open_conn: 50
      conn_max_lifetime: 1800
      ssl_mode: 'require'
    server:
      domain: 'grafana.int.mylogin.space'
      root_url: 'https://grafana.int.mylogin.space'
    auth.ldap:
      enabled: true
      allow_sign_up: true
      config_file: '/etc/grafana/ldap.toml'
    auth:
      signout_redirect_url: 'https://idp.mylogin.space/flows/-/default/invalidation/'
    auth.proxy:
      enabled: true
      header_name: 'X-username'
      header_property: 'username'
      headers: 'Name:X-name'
      enable_login_token: false
    auth.generic_oauth:
      enabled: false
      name: 'authentik'
      client_id: '$__env{OIDC_CLIENT_ID}'
      client_secret: '$__env{OIDC_CLIENT_SECRET}'
      scopes: 'openid profile email logs'
      auth_url: 'https://idp.mylogin.space/application/o/authorize/'
      token_url: 'https://idp.mylogin.space/application/o/token/'
      api_url: 'https://idp.mylogin.space/application/o/userinfo/'
      role_attribute_path: "contains(groups, 'Network Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'"
    users:
      allow_sign_up: false
      auto_assign_org: true
      auto_assign_org_role: 'Editor'

  ldap:
    enabled: true
    groupMappings:
      - groupDn: 'cn=authentik Admins,ou=groups,dc=ldap,dc=mylogin,dc=space'
        orgRole: 'Admin'
        grafanaAdmin: true
      - groupDn: 'cn=Grafana Admins,ou=groups,dc=ldap,dc=mylogin,dc=space'
        orgRole: 'Admin'
        grafanaAdmin: true
      - groupDn: 'cn=Grafana Dashboard Sync,ou=groups,dc=ldap,dc=mylogin,dc=space'
        orgRole: 'Admin'
        grafanaAdmin: false

  sidecar:
    dashboards:
      enabled: false

dashboardSync:
  enabled: true
  centralClusterName: 'core-home1-talos-prod'
  namespaces:
    - 'core-prod'
    - 'k8gb'
    - 'kube-system'
    - 'longhorn-system'
  image:
    repository: 'quay.io/kiwigrid/k8s-sidecar'
    tag: '2.14.1'
    digest: 'sha256:092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7'
