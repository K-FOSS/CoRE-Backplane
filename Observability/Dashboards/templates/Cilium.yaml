apiVersion: v1
kind: ConfigMap
metadata:
  name: 'grafana-dashboard-cilium'
  labels:
    grafana_dashboard: 'true'
  annotations:
    grafana_folder: 'Cilium'
    k8s-sidecar-target-directory: 'Cilium'
data:
  cilium-agent.url: |-
    https://grafana.com/api/dashboards/16611/revisions/1/download
  cilium-operator.url: |-
    https://grafana.com/api/dashboards/16612/revisions/1/download
  cilium-hubble.url: |-
    https://grafana.com/api/dashboards/16613/revisions/1/download
