{{- if .Values.hub }}
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: grafana-core

spec:
  name: Grafana

  serviceAccount: true

  groups:
    - LDAPService
    - Grafana Admins

  psql:
    enabled: true
    database: 'GR7Ctx7FGh'

  writeConnectionSecretToRef:
    name: core-grafana-creds
{{- end }}
