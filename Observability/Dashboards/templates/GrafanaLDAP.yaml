apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-core-ldap
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: mainvault-core

  target:
    name: grafana-core-ldap
    template:
      engineVersion: v2
      data:
        ldap-toml: |
          [[servers]]
          host = "ldap-{{ .Values.cluster.datacenter }}.mylogin.space"
          port = 636
          use_ssl = true
          start_tls = false
          tls_ciphers = []
          min_tls_version = ""
          ssl_skip_verify = false
          bind_dn = "cn={{ "{{ .Username }}" }},ou=users,dc=ldap,dc=mylogin,dc=space"
          bind_password = "{{ "{{ .Password }}" }}"
          timeout = 10
          search_filter = "(cn=%s)"
          search_base_dns = ["ou=users,dc=ldap,dc=mylogin,dc=space"]
          group_search_base_dns = ["ou=groups,dc=ldap,dc=mylogin,dc=space"]

          [servers.attributes]
          member_of = "memberOf"
          email = "mail"
          name = "name"
          surname = "lastname"
          username = "cn"
          uid = "uid"

          {{- range .Values.grafana.ldap.groupMappings }}
          [[servers.group_mappings]]
          group_dn = "{{ .groupDn }}"
          org_role = "{{ .orgRole }}"
          grafana_admin = {{ .grafanaAdmin }}
          {{- end }}
  data:
    - secretKey: Username
      remoteRef:
        key: Grafana/User
        property: Username

    - secretKey: Password
      remoteRef:
        key: Grafana/User
        property: Password
