apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: core-grafana

spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana-core

  jwt:
    optional: false
    providers:
      - name: authentik
        issuer: 'https://idp.mylogin.space/application/o/grafana-test/'
        remoteJWKS:
          uri: 'https://idp.mylogin.space/application/o/grafana-test/jwks/'
          cacheDuration: '3600s'
          backendRefs:
            - group: 'gateway.envoyproxy.io'
              kind: 'Backend'
              name: 'grafana-authentik-idp'
              port: 443
          backendSettings:
            retry:
              numRetries: 3
              perRetry:
                backOff:
                  baseInterval: '1s'
                  maxInterval: '5s'
              retryOn:
                triggers:
                  - '5xx'
                  - 'gateway-error'
                  - 'reset'
        claimToHeaders:
          - header: x-username
            claim: preferred_username

          - header: x-name
            claim: name

          - header: x-lastname
            claim: last_name

          - header: x-email
            claim: email

          - header: x-groups
            claim: groups
        extractFrom:
          headers:
            - name: Authorization
              valuePrefix: 'Bearer '
          cookies:
            - core-token
          params:
            - token

  oidc:
    provider:
      issuer: 'https://idp.mylogin.space/application/o/grafana-test/'
      backendRefs:
        - group: 'gateway.envoyproxy.io'
          kind: 'Backend'
          name: 'grafana-authentik-idp'
          port: 443
          weight: 1
          fallback: false

      authorizationEndpoint: 'https://idp.mylogin.space/application/o/authorize/'
      tokenEndpoint: 'https://idp.mylogin.space/application/o/token/'

      backendSettings:
        retry:
          numRetries: 3
          perRetry:
            backOff:
              baseInterval: '1s'
              maxInterval: '5s'
          retryOn:
            triggers:
              - '5xx'
              - 'gateway-error'
              - 'reset'

    scopes:
      - openid
      - profile
      - logs
      - offline_access
    cookieNames:
      accessToken: core-token
      idToken: core-id-token
    clientID: grafana-test
    forwardAccessToken: true
    refreshToken: true
    clientSecret:
      name: grafana-core-authentik
