{{- if .Values.dashboardSync.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sync-script
data:
  import.py: |-
    #!/usr/bin/env python3
    import json
    import hashlib
    import os
    import re
    import time
    import fcntl
    from pathlib import Path
    from urllib.error import HTTPError
    from urllib.parse import parse_qsl, quote, urlencode, urlsplit, urlunsplit
    from urllib.request import Request, urlopen

    ROOT = Path(os.environ['FOLDER'])
    GRAFANA_URL = os.environ['GRAFANA_URL'].rstrip('/')
    token = os.environ['GRAFANA_TOKEN']
    cluster_name = os.environ['CLUSTER_NAME']
    datacenter = os.environ['DC']
    region = os.environ['REGION']
    central_cluster_name = os.environ['CENTRAL_CLUSTER_NAME']
    STATE_PATH = Path(os.environ['SYNC_STATE'])
    LOCK_PATH = Path(os.environ['SYNC_LOCK'])
    VERIFICATION_INTERVAL = int(os.environ.get('SYNC_VERIFICATION_INTERVAL', '300'))
    FOLDER_API = '/apis/folder.grafana.app/v1/namespaces/default/folders'
    DASHBOARD_API = '/apis/dashboard.grafana.app/v1/namespaces/default/dashboards'

    def request(method, path, payload=None):
        body = None
        headers = {
            'Authorization': f'Bearer {token}',
            'Accept': 'application/json',
        }
        if payload is not None:
            body = json.dumps(payload).encode()
            headers['Content-Type'] = 'application/json'
        req = Request(f'{GRAFANA_URL}{path}', data=body, headers=headers, method=method)
        with urlopen(req, timeout=30) as response:
            return response.status, json.loads(response.read() or b'{}')

    def source_digest(path):
        """Hash the source content, not mtime; sidecar rewrites files on events."""
        digest = hashlib.sha256()
        with path.open('rb') as stream:
            for chunk in iter(lambda: stream.read(1024 * 1024), b''):
                digest.update(chunk)
        return digest.hexdigest()

    def load_state():
        try:
            with STATE_PATH.open(encoding='utf-8') as stream:
                value = json.load(stream)
            return value if isinstance(value, dict) else {}
        except (FileNotFoundError, json.JSONDecodeError):
            return {}

    def save_state(state):
        temporary = STATE_PATH.with_suffix('.tmp')
        with temporary.open('w', encoding='utf-8') as stream:
            json.dump(state, stream, sort_keys=True)
            stream.flush()
            os.fsync(stream.fileno())
        temporary.replace(STATE_PATH)

    def acquire_lock():
        lock = LOCK_PATH.open('w', encoding='utf-8')
        fcntl.flock(lock.fileno(), fcntl.LOCK_EX)
        return lock

    def normalized_dashboard(value):
        dashboard = json.loads(json.dumps(value))
        for key in ('id', 'version', 'iteration'):
            dashboard.pop(key, None)
        return dashboard

    def dashboard_is_unchanged(uid, desired):
        try:
            _, result = request('GET', f'/api/dashboards/uid/{quote(uid, safe="")}')
        except HTTPError as error:
            if error.code == 404:
                return False
            raise
        current = result.get('dashboard', result)
        return normalized_dashboard(current) == normalized_dashboard(desired)

    def list_resources(path):
        resources = []
        continuation = None
        while True:
            query = {'limit': '1000'}
            if continuation:
                query['continue'] = continuation
            separator = '&' if '?' in path else '?'
            _, result = request('GET', f'{path}{separator}{urlencode(query)}')
            resources.extend(result.get('items', []))
            continuation = result.get('metadata', {}).get('continue')
            if not continuation:
                return resources

    def folder_uid(title, parent_uid=None):
        parent = parent_uid or 'root'
        return f'sync-{hashlib.sha256(f"{parent}:{title}".encode()).hexdigest()[:16]}'

    def local_dashboard_uid(original_uid, global_dashboard=False):
        if global_dashboard or cluster_name == central_cluster_name:
            return original_uid
        cluster_slug = re.sub(r'[^a-z0-9-]+', '-', cluster_name.lower()).strip('-')[:22]
        return f'{cluster_slug}-{hashlib.sha256(original_uid.encode()).hexdigest()[:12]}'

    def replace_dashboard_link(url, uid_map, folder_uid):
        parsed = urlsplit(url)
        if not parsed.path.startswith('./d/'):
            return url
        path_parts = parsed.path.split('/')
        if len(path_parts) < 4 or not path_parts[2]:
            return url
        path_parts[2] = uid_map.get(path_parts[2], path_parts[2])
        query = [
            (key, value)
            for key, value in parse_qsl(parsed.query, keep_blank_values=True)
            if key != 'folderUid'
        ]
        query.append(('folderUid', folder_uid))
        return urlunsplit(
            (
                parsed.scheme,
                parsed.netloc,
                '/'.join(path_parts),
                urlencode(query),
                parsed.fragment,
            )
        )

    def replace_dashboard_links(value, uid_map, folder_uid, scope_tag):
        if isinstance(value, dict):
            rewritten = {
                key: replace_dashboard_links(item, uid_map, folder_uid, scope_tag)
                for key, item in value.items()
            }
            if value.get('type') == 'dashboards':
                tags = rewritten.get('tags')
                if not isinstance(tags, list):
                    tags = []
                if scope_tag not in tags:
                    tags.append(scope_tag)
                rewritten['tags'] = tags
            return rewritten
        if isinstance(value, list):
            return [
                replace_dashboard_links(item, uid_map, folder_uid, scope_tag)
                for item in value
            ]
        if isinstance(value, str):
            return replace_dashboard_link(value, uid_map, folder_uid)
        return value

    def normalize_prometheus_datasource(value):
        if isinstance(value, dict):
            normalized = {
                key: normalize_prometheus_datasource(item)
                for key, item in value.items()
            }
            if normalized.get('name') == 'DS_PROMETHEUS':
                normalized['name'] = 'datasource'
            return normalized
        if isinstance(value, list):
            return [normalize_prometheus_datasource(item) for item in value]
        if isinstance(value, str):
            return value.replace('${DS_PROMETHEUS}', '${datasource}')
        return value

    def scope_prometheus_query(query):
        # A query that already mentions cluster owns its routing and
        # aggregation semantics. Preserve it byte-for-byte, including queries
        # that group by cluster without a cluster matcher.
        if re.search(r'(?<![a-zA-Z0-9_])cluster(?![a-zA-Z0-9_])', query):
            return query
        scoped = {'cluster': '$cluster', 'dc': '$dc', 'region': '$region'}
        selector_open = chr(123)
        selector_close = chr(125)
        matchers = ','.join(
            f'{label}="{value}"' for label, value in scoped.items()
        )

        def scope_selector(match):
            metric = match.group('metric') or ''
            body = match.group('body')
            body = re.sub(
                r'(?:^|,)\s*(?:cluster|dc|region)\s*(?:=~|=|!~|!=)\s*"(?:\\.|[^"])*"\s*(?=,|$)',
                '',
                body,
            ).strip(', ')
            return f'{metric}{selector_open}{matchers}{"," if body else ""}{body}{selector_close}'

        query = re.sub(
            r'(?P<metric>[a-zA-Z_:][a-zA-Z0-9_:]*)?\x7b(?P<body>[^\x7b\x7d]*)\x7d',
            scope_selector,
            query,
        )
        for metric in ('kubelet_volume_stats_', 'longhorn_'):
            query = re.sub(
                rf'(?<![a-zA-Z0-9_:])({metric}[a-zA-Z0-9_:]*)(?![a-zA-Z0-9_:]|\s*\x7b)',
                rf'\1{selector_open}{matchers}{selector_close}',
                query,
            )
        if 'kubelet_volume_stats_' in query and 'longhorn_' in query:
            query = re.sub(
                r'\bon\s*\(\s*namespace\s*,\s*pvc\s*\)',
                'on (namespace, pvc, volume)',
                query,
            )
        return query

    def is_prometheus_datasource(value):
        return isinstance(value, dict) and value.get('type') == 'prometheus'

    def scope_prometheus_queries(value, inherited=False):
        if isinstance(value, dict):
            local = inherited or is_prometheus_datasource(value.get('datasource'))
            return {
                key: (
                    scope_prometheus_query(item)
                    if local and key in {'expr', 'query'} and isinstance(item, str)
                    else scope_prometheus_queries(item, local)
                )
                for key, item in value.items()
            }
        if isinstance(value, list):
            return [scope_prometheus_queries(item, inherited) for item in value]
        return value

    def contains_prometheus_datasource(value):
        if isinstance(value, dict):
            if is_prometheus_datasource(value.get('datasource')):
                return True
            return any(contains_prometheus_datasource(item) for item in value.values())
        if isinstance(value, list):
            return any(contains_prometheus_datasource(item) for item in value)
        return False

    def ensure_source_scope_variables(dashboard):
        values = {
            'cluster': cluster_name,
            'dc': datacenter,
            'region': region,
        }
        labels = {'cluster': 'Cluster', 'dc': 'Datacenter', 'region': 'Region'}
        variables = dashboard.setdefault('templating', {}).setdefault('list', [])
        by_name = {
            variable.get('name'): variable
            for variable in variables
            if isinstance(variable, dict) and variable.get('name')
        }
        for name, value in values.items():
            variable = by_name.get(name)
            if variable is None:
                variable = {'name': name}
                variables.append(variable)
            variable.update({
                'current': {'selected': True, 'text': value, 'value': value},
                'hide': 0,
                'includeAll': False,
                'label': labels[name],
                'multi': False,
                'options': [{'selected': True, 'text': value, 'value': value}],
                'query': value,
                'type': 'custom',
            })
            for key in ('allValue', 'datasource', 'refresh'):
                variable.pop(key, None)

    def is_global_dashboard(dashboard_path):
        # k8s-sidecar places annotated ConfigMaps under this directory.
        parts = dashboard_path.relative_to(ROOT).parts
        return bool(parts) and parts[0] == 'Global'

    def cleanup_empty_legacy_folders(folders, managed_titles, active_root_uid):
        try:
            dashboards = list_resources(DASHBOARD_API)
            dashboard_folders = {
                item.get('metadata', {}).get('annotations', {}).get(
                    'grafana.app/folder'
                )
                for item in dashboards
            }
            child_folders = {
                item.get('metadata', {}).get('annotations', {}).get(
                    'grafana.app/folder'
                )
                for item in folders
                if item.get('metadata', {}).get('annotations', {}).get(
                    'grafana.app/folder'
                )
            }
            for folder in folders:
                metadata = folder.get('metadata', {})
                annotations = metadata.get('annotations', {})
                uid = metadata.get('name')
                if (
                    folder.get('spec', {}).get('title') in managed_titles
                    and not annotations.get('grafana.app/folder')
                    and uid.startswith('sync-')
                    and uid != active_root_uid
                    and uid not in dashboard_folders
                    and uid not in child_folders
                ):
                    request('DELETE', f'{FOLDER_API}/{quote(uid, safe="")}')
        except Exception as error:
            # Cleanup is best effort; dashboard imports must continue if an
            # older Grafana API does not expose the dashboard list endpoint.
            print(f'Unable to clean up empty legacy folders: {error}')

    lock = acquire_lock()
    dashboard_paths = sorted(path for path in ROOT.rglob('*') if path.is_file())
    dashboards = []
    for dashboard_path in dashboard_paths:
        if dashboard_path.suffix == '.url':
            with dashboard_path.open(encoding='utf-8') as stream:
                dashboard_url = stream.read().strip()
            request_object = Request(
                dashboard_url,
                headers={'Accept': 'application/json'},
                method='GET',
            )
            with urlopen(request_object, timeout=30) as response:
                dashboard = json.loads(response.read())
        else:
            with dashboard_path.open(encoding='utf-8') as stream:
                dashboard = json.load(stream)
        dashboards.append((dashboard_path, dashboard))

    state = load_state()
    now = int(time.time())
    active_paths = {str(path.relative_to(ROOT)) for path, _ in dashboards}
    source_digests = {
        str(path.relative_to(ROOT)): source_digest(path)
        for path, _ in dashboards
    }
    dirty_paths = {
        str(path.relative_to(ROOT))
        for path, _ in dashboards
        if (
            state.get(str(path.relative_to(ROOT)), {}).get('sourceDigest')
            != source_digests[str(path.relative_to(ROOT))]
            or now - state.get(str(path.relative_to(ROOT)), {}).get('verifiedAt', 0)
            >= VERIFICATION_INTERVAL
        )
    }
    stale_paths = set(state) - active_paths
    if not dirty_paths and not stale_paths:
        print(f'dashboard sync complete: imported=0 skipped={len(active_paths)} active={len(active_paths)}')
        lock.close()
        raise SystemExit(0)

    uid_map = {}
    for dashboard_path, dashboard in dashboards:
        original_uid = dashboard.get('uid')
        global_dashboard = is_global_dashboard(dashboard_path)
        if original_uid:
            uid_map[original_uid] = local_dashboard_uid(
                original_uid, is_global_dashboard(dashboard_path)
            )

    folders = list_resources(FOLDER_API)
    folders_by_key = {
        (
            item.get('spec', {}).get('title'),
            item.get('metadata', {}).get('annotations', {}).get('grafana.app/folder'),
        ): item.get('metadata', {}).get('name')
        for item in folders
    }
    cluster_folder = None
    managed_folder_titles = set()

    def ensure_indexed_folder(title, parent_uid):
        key = (title, parent_uid or None)
        existing = folders_by_key.get(key)
        if existing:
            return existing
        uid = folder_uid(title, parent_uid)
        payload = {
            'metadata': {'name': uid},
            'spec': {'title': title},
        }
        if parent_uid:
            payload['metadata']['annotations'] = {'grafana.app/folder': parent_uid}
        try:
            _, result = request('POST', FOLDER_API, payload)
            uid = result['metadata']['name']
        except HTTPError as error:
            if error.code != 409:
                raise
            # A second cluster-local syncer may have won the create race.
            _, result = request('GET', f'{FOLDER_API}/{quote(uid, safe="")}')
            uid = result['metadata']['name']
        folders_by_key[key] = uid
        folders.append({'metadata': {'name': uid, 'annotations': payload['metadata'].get('annotations', {})}, 'spec': {'title': title}})
        return uid

    imported = 0
    skipped = 0

    for dashboard_path, dashboard in dashboards:
        relative_path = str(dashboard_path.relative_to(ROOT))
        digest = source_digests[relative_path]
        previous = state.get(relative_path, {})
        if (
            previous.get('sourceDigest') == digest
            and now - previous.get('verifiedAt', 0) < VERIFICATION_INTERVAL
        ):
            skipped += 1
            continue
        original_uid = dashboard.get('uid')
        if original_uid:
            dashboard['uid'] = uid_map[original_uid]
        else:
            generated_uid = hashlib.sha256(str(dashboard_path).encode()).hexdigest()[:12]
            dashboard['uid'] = local_dashboard_uid(generated_uid, global_dashboard)
        dashboard = normalize_prometheus_datasource(dashboard)
        dashboard.pop('__inputs', None)
        if contains_prometheus_datasource(dashboard):
            if not global_dashboard:
                ensure_source_scope_variables(dashboard)
                dashboard = scope_prometheus_queries(dashboard)
        if original_uid == 'rYdddlPWk':
            dashboard.setdefault('timepicker', {})['refresh_intervals'] = [
                '15s',
                '30s',
                '1m',
                '5m',
                '15m',
                '30m',
                '1h',
            ]
            for panel in dashboard.get('panels', []):
                if panel.get('targets'):
                    panel['interval'] = '15s'
                    panel['intervalFactor'] = 1
        if original_uid in {
            'ffcd83628d7d4b5a03d1cafd159e6c9c',
            '8280707b8f16e7b87b840fc1cc92d4c5',
        }:
            # The upstream Mimir dashboards use $__all as the default
            # namespace value while leaving includeAll disabled. Grafana
            # then expands an unselected namespace into an empty-compatible
            # matcher, which newer Mimir rejects. Keep the upstream dashboard
            # structure but make the All selection explicit and non-empty.
            for variable in dashboard.get('templating', {}).get('list', []):
                if variable.get('name') in {'cluster', 'namespace'}:
                    variable['includeAll'] = True
                    variable['allValue'] = '.+'
                    variable['current'] = {
                        'text': 'All',
                        'value': ['$__all'],
                    }
        dashboard.pop('id', None)
        relative_parent = dashboard_path.parent.relative_to(ROOT)
        folder = '' if str(relative_parent) == '.' else str(relative_parent)
        folder_parts = relative_parent.parts
        global_folder = global_dashboard and folder_parts[0] == 'Global'
        if global_dashboard:
            root_folder_uid = ensure_indexed_folder('Global', None)
        else:
            if cluster_folder is None:
                cluster_folder = ensure_indexed_folder(cluster_name, None)
            root_folder_uid = cluster_folder
        managed_folder_titles.add('Global' if global_dashboard else folder or cluster_name)
        folder_uid_value = root_folder_uid
        if folder:
            nested_folder = '/'.join(folder_parts[1:]) if global_folder else folder
            if nested_folder:
                folder_uid_value = ensure_indexed_folder(nested_folder, root_folder_uid)
        scope_tag = 'sync-scope-' + hashlib.sha256(
            f'{root_folder_uid}:{folder_uid_value}'.encode()
        ).hexdigest()[:12]
        dashboard_tags = dashboard.get('tags')
        if not isinstance(dashboard_tags, list):
            dashboard_tags = []
        if scope_tag not in dashboard_tags:
            dashboard_tags.append(scope_tag)
        dashboard['tags'] = dashboard_tags
        dashboard = replace_dashboard_links(
            dashboard, uid_map, folder_uid_value, scope_tag
        )
        payload = {
            'dashboard': dashboard,
            'folderId': 0,
            'overwrite': True,
        }
        payload['folderUid'] = folder_uid_value
        if not dashboard_is_unchanged(dashboard['uid'], dashboard):
            request('POST', '/api/dashboards/db', payload)
            imported += 1
        state[relative_path] = {
            'sourceDigest': digest,
            'verifiedAt': now,
            'uid': dashboard['uid'],
            'folderUid': folder_uid_value,
        }

    for relative_path in stale_paths:
        del state[relative_path]
    save_state(state)
    if imported or stale_paths:
        cleanup_empty_legacy_folders(folders, managed_folder_titles, cluster_folder)
    print(f'dashboard sync complete: imported={imported} skipped={skipped} active={len(active_paths)}')
    lock.close()
{{- end }}
