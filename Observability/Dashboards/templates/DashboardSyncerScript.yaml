{{- if .Values.dashboardSync.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sync-script
data:
  import.py: |-
    #!/usr/bin/env python3
    import json
    import hashlib
    import os
    import re
    from pathlib import Path
    from urllib.error import HTTPError
    from urllib.parse import quote, urlencode
    from urllib.request import Request, urlopen

    ROOT = Path(os.environ['FOLDER'])
    GRAFANA_URL = os.environ['GRAFANA_URL'].rstrip('/')
    token = os.environ['GRAFANA_TOKEN']
    cluster_name = os.environ['CLUSTER_NAME']
    datacenter = os.environ['DC']
    region = os.environ['REGION']
    central_cluster_name = os.environ['CENTRAL_CLUSTER_NAME']
    FOLDER_API = '/apis/folder.grafana.app/v1/namespaces/default/folders'
    DASHBOARD_API = '/apis/dashboard.grafana.app/v1/namespaces/default/dashboards'

    def request(method, path, payload=None):
        body = None
        headers = {
            'Authorization': f'Bearer {token}',
            'Accept': 'application/json',
        }
        if payload is not None:
            body = json.dumps(payload).encode()
            headers['Content-Type'] = 'application/json'
        req = Request(f'{GRAFANA_URL}{path}', data=body, headers=headers, method=method)
        with urlopen(req, timeout=30) as response:
            return response.status, json.loads(response.read() or b'{}')

    def normalized_dashboard(value):
        dashboard = json.loads(json.dumps(value))
        for key in ('id', 'version', 'iteration'):
            dashboard.pop(key, None)
        return dashboard

    def dashboard_is_unchanged(uid, desired):
        try:
            _, result = request('GET', f'/api/dashboards/uid/{quote(uid, safe="")}')
        except HTTPError as error:
            if error.code == 404:
                return False
            raise
        current = result.get('dashboard', result)
        return normalized_dashboard(current) == normalized_dashboard(desired)

    def list_resources(path):
        resources = []
        continuation = None
        while True:
            query = {'limit': '1000'}
            if continuation:
                query['continue'] = continuation
            separator = '&' if '?' in path else '?'
            _, result = request('GET', f'{path}{separator}{urlencode(query)}')
            resources.extend(result.get('items', []))
            continuation = result.get('metadata', {}).get('continue')
            if not continuation:
                return resources

    def ensure_folder(title, parent_uid, folders):
        parent_annotation = parent_uid or None
        matches = [
            item for item in folders
            if item.get('spec', {}).get('title') == title
            and item.get('metadata', {}).get('annotations', {}).get(
                'grafana.app/folder'
            ) == parent_annotation
        ]
        if matches:
            # Prefer the deterministic UID. This makes concurrent syncers
            # converge without creating a new folder for each event.
            stable_uid = folder_uid(title, parent_uid)
            for match in matches:
                if match.get('metadata', {}).get('name') == stable_uid:
                    return stable_uid
            return min(
                matches,
                key=lambda item: item.get('metadata', {}).get(
                    'creationTimestamp', ''
                ),
            )['metadata']['name']

        stable_uid = folder_uid(title, parent_uid)
        metadata = {'name': stable_uid}
        if parent_uid:
            metadata['annotations'] = {'grafana.app/folder': parent_uid}
        payload = {
            'metadata': metadata,
            'spec': {'title': title},
        }
        try:
            _, result = request('POST', FOLDER_API, payload)
            return result['metadata']['name']
        except HTTPError as error:
            if error.code != 409:
                raise
            # Another cluster-local syncer may have created the same folder.
            _, result = request('GET', f'{FOLDER_API}/{quote(stable_uid, safe="")}')
            return result['metadata']['name']

    def folder_uid(title, parent_uid=None):
        parent = parent_uid or 'root'
        return f'sync-{hashlib.sha256(f"{parent}:{title}".encode()).hexdigest()[:16]}'

    def local_dashboard_uid(original_uid):
        if cluster_name == central_cluster_name:
            return original_uid
        cluster_slug = re.sub(r'[^a-z0-9-]+', '-', cluster_name.lower()).strip('-')[:22]
        return f'{cluster_slug}-{hashlib.sha256(original_uid.encode()).hexdigest()[:12]}'

    def replace_dashboard_links(value, uid_map):
        if isinstance(value, dict):
            return {key: replace_dashboard_links(item, uid_map) for key, item in value.items()}
        if isinstance(value, list):
            return [replace_dashboard_links(item, uid_map) for item in value]
        if isinstance(value, str):
            return re.sub(
                r'(\./d/)([^/?#]+)(/)',
                lambda match: f'{match.group(1)}{uid_map.get(match.group(2), match.group(2))}{match.group(3)}',
                value,
            )
        return value

    def normalize_prometheus_datasource(value):
        if isinstance(value, dict):
            normalized = {
                key: normalize_prometheus_datasource(item)
                for key, item in value.items()
            }
            if normalized.get('name') == 'DS_PROMETHEUS':
                normalized['name'] = 'datasource'
            return normalized
        if isinstance(value, list):
            return [normalize_prometheus_datasource(item) for item in value]
        if isinstance(value, str):
            return value.replace('${DS_PROMETHEUS}', '${datasource}')
        return value

    def scope_prometheus_query(query):
        scoped = {'cluster': '$cluster', 'dc': '$dc', 'region': '$region'}
        selector_open = chr(123)
        selector_close = chr(125)
        matchers = ','.join(
            f'{label}="{value}"' for label, value in scoped.items()
        )

        def scope_selector(match):
            metric = match.group('metric') or ''
            body = match.group('body')
            body = re.sub(
                r'(?:^|,)\s*(?:cluster|dc|region)\s*(?:=~|=|!~|!=)\s*"(?:\\.|[^"])*"\s*(?=,|$)',
                '',
                body,
            ).strip(', ')
            return f'{metric}{selector_open}{matchers}{"," if body else ""}{body}{selector_close}'

        query = re.sub(
            r'(?P<metric>[a-zA-Z_:][a-zA-Z0-9_:]*)?\x7b(?P<body>[^\x7b\x7d]*)\x7d',
            scope_selector,
            query,
        )
        for metric in ('kubelet_volume_stats_', 'longhorn_'):
            query = re.sub(
                rf'(?<![a-zA-Z0-9_:])({metric}[a-zA-Z0-9_:]*)(?![a-zA-Z0-9_:]|\s*\x7b)',
                rf'\1{selector_open}{matchers}{selector_close}',
                query,
            )
        return query

    def is_prometheus_datasource(value):
        return isinstance(value, dict) and value.get('type') == 'prometheus'

    def scope_prometheus_queries(value, inherited=False):
        if isinstance(value, dict):
            local = inherited or is_prometheus_datasource(value.get('datasource'))
            return {
                key: (
                    scope_prometheus_query(item)
                    if local and key in {'expr', 'query'} and isinstance(item, str)
                    else scope_prometheus_queries(item, local)
                )
                for key, item in value.items()
            }
        if isinstance(value, list):
            return [scope_prometheus_queries(item, inherited) for item in value]
        return value

    def contains_prometheus_datasource(value):
        if isinstance(value, dict):
            if is_prometheus_datasource(value.get('datasource')):
                return True
            return any(contains_prometheus_datasource(item) for item in value.values())
        if isinstance(value, list):
            return any(contains_prometheus_datasource(item) for item in value)
        return False

    def ensure_source_scope_variables(dashboard):
        values = {
            'cluster': cluster_name,
            'dc': datacenter,
            'region': region,
        }
        labels = {'cluster': 'Cluster', 'dc': 'Datacenter', 'region': 'Region'}
        variables = dashboard.setdefault('templating', {}).setdefault('list', [])
        by_name = {
            variable.get('name'): variable
            for variable in variables
            if isinstance(variable, dict) and variable.get('name')
        }
        for name, value in values.items():
            variable = by_name.get(name)
            if variable is None:
                variable = {'name': name}
                variables.append(variable)
            variable.update({
                'current': {'selected': True, 'text': value, 'value': value},
                'hide': 0,
                'includeAll': False,
                'label': labels[name],
                'multi': False,
                'options': [{'selected': True, 'text': value, 'value': value}],
                'query': value,
                'type': 'custom',
            })
            for key in ('allValue', 'datasource', 'refresh'):
                variable.pop(key, None)

    def cleanup_empty_legacy_folders(folders, managed_titles, active_root_uid):
        try:
            dashboards = list_resources(DASHBOARD_API)
            dashboard_folders = {
                item.get('metadata', {}).get('annotations', {}).get(
                    'grafana.app/folder'
                )
                for item in dashboards
            }
            child_folders = {
                item.get('metadata', {}).get('annotations', {}).get(
                    'grafana.app/folder'
                )
                for item in folders
                if item.get('metadata', {}).get('annotations', {}).get(
                    'grafana.app/folder'
                )
            }
            for folder in folders:
                metadata = folder.get('metadata', {})
                annotations = metadata.get('annotations', {})
                uid = metadata.get('name')
                if (
                    folder.get('spec', {}).get('title') in managed_titles
                    and not annotations.get('grafana.app/folder')
                    and uid.startswith('sync-')
                    and uid != active_root_uid
                    and uid not in dashboard_folders
                    and uid not in child_folders
                ):
                    request('DELETE', f'{FOLDER_API}/{quote(uid, safe="")}')
        except Exception as error:
            # Cleanup is best effort; dashboard imports must continue if an
            # older Grafana API does not expose the dashboard list endpoint.
            print(f'Unable to clean up empty legacy folders: {error}')

    dashboard_paths = sorted(path for path in ROOT.rglob('*') if path.is_file())
    dashboards = []
    for dashboard_path in dashboard_paths:
        if dashboard_path.suffix == '.url':
            with dashboard_path.open(encoding='utf-8') as stream:
                dashboard_url = stream.read().strip()
            request_object = Request(
                dashboard_url,
                headers={'Accept': 'application/json'},
                method='GET',
            )
            with urlopen(request_object, timeout=30) as response:
                dashboard = json.loads(response.read())
        else:
            with dashboard_path.open(encoding='utf-8') as stream:
                dashboard = json.load(stream)
        dashboards.append((dashboard_path, dashboard))

    uid_map = {}
    for _, dashboard in dashboards:
        original_uid = dashboard.get('uid')
        if original_uid:
            uid_map[original_uid] = local_dashboard_uid(original_uid)

    folders = list_resources(FOLDER_API)
    cluster_folder = ensure_folder(cluster_name, None, folders)
    folders = list_resources(FOLDER_API)
    managed_folder_titles = set()

    for dashboard_path, dashboard in dashboards:
        original_uid = dashboard.get('uid')
        if original_uid:
            dashboard['uid'] = uid_map[original_uid]
        else:
            generated_uid = hashlib.sha256(str(dashboard_path).encode()).hexdigest()[:12]
            dashboard['uid'] = local_dashboard_uid(generated_uid)
        dashboard = replace_dashboard_links(dashboard, uid_map)
        dashboard = normalize_prometheus_datasource(dashboard)
        dashboard.pop('__inputs', None)
        if contains_prometheus_datasource(dashboard):
            ensure_source_scope_variables(dashboard)
            dashboard = scope_prometheus_queries(dashboard)
        if original_uid == 'rYdddlPWk':
            dashboard.setdefault('timepicker', {})['refresh_intervals'] = [
                '15s',
                '30s',
                '1m',
                '5m',
                '15m',
                '30m',
                '1h',
            ]
            for panel in dashboard.get('panels', []):
                if panel.get('targets'):
                    panel['interval'] = '15s'
                    panel['intervalFactor'] = 1
        if original_uid in {
            'ffcd83628d7d4b5a03d1cafd159e6c9c',
            '8280707b8f16e7b87b840fc1cc92d4c5',
        }:
            # The upstream Mimir dashboards use $__all as the default
            # namespace value while leaving includeAll disabled. Grafana
            # then expands an unselected namespace into an empty-compatible
            # matcher, which newer Mimir rejects. Keep the upstream dashboard
            # structure but make the All selection explicit and non-empty.
            for variable in dashboard.get('templating', {}).get('list', []):
                if variable.get('name') in {'cluster', 'namespace'}:
                    variable['includeAll'] = True
                    variable['allValue'] = '.+'
                    variable['current'] = {
                        'text': 'All',
                        'value': ['$__all'],
                    }
        dashboard.pop('id', None)
        relative_parent = dashboard_path.parent.relative_to(ROOT)
        folder = '' if str(relative_parent) == '.' else str(relative_parent)
        managed_folder_titles.add(folder or cluster_name)
        folder_uid_value = cluster_folder
        if folder:
            folder_uid_value = ensure_folder(folder, cluster_folder, folders)
            folders = list_resources(FOLDER_API)
        payload = {
            'dashboard': dashboard,
            'folderId': 0,
            'overwrite': True,
        }
        payload['folderUid'] = folder_uid_value
        if not dashboard_is_unchanged(dashboard['uid'], dashboard):
            request('POST', '/api/dashboards/db', payload)

    cleanup_empty_legacy_folders(folders, managed_folder_titles, cluster_folder)
{{- end }}
