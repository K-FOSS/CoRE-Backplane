{{- if .Values.dashboardSync.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-sync-script
data:
  import.py: |-
    #!/usr/bin/env python3
    import json
    import hashlib
    import os
    from pathlib import Path
    from urllib.error import HTTPError
    from urllib.parse import quote, urlencode
    from urllib.request import Request, urlopen

    ROOT = Path(os.environ['FOLDER'])
    GRAFANA_URL = os.environ['GRAFANA_URL'].rstrip('/')
    token = os.environ['GRAFANA_TOKEN']
    FOLDER_API = '/apis/folder.grafana.app/v1/namespaces/default/folders'

    def request(method, path, payload=None):
        body = None
        headers = {
            'Authorization': f'Bearer {token}',
            'Accept': 'application/json',
        }
        if payload is not None:
            body = json.dumps(payload).encode()
            headers['Content-Type'] = 'application/json'
        req = Request(f'{GRAFANA_URL}{path}', data=body, headers=headers, method=method)
        with urlopen(req, timeout=30) as response:
            return response.status, json.loads(response.read() or b'{}')

    def folder_uid(folder):
        if not folder:
            return None
        folders = []
        continuation = None
        while True:
            query = {'limit': '1000'}
            if continuation:
                query['continue'] = continuation
            path = f'{FOLDER_API}?{urlencode(query)}'
            _, result = request('GET', path)
            folders.extend(result.get('items', []))
            continuation = result.get('metadata', {}).get('continue')
            if not continuation:
                break

        matches = [
            item for item in folders
            if item.get('spec', {}).get('title') == folder
        ]
        if matches:
            # Prefer the newest existing folder while duplicate folders are
            # being consolidated manually. This avoids moving dashboards on
            # every sync while preserving the current active folder.
            match = max(
                matches,
                key=lambda item: item.get('metadata', {}).get(
                    'creationTimestamp', ''
                ),
            )
            return match['metadata']['name']

        stable_uid = f'sync-{hashlib.sha256(folder.encode()).hexdigest()[:12]}'
        payload = {
            'metadata': {'name': stable_uid},
            'spec': {'title': folder},
        }
        try:
            _, result = request('POST', FOLDER_API, payload)
            return result['metadata']['name']
        except HTTPError as error:
            if error.code != 409:
                raise
            # Another cluster-local syncer may have created the same folder.
            _, result = request('GET', f'{FOLDER_API}/{quote(stable_uid, safe="")}')
            return result['metadata']['name']

    dashboard_paths = sorted(path for path in ROOT.rglob('*') if path.is_file())
    for dashboard_path in dashboard_paths:
        if dashboard_path.suffix == '.url':
            with dashboard_path.open(encoding='utf-8') as stream:
                dashboard_url = stream.read().strip()
            request_object = Request(
                dashboard_url,
                headers={'Accept': 'application/json'},
                method='GET',
            )
            with urlopen(request_object, timeout=30) as response:
                dashboard = json.loads(response.read())
        else:
            with dashboard_path.open(encoding='utf-8') as stream:
                dashboard = json.load(stream)
        if dashboard.get('uid') == 'rYdddlPWk':
            dashboard.setdefault('timepicker', {})['refresh_intervals'] = [
                '15s',
                '30s',
                '1m',
                '5m',
                '15m',
                '30m',
                '1h',
            ]
            for panel in dashboard.get('panels', []):
                if panel.get('targets'):
                    panel['interval'] = '15s'
                    panel['intervalFactor'] = 1
        dashboard.pop('id', None)
        relative_parent = dashboard_path.parent.relative_to(ROOT)
        folder = '' if str(relative_parent) == '.' else str(relative_parent)
        payload = {
            'dashboard': dashboard,
            'folderId': 0,
            'overwrite': True,
        }
        uid = folder_uid(folder)
        if uid:
            payload['folderUid'] = uid
        request('POST', '/api/dashboards/db', payload)
{{- end }}
