apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-loki-logging
  labels:
    grafana_dashboard: 'true'
  annotations:
    grafana_folder: 'Observability'
data:
  loki-logging.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "loki",
            "uid": "${loki}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "unit": "decbytes"
            },
            "overrides": []
          },
          "gridPos": {"h": 5, "w": 8, "x": 0, "y": 0},
          "id": 1,
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false},
            "textMode": "auto"
          },
          "targets": [
            {
              "expr": "sum(bytes_over_time({cluster=~\"$cluster\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}[$__range]))",
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Log volume in selected range",
          "type": "stat"
        },
        {
          "datasource": {"type": "loki", "uid": "${loki}"},
          "fieldConfig": {"defaults": {"decimals": 1, "unit": "Bps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 16, "x": 8, "y": 0},
          "id": 2,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "sum by (cluster, dc) (bytes_over_time({cluster=~\"$cluster\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}[$__interval])) / $__interval_ms * 1000",
              "legendFormat": "{{ "{{cluster}}" }}/{{ "{{dc}}" }}",
              "refId": "A"
            }
          ],
          "title": "Log bytes per second",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "loki", "uid": "${loki}"},
          "fieldConfig": {"defaults": {"decimals": 1, "unit": "decbytes"}, "overrides": []},
          "gridPos": {"h": 10, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "options": {
            "cellHeight": "sm",
            "footer": {"countRows": false, "fields": "", "reducer": ["sum"], "show": false},
            "showHeader": true,
            "sortBy": [{"desc": true, "displayName": "Value"}]
          },
          "targets": [
            {
              "expr": "topk(25, sum by (cluster, dc, namespace, pod, container) (bytes_over_time({cluster=~\"$cluster\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}[$__range])))",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ "{{cluster}}" }}/{{ "{{dc}}" }}/{{ "{{namespace}}" }}/{{ "{{pod}}" }}/{{ "{{container}}" }}",
              "refId": "A"
            }
          ],
          "title": "Top containers by log bytes",
          "type": "table"
        },
        {
          "datasource": {"type": "loki", "uid": "${loki}"},
          "fieldConfig": {"defaults": {"decimals": 0, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 10, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "options": {
            "cellHeight": "sm",
            "footer": {"countRows": false, "fields": "", "reducer": ["sum"], "show": false},
            "showHeader": true,
            "sortBy": [{"desc": true, "displayName": "Value"}]
          },
          "targets": [
            {
              "expr": "topk(25, sum by (cluster, dc, namespace, pod, container) (count_over_time({cluster=~\"$cluster\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}[$__range])))",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ "{{cluster}}" }}/{{ "{{dc}}" }}/{{ "{{namespace}}" }}/{{ "{{pod}}" }}/{{ "{{container}}" }}",
              "refId": "A"
            }
          ],
          "title": "Top containers by log lines",
          "type": "table"
        },
        {
          "datasource": {"type": "loki", "uid": "${loki}"},
          "fieldConfig": {"defaults": {"decimals": 1, "unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 18},
          "id": 5,
          "options": {
            "legend": {"calcs": ["lastNotNull", "max"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi", "sort": "desc"}
          },
          "targets": [
            {
              "expr": "sum by (cluster, dc) (count_over_time({cluster=~\"$cluster\", namespace=~\"$namespace\", pod=~\"$pod\", container=~\"$container\"}[$__interval])) / $__interval_ms * 1000",
              "legendFormat": "{{ "{{cluster}}" }}/{{ "{{dc}}" }}",
              "refId": "A"
            }
          ],
          "title": "Log lines per second",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["loki", "logging", "capacity"],
      "templating": {
        "list": [
          {
            "allValue": ".+",
            "current": {"text": "All", "value": ["$__all"]},
            "datasource": {"type": "loki", "uid": "${loki}"},
            "includeAll": true,
            "label": "Cluster",
            "multi": true,
            "name": "cluster",
            "query": "label_values({cluster=~\".+\"}, cluster)",
            "refresh": 2,
            "type": "query"
          },
          {
            "allValue": ".+",
            "current": {"text": "All", "value": ["$__all"]},
            "datasource": {"type": "loki", "uid": "${loki}"},
            "includeAll": true,
            "label": "Namespace",
            "multi": true,
            "name": "namespace",
            "query": "label_values({cluster=~\"$cluster\"}, namespace)",
            "refresh": 2,
            "type": "query"
          },
          {
            "allValue": ".+",
            "current": {"text": "All", "value": ["$__all"]},
            "datasource": {"type": "loki", "uid": "${loki}"},
            "includeAll": true,
            "label": "Pod",
            "multi": true,
            "name": "pod",
            "query": "label_values({cluster=~\"$cluster\", namespace=~\"$namespace\"}, pod)",
            "refresh": 2,
            "type": "query"
          },
          {
            "allValue": ".+",
            "current": {"text": "All", "value": ["$__all"]},
            "datasource": {"type": "loki", "uid": "${loki}"},
            "includeAll": true,
            "label": "Container",
            "multi": true,
            "name": "container",
            "query": "label_values({cluster=~\"$cluster\", namespace=~\"$namespace\", pod=~\"$pod\"}, container)",
            "refresh": 2,
            "type": "query"
          },
          {
            "current": {},
            "label": "Loki",
            "name": "loki",
            "query": "loki",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": {"from": "now-6h", "to": "now"},
      "timezone": "browser",
      "title": "Loki / Container Logging Volume",
      "uid": "core-loki-logging",
      "version": 1
    }
