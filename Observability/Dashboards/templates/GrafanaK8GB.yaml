{{- if .Values.k8gb.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: 'grafana-core-k8gb'

  labels:
    lan-mode: 'private'

  annotations:
    external-dns.kubernetes.io/hostname: 'grafana.{{ .Values.k8gb.domain }}'
    external-dns.alpha.kubernetes.io/hostname: 'grafana.{{ .Values.k8gb.domain }}'

spec:
  parentRefs:
    - group: 'gateway.networking.k8s.io'
      kind: Gateway
      namespace: 'core-prod'
      name: 'main-gw'

  hostnames:
    - 'grafana.{{ .Values.k8gb.domain }}'

  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: 'grafana-core'
          port: 80
          weight: 1

      matches:
        - path:
            type: 'PathPrefix'
            value: '/'
---
apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: 'grafana-core'

  annotations:
    k8gb.io/hostname: 'grafana.int.mylogin.space'

spec:
  resourceRef:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: 'grafana-core-k8gb'

  strategy:
    type: '{{ .Values.k8gb.strategy }}'
{{- if eq .Values.k8gb.strategy "failover" }}
    primaryGeoTag: '{{ .Values.k8gb.primaryGeoTag }}'
{{- end }}
    dnsTtlSeconds: {{ .Values.k8gb.dnsTtlSeconds }}
{{- end }}
