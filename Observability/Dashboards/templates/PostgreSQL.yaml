apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-postgresql
  labels:
    grafana_dashboard: '1'
  annotations:
    grafana_folder: 'PostgreSQL'
data:
  postgresql.json: |-
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Value"
              }
            ]
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "label_join(sum by (region, dc, pod, datname) (pg_database_size_bytes{job=\"postgres-exporter\", datname=~\"$database\"}), \"psql_instance\", \"-\", \"region\", \"dc\", \"pod\")",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ "{{region}}" }}-{{ "{{dc}}" }}-{{ "{{pod}}" }} / {{ "{{datname}}" }}",
              "refId": "A"
            }
          ],
          "title": "PostgreSQL database size",
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "id": 2,
          "options": {
            "cellHeight": "sm",
            "footer": {
              "countRows": false,
              "fields": "",
              "reducer": [
                "sum"
              ],
              "show": false
            },
            "showHeader": true,
            "sortBy": [
              {
                "desc": true,
                "displayName": "Value"
              }
            ]
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "label_join(sum by (region, dc, pod, datname) (pg_stat_database_numbackends{job=\"postgres-exporter\", datname=~\"$database\"}), \"psql_instance\", \"-\", \"region\", \"dc\", \"pod\")",
              "format": "table",
              "instant": true,
              "legendFormat": "{{ "{{region}}" }}-{{ "{{dc}}" }}-{{ "{{pod}}" }} / {{ "{{datname}}" }}",
              "refId": "A"
            }
          ],
          "title": "PostgreSQL connections by database",
          "type": "table"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 20
          },
          "id": 3,
          "options": {
            "legend": {
              "calcs": [
                "lastNotNull",
                "max"
              ],
              "displayMode": "table",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "pluginVersion": "13.1.3",
          "targets": [
            {
              "editorMode": "code",
              "expr": "label_join(sum by (region, dc, pod, datname) (pg_stat_database_numbackends{job=\"postgres-exporter\", datname=~\"$database\"}), \"psql_instance\", \"-\", \"region\", \"dc\", \"pod\")",
              "legendFormat": "{{ "{{psql_instance}}" }} / {{ "{{datname}}" }}",
              "refId": "A"
            }
          ],
          "title": "PostgreSQL connections over time",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": [
        "postgresql",
        "database"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "selected": true,
              "text": "All",
              "value": [
                "$__all"
              ]
            },
            "includeAll": true,
            "label": "Database",
            "multi": true,
            "name": "database",
            "options": [],
            "query": "label_values(pg_database_size_bytes, datname)",
            "refresh": 2,
            "type": "query"
          },
          {
            "current": {},
            "label": "Prometheus",
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "PostgreSQL / Database Capacity and Connections",
      "uid": "core-postgresql",
      "version": 1
    }
