apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: loki-s3
spec:
  name: {{ printf "Loki %s-%s-%s" .Values.region .Values.datacenter .Values.cluster.name | squote }}

  groups:
    - 'LDAPService'

  s3:
    enabled: true

    createBuckets: true

    crossplane:
      terraformProvider: s3-{{ .Values.region }}-{{ .Values.datacenter }}-core
      crossplaneProvider: s3-{{ .Values.region }}-{{ .Values.datacenter }}-core

    {{- if .Values.garage.enabled }}
    backend: 'garage'
    createUserBucket: false
    createServiceAccount: true
    garage:
      clusterName: {{ .Values.garage.clusterName | squote }}
      endpoint: {{ .Values.garage.endpoint | squote }}
    buckets:
      - {{ .Values.garage.buckets.chunks | squote }}
      - {{ .Values.garage.buckets.ruler | squote }}
      - {{ .Values.garage.buckets.admin | squote }}
    writeServiceAccountCredentialsSecretRef:
      name: {{ printf "%s-s3-creds" .Values.globalService.name | squote }}
      namespace: {{ .Release.Namespace | squote }}
    {{- else }}
    createCredentials: true
    buckets:
      - 'loki-rules-temp'
      - 'loki-admin'
    writeCredentialsSecretRef:
      name: {{ printf "%s-s3-creds" .Values.globalService.name | squote }}
      namespace: {{ .Release.Namespace | squote }}
    {{- end }}

  writeConnectionSecretToRef:
    name: {{ .Values.globalService.name | squote }}
