apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.globalService.name }}
  labels:
    lan-mode: 'private'

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.gateway.namespace }}
      name: {{ .Values.gateway.name }}
      sectionName: {{ .Values.gateway.sectionName }}

  hostnames:
    - logs.mylogin.space
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Values.globalService.name }}
          port: 3100
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /loki/api/v1/query
        - path:
            type: PathPrefix
            value: /loki/api/v1/query_range
        - path:
            type: PathPrefix
            value: /loki/api/v1/labels
        - path:
            type: PathPrefix
            value: /loki/api/v1/label
        - path:
            type: PathPrefix
            value: /loki/api/v1/series
        - path:
            type: PathPrefix
            value: /loki/api/v1/index
        - path:
            type: PathPrefix
            value: /loki/api/v1/rules
        - path:
            type: PathPrefix
            value: /loki/api/v1/detected_labels
        - path:
            type: PathPrefix
            value: /loki/api/v1/format_query
        - path:
            type: PathPrefix
            value: /loki/api/v1/detected_fields
        - path:
            type: PathPrefix
            value: /loki/api/v1/patterns
      timeouts:
        request: '330s'
        backendRequest: '300s'
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Values.globalService.name }}
          port: 3100
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /loki/api/v1/tail
      timeouts:
        request: '0s'
        backendRequest: '0s'
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Values.globalService.name }}
          port: 3100
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
{{ if .Values.k8gb.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.globalService.name }}-k8gb
  labels:
    lan-mode: 'private'
  annotations:
    external-dns.kubernetes.io/hostname: 'logs.{{ .Values.k8gb.domain }}'
    external-dns.alpha.kubernetes.io/hostname: 'logs.{{ .Values.k8gb.domain }}'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.gateway.namespace }}
      name: {{ .Values.gateway.name }}
      sectionName: {{ .Values.gateway.sectionName }}
  hostnames:
    - 'logs.{{ .Values.k8gb.domain }}'
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Values.globalService.name }}
          port: 3100
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /loki/api/v1/query
        - path:
            type: PathPrefix
            value: /loki/api/v1/query_range
        - path:
            type: PathPrefix
            value: /loki/api/v1/labels
        - path:
            type: PathPrefix
            value: /loki/api/v1/label
        - path:
            type: PathPrefix
            value: /loki/api/v1/series
        - path:
            type: PathPrefix
            value: /loki/api/v1/index
        - path:
            type: PathPrefix
            value: /loki/api/v1/rules
        - path:
            type: PathPrefix
            value: /loki/api/v1/detected_labels
        - path:
            type: PathPrefix
            value: /loki/api/v1/format_query
        - path:
            type: PathPrefix
            value: /loki/api/v1/detected_fields
        - path:
            type: PathPrefix
            value: /loki/api/v1/patterns
      timeouts:
        request: '330s'
        backendRequest: '300s'
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Values.globalService.name }}
          port: 3100
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /loki/api/v1/tail
      timeouts:
        request: '0s'
        backendRequest: '0s'
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Values.globalService.name }}
          port: 3100
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
---
apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: {{ .Values.globalService.name }}
  annotations:
    k8gb.io/hostname: 'logs.mylogin.space'
spec:
  resourceRef:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: {{ .Values.globalService.name }}-k8gb
  strategy:
    type: {{ .Values.k8gb.strategy }}
    dnsTtlSeconds: {{ .Values.k8gb.dnsTtlSeconds }}
{{- end }}
