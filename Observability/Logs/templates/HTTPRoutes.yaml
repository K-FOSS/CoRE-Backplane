apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: {{ .Values.globalService.name }}
  labels:
    wan-mode: 'public'
    lan-mode: 'private'

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.gateway.namespace }}
      name: {{ .Values.gateway.name }}
      sectionName: {{ .Values.gateway.sectionName }}

  hostnames:
    - logs.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.{{ .Values.externalDomain }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Values.globalService.name }}
          port: 3100
          weight: 1
      matches:
        - path:
            type: PathPrefix
            value: /
