{{- if or .Values.globalServiceOnly (eq .Values.loki.deploymentMode "Distributed") (eq .Values.loki.deploymentMode "SimpleScalable<->Distributed") }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.globalService.name }}
  labels:
    app.kubernetes.io/name: 'loki'
    app.kubernetes.io/component: 'gateway'
    prometheus.io/service-monitor: 'false'
  {{- with .Values.globalService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: 'ClusterIP'
  ports:
    - name: 'http-metrics'
      port: 3100
      protocol: 'TCP'
      targetPort: 'http-metrics'
  selector:
    {{- if .Values.globalServiceOnly }}
    service.mylogin.space/global-endpoint: 'loki-core'
    {{- else }}
    app.kubernetes.io/name: 'loki'
    app.kubernetes.io/instance: {{ $.Subcharts.loki.Release.Name | quote }}
    app.kubernetes.io/component: 'gateway'
    {{- end }}
{{- end }}
