cluster:
  name: k8s
  domain: cluster.local

gateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

datacenter: dc1
region: yxl
externalDomain: mylogin.space

oauth:
  indexKey: loki
  groups:
    - Server Admins
    - Logs
  allowedGroups:
    - Logs
  authentik:
    urlBase: https://idp.mylogin.space

loki:
  fullnameOverride: loki-core
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false

    commonConfig:
      replication_factor: 3

    podLabels:
      logs: loki-myloginspace

    server:
      http_server_read_timeout: 600s
      http_server_write_timeout: 600s
      grpc_server_max_recv_msg_size: 8388608
      grpc_server_max_send_msg_size: 8388608

    limits_config:
      reject_old_samples: false
      allow_structured_metadata: true
      retention_period: 744h
      retention_stream:
        - selector: '{env="testing"}'
          priority: 1
          period: 24h
      per_tenant_override_config: /etc/overrides.yaml

    storage:
      type: s3
      bucketNames:
        chunks: ${S3_BUCKET}
        ruler: loki-rules-temp
        admin: loki-admin
      s3:
        endpoint: ${S3_ENDPOINT}
        region: us-east-1
        accessKeyId: ${S3_ACCESS_KEY}
        secretAccessKey: ${S3_SECRET_ACCESS_KEY}
        session_token: ${S3_SESSION_TOKEN}
        s3ForcePathStyle: true
        insecure: false

    schemaConfig:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: s3
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    compactor:
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: s3

    pattern_ingester:
      enabled: true

    ingester:
      chunk_encoding: snappy

    querier:
      max_concurrent: 4

  singleBinary:
    replicas: 3
    terminationGracePeriodSeconds: 300
    annotations:
      reloader.stakater.com/auto: "true"
    extraArgs:
      - -config.expand-env=true
    extraEnv:
      - name: S3_ENDPOINT
        valueFrom:
          secretKeyRef:
            name: loki-core
            key: S3Hostname
      - name: S3_BUCKET
        valueFrom:
          secretKeyRef:
            name: loki-core
            key: username
      - name: S3_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-core-s3-creds
            key: AccessKey
      - name: S3_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: loki-core-s3-creds
            key: SecretAccessKey
      - name: S3_SESSION_TOKEN
        valueFrom:
          secretKeyRef:
            name: loki-core-s3-creds
            key: SessionToken

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  gateway:
    enabled: false

  ingress:
    enabled: false

  chunksCache:
    enabled: false

  resultsCache:
    enabled: false

  podDisruptionBudget:
    maxUnavailable: 1
