cluster:
  name: k8s
  domain: cluster.local

gateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

datacenter: dc1
region: yxl
externalDomain: mylogin.space

globalService:
  name: 'loki-core'
  annotations: {}

globalServiceOnly: false

oauth:
  indexKey: loki
  groups:
    - Server Admins
    - Logs
  allowedGroups:
    - Logs
  authentik:
    urlBase: https://idp.mylogin.space

loki:
  enabled: true
  fullnameOverride: loki-core
  deploymentMode: 'Distributed'

  global:
    extraArgs:
      - '-config.expand-env=true'
    extraEnv:
      - name: 'S3_ENDPOINT'
        valueFrom:
          secretKeyRef:
            name: 'loki-core'
            key: 'S3Hostname'
      - name: 'S3_BUCKET'
        valueFrom:
          secretKeyRef:
            name: 'loki-core'
            key: 'username'
      - name: 'S3_ACCESS_KEY'
        valueFrom:
          secretKeyRef:
            name: 'loki-core-s3-creds'
            key: 'AccessKey'
      - name: 'S3_SECRET_ACCESS_KEY'
        valueFrom:
          secretKeyRef:
            name: 'loki-core-s3-creds'
            key: 'SecretAccessKey'
      - name: 'S3_SESSION_TOKEN'
        valueFrom:
          secretKeyRef:
            name: 'loki-core-s3-creds'
            key: 'SessionToken'

  loki:
    auth_enabled: true

    commonConfig:
      replication_factor: 3

    podLabels:
      logs: loki-myloginspace

    server:
      http_server_read_timeout: 600s
      http_server_write_timeout: 600s
      grpc_server_max_recv_msg_size: 8388608
      grpc_server_max_send_msg_size: 8388608

    limits_config:
      reject_old_samples: false
      allow_structured_metadata: true
      retention_period: 744h
      retention_stream:
        - selector: '{env="testing"}'
          priority: 1
          period: 24h
      per_tenant_override_config: /etc/overrides.yaml

    storage:
      type: s3
      bucketNames:
        chunks: ${S3_BUCKET}
        ruler: loki-rules-temp
        admin: loki-admin
      s3:
        endpoint: ${S3_ENDPOINT}
        region: us-east-1
        accessKeyId: ${S3_ACCESS_KEY}
        secretAccessKey: ${S3_SECRET_ACCESS_KEY}
        session_token: ${S3_SESSION_TOKEN}
        s3ForcePathStyle: true
        insecure: false

    schemaConfig:
      configs:
        - from: '2024-04-01'
          store: 'tsdb'
          object_store: 's3'
          schema: 'v13'
          index:
            prefix: 'loki_index_'
            period: '24h'

    compactor:
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: s3

    pattern_ingester:
      enabled: true

    ingester:
      chunk_encoding: snappy
      wal:
        flush_on_shutdown: true

    querier:
      max_concurrent: 4

  singleBinary:
    replicas: 0
    # Preserve the former working-data PVCs for rollback and explicit cleanup.
    persistence:
      whenDeleted: 'Retain'
      whenScaled: 'Retain'
    extraArgs:
      - '-config.expand-env=true'
    extraEnv:
      - name: 'S3_ENDPOINT'
        valueFrom:
          secretKeyRef:
            name: 'loki-core'
            key: 'S3Hostname'
      - name: 'S3_BUCKET'
        valueFrom:
          secretKeyRef:
            name: 'loki-core'
            key: 'username'
      - name: 'S3_ACCESS_KEY'
        valueFrom:
          secretKeyRef:
            name: 'loki-core-s3-creds'
            key: 'AccessKey'
      - name: 'S3_SECRET_ACCESS_KEY'
        valueFrom:
          secretKeyRef:
            name: 'loki-core-s3-creds'
            key: 'SecretAccessKey'
      - name: 'S3_SESSION_TOKEN'
        valueFrom:
          secretKeyRef:
            name: 'loki-core-s3-creds'
            key: 'SessionToken'

  gateway:
    enabled: true
    replicas: 3

  distributor:
    replicas: 3
    maxUnavailable: 1

  ingester:
    replicas: 3
    zoneAwareReplication:
      enabled: false
    persistence:
      enabled: true
      size: '10Gi'
      enableStatefulSetAutoDeletePVC: false
      whenDeleted: 'Retain'
      whenScaled: 'Retain'

  querier:
    replicas: 3
    maxUnavailable: 1

  queryFrontend:
    replicas: 2
    maxUnavailable: 1

  queryScheduler:
    replicas: 2

  indexGateway:
    replicas: 2
    maxUnavailable: 1
    persistence:
      enabled: true
      size: '10Gi'
      enableStatefulSetAutoDeletePVC: false
      whenDeleted: 'Retain'
      whenScaled: 'Retain'

  compactor:
    replicas: 1
    persistence:
      enabled: true
      enableStatefulSetAutoDeletePVC: false
      whenDeleted: 'Retain'
      whenScaled: 'Retain'

  ruler:
    replicas: 1
    persistence:
      enabled: true
      size: '10Gi'

  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  ingress:
    enabled: false

  lokiCanary:
    podLabels:
      logs: loki-myloginspace

  chunksCache:
    enabled: false

  resultsCache:
    enabled: false

  podDisruptionBudget:
    maxUnavailable: 1
