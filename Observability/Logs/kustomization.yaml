apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Loki 6.46.0 copies singleBinary.service annotations to loki-headless.
# Keep the client Service and ring/memberlist Services independently
# selectable while the ApplicationSet keeps the memberlist Service local.
patches:
  - target:
      version: 'v1'
      kind: Service
      name: 'loki-headless'
    patch: |-
      - op: 'remove'
        path: '/metadata/annotations'
