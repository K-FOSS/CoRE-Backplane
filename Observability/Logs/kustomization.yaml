apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Loki 6.46.0 copies singleBinary.service annotations to loki-headless.
# Keep ring discovery local while exporting only the client Service.
patches:
  - target:
      version: 'v1'
      kind: Service
      name: 'loki-headless'
    patch: |-
      - op: 'remove'
        path: '/metadata/annotations'
