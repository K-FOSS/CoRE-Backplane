cluster:
  name: 'core-dc1-talos-prod'

region: 'yxl'

tenants:
  - name: 'core'
    primarySite: 'yxl'

garage:
  enabled: true
  name: 'observability-garage'
  zone: 'yxl'
  image: 'dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020'
  replicationFactor: 3
  storageReplicas: 3
  dataSize: '20Gi'
  metadataSize: '2Gi'
  dataStorageClass: 'garage-mimir-yxl-data'
  metadataStorageClass: 'garage-mimir-yxl-metadata'
  secretStoreRef:
    kind: 'ClusterSecretStore'
    name: 'mainvault-core'
  remoteKey: 'Garage/Mimir'
  adminTokenProperty: 'AdminToken'
  rpcSecretProperty: 'RPCSecret'
  bootstrap:
    generatedSecretName: 'observability-garage-bootstrap-generated'
  storage:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: 'kubernetes.io/hostname'
        whenUnsatisfiable: 'DoNotSchedule'
        labelSelector:
          matchLabels:
            garage.rajsingh.info/cluster: 'observability-garage'
            garage.rajsingh.info/tier: 'storage'
  tls:
    enabled: true
    serviceName: 'observability-garage-s3'
    gatewayName: 'main-gw'
    gatewayNamespace: 'core-prod'

  federation:
    enabled: true
    writerRegion: 'yxl'
    adminHostnameSuffix: 'mylogin.space'
    remoteStorageNodes:
      - name: 'observability-garage-yvr-storage-0'
        nodeId: '4f8cf6f31d74ee98445883d75033b3e8ffde72131a457c90a4625c773b58fbd2'
        address: '172.20.56.191'
      - name: 'observability-garage-yvr-storage-1'
        nodeId: '125cfa8e1c64fa812e8e0284696e51525fb910164f3fc4ad00e244201dbc9578'
        address: '172.20.57.51'
      - name: 'observability-garage-yvr-storage-2'
        nodeId: 'ebeb2ff54d5a3442b64527fa02a3f8169818876894426d7d1a5280fe6cfce4fa'
        address: '172.20.63.101'

garageUI:
  enabled: true
  hostname: 'garage-ui.mylogin.space'
  accessGroup: 'Server Admins'
  garage:
    serviceName: 'observability-garage'
    s3Port: 3900
    adminPort: 3903
garage-ui-web:
  nameOverride: 'garage-ui'
  fullnameOverride: 'garage-ui'
  replicaCount: 2
  image:
    repository: 'noooste/garage-ui'
    tag: 'v0.14.0@sha256:e4a33c448304a3f6e60f08d6aa71b2471fd79ac870a5c7e178ea247dea3238b3'
    pullPolicy: 'IfNotPresent'
  config:
    server:
      host: '::'
      port: 8080
      environment: 'production'
      domain: 'garage-ui.mylogin.space'
      protocol: 'https'
      root_url: 'https://garage-ui.mylogin.space'
    garage:
      endpoint: 'http://observability-garage:3900'
      region: 'garage'
      admin_endpoint: 'http://observability-garage:3903'
      admin_token: ''
      existingSecret:
        name: 'observability-garage-bootstrap'
        key: 'admin-token'
    auth:
      metrics_public: true
      admin:
        enabled: false
      oidc:
        enabled: false
  resources:
    requests:
      cpu: '50m'
      memory: '128Mi'
    limits:
      cpu: '500m'
      memory: '512Mi'
  serviceMonitor:
    enabled: true
    interval: '60s'

longhorn:
  provisioner: 'driver.longhorn.io'
