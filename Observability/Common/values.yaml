cluster:
  name: 'core-dc1-talos-prod'

region: 'yxl'

garage:
  enabled: true
  name: 'observability-garage'
  zone: 'yxl'
  image: 'dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020'
  replicationFactor: 3
  storageReplicas: 3
  dataSize: '20Gi'
  metadataSize: '2Gi'
  dataStorageClass: 'garage-mimir-yxl-data'
  metadataStorageClass: 'garage-mimir-yxl-metadata'
  secretStoreRef:
    kind: 'ClusterSecretStore'
    name: 'mainvault-core'
  remoteKey: 'Garage/Mimir'
  adminTokenProperty: 'AdminToken'
  rpcSecretProperty: 'RPCSecret'

longhorn:
  provisioner: 'driver.longhorn.io'
