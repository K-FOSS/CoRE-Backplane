{{- if .Values.garage.enabled }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ printf "%s-bootstrap" .Values.garage.name | squote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  refreshInterval: '1h'
  updatePolicy: 'IfNotExists'
  deletionPolicy: 'None'
  secretStoreRefs:
    - name: {{ .Values.garage.secretStoreRef.name | squote }}
      kind: {{ .Values.garage.secretStoreRef.kind | squote }}
  selector:
    secret:
      name: {{ .Values.garage.bootstrap.generatedSecretName | squote }}
  data:
    - match:
        secretKey: 'AdminToken'
        remoteRef:
          remoteKey: {{ .Values.garage.remoteKey | squote }}
          property: {{ .Values.garage.adminTokenProperty | squote }}
    - match:
        secretKey: 'RPCSecret'
        remoteRef:
          remoteKey: {{ .Values.garage.remoteKey | squote }}
          property: {{ .Values.garage.rpcSecretProperty | squote }}
{{- end }}
