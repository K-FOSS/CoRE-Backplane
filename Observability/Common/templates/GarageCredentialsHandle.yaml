{{- if and .Values.garage.enabled .Values.garage.federation.enabled (ne .Values.region .Values.garage.federation.writerRegion) }}
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: {{ printf "%s-yxl" .Values.garage.name | squote }}
  namespace: {{ .Release.Namespace | squote }}
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  connectTo:
    adminApiEndpoint: 'https://observability-garage-admin.dc1.yxl.mylogin.space'
    adminTokenSecretRef:
      name: {{ printf "%s-bootstrap" .Values.garage.name | squote }}
      key: 'admin-token'
    rpcSecretRef:
      name: {{ printf "%s-bootstrap" .Values.garage.name | squote }}
      key: 'rpc-secret'
{{- end }}
