{{- if .Values.garage.enabled }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.garage.dataStorageClass | squote }}
  annotations:
    argocd.argoproj.io/sync-wave: '0'
provisioner: {{ .Values.longhorn.provisioner | squote }}
reclaimPolicy: 'Retain'
allowVolumeExpansion: true
volumeBindingMode: 'Immediate'
parameters:
  numberOfReplicas: '1'
  staleReplicaTimeout: '2880'
  dataEngine: 'v1'
  fsType: 'xfs'
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: {{ .Values.garage.metadataStorageClass | squote }}
  annotations:
    argocd.argoproj.io/sync-wave: '0'
provisioner: {{ .Values.longhorn.provisioner | squote }}
reclaimPolicy: 'Retain'
allowVolumeExpansion: true
volumeBindingMode: 'Immediate'
parameters:
  numberOfReplicas: '2'
  staleReplicaTimeout: '2880'
  dataEngine: 'v1'
  fsType: 'xfs'
{{- end }}
