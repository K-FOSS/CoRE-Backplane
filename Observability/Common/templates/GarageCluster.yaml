{{- if .Values.garage.enabled }}
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: {{ .Values.garage.name | squote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  image: {{ .Values.garage.image | squote }}
  zone: {{ .Values.region | squote }}
  replication:
    factor: {{ int .Values.garage.replicationFactor }}
    consistencyMode: 'consistent'
    zoneRedundancyMode: 'AtLeast'
    zoneRedundancyMinZones: 2
  deletionPolicy: 'Drain'
  {{- if .Values.garage.federation.enabled }}
  layoutManagement:
    siteRole: {{ if eq .Values.region .Values.garage.federation.writerRegion }}'Writer'{{ else }}'Follower'{{ end }}
  publicEndpoint:
    type: {{ .Values.garage.federation.rpc.type | squote }}
    nodePort:
      basePort: {{ int .Values.garage.federation.rpc.basePort }}
      externalAddresses:
        {{- if eq .Values.region "yxl" }}
        {{- toYaml .Values.garage.federation.rpc.yxlExternalAddresses | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.garage.federation.rpc.yvrExternalAddresses | nindent 8 }}
        {{- end }}
  remoteClusters:
    - name: {{ if eq .Values.region "yxl" }}'observability-garage-yvr'{{ else }}'observability-garage-yxl'{{ end }}
      zone: {{ if eq .Values.region "yxl" }}'yvr'{{ else }}'yxl'{{ end }}
      connection:
        adminApiEndpoint: {{ if eq .Values.region "yxl" }}'https://observability-garage-admin.home1.yvr.mylogin.space'{{ else }}'https://observability-garage-admin.dc1.yxl.mylogin.space'{{ end }}
        adminTokenSecretRef:
          name: {{ printf "%s-bootstrap" .Values.garage.name | squote }}
          key: 'admin-token'
  {{- end }}
  network:
    rpcSecretRef:
      name: {{ printf "%s-bootstrap" .Values.garage.name | squote }}
      key: 'rpc-secret'
  admin:
    adminTokenSecretRef:
      name: {{ printf "%s-bootstrap" .Values.garage.name | squote }}
      key: 'admin-token'
  monitoring:
    enabled: true
    interval: '60s'
    metricRelabelings:
      # Per-peer, per-endpoint histogram buckets are the dominant Garage
      # series source. Keep counts and sums for traffic/error dashboards.
      - sourceLabels: ['__name__']
        regex: 'rpc_duration_bucket'
        action: 'drop'
  storage:
    replicas: {{ int .Values.garage.storageReplicas }}
    metadata:
      size: {{ .Values.garage.metadataSize | quote }}
      storageClassName: {{ if eq .Values.region "yxl" }}{{ .Values.garage.metadataStorageClass | squote }}{{ else }}'garage-mimir-yvr-metadata'{{ end }}
    data:
      size: {{ .Values.garage.dataSize | quote }}
      storageClassName: {{ if eq .Values.region "yxl" }}{{ .Values.garage.dataStorageClass | squote }}{{ else }}'garage-mimir-yvr-data'{{ end }}
    pvcRetentionPolicy:
      whenDeleted: 'Retain'
      whenScaled: 'Retain'
    {{- with .Values.garage.storage.topologySpreadConstraints }}
    topologySpreadConstraints:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
