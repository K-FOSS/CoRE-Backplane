{{- if .Values.garage.enabled }}
apiVersion: garage.rajsingh.info/v1beta2
kind: GarageCluster
metadata:
  name: {{ .Values.garage.name | squote }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  image: {{ .Values.garage.image | squote }}
  zone: {{ .Values.garage.zone | squote }}
  replication:
    factor: {{ int .Values.garage.replicationFactor }}
    consistencyMode: 'consistent'
  network:
    rpcSecretRef:
      name: {{ printf "%s-bootstrap" .Values.garage.name | squote }}
      key: 'rpc-secret'
  admin:
    adminTokenSecretRef:
      name: {{ printf "%s-bootstrap" .Values.garage.name | squote }}
      key: 'admin-token'
  monitoring:
    enabled: true
    interval: '60s'
    metricRelabelings:
      # Per-peer, per-endpoint histogram buckets are the dominant Garage
      # series source. Keep counts and sums for traffic/error dashboards.
      - sourceLabels: ['__name__']
        regex: 'rpc_duration_bucket'
        action: 'drop'
  storage:
    replicas: {{ int .Values.garage.storageReplicas }}
    metadata:
      size: {{ .Values.garage.metadataSize | quote }}
      storageClassName: {{ .Values.garage.metadataStorageClass | squote }}
    data:
      size: {{ .Values.garage.dataSize | quote }}
      storageClassName: {{ .Values.garage.dataStorageClass | squote }}
    pvcRetentionPolicy:
      whenDeleted: 'Retain'
      whenScaled: 'Retain'
    {{- with .Values.garage.storage.topologySpreadConstraints }}
    topologySpreadConstraints:
      {{- toYaml . | nindent 6 }}
    {{- end }}
{{- end }}
