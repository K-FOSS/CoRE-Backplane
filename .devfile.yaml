schemaVersion: 2.2.0
metadata:
  name: core-backplane-prod

components:
  - name: devtools
    container:
      image: quay.io/devfile/universal-developer-image:ubi10-latest
      memoryLimit: 16G
      memoryRequest: 4G
      cpuLimit: '8'
      cpuRequest: '200m'
      env:
        - name: TZ
          value: 'America/Vancouver'

attributes:
  pod-overrides:
    metadata:
      labels:
        che-workspace: 'true'
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  che-workspace: 'true'
              topologyKey: kubernetes.io/hostname