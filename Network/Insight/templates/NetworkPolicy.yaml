{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ .Release.Name }}'
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: 'opennms'
      app.kubernetes.io/instance: '{{ .Release.Name }}'
  policyTypes:
    - 'Ingress'
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.gateway.namespace is required" .Values.networkPolicy.gateway.namespace | squote }}
          podSelector:
            matchLabels:
              {{- range $key, $value := .Values.networkPolicy.gateway.podLabels }}
              {{ $key }}: {{ $value | squote }}
              {{- end }}
      ports:
        - port: 'http'
          protocol: 'TCP'
{{- end }}
