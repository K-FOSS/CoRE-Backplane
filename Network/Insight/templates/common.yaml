---
{{- include "bjw-s.common.loader.init" . }}

{{- if and .Values.ldap.enabled (not .Values.authentik.accessGroups) }}
{{- fail "authentik.accessGroups must contain at least one group when LDAP authentication is enabled" }}
{{- end }}
{{- if and .Values.ldap.enabled (not .Values.authentik.proxyAuth.authorities) }}
{{- fail "authentik.proxyAuth.authorities must contain at least one role when LDAP authentication is enabled" }}
{{- end }}

{{- define "core-network-insight.networkPolicyRules" -}}
ingress:
  - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ required "networkPolicy.gateway.namespace is required" .Values.networkPolicy.gateway.namespace | squote }}
        podSelector:
          matchLabels:
            {{- range $key, $value := .Values.networkPolicy.gateway.podLabels }}
            {{ $key }}: {{ $value | squote }}
            {{- end }}
    ports:
      - port: 'http'
        protocol: 'TCP'
{{- end -}}

{{- define "core-network-insight.commonValues" -}}
global:
  nameOverride: '{{ .Release.Name }}'

controllers:
  main:
    forceRename: '{{ .Release.Name }}'
    type: 'statefulset'
    replicas: 1
    strategy: 'RollingUpdate'
    {{- if .Values.migration.replaceStatefulSet }}
    annotations:
      argocd.argoproj.io/sync-options: 'Replace=true'
    {{- end }}
    pod:
      annotations:
        secret.reloader.stakater.com/reload: '{{ .Values.postgresql.credentialsSecretName }},{{ .Values.postgresql.adminSecretName }}{{ if .Values.kafka.enabled }},{{ .Values.kafka.credentialsSecretName }}{{ end }}'
      automountServiceAccountToken: false
      nodeSelector:
        core.resolvemy.host/x86-64-v3: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: 'OnRootMismatch'
        seccompProfile:
          type: 'RuntimeDefault'
      terminationGracePeriodSeconds: 120
    statefulset:
      serviceName:
        identifier: 'main'
      volumeClaimTemplates:
        - name: 'config'
          accessMode: 'ReadWriteOnce'
          size: {{ .Values.storage.config.size | squote }}
          advancedMounts:
            prepare-configuration:
              - path: '/opennms-config'
            {{- if .Values.timeseries.enabled }}
            install-timeseries-plugin:
              - path: '/opennms-config'
            {{- end }}
            initialize:
              - path: '/opt/opennms/etc'
            opennms:
              - path: '/opt/opennms/etc'
              {{- if .Values.timeseries.enabled }}
              - path: '/opt/opennms/deploy/opennms-prometheus-remotewrite-plugin.kar'
                subPath: '.plugin-cache/opennms-prometheus-remotewrite-plugin.kar'
                readOnly: true
              {{- end }}
        - name: 'data'
          accessMode: 'ReadWriteOnce'
          size: {{ .Values.storage.data.size | squote }}
          advancedMounts:
            initialize:
              - path: '/opennms-data'
            opennms:
              - path: '/opennms-data'
    initContainers:
      prepare-configuration:
        image:
          repository: {{ .Values.image.repository | squote }}
          tag: {{ required "image.tag is required" .Values.image.tag | squote }}
          digest: {{ required "image.digest is required" .Values.image.digest | squote }}
          pullPolicy: {{ .Values.image.pullPolicy | squote }}
        command:
          - '/usr/bin/env'
          - 'bash'
          - '-c'
        args:
          - |
            set -Eeuo pipefail

            config_dir='/opennms-config'
            pristine_dir='/opt/opennms/share/etc-pristine'

            if [[ ! -f "${config_dir}/opennms.properties" ]]; then
              echo 'OpenNMS configuration is incomplete; seed missing files from etc-pristine.'
              rsync -r --ignore-existing --out-format='%n %C' "${pristine_dir}/" "${config_dir}/"
            fi

            install -d -m 0755 "${config_dir}/opennms.properties.d"
            {{- if .Values.timeseries.enabled }}
            install -d -m 0755 "${config_dir}/featuresBoot.d"
            {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
        resources: &containerResources
{{ toYaml .Values.resources | nindent 10 }}
      {{- if .Values.timeseries.enabled }}
      install-timeseries-plugin:
        dependsOn: 'prepare-configuration'
        image:
          repository: {{ .Values.image.repository | squote }}
          tag: {{ required "image.tag is required" .Values.image.tag | squote }}
          digest: {{ required "image.digest is required" .Values.image.digest | squote }}
          pullPolicy: {{ .Values.image.pullPolicy | squote }}
        command:
          - '/usr/bin/env'
          - 'bash'
          - '-c'
        args:
          - |
            set -Eeuo pipefail

            plugin_dir='/opennms-config/.plugin-cache'
            plugin_path="${plugin_dir}/opennms-prometheus-remotewrite-plugin.kar"
            download_path="${plugin_path}.download"
            plugin_url={{ required "timeseries.plugin.url is required when external time-series storage is enabled" .Values.timeseries.plugin.url | squote }}
            expected_sha256={{ required "timeseries.plugin.sha256 is required when external time-series storage is enabled" .Values.timeseries.plugin.sha256 | squote }}

            if [[ -f "${plugin_path}" ]] && \
              printf '%s  %s\n' "${expected_sha256}" "${plugin_path}" | sha256sum --check --status; then
              echo 'The cached Prometheus RemoteWrite plugin matches the pinned checksum.'
              exit 0
            fi

            install -d -m 0755 "${plugin_dir}"
            curl --fail --location --silent --show-error \
              --output "${download_path}" "${plugin_url}"
            printf '%s  %s\n' "${expected_sha256}" "${download_path}" | sha256sum --check
            mv -f "${download_path}" "${plugin_path}"
            chmod 0444 "${plugin_path}"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
        resources:
{{ toYaml .Values.timeseries.plugin.resources | nindent 10 }}
      {{- end }}
      initialize:
        {{- if .Values.timeseries.enabled }}
        dependsOn: 'install-timeseries-plugin'
        {{- else }}
        dependsOn: 'prepare-configuration'
        {{- end }}
        image:
          repository: {{ .Values.image.repository | squote }}
          tag: {{ .Values.image.tag | squote }}
          digest: {{ .Values.image.digest | squote }}
          pullPolicy: {{ .Values.image.pullPolicy | squote }}
        {{- if or .Values.authentik.proxyAuth.enabled .Values.ldap.enabled }}
        command:
          - '/opt/opennms-auth/start.sh'
        {{- end }}
        args:
          - '-i'
        env: &databaseEnvironment
          - name: 'TZ'
            value: {{ .Values.global.timezone | squote }}
          - name: 'POSTGRES_HOST'
            value: {{ required "postgresql.host is required" .Values.postgresql.host | squote }}
          - name: 'POSTGRES_PORT'
            value: {{ .Values.postgresql.port | quote }}
          - name: 'POSTGRES_USER'
            valueFrom:
              secretKeyRef:
                name: {{ required "postgresql.adminSecretName is required" .Values.postgresql.adminSecretName | squote }}
                key: 'username'
          - name: 'POSTGRES_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.adminSecretName | squote }}
                key: 'password'
          - name: 'OPENNMS_DBNAME'
            value: {{ required "postgresql.database is required" .Values.postgresql.database | squote }}
          - name: 'OPENNMS_DBUSER'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.credentialsSecretName | squote }}
                key: 'username'
          - name: 'OPENNMS_DBPASS'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.credentialsSecretName | squote }}
                key: 'password'
          {{- if .Values.ldap.enabled }}
          - name: 'OPENNMS_LDAP_URI'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.credentialsSecretName | squote }}
                key: 'ldapsURI'
          - name: 'OPENNMS_LDAP_BIND_DN'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.credentialsSecretName | squote }}
                key: 'ldapsBIND'
          - name: 'OPENNMS_LDAP_BIND_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.credentialsSecretName | squote }}
                key: 'password'
          {{- end }}
        # The pinned OpenNMS image assigns cap_net_raw to the Java executable
        # for its native ICMP pollers. NET_RAW must remain in the container's
        # capability bounding set or Linux refuses to execute Java with EPERM.
        securityContext: &javaContainerSecurityContext
          capabilities:
            add:
              - 'NET_RAW'
        resources: *containerResources
    containers:
      opennms:
        image:
          repository: {{ .Values.image.repository | squote }}
          tag: {{ .Values.image.tag | squote }}
          digest: {{ .Values.image.digest | squote }}
          pullPolicy: {{ .Values.image.pullPolicy | squote }}
        {{- if or .Values.authentik.proxyAuth.enabled .Values.ldap.enabled }}
        command:
          - '/opt/opennms-auth/start.sh'
        {{- end }}
        args:
          - '-s'
        env: *databaseEnvironment
        ports:
          - name: 'http'
            containerPort: 8980
            protocol: 'TCP'
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/opennms/login.jsp'
            port: 'http'
            spec:
              initialDelaySeconds: 30
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 12
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/opennms/login.jsp'
            port: 'http'
            spec:
              initialDelaySeconds: 120
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          startup:
            enabled: true
            type: 'HTTP'
            path: '/opennms/login.jsp'
            port: 'http'
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 90
        securityContext: *javaContainerSecurityContext
        resources: *containerResources

service:
  main:
    forceRename: '{{ .Release.Name }}'
    controller: 'main'
    primary: true
    type: 'ClusterIP'
    ports:
      http:
        primary: true
        port: 80
        targetPort: 'http'
        protocol: 'TCP'

{{- if .Values.networkPolicy.enabled }}
networkpolicies:
  {{- if .Values.migration.replaceStatefulSet }}
  migration-legacy:
    forceRename: '{{ .Release.Name }}-migration-legacy'
    annotations:
      argocd.argoproj.io/sync-wave: '-1'
    podSelector:
      matchLabels:
        app.kubernetes.io/name: 'opennms'
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    policyTypes:
      - 'Ingress'
    rules:
{{ include "core-network-insight.networkPolicyRules" . | nindent 6 }}
  {{- end }}
  main:
    forceRename: '{{ .Release.Name }}'
    controller: 'main'
    policyTypes:
      - 'Ingress'
    rules:
{{ include "core-network-insight.networkPolicyRules" . | nindent 6 }}
{{- end }}

rawResources:
  route:
    forceRename: '{{ .Release.Name }}'
    manifest:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        namespace: '{{ .Release.Namespace }}'
        labels:
          wan-mode: 'public'
          lan-mode: 'private'
      spec:
        hostnames:
          - {{ required "gateway.hostname is required" .Values.gateway.hostname | squote }}
        parentRefs:
          - group: 'gateway.networking.k8s.io'
            kind: Gateway
            name: {{ required "gateway.name is required" .Values.gateway.name | squote }}
            namespace: {{ required "gateway.namespace is required" .Values.gateway.namespace | squote }}
            sectionName: {{ required "gateway.sectionName is required" .Values.gateway.sectionName | squote }}
        rules:
          - backendRefs:
              - group: ''
                kind: Service
                name: '{{ .Release.Name }}'
                port: 80
                weight: 1
{{- if .Values.postgresql.secretSync.enabled }}
  postgresql-admin-push:
    forceRename: '{{ .Release.Name }}-postgresql-admin-push'
    manifest:
      apiVersion: external-secrets.io/v1alpha1
      kind: PushSecret
      metadata:
        namespace: {{ required "postgresql.adminSecretSourceNamespace is required" .Values.postgresql.adminSecretSourceNamespace | squote }}
        annotations:
          argocd.argoproj.io/sync-wave: '-3'
      spec:
        updatePolicy: 'Replace'
        deletionPolicy: 'None'
        refreshInterval: '1h'
        secretStoreRefs:
          - name: {{ required "postgresql.secretSync.storeName is required" .Values.postgresql.secretSync.storeName | squote }}
            kind: 'ClusterSecretStore'
        selector:
          secret:
            name: {{ required "postgresql.adminSecretName is required" .Values.postgresql.adminSecretName | squote }}
        data:
          - match:
              secretKey: 'username'
              remoteRef:
                remoteKey: {{ printf "%s/PostgreSQLAdmin" (required "postgresql.secretSync.remoteKeyPrefix is required" .Values.postgresql.secretSync.remoteKeyPrefix) | squote }}
                property: 'username'
          - match:
              secretKey: 'password'
              remoteRef:
                remoteKey: {{ printf "%s/PostgreSQLAdmin" .Values.postgresql.secretSync.remoteKeyPrefix | squote }}
                property: 'password'
  postgresql-admin-sync:
    forceRename: '{{ .Release.Name }}-postgresql-admin-sync'
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        namespace: '{{ .Release.Namespace }}'
        annotations:
          argocd.argoproj.io/sync-wave: '-2'
      spec:
        refreshInterval: '1h'
        secretStoreRef:
          name: {{ .Values.postgresql.secretSync.storeName | squote }}
          kind: 'ClusterSecretStore'
        target:
          name: {{ .Values.postgresql.adminSecretName | squote }}
          creationPolicy: 'Owner'
          deletionPolicy: 'Retain'
        data:
          - secretKey: 'username'
            remoteRef:
              key: {{ printf "%s/PostgreSQLAdmin" .Values.postgresql.secretSync.remoteKeyPrefix | squote }}
              property: 'username'
          - secretKey: 'password'
            remoteRef:
              key: {{ printf "%s/PostgreSQLAdmin" .Values.postgresql.secretSync.remoteKeyPrefix | squote }}
              property: 'password'
{{- end }}

configMaps:
  public-url:
    forceRename: '{{ .Release.Name }}-public-url'
    data:
      public-url.properties: |
        opennms.web.base-url=https://{{ required "gateway.hostname is required" .Values.gateway.hostname }}/opennms/

{{- if .Values.timeseries.enabled }}
  timeseries:
    forceRename: '{{ .Release.Name }}-timeseries'
    data:
      timeseries.properties: |
        org.opennms.timeseries.strategy=integration
        org.opennms.rrd.storeByForeignSource=true
        org.opennms.timeseries.tin.metatags.tag.node=${node:label}
        org.opennms.timeseries.tin.metatags.tag.location=${node:location}
        org.opennms.timeseries.tin.metatags.tag.ifDescr=${interface:if-description}
        org.opennms.timeseries.tin.metatags.tag.ifName=${interface:if-name}
      org.opennms.plugins.tss.prometheus.cfg: |
        writeUrl={{ required "timeseries.writeUrl is required when external time-series storage is enabled" .Values.timeseries.writeUrl }}
        readUrl={{ required "timeseries.readUrl is required when external time-series storage is enabled" .Values.timeseries.readUrl }}
        maxConcurrentHttpConnections={{ int .Values.timeseries.maxConcurrentHttpConnections }}
        writeTimeoutInMs={{ int .Values.timeseries.writeTimeoutInMs }}
        readTimeoutInMs={{ int .Values.timeseries.readTimeoutInMs }}
        metricCacheSize={{ int .Values.timeseries.metricCacheSize }}
        externalTagsCacheSize={{ int .Values.timeseries.externalTagsCacheSize }}
        maxSeriesLookback={{ int .Values.timeseries.maxSeriesLookback }}
      prometheus-remotewrite.boot: |
        opennms-plugins-prometheus-remotewrite wait-for-kar=opennms-prometheus-remotewrite-plugin
{{- end }}

{{- if or .Values.authentik.proxyAuth.enabled .Values.ldap.enabled }}
  proxy-auth:
    forceRename: '{{ .Release.Name }}-proxy-auth'
    data:
      start.sh: |
        #!/usr/bin/env bash
        set -Eeuo pipefail

        opennms_home="${OPENNMS_HOME:-/opt/opennms}"
        jetty_overlay="${OPENNMS_JETTY_OVERLAY:-/opt/opennms-jetty-webinf-overlay}"
        auth_config="${OPENNMS_AUTH_CONFIG:-/opt/opennms-auth/authentication.xml}"
        security_context="${opennms_home}/jetty-webapps/opennms/WEB-INF/applicationContext-spring-security.xml"
        {{- if .Values.authentik.proxyAuth.enabled }}
        legacy_provider='org.springframework.security.core.userdetails.UserDetailsByNameServiceWrapper'
        authorities_provider='org.springframework.security.web.authentication.preauth.PreAuthenticatedGrantedAuthoritiesUserDetailsService'

        if grep -Fq "${authorities_provider}" "${security_context}"; then
          :
        elif grep -Fq "${legacy_provider}" "${security_context}"; then
          sed -i \
            '/^  <beans:bean id="preauthAuthProvider"/,/^  <\/beans:bean>$/c\
        <beans:bean id="preauthAuthProvider" class="org.springframework.security.web.authentication.preauth.PreAuthenticatedAuthenticationProvider">\
          <beans:property name="preAuthenticatedUserDetailsService">\
            <beans:bean id="preAuthUserDetailsService" class="org.springframework.security.web.authentication.preauth.PreAuthenticatedGrantedAuthoritiesUserDetailsService"/>\
          </beans:property>\
        </beans:bean>' \
            "${security_context}"
        else
          echo "OpenNMS pre-auth provider layout is not recognized; refusing to start" >&2
          exit 1
        fi

        grep -Fq "${authorities_provider}" "${security_context}"
        {{- end }}
        {{- if .Values.ldap.enabled }}
        if grep -Eq '^[[:space:]]*<authentication-provider ref="externalAuthenticationProvider"[[:space:]]*/>[[:space:]]*$' "${security_context}"; then
          :
        elif grep -Fq '<!-- <authentication-provider ref="externalAuthenticationProvider" /> -->' "${security_context}"; then
          sed -i \
            's@^[[:space:]]*<!-- <authentication-provider ref="externalAuthenticationProvider" /> -->@    <authentication-provider ref="externalAuthenticationProvider" />@' \
            "${security_context}"
        else
          echo "OpenNMS external authentication provider layout is not recognized; refusing to start" >&2
          exit 1
        fi

        grep -Eq '^[[:space:]]*<authentication-provider ref="externalAuthenticationProvider"[[:space:]]*/>[[:space:]]*$' "${security_context}"
        {{- end }}
        install -d -m 0755 "${jetty_overlay}/spring-security.d"
        install -m 0444 "${auth_config}" \
          "${jetty_overlay}/spring-security.d/authentication.xml"
        exec "${OPENNMS_ENTRYPOINT:-/entrypoint.sh}" "$@"
      authentication.xml: |
        <?xml version="1.0" encoding="UTF-8"?>
        <beans:beans xmlns="http://www.springframework.org/schema/security"
          xmlns:beans="http://www.springframework.org/schema/beans"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans.xsd
                              http://www.springframework.org/schema/security http://www.springframework.org/schema/security/spring-security.xsd">
          {{- if .Values.authentik.proxyAuth.enabled }}
          <beans:bean id="headerPreAuthFilter" class="org.opennms.web.springframework.security.RequestHeaderPreAuthenticationProcessingFilter">
            <beans:property name="enabled" value="true"/>
            <beans:property name="failOnError" value="{{ .Values.authentik.proxyAuth.failOnError }}"/>
            <beans:property name="userHeader" value="{{ required "authentik.proxyAuth.userHeader is required" .Values.authentik.proxyAuth.userHeader }}"/>
            <beans:property name="credentialsHeader" value=""/>
            <beans:property name="authoritiesHeader" value="{{ required "authentik.proxyAuth.authoritiesHeader is required" .Values.authentik.proxyAuth.authoritiesHeader }}"/>
            <beans:property name="authenticationManager" ref="authenticationManager"/>
          </beans:bean>
          {{- end }}
          {{- if .Values.ldap.enabled }}
          <beans:bean id="ldapTemplate" class="org.springframework.ldap.core.LdapTemplate">
            <beans:constructor-arg ref="contextSource"/>
            <beans:property name="ignorePartialResultException" value="true"/>
          </beans:bean>

          <beans:bean id="contextSource" class="org.springframework.ldap.core.support.LdapContextSource">
            <beans:property name="urls">
              <beans:list>
                <beans:value>#{systemEnvironment['OPENNMS_LDAP_URI']}</beans:value>
              </beans:list>
            </beans:property>
            <beans:property name="base" value="{{ required "ldap.baseDn is required when LDAP authentication is enabled" .Values.ldap.baseDn | html }}"/>
            <beans:property name="authenticationSource" ref="authenticationSource"/>
          </beans:bean>

          <beans:bean id="authenticationSource" class="org.springframework.ldap.authentication.DefaultValuesAuthenticationSourceDecorator">
            <beans:property name="target" ref="springSecurityAuthenticationSource"/>
            <beans:property name="defaultUser" value="#{systemEnvironment['OPENNMS_LDAP_BIND_DN']}"/>
            <beans:property name="defaultPassword" value="#{systemEnvironment['OPENNMS_LDAP_BIND_PASSWORD']}"/>
          </beans:bean>

          <beans:bean id="springSecurityAuthenticationSource" class="org.springframework.security.ldap.authentication.SpringSecurityAuthenticationSource"/>

          <beans:bean id="externalAuthenticationProvider" class="org.springframework.security.ldap.authentication.LdapAuthenticationProvider">
            <beans:constructor-arg ref="ldapAuthenticator"/>
            <beans:constructor-arg ref="userGroupLdapAuthoritiesPopulator"/>
          </beans:bean>

          <beans:bean id="ldapAuthenticator" class="org.springframework.security.ldap.authentication.BindAuthenticator">
            <beans:constructor-arg ref="contextSource"/>
            <beans:property name="userSearch" ref="userSearch"/>
          </beans:bean>

          <beans:bean id="userSearch" class="org.springframework.security.ldap.search.FilterBasedLdapUserSearch">
            <beans:constructor-arg index="0" value="{{ required "ldap.userSearchBase is required when LDAP authentication is enabled" .Values.ldap.userSearchBase | html }}"/>
            <beans:constructor-arg index="1" value="{{ required "ldap.userSearchFilter is required when LDAP authentication is enabled" .Values.ldap.userSearchFilter | html }}"/>
            <beans:constructor-arg index="2" ref="contextSource"/>
            <beans:property name="searchSubtree" value="true"/>
          </beans:bean>

          <beans:bean id="userGroupLdapAuthoritiesPopulator" class="org.opennms.web.springframework.security.UserGroupLdapAuthoritiesPopulator">
            <beans:constructor-arg ref="contextSource"/>
            <beans:constructor-arg value="{{ required "ldap.groupSearchBase is required when LDAP authentication is enabled" .Values.ldap.groupSearchBase | html }}"/>
            <beans:property name="searchSubtree" value="true"/>
            <beans:property name="convertToUpperCase" value="true"/>
            <beans:property name="groupRoleAttribute" value="cn"/>
            <beans:property name="groupSearchFilter" value="{{ required "ldap.groupSearchFilter is required when LDAP authentication is enabled" .Values.ldap.groupSearchFilter | html }}"/>
            <beans:property name="groupToRoleMap">
              <beans:map>
                {{- range $group := .Values.authentik.accessGroups }}
                <beans:entry>
                  <beans:key><beans:value>{{ $group | html }}</beans:value></beans:key>
                  <beans:list>
                    {{- range $.Values.authentik.proxyAuth.authorities }}
                    <beans:value>{{ . | html }}</beans:value>
                    {{- end }}
                  </beans:list>
                </beans:entry>
                {{- end }}
              </beans:map>
            </beans:property>
          </beans:bean>
          {{- end }}
        </beans:beans>
{{- end }}

persistence:
  public-url:
    type: 'configMap'
    identifier: 'public-url'
    advancedMounts:
      main:
        initialize:
          - path: '/opt/opennms/etc/opennms.properties.d/public-url.properties'
            subPath: 'public-url.properties'
            readOnly: true
        opennms:
          - path: '/opt/opennms/etc/opennms.properties.d/public-url.properties'
            subPath: 'public-url.properties'
            readOnly: true
{{- if .Values.kafka.enabled }}
  kafka:
    type: 'secret'
    name: {{ .Values.kafka.credentialsSecretName | squote }}
    advancedMounts:
      main:
        initialize:
          - path: '/opt/opennms/etc/opennms.properties.d/kafka.properties'
            subPath: 'kafka.properties'
            readOnly: true
        opennms:
          - path: '/opt/opennms/etc/opennms.properties.d/kafka.properties'
            subPath: 'kafka.properties'
            readOnly: true
{{- end }}
{{- if .Values.timeseries.enabled }}
  timeseries:
    type: 'configMap'
    identifier: 'timeseries'
    advancedMounts:
      main:
        opennms:
          - path: '/opt/opennms/etc/opennms.properties.d/timeseries.properties'
            subPath: 'timeseries.properties'
            readOnly: true
          - path: '/opt/opennms/etc/org.opennms.plugins.tss.prometheus.cfg'
            subPath: 'org.opennms.plugins.tss.prometheus.cfg'
            readOnly: true
          - path: '/opt/opennms/etc/featuresBoot.d/prometheus-remotewrite.boot'
            subPath: 'prometheus-remotewrite.boot'
            readOnly: true
