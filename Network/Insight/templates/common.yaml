{{- if or .Values.authentik.proxyAuth.enabled .Values.ldap.enabled }}
  proxy-auth:
    forceRename: '{{ .Release.Name }}-proxy-auth'
    data:
      start.sh: |
        #!/usr/bin/env bash
        set -Eeuo pipefail

        opennms_home="${OPENNMS_HOME:-/opt/opennms}"
        jetty_overlay="${OPENNMS_JETTY_OVERLAY:-/opt/opennms-jetty-webinf-overlay}"
        auth_config="${OPENNMS_AUTH_CONFIG:-/opt/opennms-auth/authentication.xml}"
        security_context="${opennms_home}/jetty-webapps/opennms/WEB-INF/applicationContext-spring-security.xml"
        {{- if .Values.authentik.proxyAuth.enabled }}
        legacy_provider='org.springframework.security.core.userdetails.UserDetailsByNameServiceWrapper'
        authorities_provider='org.springframework.security.web.authentication.preauth.PreAuthenticatedGrantedAuthoritiesUserDetailsService'

        if grep -Fq "${authorities_provider}" "${security_context}"; then
          :
        elif grep -Fq "${legacy_provider}" "${security_context}"; then
          sed -i \
            '/^  <beans:bean id="preauthAuthProvider"/,/^  <\/beans:bean>$/c\
        <beans:bean id="preauthAuthProvider" class="org.springframework.security.web.authentication.preauth.PreAuthenticatedAuthenticationProvider">\
          <beans:property name="preAuthenticatedUserDetailsService">\
            <beans:bean id="preAuthUserDetailsService" class="org.springframework.security.web.authentication.preauth.PreAuthenticatedGrantedAuthoritiesUserDetailsService"/>\
          </beans:property>\
        </beans:bean>' \
            "${security_context}"
        else
          echo "OpenNMS pre-auth provider layout is not recognized; refusing to start" >&2
          exit 1
        fi

        grep -Fq "${authorities_provider}" "${security_context}"
        {{- end }}
        {{- if .Values.ldap.enabled }}
        if grep -Eq '^[[:space:]]*<authentication-provider ref="externalAuthenticationProvider"[[:space:]]*/>[[:space:]]*$' "${security_context}"; then
          :
        elif grep -Fq '<!-- <authentication-provider ref="externalAuthenticationProvider" /> -->' "${security_context}"; then
          sed -i \
            's@^[[:space:]]*<!-- <authentication-provider ref="externalAuthenticationProvider" /> -->@    <authentication-provider ref="externalAuthenticationProvider" />@' \
            "${security_context}"
        else
          echo "OpenNMS external authentication provider layout is not recognized; refusing to start" >&2
          exit 1
        fi

        grep -Eq '^[[:space:]]*<authentication-provider ref="externalAuthenticationProvider"[[:space:]]*/>[[:space:]]*$' "${security_context}"
        {{- end }}
        install -d -m 0755 "${jetty_overlay}/spring-security.d"
        install -m 0444 "${auth_config}" \
          "${jetty_overlay}/spring-security.d/authentication.xml"
        exec "${OPENNMS_ENTRYPOINT:-/entrypoint.sh}" "$@"
      authentication.xml: |
        <?xml version="1.0" encoding="UTF-8"?>
        <beans:beans xmlns="http://www.springframework.org/schema/security"
          xmlns:beans="http://www.springframework.org/schema/beans"
          xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
          xsi:schemaLocation="http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans.xsd
                              http://www.springframework.org/schema/security http://www.springframework.org/schema/security/spring-security.xsd">
          {{- if .Values.authentik.proxyAuth.enabled }}
          <beans:bean id="headerPreAuthFilter" class="org.opennms.web.springframework.security.RequestHeaderPreAuthenticationProcessingFilter">
            <beans:property name="enabled" value="true"/>
            <beans:property name="failOnError" value="{{ .Values.authentik.proxyAuth.failOnError }}"/>
            <beans:property name="userHeader" value="{{ required "authentik.proxyAuth.userHeader is required" .Values.authentik.proxyAuth.userHeader }}"/>
            <beans:property name="credentialsHeader" value=""/>
            <beans:property name="authoritiesHeader" value="{{ required "authentik.proxyAuth.authoritiesHeader is required" .Values.authentik.proxyAuth.authoritiesHeader }}"/>
            <beans:property name="authenticationManager" ref="authenticationManager"/>
          </beans:bean>
          {{- end }}
          {{- if .Values.ldap.enabled }}
          <beans:bean id="ldapTemplate" class="org.springframework.ldap.core.LdapTemplate">
            <beans:constructor-arg ref="contextSource"/>
            <beans:property name="ignorePartialResultException" value="true"/>
          </beans:bean>

          <beans:bean id="contextSource" class="org.springframework.ldap.core.support.LdapContextSource">
            <beans:property name="urls">
              <beans:list>
                <beans:value>#{systemEnvironment['OPENNMS_LDAP_URI']}</beans:value>
              </beans:list>
            </beans:property>
            <beans:property name="base" value="{{ required "ldap.baseDn is required when LDAP authentication is enabled" .Values.ldap.baseDn | html }}"/>
            <beans:property name="authenticationSource" ref="authenticationSource"/>
          </beans:bean>

          <beans:bean id="authenticationSource" class="org.springframework.ldap.authentication.DefaultValuesAuthenticationSourceDecorator">
            <beans:property name="target" ref="springSecurityAuthenticationSource"/>
            <beans:property name="defaultUser" value="#{systemEnvironment['OPENNMS_LDAP_BIND_DN']}"/>
            <beans:property name="defaultPassword" value="#{systemEnvironment['OPENNMS_LDAP_BIND_PASSWORD']}"/>
          </beans:bean>

          <beans:bean id="springSecurityAuthenticationSource" class="org.springframework.security.ldap.authentication.SpringSecurityAuthenticationSource"/>

          <beans:bean id="externalAuthenticationProvider" class="org.springframework.security.ldap.authentication.LdapAuthenticationProvider">
            <beans:constructor-arg ref="ldapAuthenticator"/>
            <beans:constructor-arg ref="userGroupLdapAuthoritiesPopulator"/>
          </beans:bean>

          <beans:bean id="ldapAuthenticator" class="org.springframework.security.ldap.authentication.BindAuthenticator">
            <beans:constructor-arg ref="contextSource"/>
            <beans:property name="userSearch" ref="userSearch"/>
          </beans:bean>

          <beans:bean id="userSearch" class="org.springframework.security.ldap.search.FilterBasedLdapUserSearch">
            <beans:constructor-arg index="0" value="{{ required "ldap.userSearchBase is required when LDAP authentication is enabled" .Values.ldap.userSearchBase | html }}"/>
            <beans:constructor-arg index="1" value="{{ required "ldap.userSearchFilter is required when LDAP authentication is enabled" .Values.ldap.userSearchFilter | html }}"/>
            <beans:constructor-arg index="2" ref="contextSource"/>
            <beans:property name="searchSubtree" value="true"/>
          </beans:bean>

          <beans:bean id="userGroupLdapAuthoritiesPopulator" class="org.opennms.web.springframework.security.UserGroupLdapAuthoritiesPopulator">
            <beans:constructor-arg ref="contextSource"/>
            <beans:constructor-arg value="{{ required "ldap.groupSearchBase is required when LDAP authentication is enabled" .Values.ldap.groupSearchBase | html }}"/>
            <beans:property name="searchSubtree" value="true"/>
            <beans:property name="convertToUpperCase" value="true"/>
            <beans:property name="groupRoleAttribute" value="cn"/>
            <beans:property name="groupSearchFilter" value="{{ required "ldap.groupSearchFilter is required when LDAP authentication is enabled" .Values.ldap.groupSearchFilter | html }}"/>
            <beans:property name="groupToRoleMap">
              <beans:map>
                {{- range $group := .Values.authentik.accessGroups }}
                <beans:entry>
                  <beans:key><beans:value>{{ $group | html }}</beans:value></beans:key>
                  <beans:list>
                    {{- range $.Values.authentik.proxyAuth.authorities }}
                    <beans:value>{{ . | html }}</beans:value>
                    {{- end }}
                  </beans:list>
                </beans:entry>
                {{- end }}
                {{- if .Values.minion.enabled }}
                <beans:entry>
                  <beans:key><beans:value>{{ required "authentik.minionGroup is required when Minion is enabled" .Values.authentik.minionGroup | html }}</beans:value></beans:key>
                  <beans:list>
                    <beans:value>ROLE_MINION</beans:value>
                  </beans:list>
                </beans:entry>
                {{- end }}
              </beans:map>
            </beans:property>
          </beans:bean>
          {{- end }}
        </beans:beans>
{{- end }}

