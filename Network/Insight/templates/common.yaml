---
{{- include "bjw-s.common.loader.init" . }}

{{- if and .Values.minion.enabled (not .Values.minion.coreUrl) }}
{{- fail "minion.coreUrl is required when Minion is enabled" }}
{{- end }}
{{- if and .Values.minion.enabled (not .Values.minion.kafka.bootstrapServers) }}
{{- fail "minion.kafka.bootstrapServers is required when Minion is enabled" }}
{{- end }}

{{- if and .Values.opennms.enabled .Values.ldap.enabled (not .Values.authentik.accessGroups) }}
{{- fail "authentik.accessGroups must contain at least one group when LDAP authentication is enabled" }}
{{- end }}
{{- if and .Values.opennms.enabled .Values.ldap.enabled (not .Values.authentik.proxyAuth.authorities) }}
{{- fail "authentik.proxyAuth.authorities must contain at least one role when LDAP authentication is enabled" }}
{{- end }}
{{- if and .Values.flow.enabled .Values.networkPolicy.enabled (not .Values.flow.allowedCidrs) }}
{{- fail "flow.allowedCidrs must contain at least one CIDR when the flow collector and network policy are enabled" }}
{{- end }}
{{- if and .Values.flow.enabled (ne .Values.flow.database.username .Values.flow.database.database) }}
{{- fail "flow.database.database must match flow.database.username because the User claim creates the database named after its username" }}
{{- end }}
{{- if and .Values.flow.enabled .Values.flow.retention.enabled (lt (.Values.flow.retention.detailHours | int) 1) }}
{{- fail "flow.retention.detailHours must be greater than zero when flow retention is enabled" }}
{{- end }}

{{- define "core-network-insight.networkPolicyRules" -}}
ingress:
  - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: {{ required "networkPolicy.gateway.namespace is required" .Values.networkPolicy.gateway.namespace | squote }}
        podSelector:
          matchLabels:
            {{- range $key, $value := .Values.networkPolicy.gateway.podLabels }}
            {{ $key }}: {{ $value | squote }}
            {{- end }}
    ports:
      - port: 'http'
        protocol: 'TCP'
{{- end -}}

{{- define "core-network-insight.commonValues" -}}
global:
  nameOverride: '{{ .Release.Name }}'

controllers:
  main:
    forceRename: '{{ .Release.Name }}'
    type: 'statefulset'
    replicas: 1
    strategy: 'RollingUpdate'
    {{- if .Values.migration.replaceStatefulSet }}
    annotations:
      argocd.argoproj.io/sync-options: 'Replace=true'
    {{- end }}
    pod:
      annotations:
        secret.reloader.stakater.com/reload: '{{ .Values.postgresql.credentialsSecretName }},{{ .Values.postgresql.adminSecretName }}{{ if .Values.kafka.enabled }},{{ .Values.kafka.credentialsSecretName }}{{ end }}'
      automountServiceAccountToken: false
      nodeSelector:
        core.resolvemy.host/x86-64-v3: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: 'OnRootMismatch'
        seccompProfile:
          type: 'RuntimeDefault'
      terminationGracePeriodSeconds: 120
    statefulset:
      serviceName:
        identifier: 'main'
      volumeClaimTemplates:
        - name: 'config'
          accessMode: 'ReadWriteOnce'
          size: {{ .Values.storage.config.size | squote }}
          advancedMounts:
            prepare-configuration:
              - path: '/opennms-config'
            {{- if .Values.timeseries.enabled }}
            install-timeseries-plugin:
              - path: '/opennms-config'
            {{- end }}
            initialize:
              - path: '/opt/opennms/etc'
            opennms:
              - path: '/opt/opennms/etc'
              {{- if .Values.timeseries.enabled }}
              - path: '/opt/opennms/deploy/opennms-prometheus-remotewrite-plugin.kar'
                subPath: '.plugin-cache/opennms-prometheus-remotewrite-plugin.kar'
                readOnly: true
              {{- end }}
        - name: 'data'
          accessMode: 'ReadWriteOnce'
          size: {{ .Values.storage.data.size | squote }}
          advancedMounts:
            initialize:
              - path: '/opennms-data'
            opennms:
              - path: '/opennms-data'
    initContainers:
      prepare-configuration:
        image:
          repository: {{ .Values.image.repository | squote }}
          tag: {{ required "image.tag is required" .Values.image.tag | squote }}
          digest: {{ required "image.digest is required" .Values.image.digest | squote }}
          pullPolicy: {{ .Values.image.pullPolicy | squote }}
        command:
          - '/usr/bin/env'
          - 'bash'
          - '-c'
        args:
          - |
            set -Eeuo pipefail

            config_dir='/opennms-config'
            pristine_dir='/opt/opennms/share/etc-pristine'

            if [[ ! -f "${config_dir}/opennms.properties" ]]; then
              echo 'OpenNMS configuration is incomplete; seed missing files from etc-pristine.'
              rsync -r --ignore-existing --out-format='%n %C' "${pristine_dir}/" "${config_dir}/"
            fi

            install -d -m 0755 "${config_dir}/opennms.properties.d"
            {{- if .Values.timeseries.enabled }}
            install -d -m 0755 "${config_dir}/featuresBoot.d"
            {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
        resources: &containerResources
{{ toYaml .Values.resources | nindent 10 }}
      {{- if .Values.timeseries.enabled }}
      install-timeseries-plugin:
        dependsOn: 'prepare-configuration'
        image:
          repository: {{ .Values.image.repository | squote }}
          tag: {{ required "image.tag is required" .Values.image.tag | squote }}
          digest: {{ required "image.digest is required" .Values.image.digest | squote }}
          pullPolicy: {{ .Values.image.pullPolicy | squote }}
        command:
          - '/usr/bin/env'
          - 'bash'
          - '-c'
        args:
          - |
            set -Eeuo pipefail

            plugin_dir='/opennms-config/.plugin-cache'
            plugin_path="${plugin_dir}/opennms-prometheus-remotewrite-plugin.kar"
            download_path="${plugin_path}.download"
            plugin_url={{ required "timeseries.plugin.url is required when external time-series storage is enabled" .Values.timeseries.plugin.url | squote }}
            expected_sha256={{ required "timeseries.plugin.sha256 is required when external time-series storage is enabled" .Values.timeseries.plugin.sha256 | squote }}

            if [[ -f "${plugin_path}" ]] && \
              printf '%s  %s\n' "${expected_sha256}" "${plugin_path}" | sha256sum --check --status; then
              echo 'The cached Prometheus RemoteWrite plugin matches the pinned checksum.'
              exit 0
            fi

            install -d -m 0755 "${plugin_dir}"
            curl --fail --location --silent --show-error \
              --output "${download_path}" "${plugin_url}"
            printf '%s  %s\n' "${expected_sha256}" "${download_path}" | sha256sum --check
            mv -f "${download_path}" "${plugin_path}"
            chmod 0444 "${plugin_path}"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
        resources:
{{ toYaml .Values.timeseries.plugin.resources | nindent 10 }}
      {{- end }}
      initialize:
        {{- if .Values.timeseries.enabled }}
        dependsOn: 'install-timeseries-plugin'
        {{- else }}
        dependsOn: 'prepare-configuration'
        {{- end }}
        image:
          repository: {{ .Values.image.repository | squote }}
          tag: {{ .Values.image.tag | squote }}
          digest: {{ .Values.image.digest | squote }}
          pullPolicy: {{ .Values.image.pullPolicy | squote }}
        {{- if or .Values.authentik.proxyAuth.enabled .Values.ldap.enabled }}
        command:
          - '/opt/opennms-auth/start.sh'
        {{- end }}
        args:
          - '-i'
        env: &databaseEnvironment
          - name: 'TZ'
            value: {{ .Values.global.timezone | squote }}
          - name: 'POSTGRES_HOST'
            value: {{ required "postgresql.host is required" .Values.postgresql.host | squote }}
          - name: 'POSTGRES_PORT'
            value: {{ .Values.postgresql.port | quote }}
          - name: 'POSTGRES_USER'
            valueFrom:
              secretKeyRef:
                name: {{ required "postgresql.adminSecretName is required" .Values.postgresql.adminSecretName | squote }}
                key: 'username'
          - name: 'POSTGRES_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.adminSecretName | squote }}
                key: 'password'
          - name: CORE_SERVICE_TRAPD_ENABLED
            value: 'true'
          - name: 'OPENNMS_DBNAME'
            value: {{ required "postgresql.database is required" .Values.postgresql.database | squote }}
          - name: 'OPENNMS_DBUSER'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.credentialsSecretName | squote }}
                key: 'username'
          - name: 'OPENNMS_DBPASS'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.credentialsSecretName | squote }}
                key: 'password'
          {{- if .Values.ldap.enabled }}
          - name: 'OPENNMS_LDAP_URI'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.credentialsSecretName | squote }}
                key: 'ldapsURI'
          - name: 'OPENNMS_LDAP_BIND_DN'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.credentialsSecretName | squote }}
                key: 'ldapsBIND'
          - name: 'OPENNMS_LDAP_BIND_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.credentialsSecretName | squote }}
                key: 'password'
          {{- end }}
        # The pinned OpenNMS image assigns cap_net_raw to the Java executable
        # for its native ICMP pollers. NET_RAW must remain in the container's
        # capability bounding set or Linux refuses to execute Java with EPERM.
        securityContext: &javaContainerSecurityContext
          capabilities:
            add:
              - 'NET_RAW'
        resources: *containerResources
    containers:
      opennms:
        image:
          repository: {{ .Values.image.repository | squote }}
          tag: {{ .Values.image.tag | squote }}
          digest: {{ .Values.image.digest | squote }}
          pullPolicy: {{ .Values.image.pullPolicy | squote }}
        {{- if or .Values.authentik.proxyAuth.enabled .Values.ldap.enabled }}
        command:
          - '/opt/opennms-auth/start.sh'
        {{- end }}
        args:
          - '-s'
        env: *databaseEnvironment
        ports:
          - name: 'http'
            containerPort: 8980
            protocol: 'TCP'
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/opennms/login.jsp'
            port: 'http'
            spec:
              initialDelaySeconds: 30
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 12
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/opennms/login.jsp'
            port: 'http'
            spec:
              initialDelaySeconds: 120
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          startup:
            enabled: true
            type: 'HTTP'
            path: '/opennms/login.jsp'
            port: 'http'
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 90
        securityContext: *javaContainerSecurityContext
        resources: *containerResources
  {{- if .Values.flow.enabled }}
  flow:
    forceRename: '{{ .Release.Name }}-flow'
    replicas: 1
    strategy: 'RollingUpdate'
    pod:
      automountServiceAccountToken: false
      shareProcessNamespace: true
      nodeSelector:
{{ toYaml .Values.flow.nodeSelector | nindent 8 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: 'RuntimeDefault'
    initContainers:
      flow-schema:
        image:
          repository: 'docker.io/library/postgres'
          tag: '16.4'
          digest: 'sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412'
          pullPolicy: 'IfNotPresent'
        command:
          - '/usr/bin/env'
          - 'bash'
          - '-c'
        args:
          - |
            set -Eeuo pipefail
            install -m 0644 /dev/null /var/run/pmacct/networks.lst
            export PGPASSWORD="${POSTGRES_ADMIN_PASSWORD}"
            psql --host="${POSTGRES_HOST}" --port="${POSTGRES_PORT}" \
              --username="${POSTGRES_ADMIN_USER}" --dbname="${FLOW_DATABASE}" \
              --set=ON_ERROR_STOP=1 --file='/etc/pmacct/flow-schema.sql'
            psql --host="${POSTGRES_HOST}" --port="${POSTGRES_PORT}" \
              --username="${POSTGRES_ADMIN_USER}" --dbname="${FLOW_DATABASE}" \
              --set=ON_ERROR_STOP=1 \
              --command="GRANT SELECT, INSERT, UPDATE, DELETE ON TABLE acct_v4, flow_hourly, flow_daily, flow_monthly, flow_yearly TO \"${FLOW_DATABASE_USER}\";"
        env:
          - name: 'POSTGRES_HOST'
            value: {{ required "postgresql.host is required" .Values.postgresql.host | squote }}
          - name: 'POSTGRES_PORT'
            value: {{ .Values.postgresql.port | quote }}
          - name: 'POSTGRES_ADMIN_USER'
            valueFrom:
              secretKeyRef:
                name: {{ required "postgresql.adminSecretName is required" .Values.postgresql.adminSecretName | squote }}
                key: 'username'
          - name: 'POSTGRES_ADMIN_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.postgresql.adminSecretName | squote }}
                key: 'password'
          - name: 'FLOW_DATABASE_USER'
            value: {{ .Values.flow.database.username | squote }}
          - name: 'FLOW_DATABASE'
            value: {{ .Values.flow.database.database | squote }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
        resources:
{{ toYaml .Values.flow.resources | nindent 10 }}
    containers:
      netflow:
        image:
          repository: {{ .Values.flow.netflowImage.repository | squote }}
          tag: {{ required "flow.netflowImage.tag is required" .Values.flow.netflowImage.tag | squote }}
          digest: {{ required "flow.netflowImage.digest is required" .Values.flow.netflowImage.digest | squote }}
          pullPolicy: {{ .Values.flow.netflowImage.pullPolicy | squote }}
        command:
          - '/usr/bin/env'
          - 'bash'
          - '-c'
        args:
          - |
            set -Eeuo pipefail
            password="${FLOW_DATABASE_PASSWORD}"
            password="${password//\\/\\\\}"
            password="${password//&/\\&}"
            password="${password//|/\\|}"
            sed "s|\${FLOW_DATABASE_PASSWORD}|${password}|g" /etc/pmacct/nfacctd-netflow.conf > /tmp/nfacctd.conf
            exec nfacctd -f /tmp/nfacctd.conf
        ports:
          - name: 'netflow'
            containerPort: 2055
            protocol: 'UDP'
        securityContext: &flowContainerSecurityContext
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
        resources:
{{ toYaml .Values.flow.resources | nindent 10 }}
        env:
          - name: 'FLOW_DATABASE_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.flow.database.credentialsSecretName | squote }}
                key: 'password'
      ipfix:
        image:
          repository: {{ .Values.flow.netflowImage.repository | squote }}
          tag: {{ required "flow.netflowImage.tag is required" .Values.flow.netflowImage.tag | squote }}
          digest: {{ required "flow.netflowImage.digest is required" .Values.flow.netflowImage.digest | squote }}
          pullPolicy: {{ .Values.flow.netflowImage.pullPolicy | squote }}
        command:
          - '/usr/bin/env'
          - 'bash'
          - '-c'
        args:
          - |
            set -Eeuo pipefail
            password="${FLOW_DATABASE_PASSWORD}"
            password="${password//\\/\\\\}"
            password="${password//&/\\&}"
            password="${password//|/\\|}"
            sed "s|\${FLOW_DATABASE_PASSWORD}|${password}|g" /etc/pmacct/nfacctd-ipfix.conf > /tmp/nfacctd.conf
            exec nfacctd -f /tmp/nfacctd.conf
        ports:
          - name: 'ipfix'
            containerPort: 4739
            protocol: 'UDP'
        securityContext: *flowContainerSecurityContext
        resources:
{{ toYaml .Values.flow.resources | nindent 10 }}
        env:
          - name: 'FLOW_DATABASE_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.flow.database.credentialsSecretName | squote }}
                key: 'password'
      sflow:
        image:
          repository: {{ .Values.flow.sflowImage.repository | squote }}
          tag: {{ required "flow.sflowImage.tag is required" .Values.flow.sflowImage.tag | squote }}
          digest: {{ required "flow.sflowImage.digest is required" .Values.flow.sflowImage.digest | squote }}
          pullPolicy: {{ .Values.flow.sflowImage.pullPolicy | squote }}
        command:
          - '/usr/bin/env'
          - 'bash'
          - '-c'
        args:
          - |
            set -Eeuo pipefail
            password="${FLOW_DATABASE_PASSWORD}"
            password="${password//\\/\\\\}"
            password="${password//&/\\&}"
            password="${password//|/\\|}"
            sed "s|\${FLOW_DATABASE_PASSWORD}|${password}|g" /etc/pmacct/sfacctd.conf > /tmp/sfacctd.conf
            exec sfacctd -f /tmp/sfacctd.conf
        ports:
          - name: 'sflow'
            containerPort: 6343
            protocol: 'UDP'
        securityContext: *flowContainerSecurityContext
        resources:
{{ toYaml .Values.flow.resources | nindent 10 }}
        env:
          - name: 'FLOW_DATABASE_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.flow.database.credentialsSecretName | squote }}
                key: 'password'
      {{- if .Values.flow.asnLookup.enabled }}
      asn-lookup:
        image:
          repository: {{ .Values.flow.asnLookup.image.repository | squote }}
          tag: {{ .Values.flow.asnLookup.image.tag | squote }}
          digest: {{ .Values.flow.asnLookup.image.digest | squote }}
          pullPolicy: {{ .Values.flow.asnLookup.image.pullPolicy | squote }}
        command:
          - '/usr/bin/env'
          - 'bash'
          - '-c'
        args:
          - |
            set -Eeuo pipefail
            map='/var/run/pmacct/networks.lst'
            refresh() {
              ips='/tmp/asn-ips'
              response='/tmp/asn-response'
              next='/tmp/networks.lst.new'
              psql --host="${POSTGRES_HOST}" --port="${POSTGRES_PORT}" \
                --username="${FLOW_DATABASE_USER}" --dbname="${FLOW_DATABASE}" \
                --tuples-only --no-align --command="
                  SELECT DISTINCT host(ip_src) FROM acct_v4
                  WHERE stamp_inserted >= NOW() - INTERVAL '2 hours'
                    AND NOT (ip_src <<= inet '10.0.0.0/8' OR ip_src <<= inet '172.16.0.0/12' OR ip_src <<= inet '192.168.0.0/16' OR ip_src <<= inet '127.0.0.0/8' OR ip_src <<= inet '169.254.0.0/16' OR ip_src <<= inet '::/128' OR ip_src <<= inet '::1/128' OR ip_src <<= inet 'fc00::/7' OR ip_src <<= inet 'fe80::/10')
                  UNION
                  SELECT DISTINCT host(ip_dst) FROM acct_v4
                  WHERE stamp_inserted >= NOW() - INTERVAL '2 hours'
                    AND NOT (ip_dst <<= inet '10.0.0.0/8' OR ip_dst <<= inet '172.16.0.0/12' OR ip_dst <<= inet '192.168.0.0/16' OR ip_dst <<= inet '127.0.0.0/8' OR ip_dst <<= inet '169.254.0.0/16' OR ip_dst <<= inet '::/128' OR ip_dst <<= inet '::1/128' OR ip_dst <<= inet 'fc00::/7' OR ip_dst <<= inet 'fe80::/10');
                " > "${ips}"
              : > "${response}"
              if [ -s "${ips}" ]; then
                exec 3<>/dev/tcp/whois.cymru.com/43
                {
                  printf '%s\n' 'begin' 'verbose'
                  cat "${ips}"
                  printf '%s\n' 'end'
                } >&3
                while IFS= read -r line <&3; do
                  printf '%s\n' "${line}" >> "${response}"
                done
                exec 3>&-
              fi
              {
                {{- range $mapping := .Values.flow.asnLookup.staticMappings }}
                {{- if $mapping.ranges }}
                {{- range $range := $mapping.ranges }}
                printf '%s,%s\n' {{ $mapping.asn | squote }} {{ $range | squote }}
                {{- end }}
                {{- else if $mapping.range }}
                printf '%s,%s\n' {{ $mapping.asn | squote }} {{ $mapping.range | squote }}
                {{- end }}
                {{- end }}
                awk -F '|' '
                  function trim(value) { gsub(/^[[:space:]]+|[[:space:]]+$/, "", value); return value }
                  {
                    asn = trim($1); prefix = trim($3)
                    if (asn ~ /^[0-9]+$/ && prefix ~ /\/[0-9]+$/) print asn "," prefix
                  }
                ' "${response}"
              } | sort -t, -k2,2 -u > "${next}"
              if [ -s "${next}" ]; then
                mv "${next}" "${map}"
                for daemon in nfacctd sfacctd; do
                  for process in /proc/[0-9]*; do
                    pid="${process##*/}"
                    if [ "$(cat "${process}/comm" 2>/dev/null || true)" = "${daemon}" ]; then
                      kill -USR2 "${pid}" || true
                    fi
                  done
                done
              fi
            }
            while true; do
              refresh || true
              sleep "${ASN_REFRESH_SECONDS}"
            done
        env:
          - name: 'POSTGRES_HOST'
            value: {{ required "postgresql.host is required" .Values.postgresql.host | squote }}
          - name: 'POSTGRES_PORT'
            value: {{ .Values.postgresql.port | quote }}
          - name: 'FLOW_DATABASE'
            value: {{ .Values.flow.database.database | squote }}
          - name: 'FLOW_DATABASE_USER'
            valueFrom:
              secretKeyRef:
                name: {{ required "flow.database.credentialsSecretName is required" .Values.flow.database.credentialsSecretName | squote }}
                key: 'username'
          - name: 'FLOW_DATABASE_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.flow.database.credentialsSecretName | squote }}
                key: 'password'
          - name: 'PGPASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.flow.database.credentialsSecretName | squote }}
                key: 'password'
          - name: 'ASN_REFRESH_SECONDS'
            value: {{ .Values.flow.asnLookup.refreshSeconds | quote }}
        securityContext: *flowContainerSecurityContext
        resources:
{{ toYaml .Values.flow.metrics.resources | nindent 10 }}
      {{- end }}
      sql-exporter:
        image:
          repository: {{ .Values.flow.metrics.exporterImage.repository | squote }}
          tag: {{ required "flow.metrics.exporterImage.tag is required" .Values.flow.metrics.exporterImage.tag | squote }}
          pullPolicy: {{ .Values.flow.metrics.exporterImage.pullPolicy | squote }}
        args:
          - '-config.file=/etc/sql-exporter/sql_exporter.yml'
        env:
          - name: 'PG_HOST'
            value: {{ required "postgresql.host is required" .Values.postgresql.host | squote }}
          - name: 'PG_PORT'
            value: {{ .Values.postgresql.port | quote }}
          - name: 'PG_DATABASE'
            value: {{ .Values.flow.database.database | squote }}
          - name: 'PG_USER'
            valueFrom:
              secretKeyRef:
                name: {{ required "flow.database.credentialsSecretName is required" .Values.flow.database.credentialsSecretName | squote }}
                key: 'username'
          - name: 'PG_PASSWORD'
            valueFrom:
              secretKeyRef:
                name: {{ .Values.flow.database.credentialsSecretName | squote }}
                key: 'password'
          - name: 'SQLEXPORTER_TARGET_DSN'
            value: 'postgresql://$(PG_USER):$(PG_PASSWORD)@$(PG_HOST):$(PG_PORT)/$(PG_DATABASE)?sslmode=disable'
        ports:
          - name: 'metrics'
            containerPort: {{ .Values.flow.metrics.port }}
            protocol: 'TCP'
        securityContext: *flowContainerSecurityContext
        resources:
{{ toYaml .Values.flow.metrics.resources | nindent 10 }}
  {{- end }}

service:
  main:
    forceRename: '{{ .Release.Name }}'
    controller: 'main'
    primary: true
    type: 'ClusterIP'
    {{- if .Values.serviceGlobal.global.enabled }}
    annotations:
      service.cilium.io/global: 'true'
      service.cilium.io/shared: 'true'
      service.cilium.io/global-sync-endpoint-slices: 'true'
    {{- end }}
    ports:
      http:
        primary: true
        port: 80
        targetPort: 'http'
        protocol: 'TCP'
  {{- if .Values.flow.enabled }}
  flow:
    forceRename: '{{ .Release.Name }}-flow'
    controller: 'flow'
    type: {{ .Values.flow.service.type | squote }}
    externalTrafficPolicy: {{ .Values.flow.service.externalTrafficPolicy | squote }}
    annotations:
      {{- range $key, $value := .Values.flow.service.annotations }}
      {{ $key }}: {{ $value | squote }}
      {{- end }}
    ports:
      netflow:
        enabled: true
        primary: false
        port: 2055
        targetPort: 'netflow'
        protocol: 'UDP'
      ipfix:
        enabled: true
        primary: false
        port: 4739
        targetPort: 'ipfix'
        protocol: 'UDP'
      sflow:
        enabled: true
        primary: false
        port: 6343
        targetPort: 'sflow'
        protocol: 'UDP'
      metrics:
        enabled: true
        primary: false
        port: {{ .Values.flow.metrics.port }}
        targetPort: 'metrics'
        protocol: 'TCP'
  {{- end }}

{{- if .Values.networkPolicy.enabled }}
networkpolicies:
  {{- if .Values.migration.replaceStatefulSet }}
  migration-legacy:
    forceRename: '{{ .Release.Name }}-migration-legacy'
    annotations:
      argocd.argoproj.io/sync-wave: '-1'
    podSelector:
      matchLabels:
        app.kubernetes.io/name: 'opennms'
        app.kubernetes.io/instance: '{{ .Release.Name }}'
    policyTypes:
      - 'Ingress'
    rules:
{{ include "core-network-insight.networkPolicyRules" . | nindent 6 }}
  {{- end }}
  main:
    forceRename: '{{ .Release.Name }}'
    controller: 'main'
    policyTypes:
      - 'Ingress'
    rules:
{{ include "core-network-insight.networkPolicyRules" . | nindent 6 }}
  {{- if .Values.flow.enabled }}
  flow:
    forceRename: '{{ .Release.Name }}-flow'
    controller: 'flow'
    policyTypes:
      - 'Ingress'
    rules:
      ingress:
        - from:
            {{- range .Values.flow.allowedCidrs }}
            - ipBlock:
                cidr: {{ . | squote }}
            {{- end }}
          ports:
            - port: 'netflow'
              protocol: 'UDP'
            - port: 'ipfix'
              protocol: 'UDP'
            - port: 'sflow'
              protocol: 'UDP'
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: 'core-{{ .Values.env }}'
          ports:
            - port: 'metrics'
              protocol: 'TCP'
  {{- end }}
{{- end }}

rawResources:
{{- if .Values.flow.enabled }}
  flow-service-monitor:
    forceRename: '{{ .Release.Name }}-flow-service-monitor'
    manifest:
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: '{{ .Release.Name }}-flow'
        namespace: '{{ .Release.Namespace }}'
        labels:
          app.kubernetes.io/managed-by: 'argocd'
      spec:
        namespaceSelector:
          matchNames:
            - '{{ .Release.Namespace }}'
        selector:
          matchLabels:
            app.kubernetes.io/name: '{{ .Release.Name }}'
            app.kubernetes.io/instance: '{{ .Release.Name }}'
            app.kubernetes.io/service: '{{ .Release.Name }}-flow'
        endpoints:
          - port: 'metrics'
            path: '/metrics'
            interval: '30s'
            scrapeTimeout: '10s'
  {{- if .Values.flow.retention.enabled }}
  flow-retention:
    forceRename: '{{ printf "%s-%s-flow-retention" (trunc 28 .Release.Name) (sha256sum .Release.Name | trunc 8) }}'
    manifest:
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: '{{ printf "%s-%s-flow-retention" (trunc 28 .Release.Name) (sha256sum .Release.Name | trunc 8) }}'
        namespace: '{{ .Release.Namespace }}'
        labels:
          app.kubernetes.io/name: '{{ .Release.Name }}'
          app.kubernetes.io/instance: '{{ .Release.Name }}'
          app.kubernetes.io/component: 'flow-retention'
      spec:
        schedule: {{ .Values.flow.retention.schedule | squote }}
        concurrencyPolicy: 'Forbid'
        successfulJobsHistoryLimit: 2
        failedJobsHistoryLimit: 3
        jobTemplate:
          spec:
            backoffLimit: 2
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: '{{ .Release.Name }}'
                  app.kubernetes.io/instance: '{{ .Release.Name }}'
                  app.kubernetes.io/component: 'flow-retention'
              spec:
                restartPolicy: 'OnFailure'
                automountServiceAccountToken: false
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 999
                  runAsGroup: 999
                  seccompProfile:
                    type: 'RuntimeDefault'
                containers:
                  - name: 'flow-retention'
                    image: '{{ .Values.flow.retention.image.repository }}:{{ .Values.flow.retention.image.tag }}@{{ .Values.flow.retention.image.digest }}'
                    imagePullPolicy: {{ .Values.flow.retention.image.pullPolicy | squote }}
                    command:
                      - '/usr/bin/env'
                      - 'bash'
                      - '-c'
                    args:
                      - |
                        set -Eeuo pipefail
                        export PGPASSWORD="${FLOW_DATABASE_PASSWORD}"
                        psql --host="${POSTGRES_HOST}" --port="${POSTGRES_PORT}" \
                          --username="${FLOW_DATABASE_USER}" --dbname="${FLOW_DATABASE}" \
                          --set=ON_ERROR_STOP=1 \
                          --variable="detail_retention_hours=${FLOW_DETAIL_RETENTION_HOURS}" \
                          --file='/etc/pmacct/flow-retention.sql'
                    env:
                      - name: 'POSTGRES_HOST'
                        value: {{ required "postgresql.host is required" .Values.postgresql.host | squote }}
                      - name: 'POSTGRES_PORT'
                        value: {{ .Values.postgresql.port | quote }}
                      - name: 'FLOW_DATABASE'
                        value: {{ .Values.flow.database.database | squote }}
                      - name: 'FLOW_DATABASE_USER'
                        valueFrom:
                          secretKeyRef:
                            name: {{ required "flow.database.credentialsSecretName is required" .Values.flow.database.credentialsSecretName | squote }}
                            key: 'username'
                      - name: 'FLOW_DATABASE_PASSWORD'
                        valueFrom:
                          secretKeyRef:
                            name: {{ .Values.flow.database.credentialsSecretName | squote }}
                            key: 'password'
                      - name: 'FLOW_DETAIL_RETENTION_HOURS'
                        value: {{ .Values.flow.retention.detailHours | quote }}
                    volumeMounts:
                      - name: 'flow-config'
                        mountPath: '/etc/pmacct/flow-retention.sql'
                        subPath: 'flow-retention.sql'
                        readOnly: true
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities:
                        drop:
                          - 'ALL'
                volumes:
                  - name: 'flow-config'
                    configMap:
                      name: '{{ .Release.Name }}-flow'
  {{- end }}
{{- end }}
  flow-dashboard:
    forceRename: '{{ .Release.Name }}-flow-dashboard'
    manifest:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: '{{ .Release.Name }}-flow-dashboard'
        namespace: 'core-{{ .Values.env }}'
        labels:
          grafana_dashboard: 'true'
          grafana_folder: 'OpenNMS'
      data:
        opennms-flow.json: |
          {
            "annotations": {"list": []},
            "description": "OpenNMS flow intake rate, archived hourly/daily/monthly rollups, and PostgreSQL storage capacity.",
            "editable": true,
            "fiscalYearStartMonth": 0,
            "graphTooltip": 1,
            "links": [],
            "panels": [
              {
                "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "flow/s"}, "overrides": []},
                "gridPos": {"h": 5, "w": 8, "x": 0, "y": 0},
                "id": 1,
                "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
                "targets": [{"expr": "sum(opennms_flow_received_per_second)", "refId": "A"}],
                "title": "Inbound flow records / second",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "Bps"}, "overrides": []},
                "gridPos": {"h": 5, "w": 8, "x": 8, "y": 0},
                "id": 2,
                "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
                "targets": [{"expr": "sum(opennms_flow_bytes_per_second)", "refId": "A"}],
                "title": "Inbound flow bytes / second",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "decbytes"}, "overrides": []},
                "gridPos": {"h": 5, "w": 8, "x": 16, "y": 0},
                "id": 3,
                "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
                "targets": [{"expr": "sum(opennms_flow_database_size_bytes)", "refId": "A"}],
                "title": "Flow database size",
                "type": "stat"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "flow/s"}, "overrides": []},
                "gridPos": {"h": 9, "w": 12, "x": 0, "y": 5},
                "id": 4,
                "options": {"legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
                "targets": [{"expr": "sum(opennms_flow_received_per_second)", "legendFormat": "flow records/s", "refId": "A"}],
                "title": "Inbound flow rate",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "decbytes"}, "overrides": []},
                "gridPos": {"h": 9, "w": 12, "x": 12, "y": 5},
                "id": 5,
                "options": {"legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
                "targets": [{"expr": "sum(opennms_flow_database_size_bytes)", "legendFormat": "database size", "refId": "A"}, {"expr": "sum(opennms_flow_storage_bytes)", "legendFormat": "acct_v4 table", "refId": "B"}],
                "title": "Flow storage growth",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "short"}, "overrides": []},
                "gridPos": {"h": 9, "w": 12, "x": 0, "y": 14},
                "id": 6,
                "options": {"legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
                "targets": [{"expr": "sum(opennms_flow_hourly_flows)", "legendFormat": "hourly flows", "refId": "A"}, {"expr": "sum(opennms_flow_daily_flows)", "legendFormat": "daily flows", "refId": "B"}, {"expr": "sum(opennms_flow_monthly_flows)", "legendFormat": "monthly flows", "refId": "C"}],
                "title": "Archived flow records",
                "type": "timeseries"
              },
              {
                "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
                "fieldConfig": {"defaults": {"color": {"mode": "palette-classic"}, "unit": "decbytes"}, "overrides": []},
                "gridPos": {"h": 9, "w": 12, "x": 12, "y": 14},
                "id": 7,
                "options": {"legend": {"calcs": ["mean", "max", "lastNotNull"], "displayMode": "table", "placement": "bottom", "showLegend": true}, "tooltip": {"mode": "multi", "sort": "desc"}},
                "targets": [{"expr": "sum(opennms_flow_hourly_bytes)", "legendFormat": "hourly bytes", "refId": "A"}, {"expr": "sum(opennms_flow_daily_bytes)", "legendFormat": "daily bytes", "refId": "B"}, {"expr": "sum(opennms_flow_monthly_bytes)", "legendFormat": "monthly bytes", "refId": "C"}],
                "title": "Archived flow volume",
                "type": "timeseries"
              }
            ],
            "refresh": "1m",
            "schemaVersion": 39,
            "tags": ["OpenNMS", "flows", "capacity"],
            "templating": {"list": [{"current": {}, "hide": 0, "label": "Prometheus", "name": "DS_PROMETHEUS", "options": [], "query": "prometheus", "refresh": 1, "type": "datasource"}]},
            "time": {"from": "now-24h", "to": "now"},
            "title": "OpenNMS Flow Capacity",
            "uid": "opennms-flow-capacity",
            "version": 1
          }
  route:
    forceRename: '{{ .Release.Name }}'
    manifest:
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        namespace: '{{ .Release.Namespace }}'
        labels:
          wan-mode: 'public'
          lan-mode: 'private'
      spec:
        hostnames:
          - {{ required "gateway.hostname is required" .Values.gateway.hostname | squote }}
        parentRefs:
          - group: 'gateway.networking.k8s.io'
            kind: Gateway
            name: {{ required "gateway.name is required" .Values.gateway.name | squote }}
            namespace: {{ required "gateway.namespace is required" .Values.gateway.namespace | squote }}
            sectionName: {{ required "gateway.sectionName is required" .Values.gateway.sectionName | squote }}
        rules:
          - backendRefs:
              - group: ''
                kind: Service
                name: '{{ .Release.Name }}'
                port: 80
                weight: 1
{{- if .Values.postgresql.secretSync.enabled }}
  postgresql-admin-push:
    forceRename: '{{ .Release.Name }}-postgresql-admin-push'
    manifest:
      apiVersion: external-secrets.io/v1alpha1
      kind: PushSecret
      metadata:
        namespace: {{ required "postgresql.adminSecretSourceNamespace is required" .Values.postgresql.adminSecretSourceNamespace | squote }}
        annotations:
          argocd.argoproj.io/sync-wave: '-3'
      spec:
        updatePolicy: 'Replace'
        deletionPolicy: 'None'
        refreshInterval: '1h'
        secretStoreRefs:
          - name: {{ required "postgresql.secretSync.storeName is required" .Values.postgresql.secretSync.storeName | squote }}
            kind: 'ClusterSecretStore'
        selector:
          secret:
            name: {{ required "postgresql.adminSecretName is required" .Values.postgresql.adminSecretName | squote }}
        data:
          - match:
              secretKey: 'username'
              remoteRef:
                remoteKey: {{ printf "%s/PostgreSQLAdmin" (required "postgresql.secretSync.remoteKeyPrefix is required" .Values.postgresql.secretSync.remoteKeyPrefix) | squote }}
                property: 'username'
          - match:
              secretKey: 'password'
              remoteRef:
                remoteKey: {{ printf "%s/PostgreSQLAdmin" .Values.postgresql.secretSync.remoteKeyPrefix | squote }}
                property: 'password'
  postgresql-admin-sync:
    forceRename: '{{ .Release.Name }}-postgresql-admin-sync'
    manifest:
      apiVersion: external-secrets.io/v1
      kind: ExternalSecret
      metadata:
        namespace: '{{ .Release.Namespace }}'
        annotations:
          argocd.argoproj.io/sync-wave: '-2'
      spec:
        refreshInterval: '1h'
        secretStoreRef:
          name: {{ .Values.postgresql.secretSync.storeName | squote }}
          kind: 'ClusterSecretStore'
        target:
          name: {{ .Values.postgresql.adminSecretName | squote }}
          creationPolicy: 'Owner'
          deletionPolicy: 'Retain'
        data:
          - secretKey: 'username'
            remoteRef:
              key: {{ printf "%s/PostgreSQLAdmin" .Values.postgresql.secretSync.remoteKeyPrefix | squote }}
              property: 'username'
          - secretKey: 'password'
            remoteRef:
              key: {{ printf "%s/PostgreSQLAdmin" .Values.postgresql.secretSync.remoteKeyPrefix | squote }}
              property: 'password'
{{- end }}

configMaps:
  public-url:
    forceRename: '{{ .Release.Name }}-public-url'
    data:
      public-url.properties: |
        opennms.web.base-url=https://{{ required "gateway.hostname is required" .Values.gateway.hostname }}/opennms/

{{- if .Values.flow.enabled }}
  flow:
    forceRename: '{{ .Release.Name }}-flow'
    data:
      nfacctd-netflow.conf: |
        daemonize: false
        nfacctd_ip: 0.0.0.0
        nfacctd_port: 2055
        plugins: pgsql
        {{- if .Values.flow.asnLookup.enabled }}
        nfacctd_as: file
        networks_file: /var/run/pmacct/networks.lst
        refresh_maps: true
        {{- end }}
        aggregate: src_host, dst_host, src_as, dst_as, src_port, dst_port, proto, flows
        sql_table: acct_v4
        sql_table_version: 6
        sql_data: typed
        sql_host: {{ .Values.postgresql.host | squote }}
        sql_port: {{ .Values.postgresql.port }}
        sql_db: {{ .Values.flow.database.database | squote }}
        sql_user: {{ .Values.flow.database.username | squote }}
        sql_passwd: '${FLOW_DATABASE_PASSWORD}'
        sql_refresh_time: 60
        sql_history: 5m
        sql_history_roundoff: m
      nfacctd-ipfix.conf: |
        daemonize: false
        nfacctd_ip: 0.0.0.0
        nfacctd_port: 4739
        plugins: pgsql
        {{- if .Values.flow.asnLookup.enabled }}
        nfacctd_as: file
        networks_file: /var/run/pmacct/networks.lst
        refresh_maps: true
        {{- end }}
        aggregate: src_host, dst_host, src_as, dst_as, src_port, dst_port, proto, flows
        sql_table: acct_v4
        sql_table_version: 6
        sql_data: typed
        sql_host: {{ .Values.postgresql.host | squote }}
        sql_port: {{ .Values.postgresql.port }}
        sql_db: {{ .Values.flow.database.database | squote }}
        sql_user: {{ .Values.flow.database.username | squote }}
        sql_passwd: '${FLOW_DATABASE_PASSWORD}'
        sql_refresh_time: 60
        sql_history: 5m
        sql_history_roundoff: m
      sfacctd.conf: |
        daemonize: false
        sfacctd_ip: 0.0.0.0
        sfacctd_port: 6343
        plugins: pgsql
        {{- if .Values.flow.asnLookup.enabled }}
        sfacctd_as: file
        networks_file: /var/run/pmacct/networks.lst
        refresh_maps: true
        {{- end }}
        aggregate: src_host, dst_host, src_as, dst_as, src_port, dst_port, proto, flows
        sql_table: acct_v4
        sql_table_version: 6
        sql_data: typed
        sql_host: {{ .Values.postgresql.host | squote }}
        sql_port: {{ .Values.postgresql.port }}
        sql_db: {{ .Values.flow.database.database | squote }}
        sql_user: {{ .Values.flow.database.username | squote }}
        sql_passwd: '${FLOW_DATABASE_PASSWORD}'
        sql_refresh_time: 60
        sql_history: 5m
        sql_history_roundoff: m
      flow-schema.sql: |
        CREATE TABLE IF NOT EXISTS acct_v4 (
          agent_id BIGINT NOT NULL DEFAULT 0,
          class_id CHAR(16) NOT NULL DEFAULT ' ',
          mac_src macaddr NOT NULL DEFAULT '0:0:0:0:0:0',
          mac_dst macaddr NOT NULL DEFAULT '0:0:0:0:0:0',
          vlan INT NOT NULL DEFAULT 0,
          ip_src inet NOT NULL DEFAULT '0.0.0.0',
          ip_dst inet NOT NULL DEFAULT '0.0.0.0',
          as_src BIGINT NOT NULL DEFAULT 0,
          as_dst BIGINT NOT NULL DEFAULT 0,
          port_src INT NOT NULL DEFAULT 0,
          port_dst INT NOT NULL DEFAULT 0,
          ip_proto SMALLINT NOT NULL DEFAULT 0,
          tos INT NOT NULL DEFAULT 0,
          packets INT NOT NULL,
          bytes BIGINT NOT NULL,
          flows INT NOT NULL DEFAULT 0,
          stamp_inserted timestamp without time zone NOT NULL DEFAULT '0001-01-01 00:00:00',
          stamp_updated timestamp without time zone,
          CONSTRAINT acct_v4_pk PRIMARY KEY (agent_id, class_id, mac_src, mac_dst, vlan, ip_src, ip_dst, as_src, as_dst, port_src, port_dst, ip_proto, tos, stamp_inserted)
        );
        ALTER TABLE acct_v4 DROP CONSTRAINT IF EXISTS acct_v4_pk;
        ALTER TABLE acct_v4 ADD COLUMN IF NOT EXISTS class_id CHAR(16) NOT NULL DEFAULT ' ';
        ALTER TABLE acct_v4 ADD COLUMN IF NOT EXISTS mac_src macaddr NOT NULL DEFAULT '0:0:0:0:0:0';
        ALTER TABLE acct_v4 ADD COLUMN IF NOT EXISTS mac_dst macaddr NOT NULL DEFAULT '0:0:0:0:0:0';
        ALTER TABLE acct_v4 ADD COLUMN IF NOT EXISTS as_src BIGINT NOT NULL DEFAULT 0;
        ALTER TABLE acct_v4 ADD COLUMN IF NOT EXISTS as_dst BIGINT NOT NULL DEFAULT 0;
        ALTER TABLE acct_v4 ADD CONSTRAINT acct_v4_pk PRIMARY KEY (agent_id, class_id, mac_src, mac_dst, vlan, ip_src, ip_dst, as_src, as_dst, port_src, port_dst, ip_proto, tos, stamp_inserted);
        CREATE INDEX IF NOT EXISTS acct_v4_stamp_inserted_idx ON acct_v4 (stamp_inserted);
        CREATE TABLE IF NOT EXISTS flow_hourly (
          period_start TIMESTAMP WITHOUT TIME ZONE NOT NULL,
          as_src BIGINT NOT NULL DEFAULT 0,
          as_dst BIGINT NOT NULL DEFAULT 0,
          packets NUMERIC NOT NULL,
          bytes NUMERIC NOT NULL,
          flows NUMERIC NOT NULL,
          generated_at TIMESTAMP WITHOUT TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
          CONSTRAINT flow_hourly_pk PRIMARY KEY (period_start, as_src, as_dst)
        );
        CREATE TABLE IF NOT EXISTS flow_daily (
          period_start DATE NOT NULL,
          as_src BIGINT NOT NULL DEFAULT 0,
          as_dst BIGINT NOT NULL DEFAULT 0,
          packets NUMERIC NOT NULL,
          bytes NUMERIC NOT NULL,
          flows NUMERIC NOT NULL,
          generated_at TIMESTAMP WITHOUT TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
          CONSTRAINT flow_daily_pk PRIMARY KEY (period_start, as_src, as_dst)
        );
        CREATE TABLE IF NOT EXISTS flow_monthly (
          period_start DATE NOT NULL,
          as_src BIGINT NOT NULL DEFAULT 0,
          as_dst BIGINT NOT NULL DEFAULT 0,
          packets NUMERIC NOT NULL,
          bytes NUMERIC NOT NULL,
          flows NUMERIC NOT NULL,
          generated_at TIMESTAMP WITHOUT TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
          CONSTRAINT flow_monthly_pk PRIMARY KEY (period_start, as_src, as_dst)
        );
        CREATE TABLE IF NOT EXISTS flow_yearly (
          period_start DATE NOT NULL,
          as_src BIGINT NOT NULL DEFAULT 0,
          as_dst BIGINT NOT NULL DEFAULT 0,
          packets NUMERIC NOT NULL,
          bytes NUMERIC NOT NULL,
          flows NUMERIC NOT NULL,
          generated_at TIMESTAMP WITHOUT TIME ZONE NOT NULL DEFAULT CURRENT_TIMESTAMP,
          CONSTRAINT flow_yearly_pk PRIMARY KEY (period_start, as_src, as_dst)
        );
        ALTER TABLE flow_hourly DROP CONSTRAINT IF EXISTS flow_hourly_pkey;
        ALTER TABLE flow_hourly DROP CONSTRAINT IF EXISTS flow_hourly_pk;
        ALTER TABLE flow_hourly ADD COLUMN IF NOT EXISTS as_src BIGINT NOT NULL DEFAULT 0;
        ALTER TABLE flow_hourly ADD COLUMN IF NOT EXISTS as_dst BIGINT NOT NULL DEFAULT 0;
        ALTER TABLE flow_hourly ADD CONSTRAINT flow_hourly_pk PRIMARY KEY (period_start, as_src, as_dst);
        ALTER TABLE flow_daily DROP CONSTRAINT IF EXISTS flow_daily_pkey;
        ALTER TABLE flow_daily DROP CONSTRAINT IF EXISTS flow_daily_pk;
        ALTER TABLE flow_daily ADD COLUMN IF NOT EXISTS as_src BIGINT NOT NULL DEFAULT 0;
        ALTER TABLE flow_daily ADD COLUMN IF NOT EXISTS as_dst BIGINT NOT NULL DEFAULT 0;
        ALTER TABLE flow_daily ADD CONSTRAINT flow_daily_pk PRIMARY KEY (period_start, as_src, as_dst);
        ALTER TABLE flow_monthly DROP CONSTRAINT IF EXISTS flow_monthly_pkey;
        ALTER TABLE flow_monthly DROP CONSTRAINT IF EXISTS flow_monthly_pk;
        ALTER TABLE flow_monthly ADD COLUMN IF NOT EXISTS as_src BIGINT NOT NULL DEFAULT 0;
        ALTER TABLE flow_monthly ADD COLUMN IF NOT EXISTS as_dst BIGINT NOT NULL DEFAULT 0;
        ALTER TABLE flow_monthly ADD CONSTRAINT flow_monthly_pk PRIMARY KEY (period_start, as_src, as_dst);
        ALTER TABLE flow_yearly DROP CONSTRAINT IF EXISTS flow_yearly_pkey;
        ALTER TABLE flow_yearly DROP CONSTRAINT IF EXISTS flow_yearly_pk;
        ALTER TABLE flow_yearly ADD COLUMN IF NOT EXISTS as_src BIGINT NOT NULL DEFAULT 0;
        ALTER TABLE flow_yearly ADD COLUMN IF NOT EXISTS as_dst BIGINT NOT NULL DEFAULT 0;
        ALTER TABLE flow_yearly ADD CONSTRAINT flow_yearly_pk PRIMARY KEY (period_start, as_src, as_dst);
        CREATE INDEX IF NOT EXISTS flow_hourly_period_start_idx ON flow_hourly (period_start);
        CREATE INDEX IF NOT EXISTS flow_daily_period_start_idx ON flow_daily (period_start);
        CREATE INDEX IF NOT EXISTS flow_monthly_period_start_idx ON flow_monthly (period_start);
        CREATE INDEX IF NOT EXISTS flow_yearly_period_start_idx ON flow_yearly (period_start);
      flow-retention.sql: |
        BEGIN;
        CREATE TEMP TABLE flow_rollup_hourly ON COMMIT DROP AS
        SELECT date_trunc('hour', stamp_inserted) AS period_start,
               as_src,
               as_dst,
               COALESCE(SUM(packets), 0)::numeric AS packets,
               COALESCE(SUM(bytes), 0)::numeric AS bytes,
               COALESCE(SUM(flows), 0)::numeric AS flows
        FROM acct_v4
        WHERE stamp_inserted < date_trunc('hour', CURRENT_TIMESTAMP)
        GROUP BY 1, 2, 3;
        DELETE FROM flow_hourly h
        USING flow_rollup_hourly r
        WHERE h.period_start = r.period_start
          AND h.as_src = r.as_src
          AND h.as_dst = r.as_dst;
        INSERT INTO flow_hourly (period_start, as_src, as_dst, packets, bytes, flows)
        SELECT period_start, as_src, as_dst, packets, bytes, flows
        FROM flow_rollup_hourly;
        DELETE FROM acct_v4
        WHERE stamp_inserted < CURRENT_TIMESTAMP - make_interval(hours => (:'detail_retention_hours')::integer);
        CREATE TEMP TABLE flow_rollup_daily ON COMMIT DROP AS
        SELECT date_trunc('day', period_start)::date AS period_start,
               as_src,
               as_dst,
               COALESCE(SUM(packets), 0)::numeric AS packets,
               COALESCE(SUM(bytes), 0)::numeric AS bytes,
               COALESCE(SUM(flows), 0)::numeric AS flows
        FROM flow_hourly
        WHERE period_start < date_trunc('day', CURRENT_TIMESTAMP)
        GROUP BY 1, 2, 3;
        DELETE FROM flow_daily d
        USING flow_rollup_daily r
        WHERE d.period_start = r.period_start
          AND d.as_src = r.as_src
          AND d.as_dst = r.as_dst;
        INSERT INTO flow_daily (period_start, as_src, as_dst, packets, bytes, flows)
        SELECT period_start, as_src, as_dst, packets, bytes, flows
        FROM flow_rollup_daily;
        CREATE TEMP TABLE flow_rollup_monthly ON COMMIT DROP AS
        SELECT date_trunc('month', period_start)::date AS period_start,
               as_src,
               as_dst,
               COALESCE(SUM(packets), 0)::numeric AS packets,
               COALESCE(SUM(bytes), 0)::numeric AS bytes,
               COALESCE(SUM(flows), 0)::numeric AS flows
        FROM flow_daily
        WHERE period_start < date_trunc('month', CURRENT_TIMESTAMP)::date
        GROUP BY 1, 2, 3;
        DELETE FROM flow_monthly m
        USING flow_rollup_monthly r
        WHERE m.period_start = r.period_start
          AND m.as_src = r.as_src
          AND m.as_dst = r.as_dst;
        INSERT INTO flow_monthly (period_start, as_src, as_dst, packets, bytes, flows)
        SELECT period_start, as_src, as_dst, packets, bytes, flows
        FROM flow_rollup_monthly;
        DELETE FROM flow_yearly;
        INSERT INTO flow_yearly (period_start, as_src, as_dst, packets, bytes, flows)
        SELECT date_trunc('year', period_start)::date,
               as_src, as_dst,
               SUM(packets), SUM(bytes), SUM(flows)
        FROM flow_monthly
        GROUP BY 1, 2, 3;
        COMMIT;
      sql-exporter.yml: |
        global:
          scrape_timeout: 10s
          min_interval: 30s
          max_connections: 1
          max_idle_connections: 1
        target:
          name: 'opennms-flow'
          data_source_name: 'postgres://placeholder'
          collectors: ['flow_rate']
        collectors:
          - collector_name: 'flow_rate'
            metrics:
              - metric_name: 'opennms_flow_received_per_second'
                type: 'gauge'
                help: 'Average flow records received per second during the last five minutes.'
                values: ['flows_per_second']
                query: |
                  SELECT COALESCE(SUM(flows), 0)::double precision / 300 AS flows_per_second
                  FROM acct_v4
                  WHERE stamp_updated >= NOW() - INTERVAL '5 minutes'
              - metric_name: 'opennms_flow_bytes_per_second'
                type: 'gauge'
                help: 'Average bytes represented by received flow records per second during the last five minutes.'
                values: ['bytes_per_second']
                query: |
                  SELECT COALESCE(SUM(bytes), 0)::double precision / 300 AS bytes_per_second
                  FROM acct_v4
                  WHERE stamp_updated >= NOW() - INTERVAL '5 minutes'
              - metric_name: 'opennms_flow_storage_bytes'
                type: 'gauge'
                help: 'PostgreSQL relation size of the OpenNMS flow accounting table in bytes.'
                values: ['storage_bytes']
                query: |
                  SELECT pg_total_relation_size('acct_v4') AS storage_bytes
              - metric_name: 'opennms_flow_database_size_bytes'
                type: 'gauge'
                help: 'Total PostgreSQL database size for the OpenNMS flow database in bytes.'
                values: ['database_size_bytes']
                query: |
                  SELECT pg_database_size(current_database()) AS database_size_bytes
              - metric_name: 'opennms_flow_hourly_flows'
                type: 'gauge'
                help: 'Flow records in the latest completed archived hourly period.'
                values: ['flows']
                query: |
                  SELECT COALESCE((SELECT SUM(flows) FROM flow_hourly WHERE period_start = (SELECT MAX(period_start) FROM flow_hourly)), 0) AS flows
              - metric_name: 'opennms_flow_daily_flows'
                type: 'gauge'
                help: 'Flow records in the latest completed archived daily period.'
                values: ['flows']
                query: |
                  SELECT COALESCE((SELECT SUM(flows) FROM flow_daily WHERE period_start = (SELECT MAX(period_start) FROM flow_daily)), 0) AS flows
              - metric_name: 'opennms_flow_monthly_flows'
                type: 'gauge'
                help: 'Flow records in the latest completed archived monthly period.'
                values: ['flows']
                query: |
                  SELECT COALESCE((SELECT SUM(flows) FROM flow_monthly WHERE period_start = (SELECT MAX(period_start) FROM flow_monthly)), 0) AS flows
              - metric_name: 'opennms_flow_hourly_bytes'
                type: 'gauge'
                help: 'Bytes in the latest completed archived hourly period.'
                values: ['bytes']
                query: |
                  SELECT COALESCE((SELECT SUM(bytes) FROM flow_hourly WHERE period_start = (SELECT MAX(period_start) FROM flow_hourly)), 0) AS bytes
              - metric_name: 'opennms_flow_daily_bytes'
                type: 'gauge'
                help: 'Bytes in the latest completed archived daily period.'
                values: ['bytes']
                query: |
                  SELECT COALESCE((SELECT SUM(bytes) FROM flow_daily WHERE period_start = (SELECT MAX(period_start) FROM flow_daily)), 0) AS bytes
              - metric_name: 'opennms_flow_monthly_bytes'
                type: 'gauge'
                help: 'Bytes in the latest completed archived monthly period.'
                values: ['bytes']
                query: |
                  SELECT COALESCE((SELECT SUM(bytes) FROM flow_monthly WHERE period_start = (SELECT MAX(period_start) FROM flow_monthly)), 0) AS bytes
{{- end }}

