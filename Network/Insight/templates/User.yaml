{{- if .Values.opennms.enabled }}
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: '{{ .Release.Name }}'
  namespace: '{{ .Release.Namespace }}'
spec:
  name: 'OpenNMS {{ .Values.region }}-{{ .Values.datacenter }}-{{ .Values.cluster.name }}'
  username: {{ required "postgresql.username is required" .Values.postgresql.username | squote }}
  serviceAccount: true
  groups:
    - 'LDAPService'
  psql:
    enabled: true
    createUserDatabase: true
    crossplane:
      crossplaneProvider: {{ required "postgresql.providers.crossplane is required" .Values.postgresql.providers.crossplane | squote }}
      terraformProvider: {{ required "postgresql.providers.terraform is required" .Values.postgresql.providers.terraform | squote }}
  writeConnectionSecretToRef:
    name: {{ required "postgresql.credentialsSecretName is required" .Values.postgresql.credentialsSecretName | squote }}
{{- end }}
{{- if .Values.flow.enabled }}
---
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: '{{ .Release.Name }}-flow'
  namespace: '{{ .Release.Namespace }}'
spec:
  name: 'OpenNMS flow processing {{ .Values.region }}-{{ .Values.datacenter }}-{{ .Values.cluster.name }}'
  username: {{ required "flow.database.username is required when flow processing is enabled" .Values.flow.database.username | squote }}
  serviceAccount: true
  groups:
    - 'LDAPService'
  psql:
    enabled: true
    createUserDatabase: true
    crossplane:
      crossplaneProvider: {{ required "postgresql.providers.crossplane is required" .Values.postgresql.providers.crossplane | squote }}
      terraformProvider: {{ required "postgresql.providers.terraform is required" .Values.postgresql.providers.terraform | squote }}
  writeConnectionSecretToRef:
    name: {{ required "flow.database.credentialsSecretName is required" .Values.flow.database.credentialsSecretName | squote }}
{{- end }}
