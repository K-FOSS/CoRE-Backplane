apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: '{{ .Release.Name }}'
  labels:
    wan-mode: 'public'
    lan-mode: 'private'
spec:
  hostnames:
    - {{ required "gateway.hostname is required" .Values.gateway.hostname | squote }}
  parentRefs:
    - group: 'gateway.networking.k8s.io'
      kind: Gateway
      name: {{ required "gateway.name is required" .Values.gateway.name | squote }}
      namespace: {{ required "gateway.namespace is required" .Values.gateway.namespace | squote }}
      sectionName: {{ required "gateway.sectionName is required" .Values.gateway.sectionName | squote }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: '{{ .Release.Name }}'
          port: 80
          weight: 1
