{{- if .Values.authentik.proxyAuth.enabled }}
{{- if not .Values.authentik.proxyAuth.authorities }}
{{- fail "authentik.proxyAuth.authorities must contain at least one OpenNMS role" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-proxy-auth'
data:
  start.sh: |
    #!/usr/bin/env bash
    set -Eeuo pipefail

    opennms_home="${OPENNMS_HOME:-/opt/opennms}"
    jetty_overlay="${OPENNMS_JETTY_OVERLAY:-/opt/opennms-jetty-webinf-overlay}"
    auth_config="${OPENNMS_AUTH_CONFIG:-/opt/opennms-auth/header-preauth.xml}"
    security_context="${opennms_home}/jetty-webapps/opennms/WEB-INF/applicationContext-spring-security.xml"
    legacy_provider='org.springframework.security.core.userdetails.UserDetailsByNameServiceWrapper'
    authorities_provider='org.springframework.security.web.authentication.preauth.PreAuthenticatedGrantedAuthoritiesUserDetailsService'

    if grep -Fq "${authorities_provider}" "${security_context}"; then
      :
    elif grep -Fq "${legacy_provider}" "${security_context}"; then
      sed -i \
        '/^  <beans:bean id="preauthAuthProvider"/,/^  <\/beans:bean>$/c\
      <beans:bean id="preauthAuthProvider" class="org.springframework.security.web.authentication.preauth.PreAuthenticatedAuthenticationProvider">\
        <beans:property name="preAuthenticatedUserDetailsService">\
          <beans:bean id="preAuthUserDetailsService" class="org.springframework.security.web.authentication.preauth.PreAuthenticatedGrantedAuthoritiesUserDetailsService"/>\
        </beans:property>\
      </beans:bean>' \
        "${security_context}"
    else
      echo "OpenNMS pre-auth provider layout is not recognized; refusing to start" >&2
      exit 1
    fi

    grep -Fq "${authorities_provider}" "${security_context}"
    install -d -m 0755 "${jetty_overlay}/spring-security.d"
    install -m 0444 "${auth_config}" \
      "${jetty_overlay}/spring-security.d/header-preauth.xml"
    exec "${OPENNMS_ENTRYPOINT:-/entrypoint.sh}" "$@"
  header-preauth.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <beans:beans xmlns="http://www.springframework.org/schema/security"
      xmlns:beans="http://www.springframework.org/schema/beans"
      xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
      xsi:schemaLocation="http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans.xsd
                          http://www.springframework.org/schema/security http://www.springframework.org/schema/security/spring-security.xsd">
      <beans:bean id="headerPreAuthFilter" class="org.opennms.web.springframework.security.RequestHeaderPreAuthenticationProcessingFilter">
        <beans:property name="enabled" value="true"/>
        <beans:property name="failOnError" value="{{ .Values.authentik.proxyAuth.failOnError }}"/>
        <beans:property name="userHeader" value="{{ required "authentik.proxyAuth.userHeader is required" .Values.authentik.proxyAuth.userHeader }}"/>
        <beans:property name="credentialsHeader" value=""/>
        <beans:property name="authoritiesHeader" value="{{ required "authentik.proxyAuth.authoritiesHeader is required" .Values.authentik.proxyAuth.authoritiesHeader }}"/>
        <beans:property name="authenticationManager" ref="authenticationManager"/>
      </beans:bean>
    </beans:beans>
{{- end }}
