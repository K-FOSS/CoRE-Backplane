{{- if .Values.kubeVip.enabled }}
{{- $vipRange := required "kubeVip.vipRange must be a reserved CIDR or IP range when kubeVip.enabled is true" .Values.kubeVip.vipRange }}
{{- $class := required "kubeVip.loadBalancerClass is required when kubeVip.enabled is true" .Values.kubeVip.loadBalancerClass }}
{{- $network := .Values.kubeVip.network }}
{{- $plugin := deepCopy $network.plugin }}
{{- if and .Values.kubeVip.upnp.enabled (empty $plugin.ipam) }}
{{- fail "kubeVip.network.plugin.ipam is required when kubeVip.upnp.enabled is true; each WAN attachment needs a unique address" }}
{{- end }}
{{- if eq $plugin.type "sriov" }}
{{- $_ := set $plugin "spoofchk" "off" }}
{{- end }}
{{- if $network.resourceName }}
{{- else if eq $plugin.type "sriov" }}
{{- fail "kubeVip.network.resourceName is required for an SR-IOV network" }}
{{- end }}
{{- $config := merge (dict "cniVersion" "1.0.0" "name" $network.name) $plugin }}
{{- $handoff := required "kubeVip.handoff is required when kubeVip.enabled is true" .Values.kubeVip.handoff }}
{{- if not (contains "-" $vipRange) }}
{{- fail "kubeVip.vipRange must use start-end notation for the handoff reconciler" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubevip
  namespace: kube-system
data:
  range-global: {{ $vipRange | quote }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ required "kubeVip.network.name is required" $network.name }}
  namespace: kube-system
  {{- if $network.resourceName }}
  annotations:
    k8s.v1.cni.cncf.io/resourceName: {{ $network.resourceName | quote }}
  {{- end }}
spec:
  config: {{ $config | toJson | quote }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ required "kubeVip.handoff.networkName is required" $handoff.networkName }}
  namespace: kube-system
spec:
  config: {{ dict "cniVersion" "1.0.0" "name" $handoff.networkName "type" "bridge" "bridge" (required "kubeVip.handoff.bridgeName is required" $handoff.bridgeName) "isGateway" false "ipMasq" false "hairpinMode" true "promiscMode" true "ipam" (dict "type" "none") | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-vip-cilium-handoff
  namespace: kube-system
data:
  reconcile.sh: |
    #!/bin/sh
    set -u

    CHAIN='100'
    ENTRY_CHAIN='0'
    WAN="${WAN_INTERFACE}"
    HANDOFF="${HANDOFF_INTERFACE}"
    CILIUM="${CILIUM_INTERFACE}"
    PRIVATE_CIDRS="${PRIVATE_ROUTE_CIDRS}"
    RANGE="${VIP_RANGE}"
    INTERVAL="${RECONCILE_INTERVAL}"
    START_IP="${RANGE%-*}"
    PREFIX="${START_IP%.*}"
    START="${START_IP##*.}"
    END="${RANGE##*.}"

    timestamp() {
      date -u '+%Y-%m-%dT%H:%M:%SZ'
    }

    log() {
      echo "$(timestamp) handoff reconcile: $*"
    }

    tc_stderr=''
    tc_rc=0

    run_tc() {
      tc_stderr=''
      # Preserve the read-only root filesystem: redirect stdout away first,
      # then capture stderr from the TC operation in the command substitution.
      tc_stderr="$("$@" 2>&1 >/dev/null)"
      tc_rc=$?
      tc_stderr="$(printf '%s' "${tc_stderr}" | tr '\n' ' ')"
      return 0
    }

    ensure_clsact() {
      qdisc="$(tc qdisc show dev "${WAN}" 2>&1)"
      qdisc_rc=$?
      log "interface=${WAN} operation=show-qdisc vip=- pref=- handle=- exit=${qdisc_rc} stderr=$(printf '%s' "${qdisc}" | tr '\n' ' ')"
      if [ "${qdisc_rc}" -eq 0 ] && printf '%s\n' "${qdisc}" | grep -qE '(^| )qdisc clsact '; then
        return 0
      fi

      run_tc tc qdisc add dev "${WAN}" clsact
      log "interface=${WAN} operation=add-clsact vip=- pref=- handle=- exit=${tc_rc} stderr=${tc_stderr}"
      if [ "${tc_rc}" -eq 0 ]; then
        return 0
      fi

      # EEXIST is recoverable only after the postcondition is true.
      qdisc="$(tc qdisc show dev "${WAN}" 2>&1)"
      if printf '%s\n' "${qdisc}" | grep -qE '(^| )qdisc clsact '; then
        log "interface=${WAN} operation=verify-clsact vip=- pref=- handle=- exit=0 stderr=add returned EEXIST but clsact is present"
        return 0
      fi
      log "interface=${WAN} operation=verify-clsact vip=- pref=- handle=- exit=1 stderr=clsact missing after add failure: $(printf '%s' "${qdisc}" | tr '\n' ' ')"
      return 1
    }

    vip_is_owned() {
      ip -4 -o addr show dev "${WAN}" scope global 2>/dev/null |
        awk '{print $4}' | cut -d/ -f1 | grep -Fxq "${1}"
    }

    legacy_filter_summary() {
      tc filter show dev "${WAN}" ingress chain 0 pref "${1}" handle 1 2>&1
    }

    # tc prints flower handles in hex even when the CLI accepted decimal.
    # Inspect the entire preference: a different classifier or a second filter
    # at our preference is a collision, not an invitation to replace it.
    inspect_filter() {
      inspect_chain="${1}"
      inspect_pref="${2}"
      inspect_handle="${3}"
      inspect_vip="${4}"
      inspect_mode="${5}"
      inspect_hex="$(printf '%x' "${inspect_handle}")"
      inspect_output="$(tc filter show dev "${WAN}" ingress chain "${inspect_chain}" pref "${inspect_pref}" 2>&1)"
      inspect_rc=$?
      filter_state='error'
      if [ "${inspect_rc}" -ne 0 ]; then
        log "interface=${WAN} operation=inspect-${inspect_mode} vip=${inspect_vip} chain=${inspect_chain} pref=${inspect_pref} handle=${inspect_handle} exit=${inspect_rc} stderr=$(printf '%s' "${inspect_output}" | tr '\n' ' ')"
        return 0
      fi
      if [ -z "${inspect_output}" ]; then
        filter_state='absent'
        return 0
      fi
      # One parent header and one handle header are normal tc flower output.
      handle_count="$(printf '%s\n' "${inspect_output}" | grep -c '^filter .* handle ' || true)"
      if [ "${handle_count}" -ne 1 ] ||
         ! printf '%s\n' "${inspect_output}" | grep -Eq "^filter protocol ip pref ${inspect_pref} flower chain ${inspect_chain} handle 0x0*${inspect_hex}([[:space:]]|$)"; then
        filter_state='collision'
      elif ! printf '%s\n' "${inspect_output}" | grep -Eq "dst_ip ${inspect_vip}(/32)?([[:space:]]|$)"; then
        filter_state='collision'
      elif [ "${inspect_mode}" = 'redirect' ]; then
        if printf '%s\n' "${inspect_output}" | grep -q 'mirred' &&
           printf '%s\n' "${inspect_output}" | grep -qi 'redirect' &&
           printf '%s\n' "${inspect_output}" | grep -Fq "${HANDOFF}"; then
          filter_state='desired'
        else
          filter_state='collision'
        fi
      elif printf '%s\n' "${inspect_output}" | grep -Eq 'gact action goto chain 100([[:space:]]|$)'; then
        filter_state='desired'
      else
        filter_state='collision'
      fi
      if [ "${filter_state}" = 'collision' ]; then
        log "interface=${WAN} operation=collision vip=${inspect_vip} chain=${inspect_chain} pref=${inspect_pref} handle=${inspect_handle} exit=1 stderr=$(printf '%s' "${inspect_output}" | tr '\n' ' ')"
      fi
    }

    ensure_private_routes() {
      gateway="$(ip -4 route show default dev "${CILIUM}" 2>/dev/null | awk '$1 == "default" && $3 != "" {print $3; exit}')"
      if [ -z "${gateway}" ]; then
        log "interface=${CILIUM} operation=private-route-discovery vip=- pref=- handle=- exit=1 stderr=no IPv4 Cilium gateway found"
        return 1
      fi

      for cidr in ${PRIVATE_CIDRS}; do
        current="$(ip -4 route show exact "${cidr}" 2>/dev/null | head -n 1)"
        if printf '%s\n' "${current}" | grep -Fq "via ${gateway} dev ${CILIUM}"; then
          log "interface=${CILIUM} operation=private-route-keep vip=${cidr} pref=- handle=- exit=0 stderr=via ${gateway}"
          continue
        fi

        route_stderr="$(ip -4 route replace "${cidr}" via "${gateway}" dev "${CILIUM}" metric 50 2>&1)"
        route_rc=$?
        route_stderr="$(printf '%s' "${route_stderr}" | tr '\n' ' ')"
        log "interface=${CILIUM} operation=private-route-replace vip=${cidr} pref=50 handle=- exit=${route_rc} stderr=${route_stderr} gateway=${gateway}"
      done
    }

    ensure_cilium_default_route() {
      gateway="$(ip -4 route show default dev "${CILIUM}" 2>/dev/null | awk '$1 == "default" && $3 != "" {print $3; exit}')"
      if [ -z "${gateway}" ]; then
        log "interface=${CILIUM} operation=default-route-discovery vip=0.0.0.0/0 pref=- handle=- exit=1 stderr=no IPv4 Cilium gateway found"
        return 1
      fi

      current="$(ip -4 route show default dev "${CILIUM}" 2>/dev/null | head -n 1)"
      if ! printf '%s\n' "${current}" | grep -Fq "via ${gateway} dev ${CILIUM}"; then
        route_stderr="$(ip -4 route replace default via "${gateway}" dev "${CILIUM}" metric 50 2>&1)"
        route_rc=$?
        route_stderr="$(printf '%s' "${route_stderr}" | tr '\n' ' ')"
        log "interface=${CILIUM} operation=default-route-replace vip=0.0.0.0/0 pref=50 handle=- exit=${route_rc} stderr=${route_stderr} gateway=${gateway}"
      fi

      while ip -4 route show default dev "${WAN}" 2>/dev/null | grep -q '^default '; do
        route_stderr="$(ip -4 route del default dev "${WAN}" 2>&1)"
        route_rc=$?
        route_stderr="$(printf '%s' "${route_stderr}" | tr '\n' ' ')"
        log "interface=${WAN} operation=default-route-delete vip=0.0.0.0/0 pref=- handle=- exit=${route_rc} stderr=${route_stderr}"
        [ "${route_rc}" -eq 0 ] || break
      done

      if ! ip -4 route show default dev "${WAN}" 2>/dev/null | grep -q '^default '; then
        log "interface=${CILIUM} operation=default-route-keep vip=0.0.0.0/0 pref=50 handle=- exit=0 stderr=wan default absent"
      fi
    }

    cleanup_legacy_vip() {
      vip="${1}"
      octet="${vip##*.}"
      legacy_pref="$((100 + octet))"
      summary="$(legacy_filter_summary "${legacy_pref}")"
      show_rc=$?
      [ "${show_rc}" -eq 0 ] && [ -n "${summary}" ] || return 0
      if printf '%s\n' "${summary}" | grep -Eq "^filter protocol ip pref ${legacy_pref} flower chain 0 handle 0x0*1([[:space:]]|$)" &&
         [ "$(printf '%s\n' "${summary}" | grep -c '^filter .* handle ' || true)" -eq 1 ] &&
         printf '%s\n' "${summary}" | grep -Eq "dst_ip ${vip}(/32)?([[:space:]]|$)" &&
         printf '%s\n' "${summary}" | grep -q 'mirred' &&
         printf '%s\n' "${summary}" | grep -qi 'redirect' &&
         printf '%s\n' "${summary}" | grep -Fq "${HANDOFF}"; then
        run_tc tc filter del dev "${WAN}" ingress chain 0 \
          pref "${legacy_pref}" handle 1 flower
        log "interface=${WAN} operation=delete-legacy vip=${vip} pref=${legacy_pref} handle=1 exit=${tc_rc} stderr=${tc_stderr}"
      else
        log "interface=${WAN} operation=legacy-collision-preserved vip=${vip} pref=${legacy_pref} handle=1 exit=1 stderr=not deleting unrelated filter: $(printf '%s' "${summary}" | tr '\n' ' ')"
      fi
    }

    # Call only after inspect_filter. Always inspect again after a mutation;
    # tc's exit code alone does not establish the required postcondition.
    add_filter() {
      add_chain="${1}"
      add_pref="${2}"
      add_handle="${3}"
      add_vip="${4}"
      add_mode="${5}"
      if [ "${add_mode}" = 'redirect' ]; then
        run_tc tc filter add dev "${WAN}" ingress chain "${add_chain}" \
          protocol ip pref "${add_pref}" handle "${add_handle}" flower \
          dst_ip "${add_vip}/32" action mirred egress redirect dev "${HANDOFF}"
      else
        run_tc tc filter add dev "${WAN}" ingress chain "${add_chain}" \
          protocol ip pref "${add_pref}" handle "${add_handle}" flower \
          dst_ip "${add_vip}/32" action goto chain "${CHAIN}"
      fi
      add_rc="${tc_rc}"
      log "interface=${WAN} operation=add-${add_mode} vip=${add_vip} chain=${add_chain} pref=${add_pref} handle=${add_handle} exit=${add_rc} stderr=${tc_stderr}"
      inspect_filter "${add_chain}" "${add_pref}" "${add_handle}" "${add_vip}" "${add_mode}"
      if [ "${filter_state}" = 'desired' ]; then
        return 0
      fi
      log "interface=${WAN} operation=verify-add-${add_mode} vip=${add_vip} chain=${add_chain} pref=${add_pref} handle=${add_handle} exit=1 stderr=postcondition ${filter_state}; add exit ${add_rc}"
      return 1
    }

    delete_filter() {
      delete_chain="${1}"
      delete_pref="${2}"
      delete_handle="${3}"
      delete_vip="${4}"
      delete_mode="${5}"
      run_tc tc filter del dev "${WAN}" ingress chain "${delete_chain}" \
        protocol ip pref "${delete_pref}" handle "${delete_handle}" flower
      delete_rc="${tc_rc}"
      log "interface=${WAN} operation=delete-${delete_mode} vip=${delete_vip} chain=${delete_chain} pref=${delete_pref} handle=${delete_handle} exit=${delete_rc} stderr=${tc_stderr}"
      inspect_filter "${delete_chain}" "${delete_pref}" "${delete_handle}" "${delete_vip}" "${delete_mode}"
      if [ "${filter_state}" = 'absent' ]; then
        return 0
      fi
      log "interface=${WAN} operation=verify-delete-${delete_mode} vip=${delete_vip} chain=${delete_chain} pref=${delete_pref} handle=${delete_handle} exit=1 stderr=postcondition ${filter_state}; delete exit ${delete_rc}"
      return 1
    }

    remove_unverified_entry() {
      inspect_filter "${ENTRY_CHAIN}" "${pref}" "${entry_handle}" "${vip}" 'entry'
      if [ "${filter_state}" = 'desired' ]; then
        delete_filter "${ENTRY_CHAIN}" "${pref}" "${entry_handle}" "${vip}" 'entry' || true
      fi
    }

    reconcile_vip() {
      vip="${1}"
      octet="${vip##*.}"
      pref="$((1000 + octet))"
      redirect_handle="${octet}"
      entry_handle='1'
      if vip_is_owned "${vip}"; then
        inspect_filter "${CHAIN}" "${pref}" "${redirect_handle}" "${vip}" 'redirect'
        case "${filter_state}" in
          desired) ;;
          absent)
            if ! add_filter "${CHAIN}" "${pref}" "${redirect_handle}" "${vip}" 'redirect'; then
              remove_unverified_entry
              return 0
            fi ;;
          *) remove_unverified_entry; return 0 ;;
        esac
        # This also repairs a missing entry beside an existing redirect.
        inspect_filter "${ENTRY_CHAIN}" "${pref}" "${entry_handle}" "${vip}" 'entry'
        case "${filter_state}" in
          desired) ;;
          absent) add_filter "${ENTRY_CHAIN}" "${pref}" "${entry_handle}" "${vip}" 'entry' || true ;;
        esac
      else
        inspect_filter "${ENTRY_CHAIN}" "${pref}" "${entry_handle}" "${vip}" 'entry'
        case "${filter_state}" in
          desired) delete_filter "${ENTRY_CHAIN}" "${pref}" "${entry_handle}" "${vip}" 'entry' || return 0 ;;
          absent) ;;
          *) return 0 ;;
        esac
        inspect_filter "${CHAIN}" "${pref}" "${redirect_handle}" "${vip}" 'redirect'
        if [ "${filter_state}" = 'desired' ]; then
          delete_filter "${CHAIN}" "${pref}" "${redirect_handle}" "${vip}" 'redirect' || true
        fi
      fi
    }

    log "interface=${WAN} operation=diagnostic-qdisc vip=- pref=- handle=- exit=0 stderr=$(tc -s -d qdisc show dev "${WAN}" 2>&1 | tr '\n' ' ')"
    log "interface=${WAN} operation=diagnostic-filter vip=- pref=- handle=- exit=0 stderr=$(tc -s -d filter show dev "${WAN}" ingress 2>&1 | tr '\n' ' ')"
    log "interface=${WAN} operation=diagnostic-filter-json vip=- pref=- handle=- exit=0 stderr=$(tc -j -s -d filter show dev "${WAN}" ingress 2>&1 | tr '\n' ' ')"
    log "interface=${WAN} operation=diagnostic-actions vip=- pref=- handle=- exit=0 stderr=$(tc action ls action mirred 2>&1 | tr '\n' ' ')"
    log "interface=${WAN} operation=diagnostic-addresses vip=- pref=- handle=- exit=0 stderr=$(ip -4 -o addr show dev "${WAN}" scope global 2>&1 | tr '\n' ' ')"

    if ! ensure_clsact; then
      log "interface=${WAN} operation=initialize vip=- pref=- handle=- exit=1 stderr=unable to establish clsact; retrying"
    fi
    ensure_cilium_default_route || true
    ensure_private_routes || true

    while :; do
      ensure_clsact || true
      ensure_cilium_default_route || true
      ensure_private_routes || true
      n="${START}"
      while [ "${n}" -le "${END}" ]; do
        vip="${PREFIX}.${n}"
        reconcile_vip "${vip}"
        cleanup_legacy_vip "${vip}"
        n=$((n + 1))
      done
      sleep "${INTERVAL}"
    done
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-vip
rules:
  - apiGroups: ['']
    resources: ['services', 'endpoints', 'nodes', 'pods']
    verbs: ['get', 'list', 'watch', 'update', 'patch']
  - apiGroups: ['']
    resources: ['services/status']
    verbs: ['update', 'patch']
  - apiGroups: ['discovery.k8s.io']
    resources: ['endpointslices']
    verbs: ['get', 'list', 'watch', 'update']
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['get', 'list', 'watch', 'create', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip-cloud-controller
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-vip-cloud-controller
rules:
  - apiGroups: ['']
    resources: ['configmaps', 'endpoints', 'events', 'services', 'services/status', 'nodes']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['get', 'list', 'watch', 'create', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip-cloud-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip-cloud-controller
subjects:
  - kind: ServiceAccount
    name: kube-vip-cloud-controller
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-vip-cloud-provider
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-cloud-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip-cloud-provider
    spec:
      serviceAccountName: kube-vip-cloud-controller
      containers:
        - name: kube-vip-cloud-provider
          image: {{ .Values.kubeVip.cloudProviderImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ['/kube-vip-cloud-provider', '--leader-elect-resource-name=kube-vip-cloud-controller']
          env:
            - name: KUBEVIP_ENABLE_LOADBALANCERCLASS
              value: 'true'
            - name: KUBEVIP_CUSTOM_LOADBALANCERCLASS_NAME
              value: {{ $class | quote }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
      annotations:
        k8s.v1.cni.cncf.io/networks: {{ list (dict "name" $network.name "interface" (required "kubeVip.interfaceName is required" .Values.kubeVip.interfaceName)) (dict "name" $handoff.networkName "interface" $handoff.interfaceName) | toJson | quote }}
        kube-vip.core-backplane/reconciler-version: {{ $handoff.reconcilerVersion | quote }}
    spec:
      serviceAccountName: kube-vip
      {{- with .Values.kubeVip.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kube-vip
          image: {{ .Values.kubeVip.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ['/kube-vip']
          args: ['manager']
          env:
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: vip_arp
              value: 'true'
            - name: svc_enable
              value: 'true'
            - name: svc_election
              value: 'true'
            - name: vip_interface
              value: {{ .Values.kubeVip.interfaceName | quote }}
            - name: vip_subnet
              value: {{ .Values.kubeVip.vipSubnet | quote }}
            - name: vip_leaseduration
              value: {{ .Values.kubeVip.leaderElection.leaseDuration | quote }}
            - name: vip_renewdeadline
              value: {{ .Values.kubeVip.leaderElection.renewDeadline | quote }}
            - name: vip_retryperiod
              value: {{ .Values.kubeVip.leaderElection.retryPeriod | quote }}
            - name: vip_preserve_on_leadership_loss
              value: {{ .Values.kubeVip.leaderElection.preserveVipOnLeadershipLoss | quote }}
            - name: lb_class_name
              value: {{ $class | quote }}
            - name: lb_class_only
              value: 'true'
            - name: lb_class_legacy_handling
              value: 'false'
            - name: enable_upnp
              value: {{ .Values.kubeVip.upnp.enabled | toString | quote }}
          {{- if $network.resourceName }}
          resources:
            requests:
              {{ $network.resourceName | quote }}: 1
            limits:
              {{ $network.resourceName | quote }}: 1
          {{- end }}
          securityContext:
            capabilities:
              add: ['NET_ADMIN', 'NET_RAW']
        {{- if .Values.kubeVip.debugSidecar.enabled }}
        - name: netshoot
          image: {{ .Values.kubeVip.debugSidecar.image | quote }}
          imagePullPolicy: {{ .Values.kubeVip.debugSidecar.imagePullPolicy | quote }}
          command:
            {{- toYaml .Values.kubeVip.debugSidecar.command | nindent 12 }}
          args:
            {{- toYaml .Values.kubeVip.debugSidecar.args | nindent 12 }}
          {{- with .Values.kubeVip.debugSidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.kubeVip.debugSidecar.securityContext | nindent 12 }}
        {{- end }}
        - name: cilium-handoff
          image: {{ .Values.kubeVip.debugSidecar.image | quote }}
          imagePullPolicy: {{ .Values.kubeVip.debugSidecar.imagePullPolicy | quote }}
          command: ['/bin/sh', '/etc/kube-vip-handoff/reconcile.sh']
          env:
            - name: WAN_INTERFACE
              value: {{ .Values.kubeVip.interfaceName | quote }}
            - name: HANDOFF_INTERFACE
              value: {{ $handoff.interfaceName | quote }}
            - name: CILIUM_INTERFACE
              value: {{ $handoff.ciliumInterfaceName | quote }}
            - name: PRIVATE_ROUTE_CIDRS
              value: {{ join " " $handoff.privateRouteCIDRs | quote }}
            - name: VIP_RANGE
              value: {{ $vipRange | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ $handoff.reconcileInterval | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            capabilities:
              add: ['NET_ADMIN', 'NET_RAW']
          volumeMounts:
            - name: kube-vip-handoff
              mountPath: /etc/kube-vip-handoff
              readOnly: true
      volumes:
        - name: kube-vip-handoff
          configMap:
            name: kube-vip-cilium-handoff
            defaultMode: 0555
      tolerations:
        - operator: Exists
{{- end }}
