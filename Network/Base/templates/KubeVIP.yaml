{{- if .Values.kubeVip.enabled }}
{{- $vipRange := required "kubeVip.vipRange must be a reserved CIDR or IP range when kubeVip.enabled is true" .Values.kubeVip.vipRange }}
{{- $class := required "kubeVip.loadBalancerClass is required when kubeVip.enabled is true" .Values.kubeVip.loadBalancerClass }}
{{- $network := .Values.kubeVip.network }}
{{- $plugin := deepCopy $network.plugin }}
{{- if and .Values.kubeVip.upnp.enabled (empty $plugin.ipam) }}
{{- fail "kubeVip.network.plugin.ipam is required when kubeVip.upnp.enabled is true; each WAN attachment needs a unique address" }}
{{- end }}
{{- if eq $plugin.type "sriov" }}
{{- $_ := set $plugin "spoofchk" "off" }}
{{- end }}
{{- if $network.resourceName }}
{{- else if eq $plugin.type "sriov" }}
{{- fail "kubeVip.network.resourceName is required for an SR-IOV network" }}
{{- end }}
{{- $config := merge (dict "cniVersion" "1.0.0" "name" $network.name) $plugin }}
{{- $handoff := required "kubeVip.handoff is required when kubeVip.enabled is true" .Values.kubeVip.handoff }}
{{- if not (contains "-" $vipRange) }}
{{- fail "kubeVip.vipRange must use start-end notation for the handoff reconciler" }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kubevip
  namespace: kube-system
data:
  range-global: {{ $vipRange | quote }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ required "kubeVip.network.name is required" $network.name }}
  namespace: kube-system
  {{- if $network.resourceName }}
  annotations:
    k8s.v1.cni.cncf.io/resourceName: {{ $network.resourceName | quote }}
  {{- end }}
spec:
  config: {{ $config | toJson | quote }}
---
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: {{ required "kubeVip.handoff.networkName is required" $handoff.networkName }}
  namespace: kube-system
spec:
  config: {{ dict "cniVersion" "1.0.0" "name" $handoff.networkName "type" "bridge" "bridge" (required "kubeVip.handoff.bridgeName is required" $handoff.bridgeName) "isGateway" false "ipMasq" false "hairpinMode" true "promiscMode" true "ipam" (dict "type" "none") | toJson | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-vip-cilium-handoff
  namespace: kube-system
data:
  reconcile.sh: |
    #!/bin/sh
    set -u

    CHAIN="100"
    WAN="${WAN_INTERFACE}"
    HANDOFF="${HANDOFF_INTERFACE}"
    RANGE="${VIP_RANGE}"
    INTERVAL="${RECONCILE_INTERVAL}"
    START_IP="${RANGE%-*}"
    PREFIX="${START_IP%.*}"
    START="${START_IP##*.}"
    END="${RANGE##*.}"

    timestamp() {
      date -u '+%Y-%m-%dT%H:%M:%SZ'
    }

    log() {
      echo "$(timestamp) handoff reconcile: $*"
    }

    tc_stderr=''
    tc_rc=0

    run_tc() {
      tc_stderr=''
      # Preserve the read-only root filesystem: redirect stdout away first,
      # then capture stderr from the TC operation in the command substitution.
      tc_stderr="$("$@" 2>&1 >/dev/null)"
      tc_rc=$?
      tc_stderr="$(printf '%s' "${tc_stderr}" | tr '\n' ' ')"
      return 0
    }

    ensure_clsact() {
      qdisc="$(tc qdisc show dev "${WAN}" 2>&1)"
      qdisc_rc=$?
      log "interface=${WAN} operation=show-qdisc vip=- pref=- handle=- exit=${qdisc_rc} stderr=$(printf '%s' "${qdisc}" | tr '\n' ' ')"
      if [ "${qdisc_rc}" -eq 0 ] && printf '%s\n' "${qdisc}" | grep -qE '(^| )qdisc clsact '; then
        return 0
      fi

      run_tc tc qdisc add dev "${WAN}" clsact
      log "interface=${WAN} operation=add-clsact vip=- pref=- handle=- exit=${tc_rc} stderr=${tc_stderr}"
      if [ "${tc_rc}" -eq 0 ]; then
        return 0
      fi

      # EEXIST is recoverable only after the postcondition is true.
      qdisc="$(tc qdisc show dev "${WAN}" 2>&1)"
      if printf '%s\n' "${qdisc}" | grep -qE '(^| )qdisc clsact '; then
        log "interface=${WAN} operation=verify-clsact vip=- pref=- handle=- exit=0 stderr=add returned EEXIST but clsact is present"
        return 0
      fi
      log "interface=${WAN} operation=verify-clsact vip=- pref=- handle=- exit=1 stderr=clsact missing after add failure: $(printf '%s' "${qdisc}" | tr '\n' ' ')"
      return 1
    }

    vip_is_owned() {
      ip -4 -o addr show dev "${WAN}" scope global 2>/dev/null |
        awk '{print $4}' | cut -d/ -f1 | grep -Fxq "${1}"
    }

    filter_summary() {
      tc filter show dev "${WAN}" ingress chain "${CHAIN}" pref "${1}" handle "${2}" 2>&1
    }

    legacy_filter_summary() {
      tc filter show dev "${WAN}" ingress chain 0 pref "${1}" handle 1 2>&1
    }

    filter_is_desired() {
      summary="${1}"
      printf '%s\n' "${summary}" | grep -q 'flower' || return 1
      printf '%s\n' "${summary}" | grep -Eq "dst_ip ${3}(/32)?([[:space:]]|$)" || return 1
      printf '%s\n' "${summary}" | grep -q 'mirred' || return 1
      printf '%s\n' "${summary}" | grep -q 'redirect' || return 1
      printf '%s\n' "${summary}" | grep -q "${HANDOFF}" || return 1
    }

    cleanup_legacy_vip() {
      vip="${1}"
      octet="${vip##*.}"
      legacy_pref="$((100 + octet))"
      summary="$(legacy_filter_summary "${legacy_pref}")"
      show_rc=$?
      [ "${show_rc}" -eq 0 ] && [ -n "${summary}" ] || return 0
      if filter_is_desired "${summary}" "${legacy_pref}" "${vip}"; then
        run_tc tc filter del dev "${WAN}" ingress chain 0 \
          pref "${legacy_pref}" handle 1
        log "interface=${WAN} operation=delete-legacy vip=${vip} pref=${legacy_pref} handle=1 exit=${tc_rc} stderr=${tc_stderr}"
      else
        log "interface=${WAN} operation=legacy-collision-preserved vip=${vip} pref=${legacy_pref} handle=1 exit=1 stderr=not deleting unrelated filter: $(printf '%s' "${summary}" | tr '\n' ' ')"
      fi
    }

    reconcile_vip() {
      vip="${1}"
      octet="${vip##*.}"
      pref="$((1000 + octet))"
      handle="${octet}"
      desired=false
      if vip_is_owned "${vip}"; then
        desired=true
      fi

      summary="$(filter_summary "${pref}" "${handle}")"
      show_rc=$?
      actual=false
      if [ "${show_rc}" -eq 0 ] && [ -n "${summary}" ]; then
        actual=true
      fi
      log "interface=${WAN} operation=inspect vip=${vip} pref=${pref} handle=${handle} exit=${show_rc} stderr=$(printf '%s' "${summary}" | tr '\n' ' ') desired=${desired} actual=${actual}"

      if [ "${desired}" = true ] && [ "${actual}" = false ]; then
        run_tc tc filter replace dev "${WAN}" ingress chain "${CHAIN}" \
          pref "${pref}" handle "${handle}" protocol ip flower \
          dst_ip "${vip}/32" \
          action mirred egress redirect dev "${HANDOFF}"
        log "interface=${WAN} operation=replace vip=${vip} pref=${pref} handle=${handle} exit=${tc_rc} stderr=${tc_stderr}"
        if [ "${tc_rc}" -ne 0 ]; then
          verify="$(filter_summary "${pref}" "${handle}")"
          if filter_is_desired "${verify}" "${pref}" "${vip}"; then
            log "interface=${WAN} operation=verify-after-replace vip=${vip} pref=${pref} handle=${handle} exit=0 stderr=existing filter is already desired"
          else
            log "interface=${WAN} operation=collision vip=${vip} pref=${pref} handle=${handle} exit=${tc_rc} stderr=${tc_stderr} existing_filter=$(printf '%s' "${verify}" | tr '\n' ' ')"
          fi
        fi
        return 0
      fi

      if [ "${desired}" = true ] && [ "${actual}" = true ]; then
        if filter_is_desired "${summary}" "${pref}" "${vip}"; then
          log "interface=${WAN} operation=keep vip=${vip} pref=${pref} handle=${handle} exit=0 stderr=already desired"
        else
          log "interface=${WAN} operation=collision vip=${vip} pref=${pref} handle=${handle} exit=1 stderr=managed identity contains another filter: $(printf '%s' "${summary}" | tr '\n' ' ')"
        fi
        return 0
      fi

      if [ "${desired}" = false ] && [ "${actual}" = true ]; then
        if filter_is_desired "${summary}" "${pref}" "${vip}"; then
          run_tc tc filter del dev "${WAN}" ingress chain "${CHAIN}" \
            pref "${pref}" handle "${handle}"
          log "interface=${WAN} operation=delete vip=${vip} pref=${pref} handle=${handle} exit=${tc_rc} stderr=${tc_stderr}"
        else
          log "interface=${WAN} operation=collision-preserved vip=${vip} pref=${pref} handle=${handle} exit=1 stderr=not deleting unrelated filter: $(printf '%s' "${summary}" | tr '\n' ' ')"
        fi
      fi
    }

    log "interface=${WAN} operation=diagnostic-qdisc vip=- pref=- handle=- exit=0 stderr=$(tc -s -d qdisc show dev "${WAN}" 2>&1 | tr '\n' ' ')"
    log "interface=${WAN} operation=diagnostic-filter vip=- pref=- handle=- exit=0 stderr=$(tc -s -d filter show dev "${WAN}" ingress 2>&1 | tr '\n' ' ')"
    log "interface=${WAN} operation=diagnostic-filter-json vip=- pref=- handle=- exit=0 stderr=$(tc -j -s -d filter show dev "${WAN}" ingress 2>&1 | tr '\n' ' ')"
    log "interface=${WAN} operation=diagnostic-actions vip=- pref=- handle=- exit=0 stderr=$(tc action ls action mirred 2>&1 | tr '\n' ' ')"
    log "interface=${WAN} operation=diagnostic-addresses vip=- pref=- handle=- exit=0 stderr=$(ip -4 -o addr show dev "${WAN}" scope global 2>&1 | tr '\n' ' ')"

    if ! ensure_clsact; then
      log "interface=${WAN} operation=initialize vip=- pref=- handle=- exit=1 stderr=unable to establish clsact; retrying"
    fi

    while :; do
      ensure_clsact || true
      n="${START}"
      while [ "${n}" -le "${END}" ]; do
        vip="${PREFIX}.${n}"
        reconcile_vip "${vip}"
        cleanup_legacy_vip "${vip}"
        n=$((n + 1))
      done
      sleep "${INTERVAL}"
    done
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-vip
rules:
  - apiGroups: ['']
    resources: ['services', 'endpoints', 'nodes', 'pods']
    verbs: ['get', 'list', 'watch', 'update', 'patch']
  - apiGroups: ['']
    resources: ['services/status']
    verbs: ['update', 'patch']
  - apiGroups: ['discovery.k8s.io']
    resources: ['endpointslices']
    verbs: ['get', 'list', 'watch', 'update']
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['get', 'list', 'watch', 'create', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip
subjects:
  - kind: ServiceAccount
    name: kube-vip
    namespace: kube-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-vip-cloud-controller
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kube-vip-cloud-controller
rules:
  - apiGroups: ['']
    resources: ['configmaps', 'endpoints', 'events', 'services', 'services/status', 'nodes']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
  - apiGroups: ['coordination.k8s.io']
    resources: ['leases']
    verbs: ['get', 'list', 'watch', 'create', 'update']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kube-vip-cloud-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kube-vip-cloud-controller
subjects:
  - kind: ServiceAccount
    name: kube-vip-cloud-controller
    namespace: kube-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-vip-cloud-provider
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip-cloud-provider
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip-cloud-provider
    spec:
      serviceAccountName: kube-vip-cloud-controller
      containers:
        - name: kube-vip-cloud-provider
          image: {{ .Values.kubeVip.cloudProviderImage | quote }}
          imagePullPolicy: IfNotPresent
          command: ['/kube-vip-cloud-provider', '--leader-elect-resource-name=kube-vip-cloud-controller']
          env:
            - name: KUBEVIP_ENABLE_LOADBALANCERCLASS
              value: 'true'
            - name: KUBEVIP_CUSTOM_LOADBALANCERCLASS_NAME
              value: {{ $class | quote }}
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-vip
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-vip
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-vip
      annotations:
        k8s.v1.cni.cncf.io/networks: {{ list (dict "name" $network.name "interface" (required "kubeVip.interfaceName is required" .Values.kubeVip.interfaceName)) (dict "name" $handoff.networkName "interface" $handoff.interfaceName) | toJson | quote }}
    spec:
      serviceAccountName: kube-vip
      {{- with .Values.kubeVip.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: kube-vip
          image: {{ .Values.kubeVip.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ['/kube-vip']
          args: ['manager']
          env:
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: vip_arp
              value: 'true'
            - name: svc_enable
              value: 'true'
            - name: svc_election
              value: 'true'
            - name: vip_interface
              value: {{ .Values.kubeVip.interfaceName | quote }}
            - name: vip_subnet
              value: {{ .Values.kubeVip.vipSubnet | quote }}
            - name: vip_leaseduration
              value: {{ .Values.kubeVip.leaderElection.leaseDuration | quote }}
            - name: vip_renewdeadline
              value: {{ .Values.kubeVip.leaderElection.renewDeadline | quote }}
            - name: vip_retryperiod
              value: {{ .Values.kubeVip.leaderElection.retryPeriod | quote }}
            - name: vip_preserve_on_leadership_loss
              value: {{ .Values.kubeVip.leaderElection.preserveVipOnLeadershipLoss | quote }}
            - name: lb_class_name
              value: {{ $class | quote }}
            - name: lb_class_only
              value: 'true'
            - name: lb_class_legacy_handling
              value: 'false'
            - name: enable_upnp
              value: {{ .Values.kubeVip.upnp.enabled | toString | quote }}
          {{- if $network.resourceName }}
          resources:
            requests:
              {{ $network.resourceName | quote }}: 1
            limits:
              {{ $network.resourceName | quote }}: 1
          {{- end }}
          securityContext:
            capabilities:
              add: ['NET_ADMIN', 'NET_RAW']
        {{- if .Values.kubeVip.debugSidecar.enabled }}
        - name: netshoot
          image: {{ .Values.kubeVip.debugSidecar.image | quote }}
          imagePullPolicy: {{ .Values.kubeVip.debugSidecar.imagePullPolicy | quote }}
          command:
            {{- toYaml .Values.kubeVip.debugSidecar.command | nindent 12 }}
          args:
            {{- toYaml .Values.kubeVip.debugSidecar.args | nindent 12 }}
          {{- with .Values.kubeVip.debugSidecar.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.kubeVip.debugSidecar.securityContext | nindent 12 }}
        {{- end }}
        - name: cilium-handoff
          image: {{ .Values.kubeVip.debugSidecar.image | quote }}
          imagePullPolicy: {{ .Values.kubeVip.debugSidecar.imagePullPolicy | quote }}
          command: ['/bin/sh', '/etc/kube-vip-handoff/reconcile.sh']
          env:
            - name: WAN_INTERFACE
              value: {{ .Values.kubeVip.interfaceName | quote }}
            - name: HANDOFF_INTERFACE
              value: {{ $handoff.interfaceName | quote }}
            - name: VIP_RANGE
              value: {{ $vipRange | quote }}
            - name: RECONCILE_INTERVAL
              value: {{ $handoff.reconcileInterval | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: false
            capabilities:
              add: ['NET_ADMIN', 'NET_RAW']
          volumeMounts:
            - name: kube-vip-handoff
              mountPath: /etc/kube-vip-handoff
              readOnly: true
      volumes:
        - name: kube-vip-handoff
          configMap:
            name: kube-vip-cilium-handoff
            defaultMode: 0555
      tolerations:
        - operator: Exists
{{- end }}
