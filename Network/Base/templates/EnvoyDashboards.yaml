{{- if .Values.envoyMonitoring.dashboards.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: 'grafana-dashboard-envoy'
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: 'true'
  annotations:
    grafana_folder: 'Envoy'
    k8s-sidecar-target-directory: 'Envoy'
data:
  envoy-gateway-overview.url: |-
    https://grafana.com/api/dashboards/24460/revisions/1/download
  envoy-overview.url: |-
    https://grafana.com/api/dashboards/24459/revisions/3/download
{{- end }}
