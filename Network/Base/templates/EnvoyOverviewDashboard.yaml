apiVersion: v1
kind: ConfigMap
metadata:
  name: 'envoy-dashboards'
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: 'true'
  annotations:
    grafana_folder: 'Envoy'
    k8s-sidecar-target-directory: 'Envoy'
data:
  envoy-overview.url: |-
    https://grafana.com/api/dashboards/24459/revisions/3/download
  envoy-upstream.url: |-
    https://grafana.com/api/dashboards/24457/revisions/4/download
  envoy-downstream.url: |-
    https://grafana.com/api/dashboards/24458/revisions/3/download
