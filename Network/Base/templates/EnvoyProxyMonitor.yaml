apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: 'envoy-proxy'
  namespace: 'kube-system'
  labels:
    app.kubernetes.io/part-of: 'core-network-base'
spec:
  namespaceSelector:
    matchNames:
      - 'kube-system'
  selector:
    matchLabels:
      app.kubernetes.io/component: 'proxy'
      app.kubernetes.io/managed-by: 'envoy-gateway'
      app.kubernetes.io/name: 'envoy'
      gateway.envoyproxy.io/owning-gateway-name: 'main-gw'
      gateway.envoyproxy.io/owning-gateway-namespace: 'core-prod'
  podMetricsEndpoints:
    - port: 'metrics'
      path: '/stats/prometheus'
      interval: '30s'
      scrapeTimeout: '10s'
