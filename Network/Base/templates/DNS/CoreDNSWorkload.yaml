{{- if .Values.kubeDNS.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: 'coredns'
  namespace: 'kube-system'
  annotations:
    argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    argocd.argoproj.io/sync-wave: '-4'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: 'system:coredns'
  labels:
    kubernetes.io/bootstrapping: 'rbac-defaults'
  annotations:
    argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    argocd.argoproj.io/sync-wave: '-4'
rules:
  - apiGroups: ['']
    resources: ['endpoints', 'services', 'pods', 'namespaces']
    verbs: ['list', 'watch']
  - apiGroups: ['discovery.k8s.io']
    resources: ['endpointslices']
    verbs: ['list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: 'system:coredns'
  labels:
    kubernetes.io/bootstrapping: 'rbac-defaults'
  annotations:
    argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    argocd.argoproj.io/sync-wave: '-4'
roleRef:
  apiGroup: 'rbac.authorization.k8s.io'
  kind: ClusterRole
  name: 'system:coredns'
subjects:
  - kind: ServiceAccount
    name: 'coredns'
    namespace: 'kube-system'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 'coredns'
  namespace: 'kube-system'
  labels:
    k8s-app: 'kube-dns'
    kubernetes.io/name: 'CoreDNS'
  annotations:
    argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    argocd.argoproj.io/sync-wave: '-3'
spec:
  replicas: {{ .Values.kubeDNS.replicas }}
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      k8s-app: 'kube-dns'
  strategy:
    type: 'RollingUpdate'
    rollingUpdate:
      maxSurge: '25%'
      maxUnavailable: 1
  template:
    metadata:
      labels:
        k8s-app: 'kube-dns'
    spec:
      serviceAccountName: 'coredns'
      priorityClassName: 'system-cluster-critical'
      dnsPolicy: 'Default'
      terminationGracePeriodSeconds: 30
      nodeSelector:
        kubernetes.io/os: 'linux'
      tolerations:
        - key: 'node-role.kubernetes.io/control-plane'
          operator: 'Exists'
          effect: 'NoSchedule'
        - key: 'node.cloudprovider.kubernetes.io/uninitialized'
          operator: 'Exists'
          effect: 'NoSchedule'
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: 'k8s-app'
                      operator: 'In'
                      values: ['kube-dns']
                topologyKey: 'kubernetes.io/hostname'
      containers:
        - name: 'coredns'
          image: {{ required "kubeDNS.image must preserve the site's pinned CoreDNS image" .Values.kubeDNS.image | squote }}
          imagePullPolicy: 'IfNotPresent'
          args: ['-conf', '/etc/coredns/Corefile']
          env:
            - name: 'GOMEMLIMIT'
              value: '161MiB'
            {{- with .Values.kubeDNS.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: 'dns'
              containerPort: 53
              protocol: 'UDP'
            - name: 'dns-tcp'
              containerPort: 53
              protocol: 'TCP'
            - name: 'metrics'
              containerPort: 9153
              protocol: 'TCP'
          resources:
            {{- toYaml .Values.kubeDNS.resources | nindent 12 }}
          {{- with .Values.kubeDNS.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.kubeDNS.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              add: ['NET_BIND_SERVICE']
              drop: ['ALL']
          volumeMounts:
            - name: 'config-volume'
              mountPath: '/etc/coredns'
              readOnly: true
      volumes:
        - name: 'config-volume'
          configMap:
            name: 'coredns'
            defaultMode: 420
            items:
              - key: 'Corefile'
                path: 'Corefile'
{{- end }}
