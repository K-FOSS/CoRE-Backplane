{{- if .Values.kubeDNS.enabled }}
{{- $domain := required "kubeDNS.clusterDomain is required when kubeDNS.enabled is true" .Values.kubeDNS.clusterDomain }}
{{- if not (regexMatch "^[a-z0-9]+([.-][a-z0-9]+)*$" $domain) }}
{{- fail "kubeDNS.clusterDomain must be a DNS domain without whitespace or Corefile directives" }}
{{- end }}
{{- if empty .Values.kubeDNS.upstreams }}
{{- fail "kubeDNS.upstreams must contain at least one resolver" }}
{{- end }}
{{- if .Values.kubeDNS.tracing.enabled }}
{{- if empty .Values.kubeDNS.tracing.endpoint }}
{{- fail "kubeDNS.tracing.endpoint is required when tracing is enabled" }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9.-]+:[0-9]+$" .Values.kubeDNS.tracing.endpoint) }}
{{- fail "kubeDNS.tracing.endpoint must be a DNS hostname and port" }}
{{- end }}
{{- if lt (int .Values.kubeDNS.tracing.every) 1 }}
{{- fail "kubeDNS.tracing.every must be at least one" }}
{{- end }}
{{- if not (regexMatch "^[A-Za-z0-9_.-]+$" .Values.kubeDNS.tracing.service) }}
{{- fail "kubeDNS.tracing.service must be a CoreDNS service name" }}
{{- end }}
{{- end }}
{{- range .Values.kubeDNS.upstreams }}
{{- if not (regexMatch "^[0-9a-fA-F:.]+$" .) }}
{{- fail "kubeDNS.upstreams entries must be resolver IP addresses" }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: 'coredns'
  namespace: 'kube-system'
  annotations:
    argocd.argoproj.io/sync-options: 'Prune=false,Delete=false'
    argocd.argoproj.io/sync-wave: '-4'
data:
  Corefile: |-
    .:53 {
        errors
        {{- if .Values.kubeDNS.tracing.enabled }}
        trace zipkin {{ .Values.kubeDNS.tracing.endpoint }} {
            every {{ .Values.kubeDNS.tracing.every }}
            service {{ .Values.kubeDNS.tracing.service }}
        }
        {{- end }}
        health {
            lameduck 5s
        }
        ready
        log . {
            class error
        }
        prometheus :9153
        kubernetes cluster.local {{ $domain }} in-addr.arpa ip6.arpa {
            pods insecure
            {{- if .Values.kubeDNS.forwardUnmatchedClusterDomain }}
            fallthrough in-addr.arpa ip6.arpa {{ $domain }}
            {{- else }}
            fallthrough in-addr.arpa ip6.arpa
            {{- end }}
            ttl 30
        }
        fanout . {{ join " " .Values.kubeDNS.upstreams }} {
            network UDP
        }
        cache 300 {
            disable success {{ $domain }}
            disable denial {{ $domain }}
        }
        loop
        reload
        loadbalance
    }
{{- end }}
