{{- if and .Values.kubeDNS.enabled .Values.kubeDNS.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: 'coredns'
  namespace: {{ .Release.Namespace }}
  {{- with .Values.kubeDNS.monitoring.serviceMonitor.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  namespaceSelector:
    matchNames: ['kube-system']
  selector:
    matchLabels:
      k8s-app: 'kube-dns'
  endpoints:
    - port: 'metrics'
      path: '/metrics'
      interval: {{ .Values.kubeDNS.monitoring.serviceMonitor.interval | squote }}
      scrapeTimeout: {{ .Values.kubeDNS.monitoring.serviceMonitor.scrapeTimeout | squote }}
{{- end }}
