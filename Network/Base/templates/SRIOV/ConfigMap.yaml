{{- $resourceList := .Values.sriovDevicePlugin.resourceList }}
{{- if empty $resourceList }}
{{- fail "sriovDevicePlugin.resourceList must contain at least one SR-IOV resource pool" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: sriovdp-config
  namespace: kube-system
data:
  config.json: |
    {{- dict "resourceList" $resourceList | toPrettyJson | nindent 4 }}
