apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization


resources:
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/refs/tags/v4.3.0/deployments/multus-daemonset-thick.yml
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-dynamic-networks-controller/refs/heads/main/manifests/dynamic-networks-controller.yaml
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/sriov-cni/refs/heads/master/images/sriov-cni-daemonset.yaml
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/sriov-network-device-plugin/refs/heads/master/deployments/sriovdp-daemonset.yaml


patches:
  - target:
      kind: DaemonSet
      name: kube-sriov-device-plugin

    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-sriov-device-plugin
      spec:
        template:
          spec:
            containers:
              - name: kube-sriovdp
                resources:
                  requests:
                    cpu: 16m

  - target:
      kind: CustomResourceDefinition
      name: network-attachment-definitions.k8s.cni.cncf.io 
      labelSelector: 'app.kubernetes.io/name=prometheus-smartctl-exporter'

    patch: |
      $patch: delete
      kind: CustomResourceDefinition
      metadata:
        name: DOES NOT MATTER
