apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # renovate: datasource=github-releases depName=k8snetworkplumbingwg/multus-cni
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/refs/tags/v4.3.1/deployments/multus-daemonset-thick.yml
  # renovate: datasource=git-refs depName=k8snetworkplumbingwg/multus-dynamic-networks-controller
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-dynamic-networks-controller/refs/heads/main/manifests/dynamic-networks-controller.yaml
  # renovate: datasource=git-refs depName=k8snetworkplumbingwg/sriov-cni
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/sriov-cni/refs/heads/master/images/sriov-cni-daemonset.yaml
  # renovate: datasource=github-releases depName=k8snetworkplumbingwg/sriov-network-device-plugin
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/sriov-network-device-plugin/refs/tags/v3.11.0/deployments/sriovdp-daemonset.yaml

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: multus-daemon-config
      namespace: kube-system
    patch: |
      - op: replace
        path: /data/daemon-config.json
        value: |
          {
              "chrootDir": "/hostroot",
              "cniVersion": "1.0.0",
              "logLevel": "verbose",
              "logToStderr": true,
              "cniConfigDir": "/host/etc/cni/net.d",
              "multusAutoconfigDir": "/host/etc/cni/net.d",
              "multusConfigFile": "auto",
              "delegates": [
                {
                  "cniVersion": "1.0.0",
                  "name": "cilium",
                  "plugins": [
                    {
                      "type": "cilium-cni",
                      "log-file": "/var/run/cilium/cilium-cni.log"
                    },
                    {
                      "type": "loopback"
                    }
                  ]
                }
              ],
              "socketDir": "/host/run/multus/"
          }

  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: kube-sriov-device-plugin
      namespace: kube-system
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-sriov-device-plugin
      spec:
        template:
          spec:
            containers:
              - name: kube-sriovdp
                image: 'ghcr.io/k8snetworkplumbingwg/sriov-network-device-plugin:v3.11.0@sha256:7c5901727d4500f103f038c178b41dc6450afa6f324306c1973495c9a7c4f5a5'
                resources:
                  requests:
                    cpu: 16m

  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: kube-sriov-cni-ds
      namespace: kube-system
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-sriov-cni-ds
      spec:
        template:
          spec:
            containers:
              - name: kube-sriov-cni
                resources:
                  requests:
                    cpu: 16m
