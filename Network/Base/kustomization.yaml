apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # renovate: datasource=github-releases depName=k8snetworkplumbingwg/multus-cni
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-cni/refs/tags/v4.3.0/deployments/multus-daemonset-thick.yml
  # renovate: datasource=git-refs depName=k8snetworkplumbingwg/multus-dynamic-networks-controller
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/multus-dynamic-networks-controller/refs/heads/main/manifests/dynamic-networks-controller.yaml
  # renovate: datasource=git-refs depName=k8snetworkplumbingwg/sriov-cni
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/sriov-cni/refs/heads/master/images/sriov-cni-daemonset.yaml
  # renovate: datasource=git-refs depName=k8snetworkplumbingwg/sriov-network-device-plugin
  - https://raw.githubusercontent.com/k8snetworkplumbingwg/sriov-network-device-plugin/refs/heads/master/deployments/sriovdp-daemonset.yaml

patches:
  - target:
      version: v1
      kind: ConfigMap
      name: multus-daemon-config
      namespace: kube-system
    patch: |
      - op: replace
        path: /data/daemon-config.json
        value: |
          {
              "chrootDir": "/hostroot",
              "cniVersion": "1.0.0",
              "logLevel": "verbose",
              "logToStderr": true,
              "cniConfigDir": "/host/etc/cni/net.d",
              "multusAutoconfigDir": "/host/etc/cni/net.d",
              "multusConfigFile": "auto",
              "socketDir": "/host/run/multus/"
          }

  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: kube-sriov-device-plugin
      namespace: kube-system
    patch: |
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: kube-sriov-device-plugin
      spec:
        template:
          spec:
            containers:
              - name: kube-sriovdp
                resources:
                  requests:
                    cpu: 16m
