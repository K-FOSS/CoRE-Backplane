                - hw-address: '74:ac:b9:a4:f9:45'
                  hostname: 'cpe-sw2'
                  ip-address: '172.31.193.38'
        - authoritative: false
          name: 'management.dc1.yxl.resolvemy.host'
          match-client-id: false
          option-data: []
