# Site defaults for the IPAM rendering unit. The owning ApplicationSet injects
# cluster-specific identity, boot-server, storage, enablement, and Redis values:
# ../../Apps/Network/IPAM.yaml
#
# Upstream values references:
# - bjw-s common library 5.0.1:
#   https://github.com/bjw-s-labs/helm-charts/tree/common-5.0.1/charts/library/common
# - NetBox chart 8.3.51:
#   https://github.com/netbox-community/netbox-chart/tree/netbox-8.3.51/charts/netbox

# Hub clusters create and push service identities; spoke clusters only consume
# the resulting secrets. The owning ApplicationSet enables hub mode for Home1.
hub: false

datacenter: 'dc1'
region: 'yxl'

cluster:
  name: 'k8s'
  domain: 'cluster.local'

# The bjw-s loader dereferences this parent-chart map before applying its own
# dependency defaults, so it must exist even when it has no site overrides.
global: {}

# ISC Kea 3.2 documentation: https://kea.readthedocs.io/en/kea-3.2.0/
# Tinkerbell iPXE boot flow: https://tinkerbell.org/docs/services/hegel/#ipxe
dhcp:
  enabled: true
  servers:
    dhcp4: true
    dhcp6: true
    dhcpDdns: true
  # The owning ApplicationSet replaces the domain for each target. `psql` is
  # the cluster-local Service selecting the site's PGPool replicas.
  database:
    host: 'psql.core-prod.svc.cluster.local'
  unifi:
    address: '24.86.197.63'
  bmps:
    tinkerbell:
      address:
        public: '66.165.222.115'
        private: '10.1.1.66'
    tftp:
      pxe:
        address: '66.165.222.115'
        path: 'undionly.kpxe'
      efi:
        address: '10.44.5.76'
        path: 'images/ipxe.efi'
  # Native Kea Dhcp4 configuration. Add shared networks, subnet4 entries,
  # pools, options, and reservations here. The chart injects site-specific boot
  # classes and the secret-backed lease database before rendering strict JSON.
  dhcp4:
      authoritative: false
      client-classes: []
      control-socket:
        socket-name: 'kea4-ctrl-socket'
        socket-type: 'unix'
      ddns-override-client-update: true
      ddns-override-no-update: true
      ddns-qualifying-suffix: 'resolvemy.host.'
      ddns-replace-client-name: 'when-not-present'
      ddns-send-updates: true
      ddns-update-on-renew: true
      ddns-conflict-resolution-mode: 'check-with-dhcid'
      decline-probation-period: 86400
      dhcp-ddns:
        enable-updates: true
        max-queue-size: 1024
        ncr-format: 'JSON'
        ncr-protocol: 'UDP'
        sender-ip: '127.0.0.1'
        sender-port: 0
        server-ip: '127.0.0.1'
        server-port: 53001
      echo-client-id: false
      expired-leases-processing:
        flush-reclaimed-timer-wait-time: 900
        hold-reclaimed-time: 3600
        max-reclaim-leases: 100
        max-reclaim-time: 250
        reclaim-timer-wait-time: 900
        unwarned-reclaim-cycles: 5
      hooks-libraries:
        - library: '/usr/lib/x86_64-linux-gnu/kea/hooks/libdhcp_pgsql.so'
      hosts-databases: []
      host-reservation-identifiers:
        - 'hw-address'
      interfaces-config:
        interfaces:
          - '*'
        dhcp-socket-type: 'udp'
        outbound-interface: 'use-routing'
        re-detect: false
      ip-reservations-unique: true
      option-def:
        - name: 'unifi-address'
          code: 1
          space: 'ubnt'
          type: 'ipv4-address'
      rebind-timer: 64800
      renew-timer: 21600
      valid-lifetime: 86400
      min-valid-lifetime: 3600
      max-valid-lifetime: 86400
      store-extended-info: true
      statistic-default-sample-count: 100
      statistic-default-sample-age: 60
      multi-threading:
        enable-multi-threading: true
        thread-pool-size: 2
        packet-queue-size: 64
      sanity-checks:
        lease-checks: 'warn'
      shared-networks:
        - authoritative: false
          name: 'spine0.home2.resolvemy.host'
          match-client-id: false
          option-data: []
          ddns-qualifying-suffix: 'home2.resolvemy.host.'
          relay:
            ip-addresses:
              - '172.31.193.16'
              - '172.31.193.254'
          store-extended-info: true
          subnet4:
            - id: 2001
              subnet: '172.31.193.0/24'
              match-client-id: false
              server-hostname: 'dhcp.resolvemy.host'
              option-data:
