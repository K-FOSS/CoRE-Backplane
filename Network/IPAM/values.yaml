# Site defaults for the IPAM rendering unit. The owning ApplicationSet injects
# cluster-specific identity, boot-server, storage, enablement, and Redis values:
# ../../Apps/Network/IPAM.yaml
#
# Upstream values references:
# - bjw-s common library 3.6.1:
#   https://github.com/bjw-s-labs/helm-charts/tree/common-3.6.1/charts/library/common
# - NetBox chart 5.0.23:
#   https://github.com/netbox-community/netbox-chart/tree/netbox-5.0.23/charts/netbox

# Hub clusters create and push service identities; spoke clusters only consume
# the resulting secrets. The owning ApplicationSet enables hub mode for Home1.
hub: false

datacenter: 'dc1'
region: 'yxl'

cluster:
  name: 'k8s'
  domain: 'cluster.local'

# The bjw-s loader dereferences this parent-chart map before applying its own
# dependency defaults, so it must exist even when it has no site overrides.
global: {}

# ISC Kea documentation: https://kea.readthedocs.io/en/latest/
# Tinkerbell iPXE boot flow: https://tinkerbell.org/docs/services/hegel/#ipxe
dhcp:
  enabled: true
  servers:
    dhcp4: true
    dhcp6: true
    dhcpDdns: true
  # The owning ApplicationSet replaces the domain for each target. `psql` is
  # the cluster-local Service selecting the site's PGPool replicas.
  database:
    host: 'psql.core-prod.svc.cluster.local'
  unifi:
    address: '24.86.197.63'
  bmps:
    tinkerbell:
      address:
        public: '66.165.222.115'
        private: '10.1.1.66'
    tftp:
      pxe:
        address: '66.165.222.115'
        path: 'undionly.kpxe'
      efi:
        address: '10.44.5.76'
        path: 'images/ipxe.efi'
  networks:
    - name: 'spine0.dc1.resolvemy.host'
      domain: 'k0s.dc1.resolvemy.host'

defaultPodOptions:
  labels:
    logs: 'loki-myloginspace'

env: 'prod'

# Gateway API HTTPRoute reference:
# https://gateway-api.sigs.k8s.io/api-types/httproute/
gateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

# Workloads below are rendered by the bjw-s common library.
controllers:
  main:
    strategy: 'RollingUpdate'
    containers:
      dhcp:
        # Site-specific Kea build. The mutable tag and Always policy are
        # intentional until this image is published with immutable releases.
        image:
          repository: 'kristianfjones/kea'
          tag: 'vps1-core'
          pullPolicy: 'Always'
        command:
          - '/usr/local/bin/entry.sh'
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - '/Healthcheck.sh'
              failureThreshold: 6
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 10
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - '/Healthcheck.sh'
              failureThreshold: 6
              initialDelaySeconds: 5
              periodSeconds: 30
              timeoutSeconds: 10
          startup:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - '/Healthcheck.sh'
              failureThreshold: 30
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 10

      # PowerDNS authoritative server documentation:
      # https://doc.powerdns.com/authoritative/
      ns:
        image:
          repository: 'powerdns/pdns-auth-51'
          tag: '5.1.3@sha256:f976e753a1de8ec62636203ecb12ae5fa3d1055601be167de53f1f673e0abe59'
          pullPolicy: 'IfNotPresent'
        command:
          - '/usr/local/sbin/pdns_server'
        args:
          - '--config-dir=/etc/pdns'
          - '--disable-syslog=yes'
          - '--socket-dir=/tmp'
          - '--gpgsql-host=psql-int.mylogin.space'
          - '--gpgsql-port=$(PSQL_PORT)'
          - '--gpgsql-dbname=DlzcnePHKR'
          - '--gpgsql-user=$(USERNAME)'
          - '--gpgsql-password=$(PASSWORD)'
        env:
          - name: 'PSQL_HOSTNAME'
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ns'
                key: 'psqlHostname'
          - name: 'PSQL_PORT'
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ns'
                key: 'psqlPort'
          - name: 'USERNAME'
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ns'
                key: 'username'
          - name: 'PASSWORD'
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ns'
                key: 'password'
        workingDir: '/etc/pdns'

service:
  main:
    enabled: true
    controller: 'main'
    primary: true
    type: 'LoadBalancer'
    externalTrafficPolicy: 'Local'
    annotations:
      purelb.io/addresses: '10.1.1.67'
      purelb.io/allow-local: 'true'
      purelb.io/allow-shared-ip: 'dhcp.resolvemy.host'
    ports:
      dhcp-tcp:
        enabled: false
        port: 67
        protocol: 'TCP'
      dhcp-udp:
        enabled: true
        primary: true
        port: 67
        protocol: 'UDP'

persistence:
  # The ApplicationSet replaces this custom volume with the cluster-specific
  # ExternalSecret output generated by templates/10-DHCP/DHCPConfigSecret.yaml.
  configs:
    enabled: true
    mountPath: '/etc/DHCP'
    type: 'custom'
    advancedMounts:
      main:
        dhcp:
          - path: '/etc/DHCP'
  scripts:
    enabled: true
    type: 'configMap'
    name: '{{ include "bjw-s.common.lib.chart.names.fullname" . -}}-config'
    defaultMode: 0755
    advancedMounts:
      main:
        dhcp:
          - path: '/usr/local/bin/entry.sh'
            readOnly: true
            subPath: 'entry.sh'
  nsconfig:
    enabled: true
    type: 'configMap'
    name: '{{ include "bjw-s.common.lib.chart.names.fullname" . -}}-nsconfig'
    advancedMounts:
      main:
        ns:
          - path: '/etc/pdns/pdns.conf'
            readOnly: true
            subPath: 'pdns.conf'
  socket:
    enabled: true
    type: 'custom'
    volumeSpec:
      emptyDir:
        medium: 'Memory'
    advancedMounts:
      main:
        dhcp:
          - path: '/var/run/kea'

configMaps:
  config:
    enabled: true
    data:
      entry.sh: |
        #!/bin/sh
        set -eu
        mkdir -p /var/run/kea
        chmod 0750 /var/run/kea
        # emptyDir survives container restarts within the same Pod. Remove only
        # Kea runtime artifacts that can incorrectly report a dead daemon as
        # running or prevent its control socket from being rebound.
        rm -f /var/run/kea/*.pid /var/run/kea/*-ctrl-socket
        /usr/sbin/keactrl start -c /etc/DHCP/keactrl.conf
        exec tail -f /dev/null
  nsconfig:
    enabled: true
    data:
      pdns.conf: |
        cache-ttl=60
        config-dir=/etc/pdns
        daemon=no
        disable-axfr=no
        distributor-threads=1
        guardian=yes
        launch=gpgsql
        load-modules=libgpgsqlbackend.so
        local-address=0.0.0.0
        local-port=1053
        loglevel=3
        negquery-cache-ttl=60
        setgid=pdns
        setuid=pdns
        socket-dir=/var/run
        version-string=anonymous
        gpgsql-dnssec=
        allow-axfr-ips=172.16.0.0/12,10.0.0.0/8
        allow-dnsupdate-from=172.16.0.0/12,10.0.0.0/8,127.0.0.0/8
        webserver=yes
        webserver-address=0.0.0.0
        webserver-allow-from=0.0.0.0/0
        webserver-port=8081
        default-soa-content=ns.resolvemy.host bots.@ 0 300 60 600 300
        dnsupdate=yes
        expand-alias=yes
        forward-dnsupdate=yes
        forward-notify=10.1.1.50,10.1.1.53
        primary=yes

# NetBox documentation: https://netboxlabs.com/docs/netbox/en/stable/
# Chart documentation: https://github.com/netbox-community/netbox-chart/tree/netbox-5.0.23/charts/netbox
netbox:
  fullnameOverride: 'netbox-ipam'

  # Site image with the plugins below. The mutable tag and Always policy are
  # intentional pending immutable site-image releases.
  image:
    registry: ''
    repository: 'kristianfoss/netbox'
    pullPolicy: 'Always'
    tag: 'core'

  superuser:
    name: 'kjones'
    email: 'august@mylogin.space'
    existingSecret: 'netbox-secret'
  email:
    existingSecretName: 'netbox-secret'
    existingSecretKey: 'password'
  logoutRedirectUrl: '/logout'

  # Plugin source and documentation:
  # - https://github.com/netbox-community/netbox-topology-views
  # - https://github.com/netbox-community/netbox-bgp
  # - https://github.com/TrackItShelby/netbox-ipcalculator
  plugins:
    - 'netbox_topology_views'
    - 'netbox_bgp'
    - 'netbox_ipcalculator'
  pluginsConfig:
    netbox_bgp:
      top_level_menu: true
    netbox_topology_views:
      allow_coordinates_saving: true

  # NetBox remote authentication:
  # https://netboxlabs.com/docs/netbox/en/stable/configuration/remote-authentication/
  # django-auth-ldap configuration:
  # https://django-auth-ldap.readthedocs.io/en/latest/authentication.html
  remoteAuth:
    enabled: true
    backends:
      - 'netbox.authentication.LDAPBackend'
      - 'netbox.authentication.RemoteUserBackend'
    header: 'HTTP_X_USERNAME'
    userFirstName: 'HTTP_X_NAME'
    userLastName: 'HTTP_X_LASTNAME'
    userEmail: 'HTTP_X_EMAIL'
    autoCreateUser: true
    autoCreateGroups: true
    groupHeader: 'HTTP_X_GROUPS'
    ldap:
      serverUri: 'ldaps://ldap.mylogin.space'
      # LDAPS is used directly, so StartTLS must remain disabled.
      startTls: false
      bindDn: 'cn=netbox-core,ou=users,dc=ldap,dc=mylogin,dc=space'
      userDnTemplate: 'cn=%(user)s,ou=users,dc=ldap,dc=mylogin,dc=space'
      userSearchBaseDn: 'dc=ldap,dc=mylogin,dc=space'
      userSearchAttr: 'cn'
      groupSearchBaseDn: 'ou=groups,dc=ldap,dc=mylogin,dc=space'
      groupType: 'NestedGroupOfNamesType'
      requireGroupDn:
        - 'cn=Network,ou=groups,dc=ldap,dc=mylogin,dc=space'
      isAdminDn:
        - 'cn=Network Admins,ou=groups,dc=ldap,dc=mylogin,dc=space'
      isSuperUserDn:
        - 'cn=authentik Admins,ou=groups,dc=ldap,dc=mylogin,dc=space'
      attrFirstName: 'cn'
      attrLastName: 'lastname'

  existingSecret: 'netbox-secret'
  # These explicit disables override the enabled defaults of nested upstream
  # dependencies; removing them would create an unmanaged PVC and databases.
  persistence:
    enabled: false
  livenessProbe:
    initialDelaySeconds: 15
  readinessProbe:
    initialDelaySeconds: 15
  startupProbe:
    initialDelaySeconds: 60
    periodSeconds: 15
    failureThreshold: 75
  revisionHistoryLimit: 3

  # External PostgreSQL connection; credentials are synchronized separately by
  # External Secrets. PostgreSQL connection parameters:
  # https://www.postgresql.org/docs/current/libpq-connect.html#LIBPQ-PARAMKEYWORDS
  externalDatabase:
    host: 'psql-int.mylogin.space'
    database: '3dzxoCeJ1f'
    username: 'netbox-core'
    existingSecretName: 'netbox-creds'
    existingSecretKey: 'password'
    connMaxAge: 3600

  postgresql:
    enabled: false
  redis:
    enabled: false

  # Both logical databases use the ApplicationSet-injected, TLS-enabled CoRE
  # Dragonfly endpoint and its namespace-local generated credential.
  # Dragonfly Redis compatibility: https://www.dragonflydb.io/docs/category/managing-dragonfly
  tasksRedis:
    database: 80
    ssl: true
    host: 'dragonfly.k8s.dc1.yxl.mylogin.space'
    existingSecretName: 'dragonfly-core-password'
    existingSecretKey: 'password'
  cachingRedis:
    database: 81
    ssl: true
    host: 'dragonfly.k8s.dc1.yxl.mylogin.space'
    existingSecretName: 'dragonfly-core-password'
    existingSecretKey: 'password'

  # Housekeeping is handled outside this chart; the upstream default is on.
  housekeeping:
    enabled: false
