{{ if and .Values.netbox.enabled .Values.hub }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .Release.Name }}-netbox

spec:
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: mainvault-core
      

  selector:
    secret:
      name: netbox-creds

  # The User claim emits the database and credentials. PostgreSQL hostname and
  # port are site-managed properties in Vault, not keys in this Secret.
  data:
    - match:
        secretKey: database
        remoteRef:
          remoteKey: IPAM/Database
          property: Database

    - match:
        secretKey: username
        remoteRef:
          remoteKey: IPAM/Credentials
          property: Username

    - match:
        secretKey: password
        remoteRef:
          remoteKey: IPAM/Credentials
          property: Password
{{- end }}
