{{ if and .Values.netbox.enabled .Values.hub }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ .Release.Name }}-netbox

spec:
  secretStoreRefs:
    - kind: ClusterSecretStore
      name: mainvault-core
      

  selector:
    secret:
      name: netbox-auth-creds

  # This publishes the stable NetBox LDAP bind identity. Database credentials
  # are now generated and consumed locally by each target's User claim.
  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: IPAM/Credentials
          property: Username

    - match:
        secretKey: password
        remoteRef:
          remoteKey: IPAM/Credentials
          property: Password
{{- end }}
