{{ if and .Values.netbox.enabled .Values.hub }}
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: '{{ .Release.Name }}-netbox'

spec:
  name: 'Netbox'
  groups:
    - 'LDAPService'

  username: {{ required "netbox.externalDatabase.username is required" .Values.netbox.externalDatabase.username | squote }}

  psql:
    enabled: true
    hostname: {{ required "netbox.externalDatabase.host is required" .Values.netbox.externalDatabase.host | squote }}
    database: {{ required "netbox.externalDatabase.database is required" .Values.netbox.externalDatabase.database | squote }}
    createUserDatabase: false
    databases:
      - {{ .Values.netbox.externalDatabase.database | squote }}
    crossplane:
      crossplaneProvider: 'psql-main'
      terraformProvider: 'psql'

  writeConnectionSecretToRef:
    name: 'netbox-creds'
{{- end }}
