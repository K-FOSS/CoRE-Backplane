{{ if and .Values.netbox.enabled .Values.k8gb.enabled }}
apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: '{{ .Release.Name }}-k8gb'

  labels:
    lan-mode: 'private'
    resolvemy.host/gw: '{{ .Values.gateway.name }}'
    resolvemy.host/gw-ns: '{{ .Values.gateway.namespace }}'
    resolvemy.host/security: 'public'
    resolvemy.host/env: '{{ .Values.env }}'

  annotations:
    external-dns.kubernetes.io/hostname: 'ipam.gslb.mylogin.space'
    external-dns.alpha.kubernetes.io/hostname: 'ipam.gslb.mylogin.space'

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: '{{ .Values.gateway.namespace }}'
      name: '{{ .Values.gateway.name }}'
      sectionName: '{{ .Values.gateway.sectionName }}'

  hostnames:
    - 'ipam.gslb.mylogin.space'

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: '/'
      backendRefs:
        - group: ''
          kind: Service
          name: 'netbox'
          port: 80
          weight: 1
---
apiVersion: k8gb.io/v1beta1
kind: Gslb
metadata:
  name: '{{ .Release.Name }}-netbox'
  annotations:
    k8gb.io/hostname: 'ipam.mylogin.space'
spec:
  resourceRef:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    name: '{{ .Release.Name }}-k8gb'
  strategy:
    type: '{{ .Values.k8gb.strategy }}'
    {{ if eq .Values.k8gb.strategy 'failover' }}
    primaryGeoTag: '{{ .Values.k8gb.primaryGeoTag }}'
    {{ end }}
    dnsTtlSeconds: {{ .Values.k8gb.dnsTtlSeconds }}
{{ end }}
