{{ if .Values.dhcp.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-dhcp-tpl'

  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}

  annotations:
    argocd.argoproj.io/sync-wave: '0'

data:
  DDNS.jsonc: | #json
    {{- $dnsServer := dict "ip-address" "127.0.0.1" "port" 1053 }}
    {{- $ddns := dict
      "ip-address" "127.0.0.1"
      "port" 53001
      "dns-server-timeout" 12000
      "ncr-protocol" "UDP"
      "ncr-format" "JSON"
      "control-socket" (dict "socket-name" "kea-ddns-ctrl-socket" "socket-type" "unix")
      "hooks-libraries" (list)
      "forward-ddns" (dict "ddns-domains" (list
        (dict "name" "resolvemy.host." "dns-servers" (list $dnsServer))))
      "reverse-ddns" (dict "ddns-domains" (list
        (dict "name" "in-addr.arpa." "dns-servers" (list $dnsServer))
        (dict "name" "ip6.arpa." "dns-servers" (list $dnsServer))))
      "tsig-keys" (list)
      "loggers" (list (dict
        "name" "kea-dhcp-ddns"
        "output_options" (list (dict "output" "stdout"))
        "severity" "INFO"
        "debuglevel" 0))
    }}
    {{- dict "DhcpDdns" $ddns | toPrettyJson | nindent 4 }}

  DHCP6.jsonc: | #json
    {{- include "ipam.dhcp6.validate" . }}
    {{- $dhcp6 := deepCopy .Values.dhcp.dhcp6 }}
    {{- $_ := set $dhcp6 "lease-database" (dict
      "type" "postgresql"
      "name" "__KEA_DATABASE__"
      "host" .Values.dhcp.database.host
      "port" "__KEA_PORT__"
      "user" "__KEA_USERNAME__"
      "password" "__KEA_PASSWORD__"
      "reconnect-wait-time" 3000
      "max-reconnect-tries" 3
      "on-fail" "stop-retry-exit"
      "connect-timeout" 60) }}
    {{- $rendered := dict "Dhcp6" $dhcp6 | toPrettyJson }}
    {{- $rendered = replace "\"__KEA_DATABASE__\"" "{{ .Database | toJson }}" $rendered }}
    {{- $rendered = replace "\"__KEA_PORT__\"" "{{ .Port }}" $rendered }}
    {{- $rendered = replace "\"__KEA_USERNAME__\"" "{{ .Username | toJson }}" $rendered }}
    {{- $rendered = replace "\"__KEA_PASSWORD__\"" "{{ .Password | toJson }}" $rendered }}
    {{- $rendered | nindent 4 }}

  DHCP4.jsonc: | #json
    {{- include "ipam.dhcp4.validate" . }}
    {{- $dhcp4 := deepCopy .Values.dhcp.dhcp4 }}
    {{- $siteClasses := list
      (dict
        "name" "tinkerbell"
        "test" "option[77].exists and substring(option[77].hex,0,10) == 'Tinkerbell'"
        "boot-file-name" (printf "http://%s:7171/auto.ipxe" .Values.dhcp.bmps.tinkerbell.address.private)
        "option-data" (list (dict "name" "boot-file-name" "data" (printf "http://%s:7171/auto.ipxe" .Values.dhcp.bmps.tinkerbell.address.private))))
      (dict
        "name" "ipxe"
        "test" "option[77].exists and not member('tinkerbell') and option[77].hex == 'iPXE'"
        "boot-file-name" .Values.dhcp.bmps.tftp.efi.path
        "next-server" .Values.dhcp.bmps.tftp.efi.address
        "option-data" (list
          (dict "name" "tftp-server-name" "data" .Values.dhcp.bmps.tftp.efi.address)
          (dict "name" "dhcp-server-identifier" "data" .Values.dhcp.bmps.tftp.efi.address)))
      (dict
        "name" "pxe-legacy"
        "test" "option[93].exists and not member('tinkerbell') and not member('ipxe') and option[93].hex == 0x0000"
        "next-server" .Values.dhcp.bmps.tftp.pxe.address
        "boot-file-name" .Values.dhcp.bmps.tftp.pxe.path
        "option-data" (list
          (dict "name" "tftp-server-name" "data" .Values.dhcp.bmps.tftp.pxe.address)
          (dict "name" "dhcp-server-identifier" "data" .Values.dhcp.bmps.tftp.pxe.address)))
      (dict
        "name" "pxe-uefi"
        "test" "option[93].exists and not member('tinkerbell') and not member('ipxe') and not member('pxe-legacy')"
        "next-server" .Values.dhcp.bmps.tftp.efi.address
        "boot-file-name" .Values.dhcp.bmps.tftp.efi.path
        "option-data" (list
          (dict "name" "tftp-server-name" "data" .Values.dhcp.bmps.tftp.efi.address)
          (dict "name" "dhcp-server-identifier" "data" .Values.dhcp.bmps.tftp.efi.address)))
      (dict
        "name" "ubnt"
        "test" "option[60].exists and substring(option[60].hex,0,4) == 'ubnt'"
        "option-def" (list (dict "name" "vendor-encapsulated-options" "type" "empty" "encapsulate" "ubnt" "code" 43))
        "option-data" (list
          (dict "name" "unifi-address" "space" "ubnt" "data" .Values.dhcp.unifi.address)
          (dict "name" "vendor-encapsulated-options")))
    }}
    {{- $clientClasses := concat $siteClasses (default (list) (get $dhcp4 "client-classes")) }}
    {{- $_ := set $dhcp4 "client-classes" $clientClasses }}
    {{- $_ := set $dhcp4 "lease-database" (dict
      "type" "postgresql"
      "name" "__KEA_DATABASE__"
      "host" .Values.dhcp.database.host
      "port" "__KEA_PORT__"
      "user" "__KEA_USERNAME__"
      "password" "__KEA_PASSWORD__"
      "reconnect-wait-time" 3000
      "max-reconnect-tries" 3
      "on-fail" "stop-retry-exit"
      "connect-timeout" 60) }}
    {{- $rendered := dict "Dhcp4" $dhcp4 | toPrettyJson }}
    {{- $rendered = replace "\"__KEA_DATABASE__\"" "{{ .Database | toJson }}" $rendered }}
    {{- $rendered = replace "\"__KEA_PORT__\"" "{{ .Port }}" $rendered }}
    {{- $rendered = replace "\"__KEA_USERNAME__\"" "{{ .Username | toJson }}" $rendered }}
    {{- $rendered = replace "\"__KEA_PASSWORD__\"" "{{ .Password | toJson }}" $rendered }}
    {{- $rendered | nindent 4 }}
{{- end -}}
