{{- if .Values.dhcp.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-dhcp-ingress'
  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/controller: 'main'
      app.kubernetes.io/instance: {{ .Release.Name | squote }}
      app.kubernetes.io/name: {{ default .Release.Name .Values.global.nameOverride | squote }}
  policyTypes:
    - 'Ingress'
  ingress:
    {{- if or .Values.dhcp.servers.dhcp4 .Values.dhcp.servers.dhcp6 }}
    - ports:
        {{- if .Values.dhcp.servers.dhcp4 }}
        - protocol: 'UDP'
          port: 67
        {{- end }}
        {{- if .Values.dhcp.servers.dhcp6 }}
        - protocol: 'UDP'
          port: 547
    {{- end }}
    {{- else }}
    []
        {{- end }}
{{- end }}
