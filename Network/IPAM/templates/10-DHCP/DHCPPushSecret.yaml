{{ if and .Values.dhcp.enabled .Values.hub }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ include "bjw-s.common.lib.chart.names.fullname" . }}-dhcp-creds

  labels:
    {{- include "bjw-s.common.lib.metadata.allLabels" . | nindent 4 }}

  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  refreshInterval: 30m
  secretStoreRefs:
    - name: mainvault-core
      kind: ClusterSecretStore

  selector:
    secret:
      name: {{ include "bjw-s.common.lib.chart.names.fullname" . }}-dhcp-creds

  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: DHCP/Database
          property: Database

    - match:
        secretKey: username
        remoteRef:
          remoteKey: DHCP/User
          property: Username

    - match:
        secretKey: password
        remoteRef:
          remoteKey: DHCP/User
          property: Password
{{- end }}
