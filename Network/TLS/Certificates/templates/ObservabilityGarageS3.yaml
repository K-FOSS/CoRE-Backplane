{{- if eq .Values.cluster.name "core-dc1-talos-prod" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: 'observability-garage-s3-tls'
spec:
  secretName: 'observability-garage-s3-tls'
  commonName: 'observability-garage-s3.core-prod.svc.{{ .Values.cluster.domain }}'
  dnsNames:
    - 'observability-garage-s3.core-prod.svc.{{ .Values.cluster.domain }}'
  issuerRef:
    name: 'kjdev-cluster'
    kind: 'ClusterIssuer'
{{- end }}
