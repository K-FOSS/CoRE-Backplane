apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: quic-window-tuning
  namespace: core-prod
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: main-gw
  type: JSONPatch
  jsonPatches:
    # Listener-level QUIC flow control (quicOptions exists and is empty)
    - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
      name: "core-prod/main-gw/https-myloginspace-quic"
      operation:
        op: add
        path: "/udp_listener_config/quic_options/quic_protocol_options"
        value:
          initial_stream_window_size: 8388608        # 8Mi
          initial_connection_window_size: 16777216   # 16Mi
    # HCM is filters[1] — filters[0] is the connection_limit filter from your CTP
    - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
      name: "core-prod/main-gw/https-myloginspace-quic"
      operation:
        op: replace
        path: "/filter_chains/0/filters/1/typed_config/http3_protocol_options"
        value:
          quic_protocol_options:
            initial_stream_window_size: 8388608
            initial_connection_window_size: 16777216
