apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: sips-no-sni-fallback
  namespace: core-prod
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: main-gw
  type: JSONPatch
  jsonPatches:
    # The SIPS listener has one TLSRoute. Removing its SNI match makes that
    # filter chain the fallback for clients without SNI. Kamailio still
    # terminates TLS.
    - type: 'type.googleapis.com/envoy.config.listener.v3.Listener'
      name: 'core-prod/main-gw/sips-tls'
      operation:
        op: remove
        path: '/filter_chains/0/filter_chain_match/server_names'
