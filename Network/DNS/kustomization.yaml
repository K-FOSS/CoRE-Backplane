apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: []

patches:
  - target:
      group: 'apps'
      version: 'v1'
      kind: 'Deployment'
      name: 'dnsdist'
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: 'dnsdist'
      spec:
        minReadySeconds: 30
  - target:
      group: 'apps'
      version: 'v1'
      kind: 'Deployment'
      name: 'dnsdist-recursor'
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: 'dnsdist-recursor'
      spec:
        minReadySeconds: 30
