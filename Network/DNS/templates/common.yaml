{{- include "bjw-s.common.loader.init" . }}

{{- define "core-network-dns.commonValues" -}}
{{- $dnsdistConfigData := include "core-network-dns.dnsdistConfigData" . | fromYaml -}}
configMaps:
  dnsdist:
    enabled: {{ .Values.dnsdist.enabled }}
    forceRename: 'dnsdist-config'
    includeInChecksum: false
    data:
{{ toYaml $dnsdistConfigData.data | nindent 6 }}

serviceMonitor:
  dnsdist:
    enabled: {{ and .Values.dnsdist.enabled .Values.dnsdist.metrics.enabled }}
    forceRename: 'dnsdist'
    labels:
      app.kubernetes.io/name: 'dnsdist'
      app.kubernetes.io/component: 'monitoring'
    service:
      identifier: 'metrics'
    endpoints:
      - port: 'metrics'
        path: '/metrics'
        interval: {{ .Values.dnsdist.metrics.interval | quote }}
        scrapeTimeout: {{ .Values.dnsdist.metrics.scrapeTimeout | quote }}
  recursor:
    enabled: {{ and .Values.dnsdist.enabled .Values.dnsdist.metrics.enabled }}
    forceRename: 'recursor'
    labels:
      app.kubernetes.io/name: 'recursor'
      app.kubernetes.io/component: 'monitoring'
    service:
      identifier: 'recursor'
    endpoints:
      - port: 'metrics'
        path: '/metrics'
        interval: {{ .Values.dnsdist.metrics.interval | quote }}
        scrapeTimeout: {{ .Values.dnsdist.metrics.scrapeTimeout | quote }}

global:
  nameOverride: 'dnsdist'
  fullnameOverride: 'dnsdist'
  createDefaultServiceAccount: false

controllers:
  main:
    type: deployment
    forceRename: 'dnsdist'
    replicas: {{ .Values.dnsdist.replicas }}
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    podDisruptionBudget:
      minAvailable: 1
    pod:
      automountServiceAccountToken: false
      annotations:
        configmap.reloader.stakater.com/reload: 'dnsdist-config'
      dnsConfig:
        options:
          - name: ndots
            value: '0'
      {{- with .Values.dnsdist.scheduling.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dnsdist.scheduling.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.dnsdist.scheduling.topologySpreadConstraints }}
      topologySpreadConstraints:
{{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 953
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 953
        runAsGroup: 953
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: {{ .Values.dnsdist.image.repository | quote }}
          tag: {{ .Values.dnsdist.image.tag | quote }}
          digest: {{ .Values.dnsdist.image.digest | quote }}
          pullPolicy: {{ .Values.dnsdist.image.pullPolicy | quote }}
        ports:
          - name: 'dns-udp'
            containerPort: {{ .Values.dnsdist.port }}
            protocol: 'UDP'
          - name: 'dns-tcp'
            containerPort: {{ .Values.dnsdist.port }}
            protocol: 'TCP'
          {{- if .Values.dnsdist.metrics.enabled }}
          - name: 'metrics'
            containerPort: {{ .Values.dnsdist.metrics.dnsdistPort }}
            protocol: 'TCP'
          {{- end }}
        args:
          - '-C'
          - '/etc/dnsdist/dnsdist.conf'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - NET_BIND_SERVICE
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 953
          runAsGroup: 953
        resources:
{{ toYaml .Values.dnsdist.resources | nindent 10 }}
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: 53
              initialDelaySeconds: 0
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 1
              successThreshold: 4
          liveness:
            enabled: true
            type: TCP
            port: 53
            spec:
              periodSeconds: 20
          startup:
            enabled: true
            type: TCP
            port: 53
            spec:
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 60
  recursor:
    type: deployment
    replicas: {{ .Values.dnsdist.recursor.replicas }}
    strategy: RollingUpdate
    rollingUpdate:
      surge: 1
      unavailable: '0'
    podDisruptionBudget:
      minAvailable: 2
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: 'kubernetes.io/hostname'
              labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'recursor'
    pod:
      automountServiceAccountToken: false
      annotations:
        configmap.reloader.stakater.com/reload: 'dnsdist-config'
      securityContext:
        fsGroup: 953
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 953
        runAsGroup: 953
        seccompProfile:
          type: RuntimeDefault
        sysctls:
{{- range $name, $value := .Values.dnsdist.recursor.sysctls }}
          - name: {{ $name | quote }}
            value: {{ $value | quote }}
{{- end }}
    containers:
      recursor:
        image:
          repository: {{ .Values.dnsdist.recursor.image.repository | quote }}
          tag: {{ .Values.dnsdist.recursor.image.tag | quote }}
          pullPolicy: {{ .Values.dnsdist.recursor.image.pullPolicy | quote }}
        args:
          - '--config-dir=/etc/powerdns'
        ports:
          - name: 'recursor-udp'
            containerPort: {{ .Values.dnsdist.recursor.port }}
            protocol: 'UDP'
          - name: 'recursor-tcp'
            containerPort: {{ .Values.dnsdist.recursor.port }}
            protocol: 'TCP'
          {{- if .Values.dnsdist.metrics.enabled }}
          - name: 'metrics'
            containerPort: {{ .Values.dnsdist.metrics.recursorPort }}
            protocol: 'TCP'
          {{- end }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - NET_BIND_SERVICE
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 953
          runAsGroup: 953
        resources:
{{ toYaml .Values.dnsdist.recursor.resources | nindent 10 }}
        probes:
          readiness:
            enabled: true
            custom: true
            spec:
              tcpSocket:
                port: {{ .Values.dnsdist.recursor.port }}
              initialDelaySeconds: 0
              failureThreshold: 3
              periodSeconds: 10
              timeoutSeconds: 1
              successThreshold: 4
          liveness:
            enabled: true
            type: TCP
            port: {{ .Values.dnsdist.recursor.port }}
            spec:
              periodSeconds: 20
          startup:
            enabled: true
            type: TCP
            port: {{ .Values.dnsdist.recursor.port }}
            spec:
              periodSeconds: 5
              timeoutSeconds: 2
              failureThreshold: 60

service:
  main:
    controller: main
    primary: true
    forceRename: 'dnsdist'
    type: {{ .Values.dnsdist.service.type }}
    externalTrafficPolicy: {{ .Values.dnsdist.service.externalTrafficPolicy }}
    loadBalancerClass: {{ .Values.dnsdist.service.loadBalancerClass | quote }}
    loadBalancerIP: {{ .Values.dnsdist.service.loadBalancerIP | quote }}
    annotations:
{{ toYaml .Values.dnsdist.service.annotations | nindent 6 }}
    ports:
      dns-udp:
        enabled: true
        primary: true
        port: {{ .Values.dnsdist.port }}
        targetPort: 'dns-udp'
        protocol: 'UDP'
      dns-tcp:
        enabled: true
        primary: false
        port: {{ .Values.dnsdist.port }}
        targetPort: 'dns-tcp'
        protocol: 'TCP'
  {{- if and .Values.dnsdist.enabled .Values.dnsdist.globalService.enabled }}
  {{ required "dnsdist.globalService.name is required when the global DNS Service is enabled" .Values.dnsdist.globalService.name }}:
    controller: main
    forceRename: {{ .Values.dnsdist.globalService.name | quote }}
    type: 'LoadBalancer'
    externalTrafficPolicy: 'Cluster'
    loadBalancerClass: ''
    ipFamilyPolicy: 'SingleStack'
    ipFamilies: ['IPv4']
    labels:
      app.kubernetes.io/name: 'dnsdist'
      app.kubernetes.io/component: 'global-dns'
    annotations:
      purelb.io/addresses: {{ required "dnsdist.globalService.address is required when the global DNS Service is enabled" .Values.dnsdist.globalService.address | quote }}
      purelb.io/service-group: {{ required "dnsdist.globalService.serviceGroup is required when the global DNS Service is enabled" .Values.dnsdist.globalService.serviceGroup | quote }}
    ports:
      dns-udp:
        enabled: true
        primary: true
        port: {{ .Values.dnsdist.port }}
        targetPort: 'dns-udp'
        protocol: 'UDP'
      dns-tcp:
        enabled: true
        primary: false
        port: {{ .Values.dnsdist.port }}
        targetPort: 'dns-tcp'
        protocol: 'TCP'
  {{- end }}
  metrics:
    controller: main
    forceRename: 'dnsdist-metrics'
    type: ClusterIP
    labels:
      app.kubernetes.io/name: 'dnsdist'
      app.kubernetes.io/component: 'metrics'
    ports:
      metrics:
        enabled: {{ .Values.dnsdist.metrics.enabled }}
        primary: true
        port: {{ .Values.dnsdist.metrics.servicePort }}
        targetPort: 'metrics'
        protocol: 'TCP'
  recursor:
    controller: recursor
    forceRename: 'recursor-discovery'
    labels:
      app.kubernetes.io/name: 'recursor'
      app.kubernetes.io/component: 'metrics'
    type: ClusterIP
    clusterIP: 'None'
    ipFamilyPolicy: 'SingleStack'
    ipFamilies: ['IPv4']
    ports:
      recursor-udp:
        enabled: true
        primary: true
        port: {{ .Values.dnsdist.recursor.port }}
        targetPort: 'recursor-udp'
        protocol: 'UDP'
      recursor-tcp:
        enabled: true
        primary: false
        port: {{ .Values.dnsdist.recursor.port }}
        targetPort: 'recursor-tcp'
        protocol: 'TCP'
      {{- if .Values.dnsdist.metrics.enabled }}
      metrics:
        enabled: true
        primary: true
        port: {{ .Values.dnsdist.metrics.recursorPort }}
        targetPort: 'metrics'
        protocol: 'TCP'
      {{- end }}

networkpolicies:
  recursor:
    forceRename: 'dnsdist-recursor'
    controller: recursor
    policyTypes: ['Ingress', 'Egress']
    rules:
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'main'
                  app.kubernetes.io/name: 'dnsdist'
                  app.kubernetes.io/instance: {{ .Release.Name | quote }}
          ports:
            - protocol: 'UDP'
              port: {{ .Values.dnsdist.recursor.port }}
            - protocol: 'TCP'
              port: {{ .Values.dnsdist.recursor.port }}
        - from:
            - podSelector: {}
          ports:
            - protocol: 'TCP'
              port: {{ .Values.dnsdist.metrics.recursorPort }}
      egress:
        - ports:
            - protocol: 'UDP'
              port: 53
            - protocol: 'TCP'
              port: 53

persistence:
  config:
    type: custom
    volumeSpec:
      configMap:
        name: 'dnsdist-config'
    advancedMounts:
      main:
        main:
          - path: '/etc/dnsdist'
            readOnly: true
  recursor-config:
    type: custom
    volumeSpec:
      configMap:
        name: 'dnsdist-config'
    advancedMounts:
      recursor:
        recursor:
          - path: '/etc/powerdns/recursor.yml'
            subPath: 'recursor.yml'
            readOnly: true
          {{- if .Values.dnsdist.cnameFilter.enabled }}
          - path: '/etc/powerdns/cname-filter.lua'
            subPath: 'cname-filter.lua'
            readOnly: true
          {{- end }}
  recursor-runtime:
    type: emptyDir
    advancedMounts:
      recursor:
        recursor:
          - path: '/var/run/pdns-recursor'
          - path: '/tmp'
{{- end -}}

{{- if .Values.dnsdist.enabled }}
{{- $commonValues := include "core-network-dns.commonValues" . | fromYaml -}}
{{- $_ := merge .Values $commonValues -}}
{{ include "bjw-s.common.loader.generate" . }}
{{- end }}
