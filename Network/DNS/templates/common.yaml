{{- include "bjw-s.common.loader.init" . }}

{{- define "core-network-dns.commonValues" -}}
global:
  nameOverride: 'dnsdist'
  fullnameOverride: 'dnsdist'
  createDefaultServiceAccount: false

controllers:
  main:
    type: deployment
    replicas: {{ .Values.dnsdist.replicas }}
    strategy: RollingUpdate
    pod:
      automountServiceAccountToken: false
      annotations:
        core.mylogin.space/dnsdist-config-revision: {{ .Values.dnsdist.configRevision | quote }}
      dnsConfig:
        options:
          - name: ndots
            value: '0'
      securityContext:
        fsGroup: 953
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 953
        runAsGroup: 953
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: {{ .Values.dnsdist.image.repository | quote }}
          tag: {{ .Values.dnsdist.image.tag | quote }}
          pullPolicy: {{ .Values.dnsdist.image.pullPolicy | quote }}
        ports:
          - name: 'dns-udp'
            containerPort: {{ .Values.dnsdist.port }}
            protocol: 'UDP'
          - name: 'dns-tcp'
            containerPort: {{ .Values.dnsdist.port }}
            protocol: 'TCP'
        args:
          - '-C'
          - '/etc/dnsdist/dnsdist.conf'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - NET_BIND_SERVICE
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 953
          runAsGroup: 953
        resources:
{{ toYaml .Values.dnsdist.resources | nindent 10 }}
        probes:
          readiness:
            enabled: true
            type: TCP
            port: 53
            spec:
              periodSeconds: 10
          liveness:
            enabled: true
            type: TCP
            port: 53
            spec:
              periodSeconds: 20
      reloader:
        image:
          repository: {{ .Values.dnsdist.image.repository | quote }}
          tag: {{ .Values.dnsdist.image.tag | quote }}
          pullPolicy: {{ .Values.dnsdist.image.pullPolicy | quote }}
        command:
          - '/bin/sh'
          - '-ec'
        args:
          - |
            config_hash() {
              sha256sum /etc/dnsdist/dnsdist.conf /etc/dnsdist/rules.lua \
                | sha256sum | awk '{print $1}'
            }
            last="$(config_hash)"
            publish() {
              printf '%s\n' "$1" > /run/dnsdist/reload.tmp
              mv /run/dnsdist/reload.tmp /run/dnsdist/reload
            }
            publish "${last}"
            while :; do
              current="$(config_hash)"
              if [ "${current}" != "${last}" ]; then
                publish "${current}"
                last="${current}"
              fi
              sleep 2
            done
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 953
          runAsGroup: 953
        resources:
          requests:
            cpu: '5m'
            memory: '16Mi'
          limits:
            cpu: '50m'
            memory: '64Mi'
  recursor:
    type: deployment
    replicas: {{ .Values.dnsdist.recursor.replicas }}
    strategy: RollingUpdate
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: 'kubernetes.io/hostname'
              labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'recursor'
    pod:
      automountServiceAccountToken: false
      annotations:
        core.mylogin.space/recursor-config-revision: {{ toYaml .Values.dnsdist.recursor | sha256sum | quote }}
        {{ if .Values.dnsdist.cnameFilter.enabled }}
        core.mylogin.space/cname-filter-revision: {{ printf "%t|%s|%s" .Values.dnsdist.cnameFilter.enabled .Values.dnsdist.cnameFilter.target .Values.dnsdist.cnameFilter.address | sha256sum | quote }}
        {{ end }}
      securityContext:
        fsGroup: 953
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 953
        runAsGroup: 953
        seccompProfile:
          type: RuntimeDefault
        sysctls:
{{- range $name, $value := .Values.dnsdist.recursor.sysctls }}
          - name: {{ $name | quote }}
            value: {{ $value | quote }}
{{- end }}
    containers:
      recursor:
        image:
          repository: {{ .Values.dnsdist.recursor.image.repository | quote }}
          tag: {{ .Values.dnsdist.recursor.image.tag | quote }}
          pullPolicy: {{ .Values.dnsdist.recursor.image.pullPolicy | quote }}
        args:
          - '--config-dir=/etc/powerdns'
        ports:
          - name: 'recursor-udp'
            containerPort: {{ .Values.dnsdist.recursor.port }}
            protocol: 'UDP'
          - name: 'recursor-tcp'
            containerPort: {{ .Values.dnsdist.recursor.port }}
            protocol: 'TCP'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - NET_BIND_SERVICE
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 953
          runAsGroup: 953
        resources:
{{ toYaml .Values.dnsdist.recursor.resources | nindent 10 }}
        probes:
          readiness:
            enabled: true
            type: TCP
            port: {{ .Values.dnsdist.recursor.port }}
            spec:
              periodSeconds: 10
          liveness:
            enabled: true
            type: TCP
            port: {{ .Values.dnsdist.recursor.port }}
            spec:
              periodSeconds: 20

service:
  main:
    controller: main
    primary: true
    forceRename: 'dnsdist'
    type: {{ .Values.dnsdist.service.type }}
    externalTrafficPolicy: {{ .Values.dnsdist.service.externalTrafficPolicy }}
    loadBalancerClass: {{ .Values.dnsdist.service.loadBalancerClass | quote }}
    loadBalancerIP: {{ .Values.dnsdist.service.loadBalancerIP | quote }}
    annotations:
{{ toYaml .Values.dnsdist.service.annotations | nindent 6 }}
    ports:
      dns-udp:
        enabled: true
        primary: true
        port: {{ .Values.dnsdist.port }}
        targetPort: 'dns-udp'
        protocol: 'UDP'
      dns-tcp:
        enabled: true
        primary: false
        port: {{ .Values.dnsdist.port }}
        targetPort: 'dns-tcp'
        protocol: 'TCP'
  recursor:
    controller: recursor
    forceRename: 'recursor-discovery'
    type: ClusterIP
    clusterIP: 'None'
    ipFamilyPolicy: 'SingleStack'
    ipFamilies: ['IPv4']
    ports:
      recursor-udp:
        enabled: true
        primary: true
        port: {{ .Values.dnsdist.recursor.port }}
        targetPort: 'recursor-udp'
        protocol: 'UDP'
      recursor-tcp:
        enabled: true
        primary: false
        port: {{ .Values.dnsdist.recursor.port }}
        targetPort: 'recursor-tcp'
        protocol: 'TCP'

networkpolicies:
  recursor:
    forceRename: 'dnsdist-recursor'
    controller: recursor
    policyTypes: ['Ingress', 'Egress']
    rules:
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'main'
                  app.kubernetes.io/name: 'dnsdist'
                  app.kubernetes.io/instance: {{ .Release.Name | quote }}
          ports:
            - protocol: 'UDP'
              port: {{ .Values.dnsdist.recursor.port }}
            - protocol: 'TCP'
              port: {{ .Values.dnsdist.recursor.port }}
      egress:
        - ports:
            - protocol: 'UDP'
              port: 53
            - protocol: 'TCP'
              port: 53

persistence:
  config:
    type: custom
    volumeSpec:
      configMap:
        name: 'dnsdist-config'
    advancedMounts:
      main:
        main:
          - path: '/etc/dnsdist'
            readOnly: true
        reloader:
          - path: '/etc/dnsdist'
            readOnly: true
  recursor-config:
    type: custom
    volumeSpec:
      configMap:
        name: 'dnsdist-config'
    advancedMounts:
      recursor:
        recursor:
          - path: '/etc/powerdns/recursor.yml'
            subPath: 'recursor.yml'
            readOnly: true
          {{- if .Values.dnsdist.cnameFilter.enabled }}
          - path: '/etc/powerdns/cname-filter.lua'
            subPath: 'cname-filter.lua'
            readOnly: true
          {{- end }}
  recursor-runtime:
    type: emptyDir
    advancedMounts:
      recursor:
        recursor:
          - path: '/var/run/pdns-recursor'
          - path: '/tmp'
  runtime:
    type: emptyDir
    advancedMounts:
      main:
        main:
          - path: '/run/dnsdist'
        reloader:
          - path: '/run/dnsdist'

{{- end -}}

{{- if .Values.dnsdist.enabled }}
{{- $commonValues := include "core-network-dns.commonValues" . | fromYaml -}}
{{- $_ := merge .Values $commonValues -}}
{{ include "bjw-s.common.loader.generate" . }}
{{- end }}
