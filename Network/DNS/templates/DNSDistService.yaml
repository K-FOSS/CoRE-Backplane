{{- if .Values.dnsdist.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: dnsdist
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: 'dnsdist'
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  {{- with .Values.dnsdist.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.dnsdist.service.type }}
  {{- if .Values.dnsdist.service.loadBalancerClass }}
  loadBalancerClass: {{ .Values.dnsdist.service.loadBalancerClass | quote }}
  {{- end }}
  {{- if .Values.dnsdist.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.dnsdist.service.loadBalancerIP | quote }}
  {{- end }}
  externalTrafficPolicy: {{ .Values.dnsdist.service.externalTrafficPolicy }}
  selector:
    app.kubernetes.io/name: 'dnsdist'
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
  ports:
    - name: 'dns-udp'
      port: {{ .Values.dnsdist.port }}
      targetPort: 'dns-udp'
      protocol: UDP
    - name: 'dns-tcp'
      port: {{ .Values.dnsdist.port }}
      targetPort: 'dns-tcp'
      protocol: TCP
{{- end }}
