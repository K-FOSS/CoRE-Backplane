{{- if .Values.dnsdist.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsdist
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: 'dnsdist'
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: 'dnsdist'
      app.kubernetes.io/instance: {{ .Release.Name | quote }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: 'dnsdist'
        app.kubernetes.io/instance: {{ .Release.Name | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/DNSDistConfig.yaml") . | sha256sum }}
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: 'dnsdist'
          image: '{{ .Values.dnsdist.image.repository }}:{{ .Values.dnsdist.image.tag }}'
          imagePullPolicy: {{ .Values.dnsdist.image.pullPolicy }}
          args:
            - '-C'
            - '/etc/dnsdist/dnsdist.conf'
          ports:
            - name: 'dns-udp'
              containerPort: {{ .Values.dnsdist.port }}
              protocol: UDP
            - name: 'dns-tcp'
              containerPort: {{ .Values.dnsdist.port }}
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - 'NET_BIND_SERVICE'
              drop:
                - 'ALL'
          readinessProbe:
            tcpSocket:
              port: 'dns-tcp'
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 'dns-tcp'
            periodSeconds: 20
          volumeMounts:
            - name: 'config'
              mountPath: '/etc/dnsdist/dnsdist.conf'
              subPath: 'dnsdist.conf'
              readOnly: true
      volumes:
        - name: 'config'
          configMap:
            name: 'dnsdist-config'
{{- end }}
