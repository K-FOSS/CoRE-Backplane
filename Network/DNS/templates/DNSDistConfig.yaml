{{- if .Values.dnsdist.enabled }}
{{- $authoritativeBackend := default (printf "ns-core.core-%s.svc.%s:53" .Values.cluster.environment .Values.cluster.kubernetesDomain) .Values.dnsdist.authoritative.backend }}
{{- $k8gbServiceName := "core-network-global-coredns" }}
{{- if .Values.cluster.name }}
{{- $k8gbServiceName = printf "%s-network-global-%s-coredns" .Values.cluster.name .Values.cluster.environment }}
{{- end }}
{{- $k8gbBackend := default (printf "%s.k8gb.svc.%s:53" $k8gbServiceName .Values.cluster.kubernetesDomain) .Values.dnsdist.k8gb.backend }}
{{- $recursiveBackend := default (printf "kube-dns.kube-system.svc.%s:53" .Values.cluster.kubernetesDomain) .Values.dnsdist.recursive.backend }}
{{- $forwardBackend := .Values.dnsdist.forward.backend }}
{{- $authoritativeHost := trimSuffix ":53" $authoritativeBackend }}
{{- $k8gbHost := trimSuffix ":53" $k8gbBackend }}
{{- $recursiveHost := trimSuffix ":53" $recursiveBackend }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsdist-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: 'dnsdist'
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
data:
  dnsdist.conf: |
    -- PowerDNS dnsdist is the public DNS front door. Routing is deliberately
    -- explicit so the public Service cannot become an open recursive resolver.
    setLocal('{{ .Values.dnsdist.listenAddress }}:{{ .Values.dnsdist.port }}')
    setACL({'0.0.0.0/0', '::/0'})

    local function addBackend(hostname, name, pool, checkType, checkClass, checkName)
      getAddressInfo(hostname, function(_, addresses)
        for _, address in ipairs(addresses) do
          local backend = {
            address=address:toString(),
            name=name,
            pool=pool,
            checkType=checkType,
            mustResolve=true
          }
          if checkClass ~= nil then backend.checkClass=checkClass end
          if checkName ~= nil then backend.checkName=checkName end
          newServer(backend)
        end
      end)
    end

    addBackend('{{ $authoritativeHost }}', 'authoritative', 'authoritative', 'SOA', nil, '{{ .Values.dnsdist.authoritative.healthCheckName }}')
    addBackend('{{ $k8gbHost }}', 'k8gb', 'k8gb', 'SOA', nil, '{{ .Values.dnsdist.k8gb.healthCheckName }}')
    {{- if .Values.dnsdist.recursive.enabled }}
    -- kube-dns is a Kubernetes Service with ready CoreDNS endpoints; avoid a
    -- false-negative dnsdist UDP health check against its dual-stack VIP.
    addBackend('{{ $recursiveHost }}', 'recursive', 'recursive', nil, nil, nil)
    {{- end }}
    {{- if .Values.dnsdist.forward.enabled }}
    {{- $forwardHost := trimSuffix ":53" $forwardBackend }}
    -- Queries outside the authoritative, K8GB, and private recursive rules
    -- are intentionally forwarded to the configured public resolver.
    addBackend('{{ $forwardHost }}', 'forwarder', 'forwarder', nil, nil, nil)
    {{- end }}

    dofile('/etc/dnsdist/rules.lua')
    reloadConfig()
    local reloadMarker = ''
    function maintenance()
      local markerFile = io.open('/run/dnsdist/reload', 'r')
      if markerFile == nil then return end
      local marker = markerFile:read('*l')
      markerFile:close()
      if marker ~= nil and marker ~= reloadMarker then
        dofile('/etc/dnsdist/rules.lua')
        reloadConfig()
        reloadMarker = marker
      end
    end
  rules.lua: |
    function reloadConfig()
      setRules({
    {{- if gt (len .Values.dnsdist.authoritative.zones) 0 }}
        newRuleAction(QNameSuffixRule({
    {{- range $index, $zone := .Values.dnsdist.authoritative.zones }}{{ if $index }}, {{ end }}'{{ $zone }}'{{ end }}
        }), PoolAction('authoritative')),
    {{- end }}
    {{- if gt (len .Values.dnsdist.k8gb.zones) 0 }}
        newRuleAction(QNameSuffixRule({
    {{- range $index, $zone := .Values.dnsdist.k8gb.zones }}{{ if $index }}, {{ end }}'{{ $zone }}'{{ end }}
        }), PoolAction('k8gb')),
    {{- end }}
    {{- if .Values.dnsdist.recursive.enabled }}
        newRuleAction(NetmaskGroupRule({
    {{- range $index, $network := .Values.dnsdist.recursive.allowedNetworks }}{{ if $index }}, {{ end }}'{{ $network }}'{{ end }}
        }), PoolAction('recursive')),
    {{- end }}
    {{- if .Values.dnsdist.forward.enabled }}
        newRuleAction(AllRule(), PoolAction('forwarder'))
    {{- else }}
        newRuleAction(AllRule(), PoolAction('authoritative'))
    {{- end }}
      })
    setServerPolicy(firstAvailable)
    end
    {{- end }}
