{{- if .Values.dnsdist.enabled }}
{{- $authoritativeBackend := default (printf "ns-core-discovery.core-%s.svc.%s:53" .Values.cluster.environment .Values.cluster.kubernetesDomain) .Values.dnsdist.authoritative.backend }}
{{- $k8gbServiceName := "core-network-global-coredns" }}
{{- if .Values.cluster.name }}
{{- $k8gbServiceName = printf "%s-network-global-%s-coredns" .Values.cluster.name .Values.cluster.environment }}
{{- end }}
{{- $k8gbBackend := default (printf "%s.k8gb.svc.%s:53" $k8gbServiceName .Values.cluster.kubernetesDomain) .Values.dnsdist.k8gb.backend }}
{{- $recursiveBackend := default (printf "recursor-discovery.k8gb.svc.%s:%v" .Values.cluster.kubernetesDomain .Values.dnsdist.recursor.port) .Values.dnsdist.recursive.backend }}
{{- $authoritativeHost := trimSuffix ":53" $authoritativeBackend }}
{{- $k8gbHost := trimSuffix ":53" $k8gbBackend }}
{{- $recursiveHost := trimSuffix ":53" $recursiveBackend }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsdist-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: 'dnsdist'
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
data:
  recursor.yml: |
    incoming:
      listen:
        - '{{ .Values.dnsdist.recursor.listenAddress }}:{{ .Values.dnsdist.recursor.port }}'
      allow_from:
{{ toYaml .Values.dnsdist.recursor.allowFrom | nindent 8 }}
      max_tcp_clients: {{ .Values.dnsdist.recursor.maxTcpClients }}
      max_tcp_per_client: {{ .Values.dnsdist.recursor.maxTcpPerClient }}
      max_tcp_queries_per_connection: {{ .Values.dnsdist.recursor.maxTcpQueriesPerConnection }}
      max_concurrent_requests_per_tcp_connection: {{ .Values.dnsdist.recursor.maxConcurrentRequestsPerTcpConnection }}
      tcp_fast_open: {{ .Values.dnsdist.recursor.tcpFastOpenQueue }}
      reuseport: {{ .Values.dnsdist.recursor.reusePort }}
      pdns_distributes_queries: false
    recursor:
      threads: {{ .Values.dnsdist.recursor.threads }}
      tcp_threads: {{ .Values.dnsdist.recursor.tcpThreads }}
      socket_dir: {{ .Values.dnsdist.recursor.socketDirectory | quote }}
      socket_mode: {{ .Values.dnsdist.recursor.socketMode | quote }}
      {{- if .Values.dnsdist.cnameFilter.enabled }}
      lua_dns_script: '/etc/powerdns/cname-filter.lua'
      {{- end }}
    recordcache:
      max_entries: {{ .Values.dnsdist.recursor.recordCache.maxEntries }}
      refresh_on_ttl_perc: {{ .Values.dnsdist.recursor.recordCache.refreshOnTtlPerc }}
      serve_stale_extensions: {{ .Values.dnsdist.recursor.recordCache.serveStaleExtensions }}
    packetcache:
      max_entries: {{ .Values.dnsdist.recursor.packetCache.maxEntries }}
      ttl: {{ .Values.dnsdist.recursor.packetCache.ttl }}
      negative_ttl: {{ .Values.dnsdist.recursor.packetCache.negativeTtl }}
      servfail_ttl: {{ .Values.dnsdist.recursor.packetCache.servfailTtl }}
    dnssec:
      validation: {{ .Values.dnsdist.recursor.dnssecValidation | quote }}
    outgoing:
      tcp_fast_open_connect: {{ .Values.dnsdist.recursor.outgoingTcpFastOpenConnect }}
      dont_query:
{{ toYaml .Values.dnsdist.recursor.dontQuery | nindent 8 }}
    {{- if .Values.dnsdist.cnameFilter.enabled }}
  cname-filter.lua: |
    local cnameFilter = newDN({{ .Values.dnsdist.cnameFilter.target | quote }})
    local cnameFilterAddress = {{ .Values.dnsdist.cnameFilter.address | quote }}
    function postresolve(dq)
      if dq.qtype ~= pdns.A then return false end
      local records = dq:getRecords()
      local matched = false
      for _, record in pairs(records) do
        if record.place == 1 and record.type == pdns.CNAME and newDN(record:getContent()) == cnameFilter then
          matched = true
          break
        end
      end
      if not matched then return false end
      local retained = {}
      for _, record in pairs(records) do
        if record.place == 0 then table.insert(retained, record) end
      end
      dq:setRecords(retained)
      dq.rcode = 0
      dq:addAnswer(pdns.A, cnameFilterAddress, 60)
      return true
    end
    {{- end }}
  dnsdist.conf: |
    -- PowerDNS dnsdist is the public DNS front door. Routing is deliberately
    -- explicit so the public Service cannot become an open recursive resolver.
    setLocal('{{ .Values.dnsdist.listenAddress }}:{{ .Values.dnsdist.port }}')
    setACL({'0.0.0.0/0', '::/0'})

    local function addBackend(hostname, name, pool, checkType, checkClass, checkName)
      getAddressInfo(hostname, function(_, addresses)
        for _, address in ipairs(addresses) do
          local backend = {
            address=address:toString(),
            name=name,
            pool=pool,
            checkType=checkType,
            mustResolve=true
          }
          if checkClass ~= nil then backend.checkClass=checkClass end
          if checkName ~= nil then backend.checkName=checkName end
          newServer(backend)
        end
      end)
    end

    local authoritativeHealthCheckName = '{{ .Values.dnsdist.authoritative.healthCheckName }}'
    local authoritativeResolutionPending = false
    local recursiveResolutionPending = false
    local authoritativeRefreshCount = 0

    local function syncAuthoritativeBackends(_, addresses)
      authoritativeResolutionPending = false
      if #addresses == 0 then return end

      local desired = {}
      for _, address in ipairs(addresses) do
        local backendAddress = address:toString()
        desired['ns-pod-' .. backendAddress] = backendAddress
      end

      local current = {}
      for _, backend in ipairs(getServers()) do
        local name = backend:getName()
        if string.sub(name, 1, 7) == 'ns-pod-' then
          current[name] = backend
        end
      end

      for name, backendAddress in pairs(desired) do
        if current[name] == nil then
          newServer({
            address=backendAddress,
            name=name,
            pool='authoritative',
            checkType='SOA',
            checkName=authoritativeHealthCheckName,
            mustResolve=true
          })
        end
      end

      for name, backend in pairs(current) do
        if desired[name] == nil then rmServer(backend) end
      end
    end

    local function refreshAuthoritativeBackends()
      if authoritativeResolutionPending then return end
      authoritativeResolutionPending = true
      getAddressInfo('{{ $authoritativeHost }}', syncAuthoritativeBackends)
    end

    local function syncRecursiveBackends(_, addresses)
      recursiveResolutionPending = false
      if #addresses == 0 then return end

      local desired = {}
      for _, address in ipairs(addresses) do
        local backendAddress = address:toString()
        desired['recursor-pod-' .. backendAddress] = backendAddress
      end

      local current = {}
      for _, backend in ipairs(getServers()) do
        local name = backend:getName()
        if string.sub(name, 1, 13) == 'recursor-pod-' then
          current[name] = backend
        end
      end

      for name, backendAddress in pairs(desired) do
        if current[name] == nil then
          newServer({
            address=backendAddress,
            name=name,
            pool='recursive',
            checkType='SOA',
            checkName='.',
            mustResolve=true
          })
        end
      end

      for name, backend in pairs(current) do
        if desired[name] == nil then rmServer(backend) end
      end
    end

    local function refreshRecursiveBackends()
      if recursiveResolutionPending then return end
      recursiveResolutionPending = true
      getAddressInfo('{{ $recursiveHost }}', syncRecursiveBackends)
    end

    refreshAuthoritativeBackends()
    refreshRecursiveBackends()
    -- Network/NS discovery is a headless Service: each ready PowerDNS Pod is
    -- an independent backend, so dnsdist can health-check and balance replicas.
    addBackend('{{ $k8gbHost }}', 'k8gb', 'k8gb', 'SOA', nil, '{{ .Values.dnsdist.k8gb.healthCheckName }}')
    dofile('/etc/dnsdist/rules.lua')
    reloadConfig()
    local reloadMarker = ''
    function maintenance()
      authoritativeRefreshCount = authoritativeRefreshCount + 1
      if authoritativeRefreshCount >= 30 then
        authoritativeRefreshCount = 0
        refreshAuthoritativeBackends()
        refreshRecursiveBackends()
      end

      local markerFile = io.open('/run/dnsdist/reload', 'r')
      if markerFile ~= nil then
        local marker = markerFile:read('*l')
        markerFile:close()
        if marker ~= nil and marker ~= reloadMarker then
          dofile('/etc/dnsdist/rules.lua')
          reloadConfig()
          reloadMarker = marker
        end
      end
    end
  rules.lua: |
    function reloadConfig()
      setRules({
    {{- range (default (list) .Values.dnsdist.hostOverrides) }}
        newRuleAction(QNameRule({{ printf "%s." (trimSuffix "." .hostname) | quote }}), SpoofAction({
    {{- range $index, $address := .addresses }}{{ if $index }}, {{ end }}{{ $address | quote }}{{ end }}
        })),
    {{- end }}
    {{- if gt (len .Values.dnsdist.k8gb.zones) 0 }}
        newRuleAction(QNameSuffixRule({
    {{- range $index, $zone := .Values.dnsdist.k8gb.zones }}{{ if $index }}, {{ end }}'{{ $zone }}'{{ end }}
        }), PoolAction('k8gb')),
    {{- end }}
    {{- if gt (len .Values.dnsdist.authoritative.zones) 0 }}
        newRuleAction(QNameSuffixRule({
    {{- range $index, $zone := .Values.dnsdist.authoritative.zones }}{{ if $index }}, {{ end }}'{{ $zone }}'{{ end }}
        }), PoolAction('authoritative')),
    {{- end }}
    {{- if .Values.dnsdist.recursive.enabled }}
        newRuleAction(NetmaskGroupRule({
    {{- range $index, $network := .Values.dnsdist.recursive.allowedNetworks }}{{ if $index }}, {{ end }}'{{ $network }}'{{ end }}
        }), PoolAction('recursive')),
    {{- end }}
        newRuleAction(AllRule(), PoolAction('authoritative'))
      })
    setServerPolicy(firstAvailable)
    setPoolServerPolicy(roundrobin, 'authoritative')
    setPoolServerPolicy(roundrobin, 'recursive')
    end
    {{- end }}
