---
global:
  nameOverride: 'time-core'
  createDefaultServiceAccount: false

images:
  permissions:
    repository: 'busybox'
    tag: '1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0'
    pullPolicy: 'IfNotPresent'
  chrony:
    repository: 'simonrupf/chronyd'
    tag: '0.9.2-nts@sha256:b0d477f68c5df76e448ad4132c7a187fc6dddb8a18095911c0b0bcf3c8fd050d'
    pullPolicy: 'IfNotPresent'
  exporter:
    repository: 'superque/chrony-exporter-linux-amd64'
    tag: 'v0.13.3@sha256:a47168fb01648d93f46f83c0f1c6b8266cc592d088f6d681d7763ec3e4d5a383'
    pullPolicy: 'IfNotPresent'
  ticcDash:
    repository: 'venthe/ticc-dash'
    tag: '1.0.0@sha256:c4d570114a7e0d8a542a6188aeb10190e2a41c8e448508b2d2b280175f409557'
    pullPolicy: 'IfNotPresent'
  ntpDashboard:
    repository: 'nighthawkatl/ntp-dashboard'
    tag: 'latest@sha256:1ead06b4ffe39470d7026efcba44fb11bc22885ab0adbc5b241d8204d0ea0fea'
    pullPolicy: 'IfNotPresent'

ntp:
  # Upstream NTP sources and their Chrony options.
  sources:
    - hostname: 'time.cloudflare.com'
      iburst: true
      nts: true
    - hostname: 'nts.netnod.se'
      iburst: true
      nts: true
    - hostname: 'ptbtime1.ptb.de'
      iburst: true
      nts: true
    - hostname: 'ntppool1.time.nl'
      iburst: true
      nts: true
    - hostname: 'time.nrc.ca'
      iburst: true
      nts: false
    - hostname: 'ntp.torix.ca'
      type: 'pool'
      iburst: true
      nts: false
      maxsources: 2
  minsources: 3
  domain: 'syncmy.date'
  logLevel: '1'
  noClientLog: false
  resources:
    limits:
      cpu: '250m'
      memory: '128Mi'
      ephemeral-storage: '128Mi'
    requests:
      cpu: '25m'
      memory: '32Mi'
      ephemeral-storage: '16Mi'

nts:
  secretName: 'syncmydate-default-certificates'

# The owning ApplicationSet supplies the public PureLB address and anycast
# service group. Keep the service selector and address allocation together.
service:
  main:
    annotations: {}
