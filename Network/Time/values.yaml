---
global:
  nameOverride: 'time-core'
  createDefaultServiceAccount: false

images:
  chrony:
    repository: 'simonrupf/chronyd'
    tag: '0.7.1@sha256:8bcda8c20bd82af6810c362f35c6e1fd2b1dbd0c6db5e6880a1c0f2a00fa0e46'
    pullPolicy: 'IfNotPresent'
  exporter:
    repository: 'superque/chrony-exporter-linux-amd64'
    tag: 'v0.13.3@sha256:a47168fb01648d93f46f83c0f1c6b8266cc592d088f6d681d7763ec3e4d5a383'
    pullPolicy: 'IfNotPresent'

ntp:
  servers: 'time.cloudflare.com,time.google.com'
  logLevel: '1'
  resources:
    limits:
      cpu: '250m'
      memory: '128Mi'
      ephemeral-storage: '128Mi'
    requests:
      cpu: '25m'
      memory: '32Mi'
      ephemeral-storage: '16Mi'

# The owning ApplicationSet supplies the public PureLB address and anycast
# service group. Keep the service selector and address allocation together.
service:
  main:
    annotations: {}
