apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: 'time-core-ticc-dash-authentik'
spec:
  providerConfigRef:
    name: 'authentik'
  forProvider:
    source: 'Inline'
    module: |-
      data "authentik_flow" "authorization" {
        slug = "default-provider-authorization-implicit-consent"
      }

      data "authentik_flow" "invalidation" {
        slug = "default-provider-invalidation-flow"
      }

      data "authentik_group" "server_admins" {
        name = "Server Admins"
      }

      resource "authentik_provider_proxy" "ntp_dashboard" {
        name               = "core-prod-ntp-dashboard"
        mode               = "forward_single"
        external_host      = "https://dash.{{ .Values.ntp.domain }}"
        authorization_flow = data.authentik_flow.authorization.id
        invalidation_flow  = data.authentik_flow.invalidation.id
      }

      resource "authentik_application" "ntp_dashboard" {
        name              = "NTP Dashboard"
        slug              = "core-prod-ntp-dashboard"
        group             = "Network"
        protocol_provider = authentik_provider_proxy.ntp_dashboard.id
      }

      resource "authentik_application_entitlement" "ntp_dashboard_server_admins" {
        name        = "server-admin-access"
        application = authentik_application.ntp_dashboard.uuid
      }

      resource "authentik_policy_binding" "ntp_dashboard_entitlement" {
        target = authentik_application_entitlement.ntp_dashboard_server_admins.id
        group  = data.authentik_group.server_admins.id
        order  = 0
      }

      resource "authentik_policy_binding" "ntp_dashboard_application" {
        target = authentik_application.ntp_dashboard.uuid
        group  = data.authentik_group.server_admins.id
        order  = 0
      }
