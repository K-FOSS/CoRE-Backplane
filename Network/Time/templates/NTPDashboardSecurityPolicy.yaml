apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: 'time-core-ntp-dashboard'
spec:
  targetRefs:
    - group: 'gateway.networking.k8s.io'
      kind: 'HTTPRoute'
      name: '{{ ((include "bjw-s.common.lib.route.getByIdentifier" (dict "rootContext" . "id" "ntp-dashboard")) | fromYaml).name }}'
  extAuth:
    failOpen: false
    headersToExtAuth:
      - 'cookie'
    http:
      headersToBackend:
        - 'set-cookie'
        - 'x-authentik-*'
        - 'authorization'
        - 'Content-Type'
        - 'Location'
      backendSettings:
        loadBalancer:
          type: 'ConsistentHash'
          consistentHash:
            type: 'SourceIP'
      backendRefs:
        - group: ''
          kind: 'Service'
          namespace: 'core-prod'
          name: 'aaa-myloginspace-proxy'
          port: 80
      path: '/outpost.goauthentik.io/auth/envoy'
