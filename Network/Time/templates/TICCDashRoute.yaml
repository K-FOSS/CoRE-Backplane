apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: 'time-core-ticc-dash'
spec:
  parentRefs:
    - group: 'gateway.networking.k8s.io'
      kind: 'Gateway'
      namespace: 'core-prod'
      name: 'main-gw'
      sectionName: 'https-myloginspace'
  hostnames:
    - 'clients.syncmy.date'
  rules:
    - matches:
        - path:
            type: 'PathPrefix'
            value: '/'
      backendRefs:
        - group: ''
          kind: 'Service'
          name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ticc-dash'
          port: 5000
