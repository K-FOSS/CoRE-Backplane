---
{{- include "bjw-s.common.loader.init" . }}

{{- define "core-network-time.commonValues" -}}
global:
  nameOverride: {{ .Values.global.nameOverride | quote }}
  fullnameOverride: {{ .Values.global.nameOverride | quote }}

controllers:
  main:
    type: 'deployment'
    replicas: 2
    strategy: 'RollingUpdate'
    initContainers:
      permissions:
        image:
          repository: {{ .Values.images.chrony.repository | quote }}
          tag: {{ .Values.images.chrony.tag | quote }}
          pullPolicy: {{ .Values.images.chrony.pullPolicy }}
        command:
          - '/bin/sh'
          - '-c'
          - |
            set -eu
            chmod 0770 /etc/chrony /run /var/lib/chrony
            chown 100:101 /etc/chrony /run /var/lib/chrony
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - 'CHOWN'
              - 'FOWNER'
            drop:
              - 'ALL'
          privileged: false
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: 'chrony-config'
            mountPath: '/etc/chrony'
          - name: 'chrony-run'
            mountPath: '/run'
          - name: 'chrony-state'
            mountPath: '/var/lib/chrony'
    pod:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: 'Always'
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: 'RuntimeDefault'
      terminationGracePeriodSeconds: 30
    containers:
      main:
        image:
          repository: {{ .Values.images.chrony.repository | quote }}
          tag: {{ .Values.images.chrony.tag | quote }}
          pullPolicy: {{ .Values.images.chrony.pullPolicy }}
        command:
          - '/bin/sh'
          - '-c'
          - |
            set -eu
            mkdir -p /run/chrony
            chmod 0770 /run/chrony
            printf '%s\n' '# Generated by the chart; do not edit in the pod.' > /etc/chrony/chrony.conf
            IFS=','
            for server in $NTP_SERVERS; do
              printf 'server %s iburst\n' "$server" >> /etc/chrony/chrony.conf
            done
            if [ "$NOCLIENTLOG" = 'true' ]; then
              printf '%s\n' 'noclientlog' >> /etc/chrony/chrony.conf
            fi
            printf '%s\n' 'allow all' 'driftfile /var/lib/chrony/chrony.drift' >> /etc/chrony/chrony.conf
            exec chronyd -x -U -d -L "$LOG_LEVEL" -f /etc/chrony/chrony.conf
        env:
          - name: 'NTP_SERVERS'
            value: {{ .Values.ntp.servers | quote }}
          - name: 'NOCLIENTLOG'
            value: 'true'
          - name: 'LOG_LEVEL'
            value: {{ .Values.ntp.logLevel | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
          privileged: false
          readOnlyRootFilesystem: true
        resources:
{{ toYaml .Values.ntp.resources | nindent 10 }}
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - 'chronyc'
                  - '-n'
                  - 'tracking'
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - 'chronyc'
                  - '-n'
                  - 'tracking'
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3

service:
  main:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    controller: 'main'
    primary: true
    type: 'LoadBalancer'
    #loadBalancerClass: 'purelb.io/purelb'
    externalTrafficPolicy: 'Local'
    labels:
      wan-mode: 'public'
    ports:
      ntp:
        primary: true
        port: 123
        protocol: 'UDP'

persistence:
  chrony-config:
    type: 'emptyDir'
    medium: 'Memory'
    sizeLimit: '1Mi'
    advancedMounts:
      main:
        main:
          - path: '/etc/chrony'
  chrony-run:
    type: 'emptyDir'
    medium: 'Memory'
    sizeLimit: '1Mi'
    advancedMounts:
      main:
        main:
          - path: '/run'
  chrony-state:
    type: 'emptyDir'
    medium: 'Memory'
    sizeLimit: '4Mi'
    advancedMounts:
      main:
        main:
          - path: '/var/lib/chrony'

networkpolicies:
  main:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    controller: 'main'
    policyTypes:
      - 'Ingress'
      - 'Egress'
    rules:
      ingress:
        - from:
            - ipBlock:
                cidr: '0.0.0.0/0'
          ports:
            - port: 'ntp'
              protocol: 'UDP'
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: 'kube-system'
          ports:
            - port: 53
              protocol: 'UDP'
            - port: 53
              protocol: 'TCP'
        - to:
            - ipBlock:
                cidr: '0.0.0.0/0'
          ports:
            - port: 123
              protocol: 'UDP'
{{- end -}}

{{- $commonValues := include "core-network-time.commonValues" . | fromYaml -}}
{{- $_ := merge .Values $commonValues -}}
{{ include "bjw-s.common.loader.generate" . }}
