---
{{- include "bjw-s.common.loader.init" . }}

{{- define "core-network-time.commonValues" -}}
global:
  nameOverride: {{ .Values.global.nameOverride | quote }}
  fullnameOverride: {{ .Values.global.nameOverride | quote }}

controllers:
  main:
    type: 'deployment'
    replicas: 1
    strategy: 'RollingUpdate'
    initContainers:
      permissions:
        image:
          repository: {{ .Values.images.chrony.repository | quote }}
          tag: {{ .Values.images.chrony.tag | quote }}
          pullPolicy: {{ .Values.images.chrony.pullPolicy }}
        command:
          - '/bin/sh'
          - '-c'
          - |
            set -eu
            chmod 0770 /etc/chrony /run /var/lib/chrony
            chown 100:101 /etc/chrony /run /var/lib/chrony
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - 'CHOWN'
              - 'FOWNER'
            drop:
              - 'ALL'
          privileged: false
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
          - name: 'chrony-config'
            mountPath: '/etc/chrony'
          - name: 'chrony-run'
            mountPath: '/run'
          - name: 'chrony-state'
            mountPath: '/var/lib/chrony'
    pod:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: 'Always'
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: 'RuntimeDefault'
      terminationGracePeriodSeconds: 30
    containers:
      main:
        image:
          repository: {{ .Values.images.chrony.repository | quote }}
          tag: {{ .Values.images.chrony.tag | quote }}
          pullPolicy: {{ .Values.images.chrony.pullPolicy }}
        command:
          - '/bin/sh'
          - '-c'
          - |
            set -eu
            mkdir -p /run/chrony
            chmod 0770 /run/chrony
            printf '%s\n' '# Generated by the chart; do not edit in the pod.' > /etc/chrony/chrony.conf
            IFS=','
            for server in $NTP_SERVERS; do
              printf 'server %s iburst\n' "$server" >> /etc/chrony/chrony.conf
            done
            if [ "$NOCLIENTLOG" = 'true' ]; then
              printf '%s\n' 'noclientlog' >> /etc/chrony/chrony.conf
            fi
            printf '%s\n' 'allow all' 'driftfile /var/lib/chrony/chrony.drift' >> /etc/chrony/chrony.conf
            printf '%s\n' 'bindcmdaddress 127.0.0.1' 'cmdport 323' >> /etc/chrony/chrony.conf
            printf '%s\n' 'bindcmdaddress /run/chrony/chronyd.sock' >> /etc/chrony/chrony.conf
            printf '%s\n' 'ntsdumpdir /var/lib/chrony' >> /etc/chrony/chrony.conf
            printf '%s\n' 'ntsservercert /etc/chrony-tls/tls.crt' >> /etc/chrony/chrony.conf
            printf '%s\n' 'ntsserverkey /etc/chrony-tls/tls.key' >> /etc/chrony/chrony.conf
            exec chronyd -x -U -d -L "$LOG_LEVEL" -f /etc/chrony/chrony.conf
        env:
          - name: 'NTP_SERVERS'
            value: {{ .Values.ntp.servers | quote }}
          - name: 'NOCLIENTLOG'
            value: {{ .Values.ntp.noClientLog | quote }}
          - name: 'LOG_LEVEL'
            value: {{ .Values.ntp.logLevel | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
          privileged: false
          readOnlyRootFilesystem: true
        resources:
{{ toYaml .Values.ntp.resources | nindent 10 }}
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - 'chronyc'
                  - '-n'
                  - 'tracking'
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - 'chronyc'
                  - '-n'
                  - 'tracking'
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
      exporter:
        image:
          repository: {{ .Values.images.exporter.repository | quote }}
          tag: {{ .Values.images.exporter.tag | quote }}
          pullPolicy: {{ .Values.images.exporter.pullPolicy }}
        args:
          - '--chrony.address=127.0.0.1:323'
          - '--collector.sourcestats'
        ports:
          - name: 'metrics'
            containerPort: 9123
            protocol: 'TCP'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
        resources:
          limits:
            cpu: '100m'
            memory: '64Mi'
          requests:
            cpu: '10m'
            memory: '16Mi'
        volumeMounts:
          - name: 'chrony-run'
            mountPath: '/run'
      ticc-dash:
        image:
          repository: {{ .Values.images.ticcDash.repository | quote }}
          tag: {{ .Values.images.ticcDash.tag | quote }}
          pullPolicy: {{ .Values.images.ticcDash.pullPolicy }}
        env:
          - name: 'CHRONY_USE_SUDO'
            value: 'false'
          - name: 'CHRONY_SOCKET'
            value: '/run/chrony/chronyd.sock'
          - name: 'TMPDIR'
            value: '/tmp'
          - name: 'HOME'
            value: '/tmp'
        ports:
          - name: 'http'
            containerPort: 5000
            protocol: 'TCP'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '/'
                port: 'http'
              initialDelaySeconds: 10
              periodSeconds: 30
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '/'
                port: 'http'
              initialDelaySeconds: 10
              periodSeconds: 15
              timeoutSeconds: 5
        resources:
          limits:
            cpu: '250m'
            memory: '128Mi'
          requests:
            cpu: '25m'
            memory: '32Mi'
        volumeMounts:
          - name: 'chrony-run'
            mountPath: '/run'
            readOnly: true

service:
  main:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    controller: 'main'
    primary: true
    type: 'LoadBalancer'
    #loadBalancerClass: 'purelb.io/purelb'
    externalTrafficPolicy: 'Local'
    labels:
      wan-mode: 'public'
      app.kubernetes.io/component: 'ntp'
    ports:
      ntp:
        primary: true
        port: 123
        protocol: 'UDP'
      metrics:
        enabled: false
      nts:
        port: 4460
        protocol: 'TCP'

  metrics:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-metrics'
    controller: 'main'
    type: 'ClusterIP'
    primary: false
    labels:
      app.kubernetes.io/component: 'ntp-metrics'
    ports:
      metrics:
        primary: true
        port: 9123
        protocol: 'TCP'
        targetPort: 'metrics'

  dashboard:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ticc-dash'
    controller: 'main'
    type: 'ClusterIP'
    primary: false
    labels:
      app.kubernetes.io/component: 'ticc-dash'
    ports:
      http:
        primary: true
        port: 5000
        protocol: 'TCP'
        targetPort: 'http'

route:
  ticc-dash:
    enabled: true
    kind: 'HTTPRoute'
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ticc-dash'
    parentRefs:
      - group: 'gateway.networking.k8s.io'
        kind: 'Gateway'
        name: 'main-gw'
        namespace: 'core-prod'
        sectionName: 'https-myloginspace'
    hostnames:
      - 'clients.syncmy.date'
    rules:
      - backendRefs:
          - identifier: 'dashboard'
            port: 'http'

persistence:
  chrony-config:
    type: 'emptyDir'
    medium: 'Memory'
    sizeLimit: '1Mi'
    advancedMounts:
      main:
        main:
          - path: '/etc/chrony'
  chrony-run:
    type: 'emptyDir'
    medium: 'Memory'
    sizeLimit: '1Mi'
    advancedMounts:
      main:
        main:
          - path: '/run'
        exporter:
          - path: '/run'
            readOnly: true
        ticc-dash:
          - path: '/run'
            readOnly: true
  chrony-state:
    type: 'persistentVolumeClaim'
    accessMode: 'ReadWriteOnce'
    size: '1Gi'
    retain: true
    advancedMounts:
      main:
        main:
          - path: '/var/lib/chrony'
  nts-tls:
    type: 'secret'
    name: {{ .Values.nts.secretName | quote }}
    defaultMode: 0440
    advancedMounts:
      main:
        main:
          - path: '/etc/chrony-tls'
            readOnly: true
  ticc-dash-tmp:
    type: 'emptyDir'
    medium: 'Memory'
    sizeLimit: '16Mi'
    advancedMounts:
      main:
        ticc-dash:
          - path: '/tmp'

networkpolicies:
  main:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    controller: 'main'
    policyTypes:
      - 'Ingress'
      - 'Egress'
    rules:
      ingress:
        - from:
            - ipBlock:
                cidr: '0.0.0.0/0'
          ports:
            - port: 'ntp'
              protocol: 'UDP'
            - port: 'nts'
              protocol: 'TCP'
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: 'core-prod'
          ports:
            - port: 'metrics'
              protocol: 'TCP'
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: 'kube-system'
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: 'envoy'
                  gateway.envoyproxy.io/owning-gateway-name: 'main-gw'
                  gateway.envoyproxy.io/owning-gateway-namespace: 'core-prod'
          ports:
            - port: 'http'
              protocol: 'TCP'
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: 'kube-system'
          ports:
            - port: 53
              protocol: 'UDP'
            - port: 53
              protocol: 'TCP'
        - to:
            - ipBlock:
                cidr: '0.0.0.0/0'
          ports:
            - port: 123
              protocol: 'UDP'
{{- end -}}

{{- $commonValues := include "core-network-time.commonValues" . | fromYaml -}}
{{- $_ := merge .Values $commonValues -}}
{{ include "bjw-s.common.loader.generate" . }}
