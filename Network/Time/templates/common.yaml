---
{{- include "bjw-s.common.loader.init" . }}

{{- define "core-network-time.commonValues" -}}
global:
  nameOverride: {{ .Values.global.nameOverride | quote }}
  fullnameOverride: {{ .Values.global.nameOverride | quote }}

controllers:
  main:
    type: 'deployment'
    replicas: {{ .Values.ntp.replicas }}
    strategy: 'RollingUpdate'
    initContainers:
      permissions:
        image:
          repository: {{ .Values.images.permissions.repository | quote }}
          tag: {{ .Values.images.permissions.tag | quote }}
          pullPolicy: {{ .Values.images.permissions.pullPolicy }}
        command:
          - '/bin/sh'
          - '-c'
          - |
            set -eu
            chown '100:101' '/run/chrony'
            chmod '0770' '/run/chrony'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - 'CHOWN'
              - 'FOWNER'
            drop:
              - 'ALL'
          privileged: false
          runAsNonRoot: false
          runAsUser: 0
          runAsGroup: 0
    pod:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 101
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: 'RuntimeDefault'
      terminationGracePeriodSeconds: 30
    containers:
      main:
        image:
          repository: {{ .Values.images.chrony.repository | quote }}
          tag: {{ .Values.images.chrony.tag | quote }}
          pullPolicy: {{ .Values.images.chrony.pullPolicy }}
        ports:
          - name: 'command'
            containerPort: 323
            protocol: 'UDP'
        command:
          - '/bin/sh'
          - '-c'
          - |
            set -eu
            printf '%s\n' '# Generated by the chart; do not edit in the pod.' > /etc/chrony/chrony.conf
            printf 'minsources %s\n' "$MINSOURCES" >> /etc/chrony/chrony.conf
            while IFS='|' read -r source_type hostname iburst nts maxsources; do
              [ -n "$hostname" ] || continue
              printf '%s %s' "$source_type" "$hostname" >> /etc/chrony/chrony.conf
              if [ "$iburst" = 'true' ]; then
                printf ' iburst' >> /etc/chrony/chrony.conf
              fi
              if [ "$nts" = 'true' ]; then
                printf ' nts' >> /etc/chrony/chrony.conf
              fi
              if [ -n "$maxsources" ]; then
                printf ' maxsources %s' "$maxsources" >> /etc/chrony/chrony.conf
              fi
              printf '\n' >> /etc/chrony/chrony.conf
            done <<EOF
            $NTP_SOURCES
            EOF
            if [ "$NOCLIENTLOG" = 'true' ]; then
              printf '%s\n' 'noclientlog' >> /etc/chrony/chrony.conf
            fi
            printf '%s\n' 'allow all' 'driftfile /var/lib/chrony/chrony.drift' >> /etc/chrony/chrony.conf
            printf '%s\n' 'bindcmdaddress 0.0.0.0' 'cmdport 323' 'opencommands tracking sources clients' >> /etc/chrony/chrony.conf
{{- range .Values.ntp.cmdAllowCidrs }}
            printf '%s\n' 'cmdallow {{ . }}' >> /etc/chrony/chrony.conf
{{- end }}
            printf '%s\n' 'bindcmdaddress /run/chrony/chronyd.sock' >> /etc/chrony/chrony.conf
            printf '%s\n' 'ntsdumpdir /var/lib/chrony' >> /etc/chrony/chrony.conf
            printf '%s\n' 'ntsservercert /etc/chrony-tls/tls.crt' >> /etc/chrony/chrony.conf
            printf '%s\n' 'ntsserverkey /etc/chrony-tls/tls.key' >> /etc/chrony/chrony.conf
            exec chronyd -x -U -d -L "$LOG_LEVEL" -f /etc/chrony/chrony.conf
        env:
          - name: 'NTP_SOURCES'
            value: |-
{{- range .Values.ntp.sources }}
              {{ default "server" .type }}|{{ .hostname }}|{{ .iburst }}|{{ .nts }}|{{ default "" .maxsources }}
{{- end }}
          - name: 'MINSOURCES'
            value: {{ .Values.ntp.minsources | quote }}
          - name: 'NOCLIENTLOG'
            value: {{ .Values.ntp.noClientLog | quote }}
          - name: 'LOG_LEVEL'
            value: {{ .Values.ntp.logLevel | quote }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
          privileged: false
          readOnlyRootFilesystem: true
        resources:
{{ toYaml .Values.ntp.resources | nindent 10 }}
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - 'chronyc'
                  - '-n'
                  - 'tracking'
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3
          readiness:
            enabled: true
            custom: true
            spec:
              exec:
                command:
                  - 'chronyc'
                  - '-n'
                  - 'tracking'
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 3
      exporter:
        image:
          repository: {{ .Values.images.exporter.repository | quote }}
          tag: {{ .Values.images.exporter.tag | quote }}
          pullPolicy: {{ .Values.images.exporter.pullPolicy }}
        args:
          - '--chrony.address=127.0.0.1:323'
          - '--collector.sourcestats'
        ports:
          - name: 'metrics'
            containerPort: 9123
            protocol: 'TCP'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
        resources:
          limits:
            cpu: '100m'
            memory: '64Mi'
          requests:
            cpu: '10m'
            memory: '16Mi'
  ntp-dashboard:
    type: 'deployment'
    replicas: 1
    strategy: 'Recreate'
    pod:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: 'RuntimeDefault'
      terminationGracePeriodSeconds: 30
    containers:
      main:
        image:
          repository: {{ .Values.images.ntpDashboard.repository | quote }}
          tag: {{ .Values.images.ntpDashboard.tag | quote }}
          pullPolicy: {{ .Values.images.ntpDashboard.pullPolicy }}
        env:
          - name: 'LOG_LEVEL'
            value: 'INFO'
          - name: 'HOME'
            value: '/tmp'
          - name: 'TMPDIR'
            value: '/tmp'
        ports:
          - name: 'dashboard'
            containerPort: 55234
            protocol: 'TCP'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 100
          runAsGroup: 101
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '/'
                port: 'dashboard'
              initialDelaySeconds: 15
              periodSeconds: 30
              timeoutSeconds: 5
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '/'
                port: 'dashboard'
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 5
        resources:
          limits:
            cpu: '250m'
            memory: '256Mi'
          requests:
            cpu: '25m'
            memory: '64Mi'
service:
  main:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    controller: 'main'
    primary: true
    type: 'LoadBalancer'
    #loadBalancerClass: 'purelb.io/purelb'
    externalTrafficPolicy: 'Local'
    labels:
      wan-mode: 'public'
      app.kubernetes.io/component: 'ntp'
    ports:
      ntp:
        primary: true
        port: 123
        protocol: 'UDP'
      metrics:
        enabled: false
      nts:
        port: 4460
        protocol: 'TCP'

  metrics:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-metrics'
    controller: 'main'
    type: 'ClusterIP'
    primary: false
    labels:
      app.kubernetes.io/component: 'ntp-metrics'
    ports:
      metrics:
        primary: true
        port: 9123
        protocol: 'TCP'
        targetPort: 'metrics'

  ntp-dashboard:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ntp-dashboard'
    controller: 'ntp-dashboard'
    type: 'ClusterIP'
    primary: false
    labels:
      app.kubernetes.io/component: 'ntp-dashboard'
    ports:
      http:
        primary: true
        port: 55234
        protocol: 'TCP'
        targetPort: 'dashboard'

  chrony-command:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-chrony-command'
    controller: 'main'
    type: 'ClusterIP'
    primary: false
    sessionAffinity: 'ClientIP'
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: {{ .Values.ntp.cmdSessionAffinityTimeoutSeconds }}
    labels:
      app.kubernetes.io/component: 'chrony-command'
    ports:
      command:
        primary: true
        port: 323
        protocol: 'UDP'
        targetPort: 323

route:
  ntp-dashboard:
    enabled: true
    kind: 'HTTPRoute'
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ntp-dashboard'
    labels:
      wan-mode: 'public'
    parentRefs:
      - group: 'gateway.networking.k8s.io'
        kind: 'Gateway'
        name: 'main-gw'
        namespace: 'core-prod'
        sectionName: 'https-myloginspace'
    hostnames:
      - 'dash.{{ .Values.ntp.domain }}'
    rules:
      - backendRefs:
          - identifier: 'ntp-dashboard'
            port: 'http'

persistence:
  chrony-config:
    type: 'emptyDir'
    medium: 'Memory'
    sizeLimit: '1Mi'
    advancedMounts:
      main:
        main:
          - path: '/etc/chrony'
        permissions:
          - path: '/etc/chrony'
  chrony-run:
    type: 'emptyDir'
    medium: 'Memory'
    sizeLimit: '1Mi'
    advancedMounts:
      main:
        main:
          - path: '/run/chrony'
        permissions:
          - path: '/run/chrony'
  chrony-state:
    type: 'persistentVolumeClaim'
    accessMode: 'ReadWriteOnce'
    size: '1Gi'
    retain: true
    advancedMounts:
      main:
        main:
          - path: '/var/lib/chrony'
        permissions:
          - path: '/var/lib/chrony'
  nts-tls:
    type: 'secret'
    name: {{ .Values.nts.secretName | quote }}
    defaultMode: 0440
    advancedMounts:
      main:
        main:
          - path: '/etc/chrony-tls'
            readOnly: true
  ntp-dashboard-data:
    type: 'persistentVolumeClaim'
    accessMode: 'ReadWriteOnce'
    size: '1Gi'
    retain: true
    advancedMounts:
      ntp-dashboard:
        ntp-dashboard:
          - path: '/app/data'
  ntp-dashboard-tmp:
    type: 'emptyDir'
    medium: 'Memory'
    sizeLimit: '16Mi'
    advancedMounts:
      ntp-dashboard:
        ntp-dashboard:
          - path: '/tmp'

networkpolicies:
  main:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    controller: 'main'
    policyTypes:
      - 'Ingress'
      - 'Egress'
    rules:
      ingress:
        - from:
            - ipBlock:
                cidr: '0.0.0.0/0'
          ports:
            - port: 'ntp'
              protocol: 'UDP'
            - port: 'nts'
              protocol: 'TCP'
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: 'core-prod'
          ports:
            - port: 'metrics'
              protocol: 'TCP'
        - from:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'ntp-dashboard'
                  app.kubernetes.io/name: {{ .Values.global.nameOverride | quote }}
                  app.kubernetes.io/instance: {{ .Release.Name | quote }}
          ports:
            - port: 'command'
              protocol: 'UDP'
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: 'kube-system'
          ports:
            - port: 53
              protocol: 'UDP'
            - port: 53
              protocol: 'TCP'
        - to:
            - ipBlock:
                cidr: '0.0.0.0/0'
          ports:
            - port: 123
              protocol: 'UDP'
  ntp-dashboard:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-ntp-dashboard'
    controller: 'ntp-dashboard'
    policyTypes:
      - 'Ingress'
      - 'Egress'
    rules:
      ingress:
        - from:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: 'kube-system'
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: 'envoy'
                  gateway.envoyproxy.io/owning-gateway-name: 'main-gw'
                  gateway.envoyproxy.io/owning-gateway-namespace: 'core-prod'
          ports:
            - port: 'dashboard'
              protocol: 'TCP'
      egress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: 'kube-system'
          ports:
            - port: 53
              protocol: 'UDP'
            - port: 53
              protocol: 'TCP'
        - to:
            - podSelector:
                matchLabels:
                  app.kubernetes.io/controller: 'main'
                  app.kubernetes.io/name: {{ .Values.global.nameOverride | quote }}
                  app.kubernetes.io/instance: {{ .Release.Name | quote }}
          ports:
            - port: 'command'
              protocol: 'UDP'
{{- end -}}

{{- $commonValues := include "core-network-time.commonValues" . | fromYaml -}}
{{- $_ := merge .Values $commonValues -}}
{{ include "bjw-s.common.loader.generate" . }}
