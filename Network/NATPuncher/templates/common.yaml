---
{{- include "bjw-s.common.loader.init" . }}

{{- define "app-template.hardcodedValues" -}}
# Set the nameOverride based on the release name if no override has been set
{{ if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{ end }}

controllers:
  {{- if .Values.coturn.enabled }}
  coturn:
    strategy: RollingUpdate

    containers:
      main:
        image:
          repository: coturn/coturn
          tag: latest
          pullPolicy: IfNotPresent

        env:
          - name: DRAGONFLY_PASSWORD
            valueFrom:
              secretKeyRef:
                name: dragonfly-core-password
                key: password
          - name: TURN_AUTH_SECRET
            valueFrom:
              secretKeyRef:
                name: natpuncher-turn-auth
                key: password

        command:
          - /bin/sh
          - -ec

        args:
          - |
            umask 077
            cp /etc/turnserver.conf /tmp/turnserver.conf
            sed -i "s|__DRAGONFLY_PASSWORD__|${DRAGONFLY_PASSWORD}|g" /tmp/turnserver.conf
            sed -i "s|__TURN_AUTH_SECRET__|${TURN_AUTH_SECRET}|g" /tmp/turnserver.conf
            exec turnserver -c /tmp/turnserver.conf

        # -- Probe configuration
        # -- [[ref]](https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/)
        # @default -- See below
        probes:
          # -- Liveness probe configuration
          # @default -- See below
          liveness:
            # -- Enable the liveness probe
            enabled: false
            # -- Set this to `true` if you wish to specify your own livenessProbe
            custom: false
            # -- sets the probe type when not using a custom probe
            # @default -- "TCP"
            type: TCP
            # -- The spec field contains the values for the default livenessProbe.
            # If you selected `custom: true`, this field holds the definition of the livenessProbe.
            # @default -- See below
            spec:
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3

          # -- Redainess probe configuration
          # @default -- See below
          readiness:
            # -- Enable the readiness probe
            enabled: false
            # -- Set this to `true` if you wish to specify your own readinessProbe
            custom: false
            # -- sets the probe type when not using a custom probe
            # @default -- "TCP"
            type: TCP
            # -- The spec field contains the values for the default readinessProbe.
            # If you selected `custom: true`, this field holds the definition of the readinessProbe.
            # @default -- See below
            spec:
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 1
              failureThreshold: 3

          # -- Startup probe configuration
          # @default -- See below
          startup:
            # -- Enable the startup probe
            enabled: false
            # -- Set this to `true` if you wish to specify your own startupProbe
            custom: false
            # -- sets the probe type when not using a custom probe
            # @default -- "TCP"
            type: TCP
            # -- The spec field contains the values for the default startupProbe.
            # If you selected `custom: true`, this field holds the definition of the startupProbe.
            # @default -- See below
            spec:
              initialDelaySeconds: 0
              timeoutSeconds: 1
              ## This means it has a maximum of 5*30=150 seconds to start up before it fails
              periodSeconds: 5
              failureThreshold: 30
  {{- end }}

  {{- if .Values.UPNP.enabled }}
  upnp:
    type: cronjob
    cronjob:
      timeZone: UTC
      schedule: '*/30 * * * *'
      concurrencyPolicy: Forbid
      successfulJobsHistory: 1
      failedJobsHistory: 3
      ttlSecondsAfterFinished: 300

    {{- $mtuUsed := false -}}
    {{- $sriovUsed := false -}}
    {{- $sriovResources := dict -}}

    {{- if and .Values.UPNP.network .Values.UPNP.network.interfaces }}
    {{- range $netID, $netInterface := .Values.UPNP.network.interfaces }}
    {{ if .mtu }}
    {{- $mtuUsed = true }}
    {{- end }}
    {{- if eq $netInterface.type "sriov" }}
    {{ $sriovUsed = true }}
    {{- 
      $device := required
          (printf "UPNP.network.interfaces.%d: sriov.device is required for SR-IOV interfaces" $netID)
          $netInterface.sriov.device
    }}
    {{- $currentCount := get $sriovResources $device | default 0 }}
    {{- $_ := set $sriovResources $device (add $currentCount 1) }}
    {{- end }}
    {{- end }}
    {{- end }}

    pod:
      dnsPolicy: None

      automountServiceAccountToken: false
      
      dnsConfig:
        nameservers:
          - 1.1.1.1
        options:
          - name: ndots
            value: '0'
          - name: edns0

    {{- if and .Values.UPNP.network .Values.UPNP.network.interfaces }}
      annotations:
        v1.multus-cni.io/default-network: '{{ $.Release.Namespace }}/net-{{ $.Release.Name }}-0'
    {{- end }}

    containers:
      main:
        image:
          repository: kristianfjones/upnp
          tag: jobs
          pullPolicy: IfNotPresent

        {{- if $sriovUsed }}
        resources:
          limits:
            {{- range $device, $count := $sriovResources }}
            {{ $device }}: {{ $count | quote }}
            {{- end }}
        {{- end }}

        command:
          - /bin/sh
          - -ec

        args:
          - |
            set -eu

            sleep 10

            IFACE="eth0"
            
            ip addr show $IFACE

            IP_ADDR="$(ip -4 -o addr show dev "${IFACE}" scope global | awk '{print $4}' | cut -d/ -f1 | head -n1)"

            echo "Using ${IFACE} with IPv4 address ${IP_ADDR}"

            upnpc -m "${IFACE}" -l 

            {{- range $port := .Values.UPNP.ports }}
            echo "Ensuring UPnP {{ $port.protocol | upper }} {{ $port.externalPort }} -> {{ $port.target }}:{{ $port.internalPort }} via ${IFACE}"

            upnpc \
              -m "${IFACE}" \
              -e "{{ $.Release.Name }} {{ $port.externalPort }}/{{ $port.protocol | upper }}" \
              -a "{{ $port.target }}" "{{ $port.internalPort }}" "{{ $port.externalPort }}" "{{ $port.protocol | upper }}" {{ default 600 $port.duration }}
            {{ end }}
  {{- end }}

{{- if .Values.coturn.enabled }}
persistence:
  config:
    enabled: true
    mountPath: /etc/turnserver.conf
    subPath: turnserver.conf
    type: custom
    volumeSpec:
      configMap:
        name: 'natpuncher-config'

    advancedMounts:
      coturn:
        main:
          - path: /etc/turnserver.conf
            readOnly: true
            subPath: turnserver.conf

  tls:
    enabled: true
    type: secret
    name: myloginspace-default-certificates

    advancedMounts:
      coturn:
        main:
          - path: /etc/tls
            readOnly: true
{{- end }}

{{- if .Values.coturn.enabled }}
service:
  main:
    # -- Enables or disables the service
    enabled: true

    # -- Configure which controller this service should target
    controller: coturn

    # -- Make this the primary service for this controller (used in probes, notes, etc...).
    # If there is more than 1 service targeting the controller, make sure that only 1 service is
    # marked as primary.
    primary: true

    # -- Set the service type
    type: LoadBalancer

    # -- Specify the externalTrafficPolicy for the service. Options: Cluster, Local
    # -- [[ref](https://kubernetes.io/docs/tutorials/services/source-ip/)]
    externalTrafficPolicy:

    # -- Specify the ip policy. Options: SingleStack, PreferDualStack, RequireDualStack
    ipFamilyPolicy:
    # -- The ip families that should be used. Options: IPv4, IPv6
    ipFamilies: []

    # # -- Provide additional annotations which may be required.
    annotations:
      purelb.io/allow-shared-ip: main-gw.resolvemy.host
      purelb.io/service-group: main-public
      purelb.io/allow-local: 'true'
      purelb.io/addresses: '{{ $.Values.networking.publicAddress }}'
      external-dns.kubernetes.io/hostname: 'nat.mylogin.space'
      # TODO(external-dns-022): Remove the legacy annotation after upgrading ExternalDNS.
      external-dns.alpha.kubernetes.io/hostname: 'nat.mylogin.space'

    # -- Provide additional labels which may be required.
    labels:
      wan-mode: public
      lan-mode: private

    # -- Allow adding additional match labels
    extraSelectorLabels: {}

    ports:
      turn-tcp:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 service, make sure that only 1 port is marked as primary.
        primary: false

        # -- The port number
        port: 3478

        # -- Port protocol.
        # Support values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        # HTTP and HTTPS spawn a TCP service and get used for internal URL and name generation
        protocol: TCP

        # -- Specify the appProtocol value for the Service.
        # [[ref]](https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol)
        appProtocol:
      
      turn-udp:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 service, make sure that only 1 port is marked as primary.
        primary: false

        # -- The port number
        port: 3478

        # -- Port protocol.
        # Support values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        # HTTP and HTTPS spawn a TCP service and get used for internal URL and name generation
        protocol: UDP

        # -- Specify the appProtocol value for the Service.
        # [[ref]](https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol)
        appProtocol:

      turn-tls-tcp:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 service, make sure that only 1 port is marked as primary.
        primary: false

        # -- The port number
        port: 5349

        # -- Port protocol.
        # Support values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        # HTTP and HTTPS spawn a TCP service and get used for internal URL and name generation
        protocol: TCP

        # -- Specify the appProtocol value for the Service.
        # [[ref]](https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol)
        appProtocol:

      turn-tls-udp:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 service, make sure that only 1 port is marked as primary.
        primary: false

        # -- The port number
        port: 5349

        # -- Port protocol.
        # Support values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        # HTTP and HTTPS spawn a TCP service and get used for internal URL and name generation
        protocol: UDP

        # -- Specify the appProtocol value for the Service.
        # [[ref]](https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol)
        appProtocol:


  {{- range untilStep (int .Values.portRange.min) (int .Values.portRange.max) 1 }}
      turn-{{ . }}:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 service, make sure that only 1 port is marked as primary.
        primary: false

        # -- The port number
        port: {{ . }}

        # -- Port protocol.
        # Support values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        # HTTP and HTTPS spawn a TCP service and get used for internal URL and name generation
        protocol: UDP

        # -- Specify the appProtocol value for the Service.
        # [[ref]](https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol)
        appProtocol:
  {{- end }}
{{- end }}

{{- if .Values.coturn.enabled }}
configMaps:
  config:
    # -- Enables or disables the configMap
    enabled: true
    # -- Labels to add to the configMap
    labels: {}
    # -- Annotations to add to the configMap
    annotations: {}
    # -- configMap data content. Helm template enabled.
    data:
      turnserver.conf: |
        # CoTURN listener, relay and Dragonfly settings.

        listening-port=3478
        tls-listening-port=5349
        external-ip={{ $.Values.networking.publicAddress }}
        min-port={{ .Values.portRange.min }}
        max-port={{ .Values.portRange.max }}
        server-name=nat.mylogin.space
        realm=nat.mylogin.space
        use-auth-secret
        static-auth-secret=__TURN_AUTH_SECRET__

        # Site-local Dragonfly stores allocation status and statistics.
        redis-statsdb="ip=dragonfly-core.{{ $.Release.Namespace }}.svc.{{ $.Values.cluster.domain }} dbname=154 password=__DRAGONFLY_PASSWORD__ port=6379 tls=true ca=/etc/ssl/certs/ca-certificates.crt sni=dragonfly.{{ $.Values.cluster.name }}.{{ $.Values.datacenter }}.{{ $.Values.region }}.mylogin.space verify=true connect_timeout=10"

        cert=/etc/tls/tls.crt
        pkey=/etc/tls/tls.key
        pidfile=/var/tmp/turnserver.pid

        # Reduce STUN response amplification.
        no-rfc5780
        response-origin-only-with-rfc5780
{{- end }}


{{- end -}}
{{- $_ := mergeOverwrite .Values (include "app-template.hardcodedValues" . | fromYaml) -}}

{{- if .Values.UPNP.enabled }}
{{ range $netID, $netInterface := $.Values.UPNP.network.interfaces }}
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: net-{{ $.Release.Name }}-{{ $netID }}


  {{- if eq $netInterface.type "sriov" }}
  annotations:
    k8s.v1.cni.cncf.io/resourceName: {{ $netInterface.sriov.device }}
  {{- end }}
spec:
  config: |
    {
      "cniVersion": "1.0.0",
      "name": "vlan{{ $netInterface.sriov.vlan }}",
      "type": "{{ $netInterface.type }}",
      {{- if eq $netInterface.type "sriov" }}
      "spoofchk": "off",
      {{- end }}
      {{- with $netInterface.mtu }}
      "mtu": {{ . }},
      {{- end }}
      "vlan": {{ $netInterface.sriov.vlan }},
      {{- if $netInterface.ipam }}
      "ipam": {
        "type": "static",
        {{- if $netInterface.ipam.routes }}
        "routes": {{ toJson $netInterface.ipam.routes }},
        {{- end }}
        "addresses": [
          {
            "address": "{{ $netInterface.ipam.address }}"
          }
        ]
      }
      {{- end }}
    }
---
{{ end }}
{{ end }}

{{/* Render the templates */}}
{{ include "bjw-s.common.loader.generate" . }}
