---
{{- include "bjw-s.common.loader.init" . }}

{{- define "app-template.hardcodedValues" -}}
global:
  # Set the nameOverride based on the release name if no override has been set
{{ if not .Values.global.nameOverride }}
  nameOverride: "{{ .Release.Name }}"
{{ end }}
  propagateGlobalMetadataToPods: true
  labels:
    resolvemy.host/env: '{{ .Values.env }}'

defaultPodOptions:
  annotations:
    backup.velero.io/backup-volumes: 'data'

controllers:
  unifi:
    strategy: 'RollingUpdate'
    defaultContainerOptions:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
    containers:
      unifi:
        command:
          - '/bin/bash'
          - '/usr/local/bin/patch-upgrade-nag.sh'
        image:
          repository: 'ghcr.io/goofball222/unifi'
          tag: 'latest'
          pullPolicy: 'Always'
        env:
          - name: 'DB_MONGO_LOCAL'
            value: 'false'
          - name: 'UNIFI_DB_NAME'
            value: 'unifi'
          - name: 'DB_MONGO_URI'
            valueFrom:
              secretKeyRef:
                name: '{{ .Release.Name }}'
                key: 'DB_MONGO_URI'
          - name: 'STATDB_MONGO_URI'
            valueFrom:
              secretKeyRef:
                name: '{{ .Release.Name }}'
                key: 'STATDB_MONGO_URI'
        ports:
          - name: 'inform'
            containerPort: 8080
            protocol: 'TCP'
          - name: 'speedtest'
            containerPort: 6789
            protocol: 'TCP'
          - name: 'syslog'
            containerPort: 5514
            protocol: 'UDP'
          - name: 'httpportalredir'
            containerPort: 8880
            protocol: 'TCP'
          - name: 'portal-https'
            containerPort: 8843
            protocol: 'TCP'
          - name: 'https'
            containerPort: 8443
            protocol: 'TCP'
        probes:
          readiness:
            enabled: true
            type: 'HTTPS'
            path: '/status'
            port: 'https'
            spec:
              initialDelaySeconds: 30
              periodSeconds: 15
              timeoutSeconds: 5
              failureThreshold: 12
          liveness:
            enabled: true
            type: 'HTTPS'
            path: '/status'
            port: 'https'
            spec:
              initialDelaySeconds: 120
              periodSeconds: 30
              timeoutSeconds: 10
              failureThreshold: 5
          startup:
            enabled: true
            type: 'HTTPS'
            path: '/status'
            port: 'https'
            spec:
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 90
      {{ if .Values.unpoller.enabled }}
      unpoller:
        image:
          repository: '{{ .Values.images.unpoller.repository }}'
          tag: '{{ .Values.images.unpoller.tag }}'
          pullPolicy: '{{ .Values.images.unpoller.pullPolicy }}'
        env:
          - name: 'UP_INFLUXDB_DISABLE'
            value: 'true'
          - name: 'UP_POLLER_DEBUG'
            value: 'false'
          - name: 'UP_UNIFI_DYNAMIC'
            value: 'false'
          - name: 'UP_PROMETHEUS_HTTP_LISTEN'
            value: '0.0.0.0:9130'
          - name: 'UP_PROMETHEUS_NAMESPACE'
            value: 'unifi'
          - name: 'UP_UNIFI_DEFAULT_URL'
            value: 'https://127.0.0.1:8443'
          - name: 'UP_UNIFI_DEFAULT_VERIFY_SSL'
            value: 'false'
          - name: 'UP_UNIFI_DEFAULT_SITES_0'
            value: 'all'
          - name: 'UP_UNIFI_DEFAULT_SAVE_SITES'
            value: 'true'
          - name: 'UP_UNIFI_DEFAULT_USER'
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-unpoller'
                key: 'username'
          - name: 'UP_UNIFI_DEFAULT_PASS'
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-unpoller'
                key: 'password'
        ports:
          - name: 'metrics'
            containerPort: 9130
            protocol: 'TCP'
        probes:
          readiness:
            enabled: true
            type: 'HTTP'
            path: '/metrics'
            port: 'metrics'
            spec:
              initialDelaySeconds: 30
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 6
          liveness:
            enabled: true
            type: 'HTTP'
            path: '/metrics'
            port: 'metrics'
            spec:
              initialDelaySeconds: 60
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 5
        resources:
          limits:
            cpu: '250m'
            memory: '128Mi'
          requests:
            cpu: '25m'
            memory: '32Mi'
      {{ end }}

service:
  unifi-lb:
    enabled: true
    controller: 'unifi'
    type: 'ClusterIP'
    ipFamilyPolicy:
    ipFamilies: []
    ports:
      inform:
        enabled: true
        primary: false
        port: 8080
      speedtest:
        enabled: true
        primary: false
        port: 6789
      syslog:
        enabled: true
        primary: false
        port: 5514
        protocol: 'UDP'
      httpportalredir:
        enabled: true
        primary: false
        port: 8880
        protocol: 'HTTP'
      httppsortalredir:
        enabled: true
        primary: false
        port: 8843
        protocol: 'HTTPS'
  unifi:
    enabled: true
    controller: 'unifi'
    primary: true
    type: 'ClusterIP'
    ports:
      https:
        enabled: true
        primary: true
        port: 8443
        protocol: 'HTTPS'
        appProtocol: 'gateway.envoyproxy.io/wss'
  {{ if .Values.unpoller.enabled }}
  unifi-metrics:
    enabled: true
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-metrics'
    controller: 'unifi'
    primary: false
    type: 'ClusterIP'
    labels:
      app.kubernetes.io/component: 'unifi-metrics'
    ports:
      metrics:
        enabled: true
        primary: true
        port: 9130
        targetPort: 'metrics'
        protocol: 'TCP'
  {{ end }}

route:
  unifi-web:
    enabled: true
    kind: 'TLSRoute'
    labels:
      wan-mode: 'public'
      lan-mode: 'private'
    hostnames:
      - '{{ .Values.domain }}'
    parentRefs:
      - group: 'gateway.networking.k8s.io'
        kind: 'Gateway'
        name: 'main-gw'
        sectionName: 'tls-mqtt'
        namespace: 'core-prod'
    rules:
      - backendRefs:
          - kind: 'Service'
            port: 8443
            name: 'unifi'
            weight: 1

persistence:
  upgrade-nag-patch:
    enabled: true
    type: 'configMap'
    name: '{{ .Release.Name }}-upgrade-nag-patch'
    advancedMounts:
      unifi:
        unifi:
          - path: '/usr/local/bin/patch-upgrade-nag.sh'
            subPath: 'patch-upgrade-nag.sh'
            readOnly: true
  data:
    enabled: true
    type: 'persistentVolumeClaim'
    mountPath:
    accessMode: 'ReadWriteOnce'
    size: '2G'
    advancedMounts:
      unifi:
        unifi:
          - path: '/usr/lib/unifi/data'
            readOnly: false
  tls:
    enabled: true
    type: 'secret'
    name: 'myloginspace-default-certificates'
    advancedMounts:
      unifi:
        unifi:
          - path: '/usr/lib/unifi/cert/cert.pem'
            subPath: 'tls.crt'
            readOnly: true
          - path: '/usr/lib/unifi/cert/privkey.pem'
            subPath: 'tls.key'
            readOnly: true
{{- end -}}
{{- $_ := mergeOverwrite .Values (include "app-template.hardcodedValues" . | fromYaml) -}}

{{/* Render the templates */}}
{{ include "bjw-s.common.loader.generate" . }}
