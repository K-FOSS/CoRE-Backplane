apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bjw-s.common.lib.chart.names.fullname" . }}

spec:
  refreshInterval: '1h'
  secretStoreRef:
    kind: ClusterSecretStore
    name: mainvault-core

  target:
    name: {{ include "bjw-s.common.lib.chart.names.fullname" . }}
    template:
      engineVersion: v2
      data:
        DB_MONGO_URI: '{{ printf "mongodb://{{ .Username | urlquery }}:{{ .Password | urlquery }}@%s-rs0.core-%s.svc.%s:27017/unifi?replicaSet=rs0&authMechanism=PLAIN&authSource=external&readPreference=primary" (required "cluster.name is required for MongoDB service discovery" .Values.cluster.name) (required "env is required for MongoDB service discovery" .Values.env) (required "cluster.domain is required for MongoDB service discovery" .Values.cluster.domain) }}'
        STATDB_MONGO_URI: '{{ printf "mongodb://{{ .Username | urlquery }}:{{ .Password | urlquery }}@%s-rs0.core-%s.svc.%s:27017/unifi_stat?replicaSet=rs0&authMechanism=PLAIN&authSource=external&readPreference=primary" (required "cluster.name is required for MongoDB service discovery" .Values.cluster.name) (required "env is required for MongoDB service discovery" .Values.env) (required "cluster.domain is required for MongoDB service discovery" .Values.cluster.domain) }}'
  data:
    - secretKey: Username
      remoteRef:
        key: Unifi/Database
        property: Username
 
    - secretKey: Password
      remoteRef:
        key: Unifi/Database
        property: Password
