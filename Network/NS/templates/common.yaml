---
{{- include "bjw-s.common.loader.init" . }}

{{- if ne (default "LoadBalancer" .Values.service.main.type) "LoadBalancer" -}}
{{- $_ := unset .Values.service.main "externalTrafficPolicy" -}}
{{- end -}}

{{- define "core-network-nameserver.commonValues" -}}
global:
  nameOverride: {{ default .Release.Name .Values.global.nameOverride | quote }}
  fullnameOverride: {{ .Values.global.fullnameOverride | quote }}

controllers:
  main:
    replicas: {{ .Values.controllers.main.replicas }}
    strategy: RollingUpdate
    pod:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 953
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 953
        runAsGroup: 953
        seccompProfile:
          type: RuntimeDefault
    containers:
      main:
        image:
          repository: {{ .Values.images.powerdns.repository | quote }}
          tag: {{ .Values.images.powerdns.tag | quote }}
          pullPolicy: {{ .Values.images.powerdns.pullPolicy }}
        command:
          - /usr/local/sbin/pdns_server
        args:
          - --config-dir=/etc/pdns
          - --disable-syslog=yes
          - --socket-dir=/tmp
          - --gpgsql-host={{ required "powerdns.database.host must be injected by the owning ApplicationSet" .Values.powerdns.database.host }}
          - --gpgsql-port={{ .Values.powerdns.database.port }}
          - --gpgsql-dbname={{ .Values.powerdns.database.name }}
          - --gpgsql-user=$(USERNAME)
          - --gpgsql-password=$(PASSWORD)
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-creds'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-creds'
                key: password
        workingDir: /etc/pdns
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 953
          runAsGroup: 953
        resources:
{{ toYaml .Values.powerdns.resources | nindent 10 }}
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false

  nsadmin:
    type: deployment
    replicas: 1
    revisionHistoryLimit: 3
    strategy: RollingUpdate
    pod:
      annotations:
        secret.reloader.stakater.com/reload: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-nsadmin-creds,{{ include "bjw-s.common.lib.chart.names.fullname" . }}-secrets'
      dnsConfig:
        options:
          - name: ndots
            value: "0"
    containers:
      main:
        image:
          repository: {{ .Values.images.powerdnsAdmin.repository | quote }}
          tag: {{ .Values.images.powerdnsAdmin.tag | quote }}
          pullPolicy: {{ .Values.images.powerdnsAdmin.pullPolicy }}
        env:
          - name: LOCAL_DB_ENABLED
            value: 'False'
          - name: SIGNUP_ENABLED
            value: 'False'
          - name: PDNS_API_URL
            value: 'http://127.0.0.1:8081'
          - name: PDNS_API_KEY
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-nsadmin-api'
                key: APIKey
          - name: LDAP_ENABLED
            value: {{ .Values.powerdnsAdmin.ldap.enabled | quote }}
          - name: LDAP_BASE_DN
            value: {{ .Values.powerdnsAdmin.ldap.baseDN | quote }}
          - name: LDAP_SG_ENABLED
            value: {{ .Values.powerdnsAdmin.ldap.searchGroups | quote }}
          - name: LDAP_FILTER_USERNAME
            value: {{ .Values.powerdnsAdmin.ldap.filters.username | quote }}
          - name: LDAP_FILTER_GROUP
            value: {{ .Values.powerdnsAdmin.ldap.filters.group | quote }}
          - name: LDAP_FILTER_BASIC
            value: {{ .Values.powerdnsAdmin.ldap.filters.basic | quote }}
          - name: LDAP_FILTER_GROUPNAME
            value: {{ .Values.powerdnsAdmin.ldap.filters.groupName | quote }}
          - name: LDAP_USER_GROUP
            value: {{ .Values.powerdnsAdmin.ldap.userGroup | quote }}
          - name: LDAP_ADMIN_GROUP
            value: {{ .Values.powerdnsAdmin.ldap.adminGroup | quote }}
          - name: LDAP_URI
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-nsadmin-creds'
                key: ldapsURI
          - name: LDAP_ADMIN_USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-nsadmin-creds'
                key: ldapsBIND
          - name: LDAP_ADMIN_PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-nsadmin-creds'
                key: password
          - name: OIDC_OAUTH_ENABLED
            value: 'True'
          - name: OIDC_OAUTH_KEY
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-nsadmin-oidc'
                key: client_id
          - name: OIDC_OAUTH_SECRET
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-nsadmin-oidc'
                key: client_secret
          - name: OIDC_OAUTH_SCOPE
            value: 'openid email profile'
          - name: OIDC_OAUTH_AUTO_CONFIGURE
            value: 'True'
          - name: OIDC_OAUTH_METADATA_URL
            value: 'https://idp.mylogin.space/application/o/{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-{{ .Values.cluster.name }}/.well-known/openid-configuration'
          - name: OIDC_OAUTH_USERNAME
            value: 'preferred_username'
          - name: GUNICORN_LOGLEVEL
            value: {{ .Values.powerdnsAdmin.gunicorn.logLevel | quote }}
          - name: GUNICORN_TIMEOUT
            value: {{ .Values.powerdnsAdmin.gunicorn.timeout | quote }}
          - name: GUNICORN_WORKERS
            value: {{ .Values.powerdnsAdmin.gunicorn.workers | quote }}
          - name: SQLALCHEMY_POOL_TIMEOUT
            value: {{ .Values.powerdnsAdmin.sqlalchemy.poolTimeout | quote }}
          - name: SQLALCHEMY_POOL_SIZE
            value: {{ .Values.powerdnsAdmin.sqlalchemy.poolSize | quote }}
          - name: SQLALCHEMY_POOL_RECYCLE
            value: {{ .Values.powerdnsAdmin.sqlalchemy.poolRecycle | quote }}
          - name: SQLALCHEMY_DATABASE_URI
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-nsadmin-creds'
                key: psqlURI
        probes:
          liveness:
            enabled: true
            type: HTTP
            port: 80
            path: /
            spec:
              initialDelaySeconds: 0
              periodSeconds: 10
              timeoutSeconds: 2
              failureThreshold: 3
          readiness:
            enabled: false
          startup:
            enabled: false
        resources:
{{ toYaml .Values.powerdnsAdmin.resources | nindent 10 }}
      pdns-api:
        image:
          repository: {{ .Values.images.powerdns.repository | quote }}
          tag: {{ .Values.images.powerdns.tag | quote }}
          pullPolicy: {{ .Values.images.powerdns.pullPolicy }}
        command:
          - /usr/local/sbin/pdns_server
        args:
          - --config-dir=/etc/pdns
          - --disable-syslog=yes
          - --socket-dir=/tmp
          - --launch=gpgsql
          - --load-modules=libgpgsqlbackend.so
          - --gpgsql-host=psql-int.mylogin.space
          - --gpgsql-port={{ .Values.powerdns.database.port }}
          - --gpgsql-dbname={{ .Values.powerdns.database.name }}
          - --gpgsql-user=$(USERNAME)
          - --gpgsql-password=$(PASSWORD)
          - --gpgsql-dnssec=yes
          - --local-address=127.0.0.1
          - --local-port=5300
          - --cache-ttl=0
          - --query-cache-ttl=0
          - --negquery-cache-ttl=0
          - --dnssec-key-cache-ttl=0
          - --zone-cache-refresh-interval=0
          - --zone-metadata-cache-ttl=0
          - --webserver=yes
          - --webserver-address=127.0.0.1
          - --webserver-allow-from=127.0.0.1
          - --webserver-port=8081
        env:
          - name: USERNAME
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-creds'
                key: username
          - name: PASSWORD
            valueFrom:
              secretKeyRef:
                name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-creds'
                key: password
        workingDir: /etc/pdns
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 953
          runAsGroup: 953
        resources:
{{ toYaml .Values.powerdns.apiResources | nindent 10 }}

service:
  nsadmin:
    controller: nsadmin
    type: ClusterIP
    primary: false
    ports:
      http:
        primary: true
        port: 80
        protocol: HTTP
        appProtocol: http
  main:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}'
    controller: main
    primary: true
    type: {{ default "LoadBalancer" .Values.service.main.type }}
    {{- if eq (default "LoadBalancer" .Values.service.main.type) "LoadBalancer" }}
    loadBalancerClass: {{ .Values.service.main.loadBalancerClass | quote }}
    externalTrafficPolicy: {{ .Values.service.main.externalTrafficPolicy | quote }}
    {{- end }}
    labels:
      wan-mode: public
      lan-mode: private
    ports:
      dns-udp:
        primary: true
        port: 53
        protocol: UDP
      dns-tcp:
        primary: false
        port: 53
        protocol: TCP
  discovery:
    controller: main
    type: ClusterIP
    clusterIP: 'None'
    ports:
      dns-udp:
        primary: true
        port: 53
        protocol: UDP
      dns-tcp:
        primary: false
        port: 53
        protocol: TCP

route:
  nsadmin:
    kind: HTTPRoute
    labels:
      wan-mode: public
      lan-mode: private
    parentRefs:
      - group: gateway.networking.k8s.io
        kind: Gateway
        name: {{ .Values.powerdnsAdmin.route.gateway.name }}
        namespace: {{ .Values.powerdnsAdmin.route.gateway.namespace }}
        sectionName: {{ .Values.powerdnsAdmin.route.gateway.sectionName }}
    hostnames:
{{ toYaml .Values.powerdnsAdmin.route.hostnames | nindent 6 }}
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - kind: Service
            name: '{{ include "bjw-s.common.lib.chart.names.fullname" . }}-nsadmin'
            port: 80
            weight: 1

        timeouts:
          backendRequest: 120s
          request: 200s

persistence:
  tmp:
    type: emptyDir
    medium: Memory
    sizeLimit: 32Mi
    advancedMounts:
      main:
        main:
          - path: /tmp
      nsadmin:
        pdns-api:
          - path: /tmp
  config:
    type: custom
    volumeSpec:
      configMap:
        name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-config'
    advancedMounts:
      main:
        main:
          - path: /etc/pdns/pdns.conf
            readOnly: true
            subPath: pdns.conf
  configs:
    type: custom
    volumeSpec:
      secret:
        secretName: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-secrets'
        items:
          - key: web.conf
            path: web.conf
    advancedMounts:
      nsadmin:
        pdns-api:
          - path: /etc/pdns/conf.d/web.conf
            readOnly: true
            subPath: web.conf
  api-config:
    type: custom
    volumeSpec:
      configMap:
        name: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-api-config'
    advancedMounts:
      nsadmin:
        pdns-api:
          - path: /etc/pdns/pdns.conf
            readOnly: true
            subPath: pdns.conf

configMaps:
  config:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-config'
    data:
      pdns.conf: |
{{- .Values.powerdns.config | nindent 8 }}
  api-config:
    forceRename: '{{ include "bjw-s.common.lib.chart.names.fullname" $ }}-api-config'
    data:
      pdns.conf: |
        config-dir=/etc/pdns
        include-dir=/etc/pdns/conf.d
{{- end -}}

{{- $commonValues := include "core-network-nameserver.commonValues" . | fromYaml -}}
{{- $_ := merge .Values $commonValues -}}
{{ include "bjw-s.common.loader.generate" . }}
