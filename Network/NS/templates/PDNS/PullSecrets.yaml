{{- if not .Values.hub }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "bjw-s.common.lib.chart.names.fullname" . }}-core-creds
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: mainvault-core

  target:
    name: {{ include "bjw-s.common.lib.chart.names.fullname" . }}-creds

  data:
    - secretKey: psqlDatabase
      remoteRef:
        key: NS/Database
        property: Database

    - secretKey: username
      remoteRef:
        key: NS/Database
        property: Username

    - secretKey: password
      remoteRef:
        key: NS/Database
        property: Password
{{- end }}
