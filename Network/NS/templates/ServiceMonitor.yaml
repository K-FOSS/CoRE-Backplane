{{- if .Values.powerdns.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: 'ns-core-powerdns'
  labels:
    app.kubernetes.io/name: 'powerdns'
    app.kubernetes.io/component: 'monitoring'
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace | quote }}
  selector:
    matchLabels:
      app.kubernetes.io/name: 'powerdns'
      app.kubernetes.io/component: 'metrics'
  endpoints:
    - port: 'metrics'
      path: '/metrics'
      interval: {{ .Values.powerdns.metrics.interval | quote }}
      scrapeTimeout: {{ .Values.powerdns.metrics.scrapeTimeout | quote }}
{{- end }}
