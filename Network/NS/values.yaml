---
global:
  fullnameOverride: ns-core

# ApplicationSets override this per target cluster.
hub: false

images:
  powerdns:
    repository: powerdns/pdns-auth-49
    tag: 4.9.14
    pullPolicy: IfNotPresent
  powerdnsAdmin:
    repository: powerdnsadmin/pda-legacy
    tag: 0.4.2
    pullPolicy: IfNotPresent

powerdns:
  databaseName: DlzcnePHKR

  # Active PowerDNS settings only. Database credentials and the API key are
  # injected from Secrets and must not be added here.
  config: |
    # Process and backend
    daemon=no
    guardian=yes
    launch=gpgsql
    load-modules=libgpgsqlbackend.so
    distributor-threads=1
    config-dir=/etc/pdns
    include-dir=/etc/pdns/conf.d
    socket-dir=/var/run
    setgid=pdns
    setuid=pdns

    # Authoritative DNS listeners and behavior
    local-address=0.0.0.0
    local-port=53
    primary=yes
    dnsupdate=yes
    forward-dnsupdate=yes
    expand-alias=yes
    disable-axfr=no
    allow-axfr-ips=172.16.0.0/12,10.0.0.0/8
    allow-dnsupdate-from=172.16.0.0/12,10.0.0.0/8
    also-notify=10.1.1.50,10.1.1.53
    forward-notify=10.1.1.50,10.1.1.53
    default-soa-content=ns.resolvemy.host bots.@ 0 300 60 600 300
    gpgsql-dnssec=

    # Cache backend answers for brief database interruptions. Purge with
    # pdns_control when a verified update must be visible immediately.
    cache-ttl=300
    query-cache-ttl=300
    negquery-cache-ttl=300

    # API endpoint consumed by PowerDNS-Admin. API enablement and
    # authentication are supplied by web.conf from an ExternalSecret.
    webserver=yes
    webserver-address=0.0.0.0
    webserver-allow-from=0.0.0.0/0
    webserver-port=8081

    # Logging and version disclosure
    loglevel=3
    version-string=anonymous

powerdnsAdmin:
  ldap:
    enabled: "True"
    searchGroups: "True"
    baseDN: dc=ldap,dc=mylogin,dc=space
    filters:
      username: cn
      group: (objectClass=group)
      basic: (objectClass=user)
      groupName: member
    userGroup: cn=Network,ou=groups,dc=ldap,dc=mylogin,dc=space
    adminGroup: cn=authentik Admins,ou=groups,dc=ldap,dc=mylogin,dc=space
  gunicorn:
    logLevel: INFO
    timeout: 60
    workers: 2
  sqlalchemy:
    poolTimeout: 30
    poolSize: 10
    poolRecycle: 100
  resources:
    limits:
      cpu: 800m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  route:
    gateway:
      name: main-gw
      namespace: core-prod
      sectionName: https
    hostnames:
      - ns.int.mylogin.space

# The owning ApplicationSet adds target-specific ExternalDNS and PureLB
# annotations under this existing override path.
service:
  main:
    annotations:
      consul.hashicorp.com/service-name: ns-core
