---
global:
  fullnameOverride: ns-core
  # The workloads do not call the Kubernetes API.
  createDefaultServiceAccount: false

# ApplicationSets override this per target cluster.
hub: false

# The owning ApplicationSet injects the site-local PSQL endpoint and provider
# configs used by the PowerDNS-Admin SSO User claim.
psql:
  hostname: ''
  crossplaneProvider: ''
  terraformProvider: ''

images:
  powerdns:
    repository: 'powerdns/pdns-auth-51'
    tag: '5.1.4@sha256:bb5b1c133bcca1dd455075321de7d55db4945a8d7f2ba23339e3c7bbe416b205'
    pullPolicy: 'IfNotPresent'
  powerdnsAdmin:
    repository: powerdnsadmin/pda-legacy
    tag: 'v2026.08.1@sha256:5bcea2c641d04f25792cf2eba84eef2b30d9618f1756102ec808e336d6f07c1a'
    pullPolicy: IfNotPresent

powerdns:
  database:
    # Required: the owning ApplicationSet injects the psql.<service domain>
    # FQDN for the cluster-local Pgpool service on each target.
    host: ""
    port: 5432
    name: DlzcnePHKR
  resources:
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 32Mi

  # Active PowerDNS settings only. Database credentials and the API key are
  # injected from Secrets and must not be added here.
  config: |
    # Process and backend
    daemon=no
    guardian=yes
    launch=gpgsql
    load-modules=libgpgsqlbackend.so
    distributor-threads=1
    config-dir=/etc/pdns
    include-dir=/etc/pdns/conf.d
    socket-dir=/var/run
    setgid=pdns
    setuid=pdns

    # Authoritative DNS listeners and behavior
    local-address=0.0.0.0
    local-port=53
    primary=yes
    dnsupdate=yes
    forward-dnsupdate=yes
    expand-alias=yes
    disable-axfr=no
    allow-axfr-ips=172.16.0.0/12
    allow-dnsupdate-from=172.16.0.0/12,10.0.0.0/8
    default-soa-content=ns.resolvemy.host bots.@ 0 300 60 600 300
    gpgsql-dnssec=

    # Cache backend answers for brief database interruptions. Purge with
    # pdns_control when a verified update must be visible immediately.
    cache-ttl=300
    query-cache-ttl=300
    negquery-cache-ttl=300

    # API endpoint consumed by PowerDNS-Admin. API enablement and
    # authentication are supplied by web.conf from an ExternalSecret.
    webserver=yes
    webserver-address=0.0.0.0
    webserver-allow-from=0.0.0.0/0
    webserver-port=8081

    # Logging and version disclosure
    loglevel=3
    version-string=anonymous

powerdnsAdmin:
  ldap:
    enabled: "True"
    searchGroups: "True"
    baseDN: dc=ldap,dc=mylogin,dc=space
    filters:
      username: cn
      group: (objectClass=group)
      basic: (objectClass=user)
      groupName: member
    userGroup: cn=Network,ou=groups,dc=ldap,dc=mylogin,dc=space
    adminGroup: cn=authentik Admins,ou=groups,dc=ldap,dc=mylogin,dc=space
  gunicorn:
    logLevel: INFO
    timeout: 60
    workers: 2
  sqlalchemy:
    poolTimeout: 30
    poolSize: 10
    poolRecycle: 100
  resources:
    limits:
      cpu: 800m
      memory: 512Mi
      ephemeral-storage: 1Gi
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 128Mi
  route:
    gateway:
      name: main-gw
      namespace: core-prod
      sectionName: 'https-myloginspace'
    hostnames:
      - nsadmin.resolvemy.host
