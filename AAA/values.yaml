env: staging

cluster:
  name: k8s
  domain: cluster.local

dnsConfig:
  options:
    - name: 'ndots'
      value: '0'

peers: []

datacenter: dc1

region: yxl

domainName: 'mylogin.space'

hub: false

readReplica:
  enabled: false
  hosts: []

gateway:
  name: main-gw
  namespace: core-prod

route:
  hostnames:
    - 'idp.mylogin.space'

k8gb:
  enabled: false
  domain: 'gslb.mylogin.space'
  strategy: 'failover'
  primaryGeoTag: 'home1'
  dnsTtlSeconds: 30

authentik:
  clusterMesh:
    enabled: false
    service:
      ipFamilies:
        - 'IPv4'
      ipFamilyPolicy: 'SingleStack'
      trafficDistribution: 'PreferSameNode'
      sessionAffinity: 'ClientIP'
      sessionAffinityConfig:
        clientIP:
          timeoutSeconds: 300

  global:
    podLabels:
      logs: loki-myloginspace

    priorityClassName: tier2-priority

    env:
      - name: CLUSTER_NAME
        valueFrom:
          configMapKeyRef:
            name: aaa-authentik-environment
            key: CLUSTER_NAME

      - name: DATACENTER
        valueFrom:
          configMapKeyRef:
            name: aaa-authentik-environment
            key: DATACENTER

      - name: REGION
        valueFrom:
          configMapKeyRef:
            name: aaa-authentik-environment
            key: REGION

      - name: DOMAIN_NAME
        valueFrom:
          configMapKeyRef:
            name: aaa-authentik-environment
            key: DOMAIN_NAME

      - name: AUTHENTIK_WEB__WORKERS
        value: '1'

      - name: AUTHENTIK_WEB__THREADS
        value: '1'

      - name: AUTHENTIK_WORKER__TASK_EXPIRATION
        value: 'hours=12'

      - name: AUTHENTIK_WEB__BASE_URL
        value: 'https://idp.$(DOMAIN_NAME)'

      - name: AUTHENTIK_OUTPOSTS__DISCOVER
        value: 'false'

      - name: AUTHENTIK_POSTGRESQL__HOST
        value: 'psql-int.mylogin.space'

      - name: AUTHENTIK_POSTGRESQL__DIRECT__HOST
        value: 'psql-int.mylogin.space'

      - name: AUTHENTIK_POSTGRESQL__DISABLE_SERVER_SIDE_CURSORS
        value: 'false'

      - name: AUTHENTIK_POSTGRESQL__CONN_MAX_AGE
        value: '3600'

      - name: AUTHENTIK_POSTGRESQL__CONN_HEALTH_CHECKS
        value: 'true'

      - name: AUTHENTIK_EMAIL__USERNAME
        valueFrom:
          secretKeyRef:
            name: authentik-core
            key: username

      - name: AUTHENTIK_EMAIL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: authentik-core
            key: password

      - name: AUTHENTIK_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: aaa-authentik-database
            key: SecretKey

      - name: AUTHENTIK_POSTGRESQL__NAME
        valueFrom:
          secretKeyRef:
            name: aaa-authentik-database
            key: Database

      - name: AUTHENTIK_POSTGRESQL__USER
        valueFrom:
          secretKeyRef:
            name: aaa-authentik-database
            key: Username

      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: aaa-authentik-database
            key: Password

  authentik:
    email:
      host: mail.mylogin.space
      use_tls: true
      from: tnumovaqly@mail.mylogin.space

  server:
    replicas: 2
    dnsConfig:
      options:
        - name: 'ndots'
          value: '0'

    pdb:
      enabled: true
      minAvailable: 1

    service:
      annotations: null
      servicePortHttpAppProtocol: kubernetes.io/ws
      sessionAffinity: None

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

    livenessProbe:
      failureThreshold: 10
      periodSeconds: 30
      timeoutSeconds: 10

    readinessProbe:
      failureThreshold: 10
      successThreshold: 3
      periodSeconds: 30
      timeoutSeconds: 10

    startupProbe:
      failureThreshold: 100
      initialDelaySeconds: 60
      periodSeconds: 30

  worker:
    dnsConfig:
      options:
        - name: 'ndots'
          value: '0'

    livenessProbe:
      failureThreshold: 10
      periodSeconds: 30
      timeoutSeconds: 10

    readinessProbe:
      failureThreshold: 10
      periodSeconds: 30
      timeoutSeconds: 10

    startupProbe:
      timeoutSeconds: 6

  geoip:
    image:
      tag: v6.0.0

  prometheus:
    rules:
      enabled: true

  ldap:
    enabled: true
    replicas: 2
    resources:
      requests:
        cpu: '25m'
        memory: '64Mi'
      limits:
        cpu: '250m'
        memory: '128Mi'
    avoidNodeName: ''
    service:
      externalDNSHostname: ''
    clusterMesh:
      enabled: false
    k8gb:
      enabled: false
      exposedIPAddresses: ''
      service:
        type: 'LoadBalancer'
        loadBalancerClass: ''
        annotations: {}
        labels: {}
        trafficDistribution: ''
        allocateLoadBalancerNodePorts: false
        externalTrafficPolicy: 'Cluster'
    globalService:
      type: 'ClusterIP'
      loadBalancerClass: ''
      externalDNSHostname: ''
      annotations: {}
      labels: {}
      trafficDistribution: ''
      allocateLoadBalancerNodePorts: true
      externalTrafficPolicy: 'Local'

  radius:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: '25m'
        memory: '64Mi'
      limits:
        cpu: '250m'
        memory: '128Mi'
    additionalExternalDNSHostname: ''
    clusterMesh:
      enabled: false
    k8gb:
      enabled: false
    service:
      type: 'ClusterIP'
      loadBalancerClass: ''
      annotations: {}
      labels: {}
      trafficDistribution: ''
      externalIPs: []
      allocateLoadBalancerNodePorts: false
      externalTrafficPolicy: 'Cluster'

  proxy:
    enabled: true
    replicas: 1
    resources:
      requests:
        cpu: '50m'
        memory: '64Mi'
      limits:
        cpu: '250m'
        memory: '128Mi'
    ipAddresses:
      - 10.1.1.17

  priorityClassName: ''

openldap:
  enabled: false
  upstreamURI: 'ldaps://ldap.gslb.mylogin.space:636'
  tls:
    secretName: myloginspace-default-certificates
