apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: aaa-authentik

  labels:
    lan-mode: 'private'
    resolvemy.host/gw: '{{ .Values.gateway.name }}'
    resolvemy.host/gw-ns: '{{ .Values.gateway.namespace }}' 
    resolvemy.host/security: 'public'
    resolvemy.host/env: '{{ .Values.env }}'

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.gateway.namespace }}
      name: {{ .Values.gateway.name }}
      sectionName: https-myloginspace

  hostnames:
    {{- range required "route.hostnames must contain at least one hostname" .Values.route.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: {{ .Release.Name }}-authentik-server
          port: 80
          weight: 1

        {{- range $index, $peer := .Values.peers }}
        - group: gateway.envoyproxy.io
          kind: Backend
          name: aaa-server-{{ $peer.cluster }}
          weight: 1
        {{- end }}

      retry:
        attempts: 5
        backoff: 100ms
        codes:
          - 500
          - 404
      
      timeouts:
        backendRequest: 0s
        request: 0s

      matches:
        - path:
            type: PathPrefix
            value: /
