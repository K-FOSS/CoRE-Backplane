apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ .Release.Name }}

spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aaa-authentik
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aaa-authentik-k8gb

  cors:
    allowOrigins:
      - 'https://office.mylogin.space'
      - 'https://idp.mylogin.space'
      - 'https://*.resolvemy.host'
    allowMethods:
      - GET
      - POST
    allowHeaders:
    - 'authorization'
