{{- if .Values.authentik.radius.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: test-radius
    app.kubernetes.io/name: myloginspace-radius
    lan-mode: 'private'
    wan-mode: 'public'

  annotations:
    consul.hashicorp.com/service-name: radius
    external-dns.alpha.kubernetes.io/hostname: 'radius.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.mylogin.space{{ with .Values.authentik.radius.additionalExternalDNSHostname }},{{ . }}{{ end }}'
    {{- if .Values.authentik.radius.clusterMesh.enabled }}
    service.cilium.io/affinity: 'local'
    service.cilium.io/global: 'true'
    service.cilium.io/global-sync-endpoint-slices: 'true'
    {{- end }}

  name: myloginspace-radius

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: myloginspace-radius

  ports:
    # Plaintext radius
    - name: tcp-radius
      protocol: TCP
      appProtocol: radius
      targetPort: 1812
      port: 1812

    - name: udp-radius
      protocol: UDP
      appProtocol: radius
      targetPort: 1812
      port: 1812

    # Prometheus Metrics
    - name: http-metrics
      protocol: TCP
      appProtocol: radiuss
      targetPort: 9300
      port: 9300

  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
{{- end }}
