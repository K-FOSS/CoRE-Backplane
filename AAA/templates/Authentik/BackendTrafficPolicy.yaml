apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: passive-health-check
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aaa-authentik
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aaa-authentik-k8gb

  timeout:
    http:
      requestTimeout: 120s
      maxStreamDuration: 0s

  retry:
    numRetries: 2
    retryOn:
      triggers:
        - connect-failure
        - refused-stream
        - reset
        - retriable-status-codes
      httpStatusCodes:
        - 408
        - 429
        - 500
        - 502
        - 503
        - 504
    perRetry:
      timeout: 8s
      backOff:
        baseInterval: 100ms
        maxInterval: 1s
