apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: passive-health-check
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aaa-authentik
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: aaa-authentik-k8gb

  timeout:
    http:
      requestTimeout: 0s
      maxStreamDuration: 0s

  telemetry:
    tracing:
      # Route-level tracing overrides the shared EnvoyProxy sampling rate.
      samplingFraction: 1.0
