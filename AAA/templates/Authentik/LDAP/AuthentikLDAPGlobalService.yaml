{{- if and .Values.authentik.ldap.enabled .Values.authentik.ldap.clusterMesh.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: test-ldap-global
    app.kubernetes.io/name: myloginspace-ldap
    app.kubernetes.io/component: 'global'
    {{- with .Values.authentik.ldap.globalService.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  annotations:
    service.cilium.io/affinity: 'local'
    service.cilium.io/global: 'true'
    service.cilium.io/global-sync-endpoint-slices: 'true'
    {{- with .Values.authentik.ldap.globalService.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}

  name: myloginspace-ldap-global

spec:
  type: {{ .Values.authentik.ldap.globalService.type | squote }}
  {{- if eq .Values.authentik.ldap.globalService.type "LoadBalancer" }}
  {{- with .Values.authentik.ldap.globalService.loadBalancerClass }}
  loadBalancerClass: {{ . | squote }}
  {{- end }}
  allocateLoadBalancerNodePorts: {{ .Values.authentik.ldap.globalService.allocateLoadBalancerNodePorts }}
  externalTrafficPolicy: {{ .Values.authentik.ldap.globalService.externalTrafficPolicy | squote }}
  {{- end }}

  selector:
    app.kubernetes.io/name: myloginspace-ldap

  ports:
    # Plaintext LDAP
    - name: tcp-ldap
      protocol: TCP
      appProtocol: ldap
      targetPort: 3389
      port: 389

    - name: udp-ldap
      protocol: UDP
      appProtocol: ldap
      targetPort: 3389
      port: 389

    # TLS LDAP
    - name: tcp-ldaps
      protocol: TCP
      appProtocol: ldaps
      targetPort: 6636
      port: 636

    - name: udp-ldaps
      protocol: UDP
      appProtocol: ldaps
      targetPort: 6636
      port: 636

    # Prometheus Metrics
    - name: http-metrics
      protocol: TCP
      appProtocol: ldaps
      targetPort: 9300
      port: 9300

  ipFamilies:
    - IPv4
  ipFamilyPolicy: SingleStack
  sessionAffinity: None
{{- end }}
