apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: '{{ .Values.seaweed.name }}-iam'
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  secretStoreRef:
    kind: '{{ .Values.seaweed.oidc.secretStoreRef.kind }}'
    name: '{{ .Values.seaweed.oidc.secretStoreRef.name }}'
  target:
    name: '{{ .Values.seaweed.name }}-iam'
    creationPolicy: 'Owner'
    template:
      engineVersion: 'v2'
      type: 'Opaque'
      data:
        iam.json: |-
          {
            "sts": {
              "tokenDuration": "1h",
              "maxSessionLength": "12h",
              "issuer": "seaweedfs-sts-yxl",
              "signingKey": "{{`{{ printf "seaweedfs-sts-yxl:%s" .OIDCClientSecret | sha256sum | b64enc }}`}}"
            },
            "providers": [
              {
                "name": "authentik-yxl",
                "type": "oidc",
                "enabled": true,
                "config": {
                  "issuer": {{ .Values.seaweed.oidc.issuer | toJson }},
                  "clientId": {{`{{ .OIDCClientID | toJson }}`}},
                  "clientSecret": {{`{{ .OIDCClientSecret | toJson }}`}},
                  "scopes": ["openid", "profile", "email", "minio"],
                  "roleMapping": {
                    "rules": [
                      {
                        "claim": "policy",
                        "value": {{ .Values.seaweed.oidc.adminPolicyClaim | toJson }},
                        "role": "arn:aws:iam::role/S3AdminRole"
                      }
                    ],
                    "defaultRole": "arn:aws:iam::role/S3ReadOnlyRole"
                  }
                }
              }
            ],
            "policies": [
              {
                "name": "S3ReadOnlyPolicy",
                "document": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {"Effect": "Allow", "Action": ["s3:List*", "s3:Get*"], "Resource": ["*"]}
                  ]
                }
              },
              {
                "name": "S3AdminPolicy",
                "document": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {"Effect": "Allow", "Action": ["s3:*"], "Resource": ["*"]}
                  ]
                }
              }
            ],
            "roles": [
              {
                "roleName": "S3ReadOnlyRole",
                "roleArn": "arn:aws:iam::role/S3ReadOnlyRole",
                "attachedPolicies": ["S3ReadOnlyPolicy"],
                "trustPolicy": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {"Federated": "*"},
                      "Action": ["sts:AssumeRoleWithWebIdentity"],
                      "Condition": {"StringEquals": {"seaweed:Issuer": {{ .Values.seaweed.oidc.issuer | toJson }}}}
                    }
                  ]
                }
              },
              {
                "roleName": "S3AdminRole",
                "roleArn": "arn:aws:iam::role/S3AdminRole",
                "attachedPolicies": ["S3AdminPolicy"],
                "trustPolicy": {
                  "Version": "2012-10-17",
                  "Statement": [
                    {
                      "Effect": "Allow",
                      "Principal": {"Federated": "*"},
                      "Action": ["sts:AssumeRoleWithWebIdentity"],
                      "Condition": {"StringEquals": {"seaweed:Issuer": {{ .Values.seaweed.oidc.issuer | toJson }}}}
                    }
                  ]
                }
              }
            ]
          }
  data:
    - secretKey: OIDCClientID
      remoteRef:
        key: '{{ .Values.seaweed.oidc.remoteKey }}'
        property: '{{ .Values.seaweed.oidc.clientIdProperty }}'
    - secretKey: OIDCClientSecret
      remoteRef:
        key: '{{ .Values.seaweed.oidc.remoteKey }}'
        property: '{{ .Values.seaweed.oidc.clientSecretProperty }}'
