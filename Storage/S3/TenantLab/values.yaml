cluster:
  name: k8s
  domain: cluster.local

gateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

datacenter: dc1

region: yxl

global:
  test: 'test'

crossplane:
  enabled: true

  providerName: ''

  peers: []

prometheus:
  enabled: true

s3:
  replicas: 1
  
  nodeSelector: {}

  storage:
    enabled: true

    size: 150G

    # The chart creates a release-scoped Longhorn StorageClass with two
    # replicas. Leave this empty unless a deliberate existing class is needed.
    storageClass: ''

    # Bind the chart-managed PVC to an existing PV (for example, a Longhorn PV).
    # Leave empty to let Kubernetes provision a new volume.
    volumeName: ''

    # These values must match the existing Longhorn volume when volumeName is set.
    fsType: 'xfs'
    volumeAttributes:
      dataEngine: 'v1'
      numberOfReplicas: '2'
      staleReplicaTimeout: '20'

    # Mount an existing PVC instead of creating a PVC managed by this chart.
    existingClaim: ''

  secrets:
    enabled: true

    rootPrefix: S3/CoRE

    secretStoreRef:
      kind: ClusterSecretStore
      name: mainvault-core

authentik:
  autoconfigure: true

tenant:
  name: core

ldap:
  enabled: true

  base: 'dc=ldap,dc=mylogin,dc=space'

admin:
  defaultAdmin: august@mylogin.space

  dashboard:
    enabled: true

    domainKey: s3-dashboard

oidc:
  enabled: true

  indexKey: minio-s3

  scopes:
    - openid
    - profile
    - email
    - minio

  groups:
    - Server Admins

  authentik:
    urlBase: https://idp.mylogin.space

terraform:
  authentikProvider: authentik

domain: mylogin.space
