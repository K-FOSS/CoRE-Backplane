apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: 'core-garage-operator-collectors-metrics-reader'
rules:
  - nonResourceURLs: ['/metrics']
    verbs: ['get']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: 'core-garage-operator-collectors-metrics-reader'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: 'core-garage-operator-collectors-metrics-reader'
subjects:
  - kind: ServiceAccount
    name: 'core-dc1-talos-prod-collectors-alloy'
    namespace: 'core-prod'
