garage-operator:
  enabled: true
  image:
    repository: 'ghcr.io/rajsinghtech/garage-operator'
    digest: 'sha256:f76c6a4412c7ac50d3bf1ff447fe1586174437ad8989a659e97e66930395335d'
  defaultGarageImage: 'dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020'
  watchNamespaces:
    - 'core-prod'
  webhooks:
    enabled: true
    failurePolicy: 'Fail'
    certManager:
      enabled: true
      issuerKind: 'Issuer'
      issuerName: ''
  crds:
    install: true
    keep: true
    annotations:
      argocd.argoproj.io/sync-options: 'Replace=true'
  serviceMonitor:
    enabled: true
    interval: '60s'
  grafanaDashboard:
    enabled: true
    namespace: 'core-prod'
    labels:
      grafana_dashboard: 'true'

metricsCollectorServiceAccount: 'core-dc1-talos-prod-collectors-alloy'
