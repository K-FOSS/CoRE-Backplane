apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: cdn-{{ required "cdn.name is required" .Values.cdn.name }}
  
  labels:
    wan-mode: public
    lan-mode: private

  annotations:
    argocd.argoproj.io/sync-wave: '0'

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: core-prod
      name: main-gw

  hostnames:
    - {{ required "cdn.url is required" .Values.cdn.url | quote }}

  rules:
    - backendRefs:
        - group: ''
          kind: Service
          name: cdn-{{ .Values.cdn.name }}
          port: 80
          weight: 1

      matches:
        - path:
            type: PathPrefix
            value: /
