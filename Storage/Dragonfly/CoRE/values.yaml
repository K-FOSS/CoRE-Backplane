datacenter: dc1

region: yxl

cluster:
  name: k8s
  domain: cluster.local

# YVR/HPC2 uses the load-testing taint. The fleet ApplicationSet supplies this
# only for core-home1-talos-prod; other Dragonfly targets remain unchanged.
tolerations: []

replicas: 2

terraform:
  enabled: true

  lab:
    enabled: true

tiering:
  enabled: false
  storageClass: 'ssd-storage'
  size: '10Gi'

snapshots:
  cron: '*/30 * * * *'
  storageClass: 'ssd-storage'
  size: '30Gi'

rollout:
  newReplicaStabilizationSeconds: 300
