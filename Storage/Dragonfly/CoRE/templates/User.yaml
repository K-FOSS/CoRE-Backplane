apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: dragonfly-core

spec:
  name: Dragonfly {{ .Values.region }}-{{ .Values.datacenter }}-{{ .Values.cluster.name }}

  s3:
    enabled: true

    createBuckets: true
    createServiceAccount: true

    crossplane:
      terraformProvider: 's3-{{ .Values.region }}-{{ .Values.datacenter }}-core'
      crossplaneProvider: 's3-{{ .Values.region }}-{{ .Values.datacenter }}-core'

    buckets:
      - dragonfly-core-{{ .Values.region }}-{{ .Values.datacenter }}-{{ .Values.cluster.name }}

    writeServiceAccountCredentialsSecretRef:
      name: 'dragonfly-core-s3-service-account-creds'
      namespace: '{{ .Release.Namespace }}'

  writeConnectionSecretToRef:
    name: dragonfly-core-creds
