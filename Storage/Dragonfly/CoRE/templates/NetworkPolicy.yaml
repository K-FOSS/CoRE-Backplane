apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-core
spec:
  podSelector:
    matchLabels:
      dragonfly.dragonflydb.io/name: dragonfly-core
  policyTypes:
    - Ingress
  ingress:
    # Preserve the existing Redis endpoint for current clients.
    - ports:
        - port: 6379
          protocol: TCP
