apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-core
spec:
  podSelector:
    matchLabels:
      dragonfly.dragonflydb.io/name: dragonfly-core
  policyTypes:
    - Ingress
  ingress:
    # Preserve the existing Redis endpoint for current clients.
    - ports:
        - port: 6379
          protocol: TCP

    # PGPool's Memcached client has no Dragonfly password/TLS integration.
    # A podSelector without a namespaceSelector only admits local PGPool pods.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pgpool
      ports:
        - port: 11211
          protocol: TCP
