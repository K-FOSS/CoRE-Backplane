apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-core
spec:
  podSelector:
    matchLabels:
      dragonfly.dragonflydb.io/name: dragonfly-core
  policyTypes:
    - Ingress
  ingress:
    # Preserve the existing Redis endpoint for current clients.
    - ports:
        - port: 6379
          protocol: TCP
    # Mimir's Memcached client has no application-level authentication. Keep
    # the cache listener limited to Mimir pods in this namespace.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: core-prod
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/controller
                operator: In
                values:
                  - mimir
                  - querier
      ports:
        - port: 11211
          protocol: TCP
