apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-dragonfly
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: 'true'
  annotations:
    k8s-sidecar-target-directory: 'Infrastructure'
data:
  dragonfly.url: 'https://raw.githubusercontent.com/dragonflydb/dragonfly-operator/v1.8.0/monitoring/grafana-dashboard.json'
