apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-core
spec:
  replicas: 2

  # Grafana Mimir uses Dragonfly's Memcached protocol for disposable query,
  # index, chunk and metadata caches. The main Redis/TLS port remains unchanged.
  memcachedPort: 11211

  authentication:
    passwordFromSecret:
      key: password
      name: dragonfly-core-password

  serviceSpec:
    annotations:
      external-dns.kubernetes.io/hostname: 'dragonfly.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.mylogin.space'
      # TODO(external-dns-021): Remove the legacy annotation after upgrading ExternalDNS.
      external-dns.alpha.kubernetes.io/hostname: dragonfly.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.mylogin.space
    labels:
      wan-mode: public

  tlsSecretRef:
    name: myloginspace-default-certificates
    namespace: core-prod

  customReadinessProbeConfigMap:
    name: dragonfly-core-readiness

  enableReplicationReadinessGate: true

  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: dragonfly-core-s3-service-account-creds
          key: AccessKey

    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: dragonfly-core-s3-service-account-creds
          key: SecretAccessKey

  args:
    - --proactor_threads=2
    - --lock_on_hashtags
    - --s3_endpoint=s3.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.mylogin.space
    - --dbnum=256

  annotations:
    secret.reloader.stakater.com/reload: 'dragonfly-core-s3-service-account-creds,dragonfly-core-password'

  snapshot:
    cron: '*/5 * * * *'
    dir: '/data'
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: '{{ .Values.snapshots.size }}'
      storageClassName: '{{ .Values.snapshots.storageClass }}'

  {{- if .Values.tiering.enabled }}
  tiering:
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: '{{ .Values.tiering.size }}'
      storageClassName: '{{ .Values.tiering.storageClass }}'
  {{- end }}

  resources:
    requests:
      cpu: 500m
      memory: 500Mi

    limits:
      cpu: '2'
      memory: 750Mi
