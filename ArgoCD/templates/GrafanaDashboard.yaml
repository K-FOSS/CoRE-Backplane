apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-argocd
  namespace: core-prod
  labels:
    grafana_dashboard: 'true'
  annotations:
    grafana_folder: 'Ops/ArgoCD'
data:
  argocd-application-overview.url: 'https://grafana.com/api/dashboards/19974/revisions/1/download'
  argocd-project-dashboard.url: 'https://raw.githubusercontent.com/argoproj/argo-cd/v3.6.1/examples/dashboard.json'
