apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: argocd-webhook-route

  labels:
    wan-mode: 'public'
    lan-mode: 'private'

spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: {{ .Values.gateway.namespace }}
      name: {{ .Values.gateway.name }}
      {{- with .Values.gateway.sectionName }}
      sectionName: {{ . }}
      {{- end }}

  hostnames:
    - 'argocd.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.{{ .Values.domain }}'

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/webhook
      backendRefs:
        - group: ''
          kind: Service
          name: argocd-server
          # server.insecure terminates TLS at the Gateway; the Service's
          # cleartext HTTP port is therefore the correct backend.
          port: 80
          weight: 1

      timeouts:
        request: 300s
        backendRequest: 300s
