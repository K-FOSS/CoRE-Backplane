apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-lovely-plugin
spec:
  template:
    spec:
      containers:
        - name: lovely-plugin
          #
          # TODO: Get renovate or similar auto updating this
          #
          image: ghcr.io/crumbhole/lovely-vault-plugin:1.2.5

          envFrom:
            - secretRef:
                name: argocd-vault-config

          env:
            - name: PLUGIN_NAME
              value: argocd-lovely-plugin

            - name: ARGOCD_EXEC_TIMEOUT
              value: 300s

            - name: LOVELY_HELM_PATH
              value: '/opt/helm-cache-wrappers/helm'

            - name: PATH
              value: '/opt/helm-cache-wrappers:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin'

          securityContext:
            runAsNonRoot: true
            runAsUser: 999

          resources:
            limits:
              cpu: '2'
              memory: 16Gi
            requests:
              cpu: '100m'
              memory: '128Mi'


          volumeMounts:
            # Import the repo-server's plugin binary
            - name: var-files
              mountPath: /var/run/argocd
              
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
              
              # Starting with v2.4, do NOT mount the same tmp volume as the repo-server container. The filesystem separation helps
              # mitigate path traversal attacks.

            - name: lovely-tmp
              mountPath: /tmp

            - name: 'helm-cache-wrappers'
              mountPath: '/opt/helm-cache-wrappers'
              readOnly: true
              
      volumes:
        - name: 'helm-cache-wrappers'
          configMap:
            name: 'argocd-helm-cache-wrappers'
            defaultMode: 365
            items:
              - key: 'argocd-lovely-plugin'
                path: 'argocd-lovely-plugin'
              - key: 'helm'
                path: 'helm'

        # A temporary directory for the tool to work in.
        - name: lovely-tmp
          emptyDir:
            sizeLimit: 4Gi
            medium: Memory
