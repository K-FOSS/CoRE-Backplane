postgres-operator:
  # Site-specific operator behavior.
  enableJsonLogging: true

  configGeneral:
    docker_image: 'kristianfoss/psql:core'
    # Argo CD owns the CRD schemas rendered by the pinned chart.
    enable_crd_registration: false
    # Keep Patroni on the existing Endpoint DCS during the v1 to v2 upgrade.
    # Switching replicated clusters to ConfigMaps needs a separate scale-in migration.
    kubernetes_use_configmaps: false
    max_instances: 3

  configUsers:
    enable_password_rotation: true

  configMajorVersionUpgrade:
    major_version_upgrade_mode: 'full'
    minimal_major_version: '14'
    target_major_version: '17'

  configKubernetes:
    enable_owner_references: true
    enable_persistent_volume_claim_deletion: false
    enable_readiness_probe: true
    enable_secrets_deletion: false
    inherited_labels:
      - 'wan-mode'
      - 'lan-mode'
      - 'argocd.argoproj.io/instance'
    pod_environment_configmap: 'core-prod/psql-ops-override'
    pod_management_policy: 'parallel'
    spilo_runasuser: 101
    spilo_runasgroup: 103
    spilo_fsgroup: 103

  configPostgresPodResources:
    default_cpu_limit: '2'
    default_memory_limit: '2Gi'
    default_memory_request: '256Mi'
    max_memory_request: '30G'
    min_memory_limit: '2Gi'

  configLoadBalancer:
    db_hosted_zone: 'mylogin.space'
    master_dns_name_format: '{cluster}.{hostedzone}'
    replica_dns_name_format: '{cluster}-repl.{hostedzone}'

  configAwsOrGcp:
    aws_region: 'us-east-1'

  configLogicalBackup:
    logical_backup_docker_image: 'ghcr.io/zalando/postgres-operator/logical-backup:v2.0.3'
    logical_backup_s3_region: 'us-east-1'
    logical_backup_s3_endpoint: 's3.mylogin.space'

  priorityClassName: 'tier2-priority'

  podPriorityClassName:
    create: false

  configDebug:
    debug_logging: false

  readinessProbe:
    periodSeconds: 30
