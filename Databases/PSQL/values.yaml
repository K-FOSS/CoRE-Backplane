restore: true

psql:
  #
  # Control wether this is a hub or spoke deployment
  #
  hub: true

  #
  # Optional [Postgres Operator](https://postgres-operator.readthedocs.io/en/latest/administrator/)
  # Controller ID to allow for multiple operators per 
  # 
  #
  controllerID: ''

  #
  # Configure if this is a standby (spoke) cluster or not
  #
  standby: false

  # Required when standby is enabled. The owning ApplicationSet derives this
  # from the single fleet entry configured with values.hub=true.
  standbyHost: ''

  # Zalando Postgres Operator maintenance windows are evaluated in UTC.
  # 10:00-12:00 UTC is 02:00-04:00 PST (UTC-08:00).
  maintenanceWindows:
    - '10:00-12:00'

  tuning:
    maxConnections: 4096
    maxWorkerProcesses: 8
    maxParallelWorkers: 4
    maxParallelWorkersPerGather: 2

  secretStore:
    - name: mainvault-core
      kind: ClusterSecretStore
  
  #
  # Operator controlled postgres users/user credentials to push to [Vault](../../Hashicorp/Vault) 
  # via [External Secrets Operator](../../Operations/Secrets)
  #
  pushUsers:
    - postgres
    - standby
    - opsadmin

monitoring:
  postgresExporter:
    enabled: true
    image: 'quay.io/prometheuscommunity/postgres-exporter:v0.18.1'
    port: 9187



#
# Configuration related to the Kubernetes Cluster and it's DNS domain
#
cluster:
  name: k8s
  domain: cluster.local

gateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

#
# Tenant configuration
# See [Tenant Model](../)
#
tenant:
  domain: mylogin.space

datacenter: dc1

region: yxl

#
# LDAP connection settings shared by PostgreSQL and its supporting services.
# Credentials remain sourced from Vault and are not configured here.
#
ldap:
  server: ldap.mylogin.space
  port: 389
  baseDN: ou=users,dc=ldap,dc=mylogin,dc=space
  bindDN: cn=<path:CORE0_SITE1/data/PSQL/LDAP#Username>,ou=users,dc=ldap,dc=mylogin,dc=space
  searchAttribute: cn

  postgres:
    server: ldap-home1.mylogin.space

  pooler:
    server: ldap-home1.mylogin.space
    port: 636
    scheme: ldaps

  pgadmin:
    serverURI: ldap://ldap.mylogin.space:389
    baseDN: dc=ldap,dc=mylogin,dc=space
    searchBaseDN: dc=ldap,dc=mylogin,dc=space
    usernameAttribute: cn
    searchFilter: (objectclass=user)

pooler:
  # 64 children x 4 pools x 3 PGPool replicas allows up to 768 pooled
  # backend connections: 18.75% of PostgreSQL's 4096 connection capacity.
  numInitChildren: 64
  maxPool: 4

  connections:
    listenBacklogMultiplier: 4
    reservedConnections: 4
    childLifeTime: 0
    childMaxConnections: 1000
    connectionLifeTime: 300

  healthCheck:
    period: 10
    timeout: 5
    maxRetries: 3
    connectTimeout: 5000

  streamingReplicationCheck:
    period: 10

  failover:
    autoFailback: true
    autoFailbackInterval: 300
    # Keep searching indefinitely when failover needs to find a primary.
    searchPrimaryNodeTimeout: 0

  relationCache:
    expire: 300
    size: 1024

  queryCache:
    method: memcached
    host: dragonfly-pgpool
    port: 11211

    dragonfly:
      enabled: true
      replicas: 3
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: '1'
          memory: 512Mi

  peers:
    - hostname: psql-int-rep.mylogin.space
      port: 5432

  logs:
    level: warning

pgadmin:
  domain: 'pgadmin.k8s.dc1.yxl.mylogin.space'

pgadmin4:
  # LDAP settings and the required bootstrap password are provided by the
  # chart-owned pgadmin-envs ExternalSecret.
  existingSecret: 'pgadmin-envs'

  env:
    email: 'pgadmin@mylogin.space'

  envVarsFromSecrets:
    - 'pgadmin-envs'

  # Keep pgAdmin state across pod replacement. The default storage class is
  # selected by the target cluster.
  persistentVolume:
    enabled: true
    size: '10Gi'

  # pgAdmin can take time to initialize its persistent configuration database.
  livenessProbe:
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 15
    successThreshold: 1
    failureThreshold: 3

  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 60
    timeoutSeconds: 15
    successThreshold: 1
    failureThreshold: 3
