apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgpool

  labels:
    app.kubernetes.io/name: pgpool

spec:
  replicas: {{ .Values.pooler.replicas }}

  revisionHistoryLimit: 3

  minReadySeconds: 60

  selector:
    matchLabels:
      app.kubernetes.io/name: pgpool

  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgpool
        logs: loki-myloginspace

    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: pgpool


      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.pooler.memoryVolumes.tmp.sizeLimit }}

        - name: shared-memory
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.pooler.memoryVolumes.sharedMemory.sizeLimit }}

        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.pooler.memoryVolumes.runtime.sizeLimit }}

        - name: config-vol
          secret:
            secretName: 'pgpool-config'
            defaultMode: 420
            items:
              - key: pgpool.conf
                path: pgpool.conf
                mode: 420

              - key: pool_hba.conf
                path: pool_hba.conf
                mode: 420

              - key: pool_passwd
                path: pool_passwd

        - name: tls
          secret:
            defaultMode: 416
            secretName: myloginspace-default-certificates

      securityContext:
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70

      containers:
        - name: pgpool
          image: '{{ .Values.pooler.image.repository }}:{{ .Values.pooler.image.tag }}'
          imagePullPolicy: {{ .Values.pooler.image.pullPolicy }}

          resources:
            {{- toYaml .Values.pooler.resources | nindent 12 }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          ports:
            - name: psql
              containerPort: 5432

          env:
            - name: PGPOOL_CONF_VOLUME
              value: /config

            - name: PGPOOL_INSTALL_DIR
              value: /opt/pgpool-II

            - name: CHECK_PGCONNECT_TIMEOUT
              value: '2'

            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: opsadmin.psql-main.credentials.postgresql.acid.zalan.do

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: opsadmin.psql-main.credentials.postgresql.acid.zalan.do

            - name: CHECK_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: opsadmin.psql-main.credentials.postgresql.acid.zalan.do

            - name: CHECK_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: opsadmin.psql-main.credentials.postgresql.acid.zalan.do

            - name: PGPOOL_PCP_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: opsadmin.psql-main.credentials.postgresql.acid.zalan.do

            - name: PGPOOL_PCP_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: opsadmin.psql-main.credentials.postgresql.acid.zalan.do

          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - '-ec'
                  - |
                    /opt/pgpool-II/bin/pcp_stop_pgpool -m smart --host localhost --user opsadmin

          readinessProbe:
            tcpSocket:
              port: psql

            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - /opt/pgpool-II/bin/Healthcheck.sh
            initialDelaySeconds: 30

            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          volumeMounts:
            - name: tmp
              mountPath: /tmp

            - name: shared-memory
              mountPath: /dev/shm

            - name: runtime
              mountPath: /var/run/postgresql

            - name: tls
              mountPath: /config/tls
              readOnly: true

            - name: config-vol
              mountPath: /config
              readOnly: true
