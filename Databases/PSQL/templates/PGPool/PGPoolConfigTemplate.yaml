apiVersion: v1
kind: ConfigMap
metadata:
  name: pgpool-config

  labels:
    app.kubernetes.io/name: pgpool

data:
  auto-recovery.sh: |
    #!/bin/sh
    set -eu

    : "${CHECK_USER:?CHECK_USER is required}"
    : "${CHECK_PASSWORD:?CHECK_PASSWORD is required}"
    : "${PGPOOL_PCP_USER:?PGPOOL_PCP_USER is required}"
    : "${PGPOOL_PCP_PASSWORD:?PGPOOL_PCP_PASSWORD is required}"

    pcp_passfile=/tmp/pgpool/pcp-pass
    umask 077
    printf '127.0.0.1:9898:%s:%s\n' "${PGPOOL_PCP_USER}" "${PGPOOL_PCP_PASSWORD}" > "${pcp_passfile}"
    trap 'rm -f "${pcp_passfile}"' EXIT INT TERM

    while :; do
      nodes="$({
        PGCONNECT_TIMEOUT="${CHECK_PGCONNECT_TIMEOUT:-2}" \
        PGPASSWORD="${CHECK_PASSWORD}" \
          psql \
            --no-password \
            --no-psqlrc \
            --quiet \
            --tuples-only \
            --no-align \
            --set=ON_ERROR_STOP=1 \
            --host=127.0.0.1 \
            --port=5432 \
            --username="${CHECK_USER}" \
            --dbname=template1 \
            --command='SHOW pool_nodes'
      } 2>/dev/null)" || {
        sleep "${AUTO_RECOVERY_POLL_PERIOD:-10}"
        continue
      }

      # Only attach a detached node after its endpoint independently reports
      # that it is a primary. Standby attachment remains owned by Pgpool's
      # streaming-replication auto_failback logic.
      printf '%s\n' "${nodes}" | awk -F '|' '
        {
          for (field = 1; field <= NF; field++) {
            gsub(/^[[:space:]]+|[[:space:]]+$/, "", $field)
          }
          if ($4 == "down") {
            print $1 "|" $2 "|" $3
          }
        }
      ' | while IFS='|' read -r node host port; do
        [ -n "${node}" ] || continue

        is_primary="$({
          PGCONNECT_TIMEOUT="${AUTO_RECOVERY_CONNECT_TIMEOUT:-2}" \
          PGPASSWORD="${CHECK_PASSWORD}" \
            psql \
              --no-password \
              --no-psqlrc \
              --quiet \
              --tuples-only \
              --no-align \
              --set=ON_ERROR_STOP=1 \
              --host="${host}" \
              --port="${port}" \
              --username="${CHECK_USER}" \
              --dbname=template1 \
              --command='SELECT NOT pg_is_in_recovery()'
        } 2>/dev/null)" || continue

        [ "${is_primary}" = 't' ] || continue

        PCPPASSFILE="${pcp_passfile}" \
          /opt/pgpool-II/bin/pcp_attach_node \
            -h 127.0.0.1 \
            -p 9898 \
            -U "${PGPOOL_PCP_USER}" \
            -n "${node}" \
            -w \
          >/dev/null 2>&1 || true
      done

      sleep "${AUTO_RECOVERY_POLL_PERIOD:-10}"
    done

  readiness.sh: |
    #!/bin/sh
    set -eu

    : "${CHECK_USER:?CHECK_USER is required}"
    : "${CHECK_PASSWORD:?CHECK_PASSWORD is required}"

    nodes="$({
      PGCONNECT_TIMEOUT="${CHECK_PGCONNECT_TIMEOUT:-2}" \
      PGPASSWORD="${CHECK_PASSWORD}" \
        psql \
          --no-password \
          --no-psqlrc \
          --quiet \
          --tuples-only \
          --no-align \
          --set=ON_ERROR_STOP=1 \
          --host=127.0.0.1 \
          --port=5432 \
          --username="${CHECK_USER}" \
          --dbname=template1 \
          --command='SHOW pool_nodes'
    } 2>/dev/null)" || exit 1

    # SHOW POOL_NODES returns pipe-delimited, unaligned fields. Require an
    # attached primary instead of accepting any incidental "primary" text.
    printf '%s\n' "${nodes}" | awk -F '|' '
      {
        for (field = 1; field <= NF; field++) {
          gsub(/^[[:space:]]+|[[:space:]]+$/, "", $field)
        }
        if ($4 == "up" && $7 == "primary") {
          found = 1
        }
      }
      END { exit(found ? 0 : 1) }
    '

  pgpool.conf: |
    listen_addresses = '*'
    port = 5432
    socket_dir = '/var/run/postgresql'
    pcp_listen_addresses = '*'
    pcp_port = 9898
    pcp_socket_dir = '/var/run/postgresql'
    pool_passwd = '/tmp/pgpool/pool_passwd'
    logdir = '/tmp/pgpool'
    status_file_dir = '/tmp/pgpool'
    pid_file_name = '/tmp/pgpool/pgpool.pid'

    # Emit application logs only to the container's stderr stream. Kubernetes
    # and the cluster log collector own persistence and retention.
    log_destination = 'stderr'
    logging_collector = off
    log_min_messages = '{{ .Values.pooler.logs.level }}'

    {{ $replicas := (include "psql.mylogin.space/replicas" $) }}
    {{ range $index, $id := untilStep (int 0) (int $replicas) 1 }}
    backend_hostname{{ $index }} = 'psql-main-{{ $index }}.{{ $.Release.Namespace }}.svc.{{ $.Values.cluster.domain }}'
    backend_port{{ $index }} = 5432
    backend_weight{{ $index }} = 25
    # Zalando/Patroni uses the pod name as the walreceiver application_name.
    backend_application_name{{ $index }} = 'psql-main-{{ $index }}'
    {{ end }}

    {{ range $index, $pooler := .Values.pooler.peers }}
    {{ $backendID := add (int $replicas) $index }}
    backend_hostname{{ $backendID }} = '{{ $pooler.hostname }}'
    backend_port{{ $backendID }} = {{ default 5432 $pooler.port }}
    backend_weight{{ $backendID }} = 1
    {{ end }}

    backend_clustering_mode = 'streaming_replication'

    # Backend health and role discovery.
    health_check_user = '{{ `{{ .Username }}` }}'
    health_check_password = 'TEXT{{ `{{ .Password }}` }}'
    health_check_period = {{ .Values.pooler.healthCheck.period }}
    health_check_timeout = {{ .Values.pooler.healthCheck.timeout }}
    health_check_max_retries = {{ .Values.pooler.healthCheck.maxRetries }}
    health_check_retry_delay = {{ .Values.pooler.healthCheck.retryDelay }}
    connect_timeout = {{ .Values.pooler.healthCheck.connectTimeout }}

    sr_check_user = '{{ `{{ .Username }}` }}'
    sr_check_password = 'TEXT{{ `{{ .Password }}` }}'
    sr_check_period = {{ .Values.pooler.streamingReplicationCheck.period }}

    # Client admission and backend connection caching.
    enable_pool_hba = on
    num_init_children = {{ .Values.pooler.numInitChildren }}
    max_pool = {{ .Values.pooler.maxPool }}
    listen_backlog_multiplier = {{ .Values.pooler.connections.listenBacklogMultiplier }}
    reserved_connections = {{ .Values.pooler.connections.reservedConnections }}
    serialize_accept = on
    child_life_time = {{ .Values.pooler.connections.childLifeTime }}
    child_max_connections = {{ .Values.pooler.connections.childMaxConnections }}
    connection_life_time = {{ .Values.pooler.connections.connectionLifeTime }}
    connection_cache = on
    client_idle_limit = 0

    # Query-cache metadata remains pod-local while cached results are shared by
    # the site's PGPool replicas through the local Dragonfly Service.
    memory_cache_enabled = on
    memqcache_method = '{{ .Values.pooler.queryCache.method }}'
    {{- if eq .Values.pooler.queryCache.method "memcached" }}
    memqcache_memcached_host = '{{ .Values.pooler.queryCache.host }}'
    memqcache_memcached_port = {{ .Values.pooler.queryCache.port }}
    {{- end }}
    memqcache_oiddir = '/tmp/pgpool/oiddir'

    # Query routing in streaming-replication mode.
    load_balance_mode = on
    ignore_leading_white_space = on
    read_only_function_list = ''
    write_function_list = 'nextval,setval,.*\.func_insert_.*,.*\.func_delete_.*,.*\.func_update_.*,.*\.func_nlb_.*,(scc|report|report_query)\..*'
    allow_sql_comments = on
    disable_load_balance_on_write = 'transaction'
    statement_level_load_balance = off

    # Let periodic health checks detach failed nodes. Session-level errors and
    # administrative backend termination must not trigger fleet-wide failover.
    failover_on_backend_error = off
    failover_on_backend_shutdown = off
    search_primary_node_timeout = {{ .Values.pooler.failover.searchPrimaryNodeTimeout }}
    auto_failback = {{ ternary "on" "off" .Values.pooler.failover.autoFailback }}
    auto_failback_interval = {{ .Values.pooler.failover.autoFailbackInterval }}

    # Shared metadata cache used to classify temporary and unlogged tables.
    relcache_expire = {{ .Values.pooler.relationCache.expire }}
    relcache_size = {{ .Values.pooler.relationCache.size }}
    check_temp_table = trace
    check_unlogged_table = on
    enable_shared_relcache = on
    relcache_query_target = primary

    # Client-side TLS.
    ssl = on
    ssl_cert = '/tls/tls.crt'
    ssl_key = '/tls/tls.key'


  pool_hba.conf: |
    local   all    all                     trust
    host    all    all        127.0.0.1/32 trust
    host    all    all        ::1/128      trust
    host    all    {{ `{{ .AAAUsername }}` }} 0.0.0.0/0    password
    host    all    {{ `{{ .OPSUsername }}` }} 0.0.0.0/0    password
    host    all    all        0.0.0.0/0    ldap ldapserver={{ .Values.ldap.pooler.server }} ldapport={{ .Values.ldap.pooler.port }} ldapscheme={{ .Values.ldap.pooler.scheme }} ldapbasedn="{{ .Values.ldap.baseDN }}" ldapbinddn="{{ .Values.ldap.bindDN }}" ldapbindpasswd="<path:CORE0_SITE1/data/PSQL/LDAP#Password>" ldapsearchattribute="{{ .Values.ldap.searchAttribute }}" backend_use_passwd=1
  pool_passwd: |
    {{ `{{ .AAAUsername }}:{{ .AAAPassword }}` }}
    {{ `{{ .OPSUsername }}:{{ .OPSPassword }}` }}
