{{ if .Values.psql.hub }}
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: pgadmin-core

spec:
  name: PGAdmin
  email: pgadmin-{{ .Values.region }}-{{ .Values.datacenter }}@mail.mylogin.space
  groups:
    - LDAPService

  writeConnectionSecretToRef:
    name: pgadmin-core
{{- end }}