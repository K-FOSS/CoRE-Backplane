apiVersion: v1
kind: ConfigMap
metadata:
  name: 'grafana-dashboard-postgresql-monitoring'
  labels:
    grafana_dashboard: 'true'
  annotations:
    grafana_folder: 'PostgreSQL'
    k8s-sidecar-target-directory: 'PostgreSQL'
data:
  postgresql-monitoring.url: |-
    https://grafana.com/api/dashboards/24298/revisions/11/download
