{{- if .Values.monitoring.pgpoolExporter.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: 'pgpool-exporter'
  labels:
    app.kubernetes.io/name: 'pgpool-exporter'
spec:
  namespaceSelector:
    matchNames:
      - '{{ .Release.Namespace }}'
  selector:
    matchLabels:
      app.kubernetes.io/name: 'pgpool-exporter'
  endpoints:
    - port: 'metrics'
      path: '/metrics'
      interval: '30s'
      scrapeTimeout: '10s'
      relabelings:
        - action: 'replace'
          targetLabel: 'job'
          replacement: 'pgpool-exporter'
        - action: 'replace'
          targetLabel: 'instance'
          sourceLabels:
            - '__meta_kubernetes_pod_name'
          regex: '(.+)'
          replacement: '{{ .Values.cluster.name }}/pgpool/$1'
{{- end }}
