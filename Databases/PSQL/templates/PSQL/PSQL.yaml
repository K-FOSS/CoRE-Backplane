apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: psql-{{ .Values.datacenter }}-{{ .Values.region }}

  labels:
    wan-mode: public

  annotations:
    acid.zalan.do/controller: '{{ .Values.psql.controllerID }}'

spec:
  teamId: psql-site-{{ .Values.datacenter }}-{{ .Values.region }}
  volume:
    size: 50Gi
    storageClass: '{{ .Values.psql.storageClass }}'

  {{- if .Values.monitoring.postgresExporter.enabled }}
  sidecars:
    - name: postgres-exporter
      image: '{{ .Values.monitoring.postgresExporter.image }}'
      imagePullPolicy: 'IfNotPresent'
      args:
        - '--port'
        - '{{ .Values.monitoring.postgresExporter.port }}'
        {{- range .Values.monitoring.postgresExporter.collectors }}
        - '--collector.{{ . }}'
        {{- end }}
      ports:
        - name: metrics
          containerPort: {{ .Values.monitoring.postgresExporter.port }}
          protocol: 'TCP'
      env:
        - name: PG_EXPORTER_DSN
          value: 'postgresql://127.0.0.1:5432/postgres?sslmode=disable'
        - name: PGUSER
          value: '$(POSTGRES_USER)'
        - name: PGPASSWORD
          value: '$(POSTGRES_PASSWORD)'
      resources:
        requests:
          cpu: '10m'
          memory: '32Mi'
        limits:
          cpu: '100m'
          memory: '128Mi'
  {{- end }}

  numberOfInstances: 3

  {{- with .Values.psql.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}

  masterServiceAnnotations:
    external-dns.kubernetes.io/hostname: 'psql-local.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.mylogin.space'
    # TODO(external-dns-031): Remove the legacy annotation after upgrading ExternalDNS.
    external-dns.alpha.kubernetes.io/hostname: 'psql-local.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.mylogin.space'

  replicaServiceAnnotations:
    external-dns.kubernetes.io/hostname: 'psql-local-rep.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.mylogin.space'
    # TODO(external-dns-034): Remove the legacy annotation after upgrading ExternalDNS.
    external-dns.alpha.kubernetes.io/hostname: 'psql-local-rep.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.mylogin.space'

  postgresql:
    version: '17'

    parameters:
      fsync: 'on'

  users:
    opsadmin:
      - superuser
      - createdb
      - LOGIN

  patroni:
    synchronous_mode: false

    pg_hba:
      - local all         all                  trust
      - local replication standby              md5
      - host replication  replicator 0.0.0.0/0 md5
      - host replication  standby    0.0.0.0/0 md5
      - host all          postgres   0.0.0.0/0 md5
      - host all          pooler     0.0.0.0/0 md5
      - host all          /^opsadmin.*   0.0.0.0/0 md5
      {{- if .Values.networking.forgejoPodCIDR }}
      - host forgejo-{{ .Values.cluster.name }} forgejo-{{ .Values.cluster.name }} {{ .Values.networking.forgejoPodCIDR }} md5
      {{- end }}
      - host all          all        ::/0 ldap ldapserver={{ .Values.ldap.postgres.server }} ldapport={{ .Values.ldap.port }} ldapbasedn="{{ .Values.ldap.baseDN }}" ldapbinddn="{{ .Values.ldap.bindDN }}" ldapbindpasswd="<path:CORE0_SITE1/data/PSQL/LDAP#Password>" ldapsearchattribute="{{ .Values.ldap.searchAttribute }}"
      - host all          all        0.0.0.0/0 ldap ldapserver={{ .Values.ldap.postgres.server }} ldapport={{ .Values.ldap.port }} ldapbasedn="{{ .Values.ldap.baseDN }}" ldapbinddn="{{ .Values.ldap.bindDN }}" ldapbindpasswd="<path:CORE0_SITE1/data/PSQL/LDAP#Password>" ldapsearchattribute="{{ .Values.ldap.searchAttribute }}"


  tls:
    secretName: 'myloginspace-default-certificates'
    certificateFile: 'tls.crt'
    privateKeyFile: 'tls.key'
