apiVersion: acid.zalan.do/v1
kind: postgresql
metadata:
  name: psql-{{ .Values.datacenter }}-{{ .Values.region }}

  labels:
    wan-mode: public

  annotations:
    acid.zalan.do/controller: '{{ .Values.psql.controllerID }}'

spec:
  teamId: psql-site-{{ .Values.datacenter }}-{{ .Values.region }}
  volume:
    size: 10Gi

  {{- if .Values.monitoring.postgresExporter.enabled }}
  podAnnotations:
    prometheus.io/scrape: 'true'
    prometheus.io/path: '/metrics'
    prometheus.io/port: '{{ .Values.monitoring.postgresExporter.port }}'
    prometheus.io/job: 'postgres-exporter'

  sidecars:
    - name: postgres-exporter
      image: '{{ .Values.monitoring.postgresExporter.image }}'
      imagePullPolicy: 'IfNotPresent'
      ports:
        - name: metrics
          containerPort: {{ .Values.monitoring.postgresExporter.port }}
          protocol: 'TCP'
      env:
        - name: DATA_SOURCE_URI
          value: '127.0.0.1:5432/postgres?sslmode=disable'
        - name: DATA_SOURCE_USER
          value: '$(POSTGRES_USER)'
        - name: DATA_SOURCE_PASS
          value: '$(POSTGRES_PASSWORD)'
      resources:
        requests:
          cpu: '10m'
          memory: '32Mi'
        limits:
          cpu: '100m'
          memory: '128Mi'
  {{- end }}

  numberOfInstances: 3

  masterServiceAnnotations:
    external-dns.alpha.kubernetes.io/hostname: 'psql-local.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.mylogin.space'

  postgresql:
    version: '17'

    parameters:
      fsync: 'off'

  users:
    opsadmin:
      - superuser
      - createdb
      - LOGIN

  patroni:
    synchronous_mode: false

    pg_hba:
      - local all         all                  trust
      - local replication standby              md5
      - host replication  replicator 0.0.0.0/0 md5
      - host replication  standby    0.0.0.0/0 md5
      - host all          postgres   0.0.0.0/0 md5
      - host all          pooler     0.0.0.0/0 md5
      - host all          /^opsadmin.*   0.0.0.0/0 md5
      - host all          all        ::/0 ldap ldapserver={{ .Values.ldap.postgres.server }} ldapport={{ .Values.ldap.port }} ldapbasedn="{{ .Values.ldap.baseDN }}" ldapbinddn="{{ .Values.ldap.bindDN }}" ldapbindpasswd="<path:CORE0_SITE1/data/PSQL/LDAP#Password>" ldapsearchattribute="{{ .Values.ldap.searchAttribute }}"
      - host all          all        0.0.0.0/0 ldap ldapserver={{ .Values.ldap.postgres.server }} ldapport={{ .Values.ldap.port }} ldapbasedn="{{ .Values.ldap.baseDN }}" ldapbinddn="{{ .Values.ldap.bindDN }}" ldapbindpasswd="<path:CORE0_SITE1/data/PSQL/LDAP#Password>" ldapsearchattribute="{{ .Values.ldap.searchAttribute }}"


  tls:
    secretName: 'myloginspace-default-certificates'
    certificateFile: 'tls.crt'
    privateKeyFile: 'tls.key'
