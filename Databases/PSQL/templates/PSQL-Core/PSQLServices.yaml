{{ $replicas := (include "psql.mylogin.space/replicas" $) }}
{{ range $index, $id := untilStep (int 0) (int $replicas) 1 }}
apiVersion: v1
kind: Service
metadata:
  name: psql-main-{{ $index }}

  labels:
    application: spilo
    cluster-name: psql-main
    team: core

  annotations:
    external-dns.kubernetes.io/hostname: 'psql-int-replica-{{ $index }}.{{ $.Values.cluster.name }}.{{ $.Values.datacenter }}.{{ $.Values.region }}.{{ $.Values.tenant.domain }}'
    # TODO(external-dns-034): Remove the legacy annotation after upgrading ExternalDNS.
    external-dns.alpha.kubernetes.io/hostname: 'psql-int-replica-{{ $index }}.{{ $.Values.cluster.name }}.{{ $.Values.datacenter }}.{{ $.Values.region }}.{{ $.Values.tenant.domain }}'

spec:
  type: ClusterIP
  clusterIP: 'None'

  publishNotReadyAddresses: true

  ports:
    - name: postgresql
      port: 5432
      protocol: TCP
      targetPort: 5432

  selector:
    application: spilo
    cluster-name: psql-main
    statefulset.kubernetes.io/pod-name: psql-main-{{ $index }}
---
{{ end }}
