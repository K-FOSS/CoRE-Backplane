{{ $chart := index $.Subcharts "psmdb-db" }}
apiVersion: mylogin.space/v1alpha1
kind: User
metadata:
  name: {{ include "psmdb-database.fullname" $chart }}

  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  name: MongoDB {{ default .Release.Name .Values.cluster.name }}

  username: mongodb-{{ default .Release.Name .Values.cluster.name }}

  buckets:
    - mongodb-backups

  groups:
    - LDAPService

  writeConnectionSecretToRef:
    name: {{ include "psmdb-database.fullname" $chart }}-creds
