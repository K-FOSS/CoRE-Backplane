{{ $chart := index $.Subcharts "psmdb-db" }}
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: {{ include "psmdb-database.fullname" $chart }}-creds

spec:
  refreshInterval: 6h
  secretStoreRefs:
    - name: mainvault-core
      kind: ClusterSecretStore

  selector:
    secret:
      name: {{ include "psmdb-database.fullname" $chart }}-creds

  data:
    - match:
        secretKey: username
        remoteRef:
          remoteKey: MongoDB/{{ default .Release.Name .Values.cluster.name }}/Credentials
          property: Username

    - match:
        secretKey: password
        remoteRef:
          remoteKey: MongoDB/{{ default .Release.Name .Values.cluster.name }}/Credentials
          property: Password
