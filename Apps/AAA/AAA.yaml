apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-backplane-aaa-deploy
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  # goTemplateOptions:
  #   - 'missingkey=error'
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                - name: dc1-k3s-node1
                  values:
                    hub: false
                    k8gbPrimaryGeoTag: 'home1'
                    readReplicaHosts: []
                    authentik:
                      ldap:
                        enabled: true
                        anycastIP: ''
                        service:
                          externalDNSHostname: ''
                        clusterMesh:
                          enabled: false
                        k8gb:
                          enabled: false
                        globalService:
                          type: 'ClusterIP'
                          loadBalancerClass: ''
                          serviceGroup: ''
                          trafficDistribution: 'PreferSameNode'
                      radius:
                        enabled: true
                        anycastIP: ''
                        additionalExternalDNSHostname: ''
                        clusterMesh:
                          enabled: false
                        k8gb:
                          enabled: false
                        service:
                          type: 'ClusterIP'
                          loadBalancerClass: ''
                          serviceGroup: ''
                          trafficDistribution: 'PreferSameNode'

                - name: core-dc1-talos-prod
                  values:
                    hub: true
                    k8gbPrimaryGeoTag: 'home1'
                    readReplicaHosts:
                      - 'psql-int-replica-0.core-dc1-talos-prod.dc1.yxl.mylogin.space'
                      - 'psql-int-replica-1.core-dc1-talos-prod.dc1.yxl.mylogin.space'
                      - 'psql-int-replica-2.core-dc1-talos-prod.dc1.yxl.mylogin.space'
                    authentik:
                      ldap:
                        enabled: true
                        anycastIP: '10.1.1.36'
                        service:
                          externalDNSHostname: ''
                        clusterMesh:
                          enabled: true
                        k8gb:
                          enabled: true
                          service:
                            type: 'LoadBalancer'
                            loadBalancerClass: ''
                            serviceGroup: 'anycast'
                            trafficDistribution: 'PreferSameNode'
                        globalService:
                          type: 'ClusterIP'
                          loadBalancerClass: ''
                          trafficDistribution: 'PreferSameNode'
                      radius:
                        enabled: true
                        anycastIP: '10.1.1.18'
                        additionalExternalDNSHostname: 'radius.mylogin.space'
                        clusterMesh:
                          enabled: true
                        k8gb:
                          enabled: false
                        service:
                          type: 'LoadBalancer'
                          loadBalancerClass: ''
                          serviceGroup: 'anycast'
                          trafficDistribution: 'PreferSameNode'

                - name: core-home1-talos-prod
                  values:
                    hub: false
                    k8gbPrimaryGeoTag: 'home1'
                    readReplicaHosts:
                      - 'psql-int-replica-0.core-home1-talos-prod.home1.yvr.mylogin.space'
                      - 'psql-int-replica-1.core-home1-talos-prod.home1.yvr.mylogin.space'
                    authentik:
                      ldap:
                        enabled: true
                        anycastIP: '10.1.1.36'
                        service:
                          externalDNSHostname: 'ldap.core-home1-talos-prod.home1.yvr.mylogin.space'
                        clusterMesh:
                          enabled: true
                        k8gb:
                          enabled: true
                          service:
                            type: 'LoadBalancer'
                            loadBalancerClass: ''
                            serviceGroup: 'core-anycast'
                            trafficDistribution: 'PreferSameNode'
                        globalService:
                          type: 'ClusterIP'
                          loadBalancerClass: ''
                          trafficDistribution: 'PreferSameNode'
                      radius:
                        enabled: true
                        anycastIP: '10.1.1.18'
                        additionalExternalDNSHostname: ''
                        clusterMesh:
                          enabled: true
                        k8gb:
                          enabled: false
                        service:
                          type: 'LoadBalancer'
                          loadBalancerClass: 'purelb.io/purelb'
                          serviceGroup: 'core-anycast'
                          trafficDistribution: 'PreferSameNode'

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'
                domainRoot: 'mylogin.space'

  syncPolicy:
    preserveResourcesOnDeletion: true
  
  template:
    metadata:
      name: '{{ .values.clusterName }}-aaa-{{ .values.environment }}'
    
      annotations:
        argocd.argoproj.io/manifest-generate-paths: /AAA

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'

    spec:
      project: core
      syncPolicy:
        syncOptions:
          - ServerSideApply=true

      source:
        path: AAA
        repoURL: 'https://slop.writemy.codes/CoRE/CoRE-Backplane.git'
        targetRevision: HEAD

        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |- # yaml
                env: '{{ .values.environment }}'

                datacenter: {{ .values.datacenter }}

                region: {{ .values.region }}

                domainName: '{{ .values.domainRoot }}'

                hub: {{ .values.hub }}

                readReplica:
                  enabled: {{ gt (len .values.readReplicaHosts) 0 }}
                  hosts: {{ toYaml .values.readReplicaHosts | nindent 4 }}

                cluster:
                  name: {{ .values.clusterName }}
                  domain: {{ .values.clusterDomain }}

                route:
                  hostnames:
                    - 'idp.{{ .values.domainRoot }}'

                k8gb:
                  enabled: true
                  domain: 'gslb.{{ .values.domainRoot }}'
                  strategy: 'failover'
                  primaryGeoTag: '{{ .values.k8gbPrimaryGeoTag }}'
                  dnsTtlSeconds: 30

                authentik:
                  clusterMesh:
                    enabled: {{ .values.authentik.ldap.clusterMesh.enabled }}

                  authentik:
                    log_level: warning

                  ldap:
                    enabled: {{ .values.authentik.ldap.enabled }}
                    avoidNodeName: ''
                    service:
                      externalDNSHostname: '{{ .values.authentik.ldap.service.externalDNSHostname }}'
                    clusterMesh:
                      enabled: {{ .values.authentik.ldap.clusterMesh.enabled }}
                    k8gb:
                      enabled: {{ .values.authentik.ldap.k8gb.enabled }}
                      {{ if .values.authentik.ldap.k8gb.enabled }}
                      exposedIPAddresses: '{{ .values.authentik.ldap.anycastIP }}'
                      service:
                        type: '{{ .values.authentik.ldap.k8gb.service.type }}'
                        loadBalancerClass: '{{ .values.authentik.ldap.k8gb.service.loadBalancerClass }}'
                        trafficDistribution: '{{ .values.authentik.ldap.k8gb.service.trafficDistribution }}'
                        annotations:
                          purelb.io/service-group: '{{ .values.authentik.ldap.k8gb.service.serviceGroup }}'
                          purelb.io/addresses: '{{ .values.authentik.ldap.anycastIP }}'
                      {{ end }}
                    globalService:
                      type: '{{ .values.authentik.ldap.globalService.type }}'
                      loadBalancerClass: '{{ .values.authentik.ldap.globalService.loadBalancerClass }}'
                      trafficDistribution: '{{ .values.authentik.ldap.globalService.trafficDistribution }}'
                      {{ if .values.authentik.ldap.clusterMesh.enabled }}
                      externalDNSHostname: 'ldap-{{ .values.datacenter }}.{{ .values.domainRoot }}'
                      {{ end }}

                  radius:
                    enabled: {{ .values.authentik.radius.enabled }}
                    additionalExternalDNSHostname: '{{ .values.authentik.radius.additionalExternalDNSHostname }}'
                    clusterMesh:
                      enabled: {{ .values.authentik.radius.clusterMesh.enabled }}
                    k8gb:
                      enabled: {{ .values.authentik.radius.k8gb.enabled }}
                    service:
                      type: '{{ .values.authentik.radius.service.type }}'
                      loadBalancerClass: '{{ .values.authentik.radius.service.loadBalancerClass }}'
                      trafficDistribution: '{{ .values.authentik.radius.service.trafficDistribution }}'
                      {{ if eq .values.authentik.radius.service.type "LoadBalancer" }}
                      annotations:
                        purelb.io/service-group: '{{ .values.authentik.radius.service.serviceGroup }}'
                        purelb.io/addresses: '{{ .values.authentik.radius.anycastIP }}'
                    {{ end }}

                  server:
                    {{ if gt (len .values.readReplicaHosts) 0 }}
                    env:
                      {{ range $index, $host := .values.readReplicaHosts }}
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__{{ $index }}__HOST'
                        valueFrom:
                          configMapKeyRef:
                            name: 'aaa-authentik-read-replica'
                            key: 'Host{{ $index }}'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__{{ $index }}__NAME'
                        valueFrom:
                          secretKeyRef:
                            name: 'aaa-authentik-database'
                            key: 'Database'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__{{ $index }}__USER'
                        valueFrom:
                          secretKeyRef:
                            name: 'aaa-authentik-database'
                            key: 'Username'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__{{ $index }}__PASSWORD'
                        valueFrom:
                          secretKeyRef:
                            name: 'aaa-authentik-database'
                            key: 'Password'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__{{ $index }}__CONN_MAX_AGE'
                        value: '60'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__{{ $index }}__CONN_HEALTH_CHECKS'
                        value: 'true'
                      {{ end }}
                    {{ end }}
                    service:
                      annotations:
                        external-dns.kubernetes.io/hostname: 'aaa-server.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'
                        # TODO(external-dns-011): Remove the legacy annotation after upgrading ExternalDNS.
                        external-dns.alpha.kubernetes.io/hostname: aaa-server.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space
                  global:
                    additionalLabels:
                      resolvemy.host/env: '{{ .values.environment }}'
                      resolvemy.host/priority: 'critical'

                  worker:
                    {{ if eq .values.clusterName "core-dc1-talos-prod" }}
                    replicas: 0
                    {{ end }}
                    # Authentik names discovered Kubernetes TLS Secrets after
                    # the parent directory containing tls.crt and tls.key.
                    # Use the cluster name except for dc1 Talos, whose
                    # established Authentik certificate name is "tls".
                    volumeMounts:
                      - name: tls-certs
                        {{ if eq .values.clusterName "core-dc1-talos-prod" }}
                        mountPath: /certs/tls
                        {{ else }}
                        mountPath: '/certs/{{ .values.clusterName }}'
                        {{ end }}
                        readOnly: true

                    volumes:
                      - name: tls-certs
                        secret:
                          secretName: myloginspace-default-certificates

            - name: LOVELY_KUSTOMIZE_MERGE
              value: |-
                {{ if eq .values.region "yvr" }}
                patches:
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      labelSelector: 'app.kubernetes.io/name=authentik'
                    patch: |-
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: unused
                      spec:
                        template:
                          spec:
                            affinity:
                              nodeAffinity:
                                preferredDuringSchedulingIgnoredDuringExecution:
                                  - weight: 100
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: In
                                          values:
                                            - 'laptop2'
                                            - 'hpc2'
                                  - weight: 50
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: In
                                          values:
                                            - 'srv2'
                                            - 'srv3'
                                  - weight: 1
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: NotIn
                                          values:
                                            - 'hpc3'
                            tolerations:
                              - key: 'load'
                                operator: Equal
                                value: 'testing'
                                effect: NoSchedule
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      labelSelector: 'app.kubernetes.io/name=myloginspace-ldap'
                    patch: |-
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: unused
                      spec:
                        template:
                          spec:
                            affinity:
                              nodeAffinity:
                                preferredDuringSchedulingIgnoredDuringExecution:
                                  - weight: 100
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: In
                                          values:
                                            - 'laptop2'
                                            - 'hpc2'
                                  - weight: 50
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: In
                                          values:
                                            - 'srv2'
                                            - 'srv3'
                                  - weight: 1
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: NotIn
                                          values:
                                            - 'hpc3'
                            tolerations:
                              - key: 'load'
                                operator: Equal
                                value: 'testing'
                                effect: NoSchedule
                {{ else if eq .values.clusterName "core-dc1-talos-prod" }}
                patches:
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      labelSelector: 'app.kubernetes.io/name=authentik,app.kubernetes.io/component=server'
                    patch: |-
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: unused
                      spec:
                        template:
                          spec:
                            containers:
                              - name: server
                                env:
                                  - name: AUTHENTIK_POSTGRESQL__HOST
                                    value: 'psql-int.mylogin.space'
                                  - name: AUTHENTIK_POSTGRESQL__DISABLE_SERVER_SIDE_CURSORS
                                    value: 'false'
                                  - name: AUTHENTIK_POSTGRESQL__CONN_MAX_AGE
                                    value: '60'
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      labelSelector: 'app.kubernetes.io/name=authentik,app.kubernetes.io/component=worker'
                    patch: |-
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: unused
                      spec:
                        template:
                          spec:
                            containers:
                              - name: worker
                                env:
                                  - name: AUTHENTIK_POSTGRESQL__HOST
                                    value: 'psql.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'
                                  - name: AUTHENTIK_POSTGRESQL__DIRECT__HOST
                                    value: 'psql-int.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'
                                  - name: AUTHENTIK_POSTGRESQL__DISABLE_SERVER_SIDE_CURSORS
                                    value: 'false'
                                  - name: AUTHENTIK_POSTGRESQL__CONN_MAX_AGE
                                    value: '3600'
                {{ else }}
                {}
                {{ end }}

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
