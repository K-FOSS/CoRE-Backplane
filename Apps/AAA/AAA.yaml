apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-backplane-aaa-deploy
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  # goTemplateOptions:
  #   - 'missingkey=error'
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                - name: dc1-k3s-node1
                  values:
                    hub: false
                    readReplicaHost: ''
                    ldapAdditionalExternalDNSHostname: ''
                    ldapClusterMeshEnabled: false
                    radiusAdditionalExternalDNSHostname: ''
                    radiusClusterMeshEnabled: false

                - name: core-dc1-talos-prod
                  values:
                    hub: true
                    readReplicaHost: 'psql-int.core-dc1-talos-prod.dc1.yxl.mylogin.space'
                    ldapAdditionalExternalDNSHostname: 'ldap.mylogin.space,ldap-dc1-talos.mylogin.space'
                    ldapClusterMeshEnabled: true
                    radiusAdditionalExternalDNSHostname: 'radius.mylogin.space'
                    radiusClusterMeshEnabled: true

                - name: core-home1-talos-prod
                  values:
                    hub: false
                    readReplicaHost: ''
                    ldapAdditionalExternalDNSHostname: 'ldap-home1.mylogin.space'
                    ldapClusterMeshEnabled: true
                    radiusAdditionalExternalDNSHostname: ''
                    radiusClusterMeshEnabled: true

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'

  syncPolicy:
    preserveResourcesOnDeletion: true
  
  template:
    metadata:
      name: '{{ .values.clusterName }}-aaa-{{ .values.environment }}'
    
      annotations:
        argocd.argoproj.io/manifest-generate-paths: /AAA

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'

    spec:
      project: core
      syncPolicy:
        syncOptions:
          - ServerSideApply=true

      source:
        path: AAA
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD

        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |- # yaml
                env: '{{ .values.environment }}'

                datacenter: {{ .values.datacenter }}

                region: {{ .values.region }}

                domainName: 'mylogin.space'

                hub: {{ .values.hub }}

                readReplica:
                  enabled: {{ ne .values.readReplicaHost "" }}
                  host: '{{ .values.readReplicaHost }}'

                cluster:
                  name: {{ .values.clusterName }}
                  domain: {{ .values.clusterDomain }}

                route:
                  hostnames:
                    - 'idp.mylogin.space'

                authentik:
                  authentik:
                    log_level: warning

                  ldap:
                    avoidNodeName: ''
                    additionalExternalDNSHostname: '{{ .values.ldapAdditionalExternalDNSHostname }}'
                    clusterMesh:
                      enabled: {{ .values.ldapClusterMeshEnabled }}

                  radius:
                    additionalExternalDNSHostname: '{{ .values.radiusAdditionalExternalDNSHostname }}'
                    clusterMesh:
                      enabled: {{ .values.radiusClusterMeshEnabled }}

                  server:
                    {{ if ne .values.readReplicaHost "" }}
                    env:
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__HOST'
                        valueFrom:
                          configMapKeyRef:
                            name: 'aaa-authentik-read-replica'
                            key: 'Host'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__NAME'
                        valueFrom:
                          secretKeyRef:
                            name: 'aaa-authentik-database'
                            key: 'Database'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__USER'
                        valueFrom:
                          secretKeyRef:
                            name: 'aaa-authentik-database'
                            key: 'Username'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__PASSWORD'
                        valueFrom:
                          secretKeyRef:
                            name: 'aaa-authentik-database'
                            key: 'Password'
                    {{ end }}
                    service:
                      annotations:
                        external-dns.kubernetes.io/hostname: 'aaa-server.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'
                        # TODO(external-dns-011): Remove the legacy annotation after upgrading ExternalDNS.
                        external-dns.alpha.kubernetes.io/hostname: aaa-server.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space
                      # -- authentik server service labels
                      labels:
                        wan-mode: public
                  global:
                    additionalLabels:
                      resolvemy.host/env: '{{ .values.environment }}'
                      resolvemy.host/priority: 'critical'

                  worker:
                    {{ if ne .values.readReplicaHost "" }}
                    env:
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__HOST'
                        valueFrom:
                          configMapKeyRef:
                            name: 'aaa-authentik-read-replica'
                            key: 'Host'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__NAME'
                        valueFrom:
                          secretKeyRef:
                            name: 'aaa-authentik-database'
                            key: 'Database'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__USER'
                        valueFrom:
                          secretKeyRef:
                            name: 'aaa-authentik-database'
                            key: 'Username'
                      - name: 'AUTHENTIK_POSTGRESQL__READ_REPLICAS__0__PASSWORD'
                        valueFrom:
                          secretKeyRef:
                            name: 'aaa-authentik-database'
                            key: 'Password'
                    {{ end }}
                    # Authentik names discovered Kubernetes TLS Secrets after
                    # the parent directory containing tls.crt and tls.key.
                    # Use the cluster name except for dc1 Talos, whose
                    # established Authentik certificate name is "tls".
                    volumeMounts:
                      - name: tls-certs
                        {{ if eq .values.clusterName "core-dc1-talos-prod" }}
                        mountPath: /certs/tls
                        {{ else }}
                        mountPath: '/certs/{{ .values.clusterName }}'
                        {{ end }}
                        readOnly: true

                    volumes:
                      - name: tls-certs
                        secret:
                          secretName: myloginspace-default-certificates

            - name: LOVELY_KUSTOMIZE_MERGE
              value: |-
                {{ if eq .values.region "yvr" }}
                patches:
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      labelSelector: 'app.kubernetes.io/name=authentik'
                    patch: |-
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: unused
                      spec:
                        template:
                          spec:
                            affinity:
                              nodeAffinity:
                                preferredDuringSchedulingIgnoredDuringExecution:
                                  - weight: 100
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: In
                                          values:
                                            - 'laptop2'
                                            - 'hpc2'
                                  - weight: 50
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: In
                                          values:
                                            - 'srv2'
                                            - 'srv3'
                                  - weight: 1
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: NotIn
                                          values:
                                            - 'hpc3'
                            tolerations:
                              - key: 'load'
                                operator: Equal
                                value: 'testing'
                                effect: NoSchedule
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      labelSelector: 'app.kubernetes.io/name=myloginspace-ldap'
                    patch: |-
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: unused
                      spec:
                        template:
                          spec:
                            affinity:
                              nodeAffinity:
                                preferredDuringSchedulingIgnoredDuringExecution:
                                  - weight: 100
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: In
                                          values:
                                            - 'laptop2'
                                            - 'hpc2'
                                  - weight: 50
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: In
                                          values:
                                            - 'srv2'
                                            - 'srv3'
                                  - weight: 1
                                    preference:
                                      matchExpressions:
                                        - key: 'kubernetes.io/hostname'
                                          operator: NotIn
                                          values:
                                            - 'hpc3'
                            tolerations:
                              - key: 'load'
                                operator: Equal
                                value: 'testing'
                                effect: NoSchedule
                {{ else }}
                {}
                {{ end }}

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
