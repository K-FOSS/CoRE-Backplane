apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-backplane-aaa-deploy
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  # goTemplateOptions:
  #   - 'missingkey=error'
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                - name: dc1-k3s-node1
                  values:
                    hub: false
                    ldapAdditionalExternalDNSHostname: ''
                    ldapClusterMeshEnabled: false
                    radiusAdditionalExternalDNSHostname: ''
                    radiusClusterMeshEnabled: false

                - name: core-dc1-talos-prod
                  values:
                    hub: true
                    ldapAdditionalExternalDNSHostname: 'ldap.mylogin.space,ldap-dc1-talos.mylogin.space'
                    ldapClusterMeshEnabled: true
                    radiusAdditionalExternalDNSHostname: 'radius.mylogin.space'
                    radiusClusterMeshEnabled: true

                - name: core-home1-talos-prod
                  values:
                    hub: false
                    ldapAdditionalExternalDNSHostname: 'ldap-home1.mylogin.space'
                    ldapClusterMeshEnabled: true
                    radiusAdditionalExternalDNSHostname: ''
                    radiusClusterMeshEnabled: true

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'

  syncPolicy:
    preserveResourcesOnDeletion: true
  
  template:
    metadata:
      name: '{{ .values.clusterName }}-aaa-{{ .values.environment }}'
    
      annotations:
        argocd.argoproj.io/manifest-generate-paths: /AAA

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'

    spec:
      project: core
      syncPolicy:
        syncOptions:
          - ServerSideApply=true

      source:
        path: AAA
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD

        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |- # yaml
                env: '{{ .values.environment }}'

                datacenter: {{ .values.datacenter }}

                region: {{ .values.region }}

                hub: {{ .values.hub }}

                readReplica:
                  enabled: {{ .values.hub }}
                  host: psql-int-rep.core-dc1-talos-prod.dc1.yxl.mylogin.space

                cluster:
                  name: {{ .values.clusterName }}
                  domain: {{ .values.clusterDomain }}

                authentik:
                  ldap:
                    additionalExternalDNSHostname: '{{ .values.ldapAdditionalExternalDNSHostname }}'
                    clusterMesh:
                      enabled: {{ .values.ldapClusterMeshEnabled }}

                  radius:
                    additionalExternalDNSHostname: '{{ .values.radiusAdditionalExternalDNSHostname }}'
                    clusterMesh:
                      enabled: {{ .values.radiusClusterMeshEnabled }}

                  authentik:
                    postgresql:
                      # -- set the postgresql hostname to talk to
                      # if unset and .Values.postgresql.enabled == true, will generate the default
                      # @default -- `{{ .Release.Name }}-postgresql`
                      # Normal ORM traffic uses the local PGPool Service.
                      host: 'psql.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'
                      port: 5432
                  
                  server:
                    service:
                      annotations:
                        external-dns.alpha.kubernetes.io/hostname: aaa-server.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space
                      # -- authentik server service labels
                      labels:
                        wan-mode: public
                  global:
                    additionalLabels:
                      resolvemy.host/env: '{{ .values.environment }}'
                      resolvemy.host/priority: 'critical'

                    env:
                      - name: AUTHENTIK_WEB__WORKERS
                        value: '2'
                      - name: AUTHENTIK_WEB__THREADS
                        value: '2'
                      - name: AUTHENTIK_OUTPOSTS__DISCOVER
                        value: 'false'
                      - name: AUTHENTIK_POSTGRESQL__DISABLE_SERVER_SIDE_CURSORS
                        value: 'false'
                      - name: AUTHENTIK_POSTGRESQL__CONN_MAX_AGE
                        value: '3600'
                      - name: AUTHENTIK_POSTGRESQL__CONN_HEALTH_CHECKS
                        value: 'true'
                      - name: AUTHENTIK_POSTGRESQL__DIRECT__HOST
                        value: 'psql-int.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'

                  worker:
                    # Authentik names discovered Kubernetes TLS Secrets after
                    # the parent directory containing tls.crt and tls.key.
                    # Use the cluster name except for dc1 Talos, whose
                    # established Authentik certificate name is "tls".
                    volumeMounts:
                      - name: tls-certs
                        {{ if eq .values.clusterName "core-dc1-talos-prod" }}
                        mountPath: /certs/tls
                        {{ else }}
                        mountPath: '/certs/{{ .values.clusterName }}'
                        {{ end }}
                        readOnly: true

                    volumes:
                      - name: tls-certs
                        secret:
                          secretName: myloginspace-default-certificates

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
