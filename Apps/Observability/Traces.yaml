apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 'core-observability-traces'
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  goTemplate: true
  goTemplateOptions:
    - 'missingkey=error'
  generators:
    - merge:
        mergeKeys:
          - 'name'
        generators:
          - list:
              elements:
                - name: 'core-dc1-talos-prod'
                  values:
                    tempoEnabled: true
                    globalServiceOnly: false
                    authentikEnabled: true
                    tempoGlobalAffinity: 'local'
                    tempoGlobalShared: 'true'
                    tempoGarageEnabled: true
                    tempoDistributorReplicas: 3
                    tempoIngesterReplicas: 3
                    tempoQuerierReplicas: 3
                    tempoQueryFrontendReplicas: 3
                    tempoCompactorReplicas: 1
                    tempoGatewayReplicas: 3
                - name: 'core-home1-talos-prod'
                  values:
                    tempoEnabled: true
                    globalServiceOnly: false
                    authentikEnabled: true
                    tempoGlobalAffinity: 'local'
                    tempoGlobalShared: 'true'
                    tempoGarageEnabled: true
                    tempoDistributorReplicas: 3
                    tempoIngesterReplicas: 3
                    tempoQuerierReplicas: 3
                    tempoQueryFrontendReplicas: 3
                    tempoCompactorReplicas: 0
                    tempoGatewayReplicas: 3
          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
                  resolvemy.host/nodetype: 'infra'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" | replace ".mylogin.space" "" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .values.clusterName }}-traces'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '.'
      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'
    spec:
      project: 'core'
      syncPolicy:
        syncOptions:
          - 'CreateNamespace=true'
          - 'ServerSideApply=true'
          - 'RespectIgnoreDifferences=true'
      source:
        path: 'Observability/Traces'
        repoURL: 'https://slop.writemy.codes/CoRE/CoRE-Backplane.git'
        targetRevision: 'HEAD'
        plugin:
          name: 'argocd-lovely-plugin'
          env:
            - name: 'LOVELY_HELM_MERGE'
              value: |-
                cluster:
                  name: '{{ .values.clusterName }}'
                  domain: '{{ .values.clusterDomain }}'

                datacenter: '{{ .values.datacenter }}'
                region: '{{ .values.region }}'

                globalServiceOnly: {{ .values.globalServiceOnly }}

                authentik:
                  enabled: {{ .values.authentikEnabled }}

                globalService:
                  name: 'tempo-core'
                  annotations:
                    service.cilium.io/global: 'true'
                    service.cilium.io/global-sync-endpoint-slices: 'true'
                    service.cilium.io/affinity: '{{ .values.tempoGlobalAffinity }}'
                    service.cilium.io/shared: '{{ .values.tempoGlobalShared }}'

                k8gb:
                  enabled: true
                  domain: 'gslb.mylogin.space'
                  strategy: 'roundRobin'
                  dnsTtlSeconds: 30

                garage:
                  enabled: {{ .values.tempoGarageEnabled }}
                  clusterName: '{{ if eq .values.region "yvr" }}observability-garage-yxl-credentials{{ else }}observability-garage{{ end }}'
                  endpoint: '{{ if eq .values.region "yvr" }}http://observability-garage.core-prod.svc.{{ .values.clusterDomain }}:3900{{ else }}https://observability-garage-s3.core-prod.svc.{{ .values.clusterDomain }}:443{{ end }}'
                  createBuckets: {{ if eq .values.region "yvr" }}false{{ else }}true{{ end }}
                  bucket: 'tempo-traces'

                tempo-distributed:
                  enabled: {{ .values.tempoEnabled }}
                  multitenancyEnabled: true
                  global:
                    fullnameOverride: 'tempo-core'
                    clusterDomain: '{{ .values.clusterDomain }}'
                    extraArgs:
                      - '-config.expand-env=true'
                    extraEnv:
                      - name: 'S3_ENDPOINT'
                        value: '{{ if eq .values.region "yvr" }}observability-garage.core-prod.svc.{{ .values.clusterDomain }}:3900{{ else }}observability-garage-s3.core-prod.svc.{{ .values.clusterDomain }}:443{{ end }}'
                      - name: 'S3_ACCESS_KEY'
                        valueFrom:
                          secretKeyRef:
                            name: 'tempo-core-s3-creds'
                            key: 'AccessKey'
                      - name: 'S3_SECRET_ACCESS_KEY'
                        valueFrom:
                          secretKeyRef:
                            name: 'tempo-core-s3-creds'
                            key: 'SecretAccessKey'
                  tempo:
                    podAnnotations:
                      secret.reloader.stakater.com/reload: 'tempo-core,tempo-core-s3-creds'
                    memberlist:
                      service:
                        annotations:
                          service.cilium.io/global: 'true'
                          service.cilium.io/global-sync-endpoint-slices: 'true'
                          service.cilium.io/shared: 'true'
                    ingester:
                      lifecycler:
                        availability_zone: '{{ .values.region }}'
                    querier:
                      partition_ring:
                        preferred_zone: '{{ .values.region }}'
                  gateway:
                    enabled: true
                    replicas: {{ .values.tempoGatewayReplicas }}
                    resources:
                      requests:
                        cpu: '100m'
                        memory: '128Mi'
                      limits:
                        cpu: '1'
                        memory: '512Mi'
                    autoscaling:
                      enabled: true
                      minReplicas: {{ .values.tempoGatewayReplicas }}
                      maxReplicas: 6
                      targetCPUUtilizationPercentage: 60
                    affinity: |
                      podAntiAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                          - weight: 100
                            podAffinityTerm:
                              labelSelector:
                                matchLabels:
                                  app.kubernetes.io/name: 'tempo'
                                  app.kubernetes.io/component: 'gateway'
                              topologyKey: 'kubernetes.io/hostname'
                    topologySpreadConstraints: |
                      - maxSkew: 1
                        topologyKey: 'kubernetes.io/hostname'
                        whenUnsatisfiable: 'DoNotSchedule'
                        labelSelector:
                          matchLabels:
                            app.kubernetes.io/name: 'tempo'
                            app.kubernetes.io/component: 'gateway'
                    service:
                      port: 3200
                  distributor:
                    replicas: {{ .values.tempoDistributorReplicas }}
                    resources:
                      requests:
                        cpu: '250m'
                        memory: '256Mi'
                      limits:
                        cpu: '2'
                        memory: '1Gi'
                    autoscaling:
                      enabled: true
                      minReplicas: {{ .values.tempoDistributorReplicas }}
                      maxReplicas: 6
                      targetCPUUtilizationPercentage: 60
                  ingester:
                    replicas: {{ .values.tempoIngesterReplicas }}
                    extraArgs:
                      - '-ingester.availability-zone={{ .values.region }}'
                    config:
                      # Use one active owner across the global ring. Local
                      # replicas provide capacity and rollout space; Garage
                      # is the cross-site durability layer.
                      replication_factor: 1
                  querier:
                    replicas: {{ .values.tempoQuerierReplicas }}
                    resources:
                      requests:
                        cpu: '250m'
                        memory: '256Mi'
                      limits:
                        cpu: '2'
                        memory: '1Gi'
                    autoscaling:
                      enabled: true
                      minReplicas: {{ .values.tempoQuerierReplicas }}
                      maxReplicas: 6
                      targetCPUUtilizationPercentage: 60
                  queryFrontend:
                    replicas: {{ .values.tempoQueryFrontendReplicas }}
                    resources:
                      requests:
                        cpu: '100m'
                        memory: '128Mi'
                      limits:
                        cpu: '1'
                        memory: '512Mi'
                    autoscaling:
                      enabled: true
                      minReplicas: {{ .values.tempoQueryFrontendReplicas }}
                      maxReplicas: 6
                      targetCPUUtilizationPercentage: 60
                  compactor:
                    replicas: {{ .values.tempoCompactorReplicas }}
                  traces:
                    otlp:
                      grpc:
                        enabled: true
                        port: 4317
                      http:
                        enabled: true
                        port: 4318
                  storage:
                    trace:
                      backend: 's3'
                      s3:
                        endpoint: '$${S3_ENDPOINT}'
                        access_key: '$${S3_ACCESS_KEY}'
                        secret_key: '$${S3_SECRET_ACCESS_KEY}'
                        bucket: 'tempo-traces'
                        region: '{{ if .values.tempoGarageEnabled }}garage{{ else }}us-east-1{{ end }}'
                        insecure: {{ if eq .values.region "yvr" }}true{{ else }}false{{ end }}
                        forcepathstyle: {{ .values.tempoGarageEnabled }}

            - name: 'LOVELY_KUSTOMIZE_MERGE'
              value: '{}'
      destination:
        server: '{{ .server }}'
        namespace: 'core-{{ .values.environment }}'
