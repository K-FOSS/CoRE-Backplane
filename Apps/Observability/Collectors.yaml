apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-observability-collectors

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                - name: core-dc1-talos-prod
                  values:
                    hub: false
                    collectorReplicas: 3
                    vectorEnabled: false
                    podLogsEnabled: true
                    lokiGlobalService: 'true'

                - name: core-home1-talos-prod
                  values:
                    hub: false
                    collectorReplicas: 3
                    vectorEnabled: false
                    podLogsEnabled: true
                    lokiGlobalService: 'true'

                - name: dc1-k3s-node1
                  values:
                    hub: false
                    collectorReplicas: 3
                    vectorEnabled: true
                    podLogsEnabled: false
                    lokiGlobalService: 'false'
          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                orgId: '{{ index .metadata.labels "mylogin.space/tenant" | trimSuffix ".mylogin.space" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'

  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-collectors'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'

    spec:
      project: core

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

      source:
        path: Observability/Collectors
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD

        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |-
                alloy:
                  destinations:
                    {{- if eq .values.lokiGlobalService "true" }}
                    lokiUrl: 'http://loki-core.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:3100/loki/api/v1/push'
                    {{- else }}
                    # Legacy has no namespace-local global Service registration.
                    lokiUrl: 'http://10.44.0.196:3100/loki/api/v1/push'
                    {{- end }}
                    # Route metrics through the Cilium global Mimir Service;
                    # the site-local endpoint is selected by Cilium affinity.
                    mimirUrl: 'http://core-mimir.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:8080/api/v1/push'
                    tempoEndpoint: 'tempo-core.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:4317'
                    orgId: '{{ .values.orgId }}'

                  controller:
                    replicas: {{ .values.collectorReplicas }}
                    {{- if eq .values.clusterName "core-home1-talos-prod" }}
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: 'kubernetes.io/hostname'
                                  operator: NotIn
                                  values: ['hpc3']
                    {{- end }}

                  alloy:
                    clustering:
                      # -- Deploy Alloy in a cluster to allow for load distribution.
                      enabled: true

                      # -- Name for the Alloy cluster. Used for differentiating between clusters.
                      name: '{{ .values.orgId }}-collectors-gateway-{{ .values.clusterName }}'

                      
                    # -- Extra environment variables to pass to the Alloy container.
                    extraEnv:
                      - name: DC
                        value: '{{ .values.datacenter }}'

                      - name: CLUSTER
                        value: '{{ .values.clusterName }}'

                      - name: REGION
                        value: '{{ .values.region }}'

                  serviceMonitor:
                    enabled: true
                    relabelings:
                      - action: replace
                        targetLabel: cluster
                        replacement: '{{ .values.clusterName }}'
                      - action: replace
                        targetLabel: dc
                        replacement: '{{ .values.datacenter }}'
                      - action: replace
                        targetLabel: region
                        replacement: '{{ .values.region }}'

                alloy-logs:
                  alloy:
                    podLogsEnabled: {{ .values.podLogsEnabled }}
                    extraEnv:
                      - name: DC
                        value: '{{ .values.datacenter }}'

                      - name: CLUSTER
                        value: '{{ .values.clusterName }}'

                      - name: REGION
                        value: '{{ .values.region }}'

                      - name: OTLP_ENDPOINT
                        value: '{{ .values.orgId }}-collectors-alloy-otlp.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:4317'

                  serviceMonitor:
                    enabled: true
                    relabelings:
                      - action: replace
                        targetLabel: cluster
                        replacement: '{{ .values.clusterName }}'
                      - action: replace
                        targetLabel: dc
                        replacement: '{{ .values.datacenter }}'
                      - action: replace
                        targetLabel: region
                        replacement: '{{ .values.region }}'

                  rbac:
                    create: {{ .values.podLogsEnabled }}
                  serviceAccount:
                    automountServiceAccountToken: {{ .values.podLogsEnabled }}

                alloy-metrics:
                  alloy:
                    clustering:
                      enabled: true
                      name: '{{ .values.orgId }}-collectors-metrics-{{ .values.clusterName }}'
                    extraEnv:
                      - name: DC
                        value: '{{ .values.datacenter }}'

                      - name: CLUSTER
                        value: '{{ .values.clusterName }}'

                      - name: OTLP_ENDPOINT
                        value: '{{ .values.orgId }}-collectors-alloy-otlp.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:4317'

                  serviceMonitor:
                    enabled: true
                    relabelings:
                      - action: replace
                        targetLabel: cluster
                        replacement: '{{ .values.clusterName }}'
                      - action: replace
                        targetLabel: dc
                        replacement: '{{ .values.datacenter }}'
                      - action: replace
                        targetLabel: region
                        replacement: '{{ .values.region }}'

                alloy-services:
                  controller:
                    replicas: {{ .values.collectorReplicas }}
                  alloy:
                    clustering:
                      enabled: true
                      name: '{{ .values.orgId }}-collectors-services-{{ .values.clusterName }}'
                    extraEnv:
                      - name: DC
                        value: '{{ .values.datacenter }}'

                      - name: CLUSTER
                        value: '{{ .values.clusterName }}'

                      - name: OTLP_ENDPOINT
                        value: '{{ .values.orgId }}-collectors-alloy-otlp.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:4317'

                  serviceMonitor:
                    enabled: true
                    relabelings:
                      - action: replace
                        targetLabel: cluster
                        replacement: '{{ .values.clusterName }}'
                      - action: replace
                        targetLabel: dc
                        replacement: '{{ .values.datacenter }}'
                      - action: replace
                        targetLabel: region
                        replacement: '{{ .values.region }}'

                alloy-otlp:
                  alloy:
                    extraEnv:
                      - name: OTLP_ENDPOINT
                        value: '{{ .values.orgId }}-collectors-alloy-otlp.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:4317'

                  serviceMonitor:
                    enabled: true
                    relabelings:
                      - action: replace
                        targetLabel: cluster
                        replacement: '{{ .values.clusterName }}'
                      - action: replace
                        targetLabel: dc
                        replacement: '{{ .values.datacenter }}'
                      - action: replace
                        targetLabel: region
                        replacement: '{{ .values.region }}'

                vector:
                  enabled: {{ .values.vectorEnabled }}

                  env:
                    - name: VECTOR_CLUSTER
                      value: '{{ .values.clusterName }}'

                    - name: VECTOR_DC
                      value: '{{ .values.datacenter }}'

                    - name: VECTOR_OTLP_LOGS_ENDPOINT
                      value: 'http://{{ .values.orgId }}-collectors-alloy-otlp.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:4328/v1/logs'

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
