apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-observability-collectors

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                - name: core-dc1-talos-prod
                  values:
                    hub: false
                    collectorReplicas: 3
                    vectorEnabled: false

                - name: core-home1-talos-prod
                  values:
                    hub: false
                    collectorReplicas: 3
                    vectorEnabled: false

                - name: dc1-k3s-node1
                  values:
                    hub: false
                    collectorReplicas: 3
                    vectorEnabled: true
          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'

  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-collectors'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'

    spec:
      project: core

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

      source:
        path: Observability/Collectors
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD

        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |-
                alloy:
                  destinations:
                    lokiUrl: 'http://10.44.0.196:3100/loki/api/v1/push'
                    mimirUrl: 'http://10.44.2.161:8080/api/v1/push'
                    tempoEndpoint: '10.44.5.232:4317'

                  controller:
                    replicas: {{ .values.collectorReplicas }}

                  alloy:
                    clustering:
                      # -- Deploy Alloy in a cluster to allow for load distribution.
                      enabled: true

                      # -- Name for the Alloy cluster. Used for differentiating between clusters.
                      name: {{ .values.clusterName }}

                      
                    # -- Extra environment variables to pass to the Alloy container.
                    extraEnv:
                      - name: DC
                        value: '{{ .values.datacenter }}'

                      - name: CLUSTER
                        value: '{{ .values.clusterName }}'

                alloy-logs:
                  alloy:
                    extraEnv:
                      - name: DC
                        value: '{{ .values.datacenter }}'

                      - name: CLUSTER
                        value: '{{ .values.clusterName }}'

                      - name: OTLP_ENDPOINT
                        value: '{{ .values.clusterName }}-collectors-alloy.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:4317'

                alloy-metrics:
                  alloy:
                    extraEnv:
                      - name: DC
                        value: '{{ .values.datacenter }}'

                      - name: CLUSTER
                        value: '{{ .values.clusterName }}'

                      - name: OTLP_ENDPOINT
                        value: '{{ .values.clusterName }}-collectors-alloy.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:4317'

                alloy-otlp:
                  alloy:
                    extraEnv:
                      - name: OTLP_ENDPOINT
                        value: '{{ .values.clusterName }}-collectors-alloy.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:4317'

                vector:
                  enabled: {{ .values.vectorEnabled }}

                  env:
                    - name: VECTOR_CLUSTER
                      value: '{{ .values.clusterName }}'

                    - name: VECTOR_DC
                      value: '{{ .values.datacenter }}'

                    - name: VECTOR_OTLP_LOGS_ENDPOINT
                      value: 'http://{{ .values.clusterName }}-collectors-alloy.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:4328/v1/logs'

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
