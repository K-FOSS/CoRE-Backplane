apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-observability-logs

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                - name: core-dc1-talos-prod
                  values:
                    hub: false

                    mode: 'Distributed'
                    lokiReplicas: 0
                    lokiBackendReplicas: 0
                    lokiReadReplicas: 0
                    lokiWriteReplicas: 0
                    lokiGatewayReplicas: 3
                    lokiDistributorReplicas: 3
                    lokiIngesterReplicas: 3
                    lokiQuerierReplicas: 3
                    lokiQueryFrontendReplicas: 3
                    lokiQuerySchedulerReplicas: 2
                    lokiIndexGatewayReplicas: 3
                    lokiCompactorReplicas: 1
                    lokiRulerReplicas: 1
                    lokiGlobalAffinity: 'local'
                    lokiGlobalShared: 'true'
                    lokiGarageEnabled: true

                - name: core-home1-talos-prod
                  values:
                    hub: false

                    mode: 'Distributed'
                    globalServiceOnly: false
                    lokiEnabled: true
                    lokiReplicas: 0
                    lokiBackendReplicas: 0
                    lokiReadReplicas: 0
                    lokiWriteReplicas: 0
                    lokiGatewayReplicas: 3
                    lokiDistributorReplicas: 3
                    lokiIngesterReplicas: 3
                    lokiQuerierReplicas: 3
                    lokiQueryFrontendReplicas: 3
                    lokiQuerySchedulerReplicas: 2
                    lokiIndexGatewayReplicas: 3
                    lokiCompactorReplicas: 0
                    lokiRulerReplicas: 0
                    lokiGlobalAffinity: 'local'
                    lokiGlobalShared: 'true'
                    lokiGarageEnabled: true

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
                  resolvemy.host/nodetype: 'infra'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'


  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-logs'
      
      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'


    spec:
      project: core

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

      source:
        path: Observability/Logs
        repoURL: https://slop.writemy.codes/CoRE/CoRE-Backplane.git
        targetRevision: HEAD

        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |-
                env: {{ .values.environment }}

                cluster:
                  name: {{ .values.clusterName }}
                  domain: {{ .values.clusterDomain }}

                  
                datacenter: {{ .values.datacenter }}
                region: {{ .values.region }}

                globalServiceOnly: {{ .values.globalServiceOnly | default false }}

                globalService:
                  name: 'loki-core'
                  annotations:
                    service.cilium.io/global: 'true'
                    service.cilium.io/global-sync-endpoint-slices: 'true'
                    service.cilium.io/affinity: '{{ .values.lokiGlobalAffinity }}'
                    service.cilium.io/shared: '{{ .values.lokiGlobalShared }}'

                memberlist:
                  service:
                    annotations:
                      service.cilium.io/global: 'true'
                      service.cilium.io/global-sync-endpoint-slices: 'true'
                      service.cilium.io/affinity: '{{ .values.lokiGlobalAffinity }}'
                      service.cilium.io/shared: '{{ .values.lokiGlobalShared }}'

                k8gb:
                  enabled: true
                  domain: 'gslb.mylogin.space'
                  strategy: 'roundRobin'
                  dnsTtlSeconds: 30

                garage:
                  enabled: {{ .values.lokiGarageEnabled }}
                  clusterName: '{{ if eq .values.region "yvr" }}observability-garage-yxl-credentials{{ else }}observability-garage{{ end }}'
                  endpoint: '{{ if eq .values.region "yvr" }}http://observability-garage.core-prod.svc.{{ .values.clusterDomain }}:3900{{ else }}observability-garage-s3.core-prod.svc.{{ .values.clusterDomain }}:443{{ end }}'
                  createBuckets: {{ if eq .values.region "yvr" }}false{{ else }}true{{ end }}
                
                loki:
                  {{ if .values.lokiGarageEnabled }}
                  global:
                    podAnnotations:
                      secret.reloader.stakater.com/reload: 'loki-core,loki-core-s3-creds'
                      core.mylogin.space/config-revision: 'd261ae480'
                  loki:
                    podAnnotations:
                      core.mylogin.space/config-revision: 'ce1e54e6'
                    memberlistConfig:
                      cluster_label: 'core-observability-loki'
                      join_members:
                        - 'loki-core-memberlist.core-prod.svc.{{ .values.clusterDomain }}'
                    commonConfig:
                      # Use one global owner per stream so either site's
                      # query path can reach recent in-memory logs without
                      # duplicating the payload in a second ingester.
                      replication_factor: 1
                    ingester:
                      lifecycler:
                        availability_zone: '{{ .values.region }}'
                    storage:
                      s3:
                        region: 'garage'
                  {{ end }}
                  enabled: {{ if eq .values.lokiEnabled false }}false{{ else }}true{{ end }}
                  # Cilium matches global Services by namespace and name.
                  fullnameOverride: 'loki-core'
                  deploymentMode: {{ .values.mode }}
                  global:
                    clusterDomain: {{ .values.clusterDomain }}

                  rollout_operator:
                    enabled: false

                  memberlist:
                    service:
                      annotations:
                        service.cilium.io/global: 'true'
                        service.cilium.io/global-sync-endpoint-slices: 'true'
                        service.cilium.io/affinity: '{{ .values.lokiGlobalAffinity }}'
                        service.cilium.io/shared: '{{ .values.lokiGlobalShared }}'

                  singleBinary:
                    replicas: {{ .values.lokiReplicas }}
                    service:
                      annotations:
                        service.cilium.io/global: 'true'
                        service.cilium.io/global-sync-endpoint-slices: 'true'
                        service.cilium.io/affinity: '{{ .values.lokiGlobalAffinity }}'
                        service.cilium.io/shared: '{{ .values.lokiGlobalShared }}'
                  backend:
                    replicas: {{ .values.lokiBackendReplicas }}
                  read:
                    replicas: {{ .values.lokiReadReplicas }}
                  write:
                    replicas: {{ .values.lokiWriteReplicas }}
                  gateway:
                    replicas: {{ .values.lokiGatewayReplicas }}
                  distributor:
                    replicas: {{ .values.lokiDistributorReplicas }}
                  ingester:
                    replicas: {{ .values.lokiIngesterReplicas }}
                    zoneAwareReplication:
                      enabled: false
                      maxUnavailablePct: 33
                  querier:
                    replicas: {{ .values.lokiQuerierReplicas }}
                  queryFrontend:
                    replicas: {{ .values.lokiQueryFrontendReplicas }}
                  queryScheduler:
                    replicas: {{ .values.lokiQuerySchedulerReplicas }}
                  indexGateway:
                    replicas: {{ .values.lokiIndexGatewayReplicas }}
                  compactor:
                    replicas: {{ .values.lokiCompactorReplicas }}
                  ruler:
                    replicas: {{ .values.lokiRulerReplicas }}

            - name: 'LOVELY_KUSTOMIZE_MERGE'
              value: |-
                {}

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
