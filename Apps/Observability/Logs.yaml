apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-observability-logs

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                - name: core-dc1-talos-prod
                  values:
                    hub: false

                    mode: 'SingleBinary'
                    lokiReplicas: 3
                    lokiGlobalAffinity: 'local'
                    lokiGlobalShared: 'true'

                - name: core-home1-talos-prod
                  values:
                    hub: false

                    mode: 'SingleBinary'
                    lokiReplicas: 0
                    lokiGlobalAffinity: 'remote'
                    lokiGlobalShared: 'false'

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
                  resolvemy.host/nodetype: 'infra'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'


  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-logs'
      
      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'


    spec:
      project: core

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

      source:
        path: Observability/Logs
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD

        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |-
                env: {{ .values.environment }}

                cluster:
                  name: {{ .values.clusterName }}
                  domain: {{ .values.clusterDomain }}

                  
                datacenter: {{ .values.datacenter }}
                region: {{ .values.region }}
                
                loki:
                  # Cilium matches global Services by namespace and name.
                  fullnameOverride: 'loki-core'
                  deploymentMode: {{ .values.mode }}
                  global:
                    clusterDomain: {{ .values.clusterDomain }}
                  
                  singleBinary:
                    replicas: {{ if eq .values.mode "SingleBinary" }}{{ .values.lokiReplicas }}{{ else }}0{{ end }}
                    service:
                      annotations:
                        service.cilium.io/global: 'true'
                        service.cilium.io/global-sync-endpoint-slices: 'true'
                        service.cilium.io/affinity: '{{ .values.lokiGlobalAffinity }}'
                        service.cilium.io/shared: '{{ .values.lokiGlobalShared }}'

            - name: 'LOVELY_KUSTOMIZE_MERGE'
              value: |-
                {{ if eq .values.mode "SingleBinary" }}
                # Loki 6.46.0 clamps singleBinary.replicas=0 to one.
                # Apply the fleet count after Helm to preserve a remote-only site.
                replicas:
                  - name: 'loki-core'
                    count: {{ .values.lokiReplicas }}
                {{ else }}
                {}
                {{ end }}

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
