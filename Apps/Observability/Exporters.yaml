apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-observability-exporters

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                - name: core-home1-talos-prod
                  values:
                    hub: false
                    nodeExporterEnabled: true
                    nodeExporterServiceMonitorEnabled: false
                    nodeExporterScrapeInterval: '30s'
                    nodeExporterCollectors:
                      - 'diskstats'
                      - 'filesystem'
                      - 'cpu'
                      - 'udp_queues'
                      - 'cpufreq'
                      - 'tcpstat'
                      - 'sockstat'
                      - 'uname'
                      - 'meminfo'
                      - 'loadavg'
                      - 'stat'
                      - 'netdev'
                      - 'netstat'
                      - 'softnet'
                      - 'time'
                      - 'hwmon'
                    nodeExporterDisabledCollectors:
                      - 'tapestats'
                      - 'fibrechannel'
                      - 'nfs'
                      - 'nfsd'
                      - 'watchdog'
                    kubeStateMetricsEnabled: true
                    smartctlExporterEnabled: true
                    ipmiExporterEnabled: true
                    drmExporterEnabled: true
                    drmExporterResources:
                      limits:
                        'gpu.intel.com/i915_monitoring': '1'
                    dcgmExporterEnabled: true
                    smartctlDeviceExclude: '^sd[b-z].*'

                - name: core-dc1-talos-prod
                  values:
                    hub: false
                    nodeExporterEnabled: true
                    nodeExporterServiceMonitorEnabled: false
                    nodeExporterScrapeInterval: '30s'
                    nodeExporterCollectors:
                      - 'diskstats'
                      - 'filesystem'
                      - 'cpu'
                      - 'udp_queues'
                      - 'cpufreq'
                      - 'tcpstat'
                      - 'sockstat'
                      - 'uname'
                      - 'meminfo'
                      - 'loadavg'
                      - 'stat'
                      - 'netdev'
                      - 'netstat'
                      - 'softnet'
                      - 'time'
                      - 'hwmon'
                    nodeExporterDisabledCollectors:
                      - 'tapestats'
                      - 'fibrechannel'
                      - 'nfs'
                      - 'nfsd'
                      - 'watchdog'
                    kubeStateMetricsEnabled: true
                    smartctlExporterEnabled: true
                    ipmiExporterEnabled: true
                    drmExporterEnabled: false
                    drmExporterResources: {}
                    dcgmExporterEnabled: false
                    smartctlDeviceExclude: ''

                - name: dc1-k3s-node1
                  values:
                    hub: false
                    nodeExporterEnabled: true
                    nodeExporterServiceMonitorEnabled: false
                    nodeExporterScrapeInterval: '30s'
                    nodeExporterCollectors:
                      - 'diskstats'
                      - 'filesystem'
                      - 'cpu'
                      - 'udp_queues'
                      - 'cpufreq'
                      - 'tcpstat'
                      - 'sockstat'
                      - 'uname'
                      - 'meminfo'
                      - 'loadavg'
                      - 'stat'
                      - 'netdev'
                      - 'netstat'
                      - 'softnet'
                      - 'time'
                      - 'hwmon'
                    nodeExporterDisabledCollectors:
                      - 'tapestats'
                      - 'fibrechannel'
                      - 'nfs'
                      - 'nfsd'
                      - 'watchdog'
                    kubeStateMetricsEnabled: true
                    smartctlExporterEnabled: true
                    ipmiExporterEnabled: true
                    drmExporterEnabled: false
                    drmExporterResources: {}
                    dcgmExporterEnabled: false
                    smartctlDeviceExclude: ''
          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'


  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-exporters'
      
      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'

    spec:
      project: core

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

      source:
        path: Observability/Exporters
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD

        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |-
                kube-prometheus-stack:
                  nodeExporter:
                    enabled: {{ .values.nodeExporterEnabled }}
                    forceDeployDashboards: {{ .values.nodeExporterEnabled }}
                  kubeStateMetrics:
                    enabled: {{ .values.kubeStateMetricsEnabled }}
                  prometheus-node-exporter:
                    extraArgs:
                      - '--collector.disable-defaults'
                      {{- range .values.nodeExporterCollectors }}
                      - '--collector.{{ . }}'
                      {{- end }}
                      {{- range .values.nodeExporterDisabledCollectors }}
                      - '--no-collector.{{ . }}'
                      {{- end }}
                      - '--collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)'
                      - '--collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs)$'
                      - '--collector.netdev.device-exclude=^lxc.*'
                      - '--collector.arp.device-exclude=^lxc.*'
                      - '--collector.ethtool.device-exclude=^lxc.*'
                    prometheus:
                      monitor:
                        enabled: {{ .values.nodeExporterServiceMonitorEnabled }}
                        interval: '{{ .values.nodeExporterScrapeInterval }}'

                prometheus-smartctl-exporter:
                  enabled: {{ .values.smartctlExporterEnabled }}
                  config:
                    device_exclude: '{{ .values.smartctlDeviceExclude }}'

                prometheus-ipmi-exporter:
                  enabled: {{ .values.ipmiExporterEnabled }}

                drm-exporter:
                  enabled: {{ .values.drmExporterEnabled }}
                  resources:
                    {{- toYaml .values.drmExporterResources | nindent 20 }}

                dcgm-exporter:
                  enabled: {{ .values.dcgmExporterEnabled }}

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
