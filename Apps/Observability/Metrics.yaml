apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-observability-metrics

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                - name: core-dc1-talos-prod
                  values:
                    hub: false

                    mode: Distributed

                    mimirEnabled: true
                    mimirBridgeEnabled: true
                    mimirGlobalAffinity: local
                    mimirGlobalShared: 'true'

                    # YXL is storage-bandwidth constrained. Bound accepted
                    # samples and serialize block uploads at this site only.
                    mimirIngestionRate: 500000
                    mimirIngestionBurstSize: 1550000
                    mimirRetentionPeriod: 12h
                    mimirShipConcurrency: 1
                    mimirCacheEnabled: true


                - name: core-home1-talos-prod
                  values:
                    hub: false

                    mode: Distributed

                    mimirEnabled: false
                    mimirBridgeEnabled: true
                    mimirGlobalAffinity: remote
                    mimirGlobalShared: 'false'
                    mimirIngestionRate: 500000
                    mimirIngestionBurstSize: 1550000
                    mimirRetentionPeriod: 12h
                    mimirShipConcurrency: 1
                    mimirCacheEnabled: true

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
                  resolvemy.host/nodetype: 'infra'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'


  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-metrics'
      
      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'

    spec:
      project: core

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

      source:
        path: Observability/Metrics
        repoURL: https://slop.writemy.codes/CoRE/CoRE-Backplane.git
        targetRevision: HEAD

        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |-
                env: {{ .values.environment }}

                cluster:
                  name: {{ .values.clusterName }}
                  domain: {{ .values.clusterDomain }}

                  
                datacenter: {{ .values.datacenter }}
                region: {{ .values.region }}

                {{ if eq .values.mode "SingleBinary"  }}
                mimir-distributed:
                  enabled: false

                mimir:
                  enabled: {{ .values.mimirEnabled }}
                  tenant: core
                  service:
                    # Cilium correlates global Services by namespace and name.
                    # YXL selects local Mimir Pods; Home1 intentionally has no
                    # local backends and consumes synchronized EndpointSlices.
                    name: core-mimir
                    annotations:
                      service.cilium.io/affinity: '{{ .values.mimirGlobalAffinity }}'
                      service.cilium.io/global: 'true'
                      service.cilium.io/global-sync-endpoint-slices: 'true'
                      service.cilium.io/shared: '{{ .values.mimirGlobalShared }}'
                  storage:
                    s3Endpoint: s3.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space:443
                  cache:
                    enabled: true
                    address: 'dragonfly-core.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:11211'
                    tls:
                      enabled: true
                      # kjdev-cluster is Let's Encrypt; its Secret has no ca.crt.
                      # Leave this empty so Mimir uses the system trust store.
                      caSecretName: ''
                      serverName: 'dragonfly.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'
                  rules:
                    configMapName: '{{ if eq .values.region "yvr" }}prometheus-{{ .values.clusterName }}-expo-prometheus-rulefiles-0{{ else }}prometheus-{{ .values.clusterName }}-export-prometheus-rulefiles-0{{ end }}'
                    tenant: core
                  {{- if eq .values.region "yxl" }}
                  limits:
                    ingestionRate: {{ .values.mimirIngestionRate }}
                    ingestionBurstSize: {{ .values.mimirIngestionBurstSize }}
                    compactorBlocksRetentionPeriod: {{ .values.mimirRetentionPeriod }}
                  blocksStorage:
                    shipConcurrency: {{ .values.mimirShipConcurrency }}
                  {{- end }}

                mimirBridge:
                  enabled: {{ .values.mimirBridgeEnabled }}

                gateway:
                  enabled: {{ .values.mimirEnabled }}
                  routeName: core-mimir
                  labels:
                    wan-mode: public
                    lan-mode: private
                  parentRefs:
                    - group: gateway.networking.k8s.io
                      kind: Gateway
                      namespace: core-prod
                      name: main-gw
                  hostnames:
                    - metrics.mylogin.space

                securityPolicy:
                  enabled: {{ .values.mimirEnabled }}
                  jwt:
                    optional: false
                    providers:
                      - name: grafana
                        issuer: https://idp.mylogin.space/application/o/grafana-test/
                        remoteJWKS:
                          cacheDuration: 3600s
                          uri: https://idp.mylogin.space/application/o/grafana-test/jwks/
                        claimToHeaders:
                          - header: x-scope-orgid
                            claim: orgID
                        extractFrom:
                          cookies:
                            - core-token
                      - name: mimir
                        issuer: https://idp.mylogin.space/application/o/mimir-test/
                        remoteJWKS:
                          cacheDuration: 3600s
                          uri: https://idp.mylogin.space/application/o/mimir-test/jwks/
                        claimToHeaders:
                          - header: x-scope-orgid
                            claim: orgID
                        extractFrom:
                          headers:
                            - name: Authorization
                              valuePrefix: 'Bearer '
                          cookies:
                            - session_access_token
                          params:
                            - token

                # Retain both site identities and buckets for recovery.
                s3User:
                  enabled: true
                {{ else if eq .values.mode "Distributed" }}
                mimir-distributed:
                  enabled: {{ .values.mimirEnabled }}
                  fullnameOverride: core-mimir
                  image:
                    repository: grafana/mimir
                    tag: '3.1.4'
                    pullPolicy: IfNotPresent
                  minio:
                    enabled: false
                  rollout_operator:
                    enabled: false
                  global:
                    clusterDomain: {{ .values.clusterDomain }}
                    extraEnv:
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef:
                            name: {{ .values.clusterName }}-metrics-s3-creds
                            key: AccessKey
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef:
                            name: {{ .values.clusterName }}-metrics-s3-creds
                            key: SecretAccessKey
                      - name: AWS_SESSION_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: {{ .values.clusterName }}-metrics-s3-creds
                            key: SessionToken
                      - name: S3_BUCKET
                        valueFrom:
                          secretKeyRef:
                            name: {{ .values.clusterName }}-metrics-creds
                            key: username
                  gateway:
                    enabled: true
                  distributor:
                    replicas: 3
                  ingester:
                    replicas: 3
                    zoneAwareReplication:
                      enabled: false
                    persistentVolume:
                      enabled: true
                      size: 50Gi
                      storageClass: longhorn
                      enableRetentionPolicy: true
                      whenDeleted: Retain
                      whenScaled: Retain
                  querier:
                    replicas: 3
                  query_frontend:
                    replicas: 3
                  query_scheduler:
                    replicas: 2
                  store_gateway:
                    replicas: 3
                    zoneAwareReplication:
                      enabled: false
                    persistentVolume:
                      enabled: true
                      size: 2Gi
                      storageClass: longhorn
                      enableRetentionPolicy: true
                      whenDeleted: Retain
                      whenScaled: Retain
                  compactor:
                    replicas: 1
                    persistentVolume:
                      enabled: true
                      size: 2Gi
                      storageClass: longhorn
                      enableRetentionPolicy: true
                      whenDeleted: Retain
                      whenScaled: Retain
                  ruler:
                    replicas: 1
                    extraVolumes:
                      - name: rulefiles
                        configMap:
                          name: '{{ if eq .values.region "yvr" }}prometheus-{{ .values.clusterName }}-expo-prometheus-rulefiles-0{{ else }}prometheus-{{ .values.clusterName }}-export-prometheus-rulefiles-0{{ end }}'
                    extraVolumeMounts:
                      - name: rulefiles
                        mountPath: /rules/core
                  mimir:
                    structuredConfig:
                      limits:
                        max_global_series_per_user: 5000000
                        ingestion_rate: {{ .values.mimirIngestionRate }}
                        ingestion_burst_size: {{ .values.mimirIngestionBurstSize }}
                        out_of_order_time_window: 24h
                        results_cache_ttl: 1h
                        results_cache_ttl_for_cardinality_query: 5m
                        results_cache_ttl_for_labels_query: 5m
                        compactor_blocks_retention_period: {{ .values.mimirRetentionPeriod }}
                      common:
                        storage:
                          backend: s3
                          s3:
                            endpoint: s3.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space:443
                            bucket_name: ${S3_BUCKET}
                            access_key_id: ${AWS_ACCESS_KEY_ID}
                            secret_access_key: ${AWS_SECRET_ACCESS_KEY}
                            session_token: ${AWS_SESSION_TOKEN}
                            insecure: false
                            http:
                              max_idle_connections: 200
                              max_idle_connections_per_host: 200
                      ruler_storage:
                        backend: local
                        local:
                          directory: /rules
                        s3:
                          bucket_name: mimir-ruler
                      compactor:
                        data_dir: /data
                      ruler:
                        rule_path: /data
                      alertmanager:
                        data_dir: /data
                s3User:
                  enabled: true
                mimirBridge:
                  enabled: {{ .values.mimirBridgeEnabled }}
                  routeName: core-mimir
                  upstream:
                    service: core-mimir
                    port: 8080
                mimir:
                  service:
                    name: core-mimir
                    annotations:
                      service.cilium.io/affinity: '{{ .values.mimirGlobalAffinity }}'
                      service.cilium.io/global: 'true'
                      service.cilium.io/global-sync-endpoint-slices: 'true'
                      service.cilium.io/shared: '{{ .values.mimirGlobalShared }}'
                gateway:
                  enabled: {{ .values.mimirEnabled }}
                  routeName: core-mimir
                  labels:
                    wan-mode: public
                    lan-mode: private
                  parentRefs:
                    - group: gateway.networking.k8s.io
                      kind: Gateway
                      namespace: core-prod
                      name: main-gw
                  hostnames:
                    - metrics.mylogin.space
                securityPolicy:
                  enabled: {{ .values.mimirEnabled }}
                  jwt:
                    optional: false
                    providers:
                      - name: grafana
                        issuer: https://idp.mylogin.space/application/o/grafana-test/
                        remoteJWKS:
                          cacheDuration: 3600s
                          uri: https://idp.mylogin.space/application/o/grafana-test/jwks/
                        claimToHeaders:
                          - header: x-scope-orgid
                            claim: orgID
                        extractFrom:
                          cookies:
                            - core-token
                      - name: mimir
                        issuer: https://idp.mylogin.space/application/o/mimir-test/
                        remoteJWKS:
                          cacheDuration: 3600s
                          uri: https://idp.mylogin.space/application/o/mimir-test/jwks/
                        claimToHeaders:
                          - header: x-scope-orgid
                            claim: orgID
                        extractFrom:
                          headers:
                            - name: Authorization
                              valuePrefix: 'Bearer '
                          cookies:
                            - session_access_token
                          params:
                            - token
                {{- end }}

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
