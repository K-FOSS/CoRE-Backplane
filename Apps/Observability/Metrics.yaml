apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-observability-metrics

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                - name: core-dc1-talos-prod
                  values:
                    hub: false

                    mode: Distributed

                    mimirEnabled: true
                    # Use one global memberlist so queries can reach recent
                    # samples held by the other site's ingesters. Keep
                    # ingester replication at one: Garage is the cross-site
                    # durable copy and no active sample is synchronously
                    # replicated between sites.
                    mimirBridgeEnabled: true
                    mimirGlobalAffinity: local
                    mimirGlobalShared: 'true'

                    # YXL is storage-bandwidth constrained. Bound accepted
                    # samples and serialize block uploads at this site only.
                    mimirIngestionRate: 500000
                    mimirIngestionBurstSize: 1550000
                    mimirRetentionPeriod: 12h
                    mimirShipConcurrency: 1
                    mimirCacheEnabled: true
                    mimirS3Backend: 'garage'
                    mimirGarageEnabled: true
                    mimirCompactorReplicas: 1
                    mimirRulerReplicas: 1
                    mimirMaxRulesPerRuleGroup: 100
                    mimirAvoidHpc3: false


                - name: core-home1-talos-prod
                  values:
                    hub: false

                    mode: Distributed

                    mimirEnabled: true
                    mimirBridgeEnabled: true
                    mimirGlobalAffinity: local
                    mimirGlobalShared: 'true'
                    mimirIngestionRate: 500000
                    mimirIngestionBurstSize: 1550000
                    mimirRetentionPeriod: 12h
                    mimirShipConcurrency: 1
                    mimirCacheEnabled: true
                    mimirS3Backend: 'garage'
                    mimirGarageEnabled: true
                    mimirCompactorReplicas: 0
                    mimirRulerReplicas: 1
                    mimirMaxRulesPerRuleGroup: 100
                    mimirAvoidHpc3: true

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
                  resolvemy.host/nodetype: 'infra'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" | replace ".mylogin.space" "" }}'
                orgId: '{{ index .metadata.labels "mylogin.space/tenant" | trimSuffix ".mylogin.space" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'


  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-metrics'
      
      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'

    spec:
      project: core

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true

      source:
        path: Observability/Metrics
        repoURL: https://slop.writemy.codes/CoRE/CoRE-Backplane.git
        targetRevision: HEAD

        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |-
                env: {{ .values.environment }}

                cluster:
                  name: {{ .values.clusterName }}
                  domain: {{ .values.clusterDomain }}

                  
                datacenter: {{ .values.datacenter }}
                region: {{ .values.region }}

                {{ if eq .values.mode "SingleBinary"  }}
                mimir-distributed:
                  enabled: false

                mimir:
                  enabled: {{ .values.mimirEnabled }}
                  tenant: '{{ .values.tenant }}'
                  storage:
                    backend: '{{ .values.mimirS3Backend }}'
                    region: '{{ if eq .values.mimirS3Backend "garage" }}garage{{ else }}us-east-1{{ end }}'
                    insecure: {{ if eq .values.region "yvr" }}true{{ else }}false{{ end }}
                    s3Endpoint: '{{ if and (eq .values.mimirS3Backend "garage") (eq .values.region "yvr") }}observability-garage.core-prod.svc.{{ .values.clusterDomain }}:3900{{ else if eq .values.mimirS3Backend "garage" }}observability-garage-s3.core-prod.svc.{{ .values.clusterDomain }}:443{{ else }}s3.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space:443{{ end }}'
                  service:
                    # Cilium correlates global Services by namespace and name.
                    # YXL selects local Mimir Pods; Home1 intentionally has no
                    # local backends and consumes synchronized EndpointSlices.
                    name: core-mimir
                    annotations:
                      service.cilium.io/affinity: '{{ .values.mimirGlobalAffinity }}'
                      service.cilium.io/global: 'true'
                      service.cilium.io/global-sync-endpoint-slices: 'true'
                      service.cilium.io/shared: '{{ .values.mimirGlobalShared }}'
                  cache:
                    enabled: true
                    address: 'dragonfly-core.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}:11211'
                    tls:
                      enabled: true
                      # kjdev-cluster is Let's Encrypt; its Secret has no ca.crt.
                      # Leave this empty so Mimir uses the system trust store.
                      caSecretName: ''
                      serverName: 'dragonfly.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'
                  limits:
                    rulerMaxRulesPerRuleGroup: {{ .values.mimirMaxRulesPerRuleGroup }}
                    {{- if eq .values.region "yxl" }}
                    ingestionRate: {{ .values.mimirIngestionRate }}
                    ingestionBurstSize: {{ .values.mimirIngestionBurstSize }}
                    compactorBlocksRetentionPeriod: {{ .values.mimirRetentionPeriod }}
                    {{- end }}
                  {{- if eq .values.region "yxl" }}
                  blocksStorage:
                    shipConcurrency: {{ .values.mimirShipConcurrency }}
                  {{- end }}

                mimirBridge:
                  enabled: true

                garage:
                  enabled: {{ .values.mimirGarageEnabled }}
                  clusterName: '{{ if eq .values.region "yvr" }}observability-garage-yxl-credentials{{ else }}observability-garage{{ end }}'
                  resourceSuffix: '{{ if eq .values.region "yvr" }}-yxl{{ else }}{{ end }}'
                  useUserCredentials: {{ if eq .values.region "yvr" }}true{{ else }}false{{ end }}

                gateway:
                  enabled: {{ .values.mimirEnabled }}
                  routeName: core-mimir
                  labels:
                    lan-mode: private
                  parentRefs:
                    - group: gateway.networking.k8s.io
                      kind: Gateway
                      namespace: core-prod
                      name: main-gw
                  hostnames:
                    - metrics.mylogin.space
                k8gb:
                  enabled: true
                  domain: 'gslb.mylogin.space'
                  strategy: 'roundRobin'
                  dnsTtlSeconds: 30

                securityPolicy:
                  enabled: {{ .values.mimirEnabled }}
                  jwt:
                    optional: false
                    providers:
                      - name: grafana
                        issuer: https://idp.mylogin.space/application/o/grafana-test/
                        remoteJWKS:
                          cacheDuration: 3600s
                          uri: https://idp.mylogin.space/application/o/grafana-test/jwks/
                        claimToHeaders:
                          - header: x-scope-orgid
                            claim: orgID
                        extractFrom:
                          cookies:
                            - core-token
                      - name: mimir
                        issuer: https://idp.mylogin.space/application/o/mimir-test/
                        remoteJWKS:
                          cacheDuration: 3600s
                          uri: https://idp.mylogin.space/application/o/mimir-test/jwks/
                        claimToHeaders:
                          - header: x-scope-orgid
                            claim: orgID
                        extractFrom:
                          headers:
                            - name: Authorization
                              valuePrefix: 'Bearer '
                          cookies:
                            - session_access_token
                          params:
                            - token

                # Retain both site identities and buckets for recovery.
                s3User:
                  enabled: true
                {{ else if eq .values.mode "Distributed" }}
                mimir-distributed:
                  enabled: {{ .values.mimirEnabled }}
                  fullnameOverride: core-mimir
                  image:
                    repository: grafana/mimir
                    tag: '3.1.4'
                    pullPolicy: IfNotPresent
                  minio:
                    enabled: false
                  alertmanager:
                    extraArgs:
                      alertmanager.sharding-ring.instance-id: '{{ .values.clusterName }}-mimir-{{ .values.tenant }}-alertmanager-$(HOSTNAME)'
                  rollout_operator:
                    enabled: false
                  metaMonitoring:
                    serviceMonitor:
                      enabled: true
                      clusterLabel: '{{ .values.clusterName }}'
                      interval: '30s'
                      scrapeTimeout: '10s'
                  global:
                    clusterDomain: {{ .values.clusterDomain }}
                    podAnnotations:
                      secret.reloader.stakater.com/reload: '{{ if eq .values.mimirS3Backend "garage" }}mimir-garage-s3{{ else }}{{ .values.clusterName }}-metrics-s3-creds,{{ .values.clusterName }}-metrics-creds{{ end }}'
                    extraEnv:
                      - name: 'HOSTNAME'
                        valueFrom:
                          fieldRef:
                            fieldPath: 'metadata.name'
                      - name: 'MIMIR_SITE'
                        value: '{{ .values.clusterName }}'
                      - name: 'OTEL_EXPORTER_OTLP_ENDPOINT'
                        value: 'http://{{ .values.orgId }}-collectors-alloy-otlp.core-prod.svc.{{ .values.clusterDomain }}:4318'
                      - name: 'OTEL_TRACES_EXPORTER'
                        value: 'otlp'
                      - name: 'OTEL_TRACES_SAMPLER'
                        value: 'parentbased_traceidratio'
                      - name: 'OTEL_TRACES_SAMPLER_ARG'
                        value: '0.1'
                      - name: 'OTEL_PROPAGATORS'
                        value: 'tracecontext,baggage'
                      {{- if eq .values.mimirS3Backend "garage" }}
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef:
                            name: 'mimir-garage-s3'
                            key: '{{ if eq .values.region "yvr" }}AccessKey{{ else }}access-key-id{{ end }}'
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef:
                            name: 'mimir-garage-s3'
                            key: '{{ if eq .values.region "yvr" }}SecretAccessKey{{ else }}secret-access-key{{ end }}'
                      - name: AWS_SESSION_TOKEN
                        value: ''
                      - name: S3_BUCKET
                        value: 'mimir-blocks'
                      - name: S3_ENDPOINT
                        value: '{{ if eq .values.region "yvr" }}observability-garage.core-prod.svc.{{ .values.clusterDomain }}:3900{{ else }}observability-garage-s3.core-prod.svc.{{ .values.clusterDomain }}:443{{ end }}'
                      {{- else }}
                      - name: AWS_ACCESS_KEY_ID
                        valueFrom:
                          secretKeyRef:
                            name: {{ .values.clusterName }}-metrics-s3-creds
                            key: 'AccessKey'
                      - name: AWS_SECRET_ACCESS_KEY
                        valueFrom:
                          secretKeyRef:
                            name: {{ .values.clusterName }}-metrics-s3-creds
                            key: 'SecretAccessKey'
                      - name: AWS_SESSION_TOKEN
                        valueFrom:
                          secretKeyRef:
                            name: {{ .values.clusterName }}-metrics-s3-creds
                            key: 'SessionToken'
                      - name: S3_BUCKET
                        valueFrom:
                          secretKeyRef:
                            name: {{ .values.clusterName }}-metrics-creds
                            key: 'username'
                      - name: S3_ENDPOINT
                        value: 's3.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space:443'
                      {{- end }}
                  nginx:
                    enabled: true
                    replicas: 2
                    resources:
                      requests:
                        cpu: '10m'
                        memory: '32Mi'
                    podDisruptionBudget:
                      maxUnavailable: 1
                    strategy:
                      type: RollingUpdate
                      rollingUpdate:
                        maxUnavailable: 0
                        maxSurge: 1
                    topologySpreadConstraints:
                      maxSkew: 1
                      topologyKey: 'kubernetes.io/hostname'
                      whenUnsatisfiable: 'ScheduleAnyway'
                  distributor:
                    replicas: 3
                    resources:
                      requests:
                        cpu: '200m'
                        memory: '1Gi'
                    extraArgs:
                      distributor.ring.instance-id: '{{ .values.clusterName }}-mimir-{{ .values.tenant }}-distributor-$(HOSTNAME)'
                    podAnnotations:
                      core.mylogin.space/config-revision: '5018cce4b'
                    {{- if .values.mimirAvoidHpc3 }}
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: 'kubernetes.io/hostname'
                                  operator: NotIn
                                  values: ['hpc3']
                    {{- end }}
                  ingester:
                    enabled: true
                    replicas: 3
                    resources:
                      requests:
                        cpu: '750m'
                        memory: '3Gi'
                    extraArgs:
                      ingester.ring.instance-id: '{{ .values.clusterName }}-mimir-{{ .values.tenant }}-ingester-$(HOSTNAME)'
                      ingester.ring.tokens-file-path: '/data/tokens-{{ .values.clusterName }}-mimir-{{ .values.tenant }}-ingester-$(HOSTNAME)'
                    topologySpreadConstraints:
                      maxSkew: 1
                      topologyKey: 'kubernetes.io/hostname'
                      whenUnsatisfiable: 'ScheduleAnyway'
                    affinity:
                      {{- if .values.mimirAvoidHpc3 }}
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: 'kubernetes.io/hostname'
                                  operator: NotIn
                                  values: ['hpc3']
                      {{- end }}
                      podAntiAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                          - weight: 100
                            podAffinityTerm:
                              topologyKey: 'kubernetes.io/hostname'
                              labelSelector:
                                matchLabels:
                                  app.kubernetes.io/component: 'ingester'
                    zoneAwareReplication:
                      enabled: false
                    persistentVolume:
                      enabled: true
                      size: 50Gi
                      storageClass: longhorn
                      enableRetentionPolicy: true
                      whenDeleted: Retain
                      whenScaled: Retain
                  querier:
                    replicas: 3
                    resources:
                      requests:
                        cpu: '150m'
                        memory: '512Mi'
                    extraArgs:
                      querier.ring.instance-id: '{{ .values.clusterName }}-mimir-{{ .values.tenant }}-querier-$(HOSTNAME)'
                    {{- if .values.mimirAvoidHpc3 }}
                    affinity:
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: 'kubernetes.io/hostname'
                                  operator: NotIn
                                  values: ['hpc3']
                    {{- end }}
                    podDisruptionBudget:
                      maxUnavailable: 1
                    strategy:
                      type: RollingUpdate
                      rollingUpdate:
                        maxUnavailable: 0
                        maxSurge: '15%'
                    topologySpreadConstraints:
                      maxSkew: 1
                      topologyKey: 'kubernetes.io/hostname'
                      whenUnsatisfiable: 'ScheduleAnyway'
                  query_frontend:
                    replicas: 3
                    resources:
                      requests:
                        cpu: '50m'
                        memory: '128Mi'
                    podDisruptionBudget:
                      maxUnavailable: 1
                    strategy:
                      type: RollingUpdate
                      rollingUpdate:
                        maxUnavailable: 0
                        maxSurge: '15%'
                    topologySpreadConstraints:
                      maxSkew: 1
                      topologyKey: 'kubernetes.io/hostname'
                      whenUnsatisfiable: 'ScheduleAnyway'
                  query_scheduler:
                    replicas: 2
                    resources:
                      requests:
                        cpu: '25m'
                        memory: '96Mi'
                    extraArgs:
                      query-scheduler.ring.instance-id: '{{ .values.clusterName }}-mimir-{{ .values.tenant }}-query-scheduler-$(HOSTNAME)'
                    podDisruptionBudget:
                      maxUnavailable: 1
                    strategy:
                      type: RollingUpdate
                      rollingUpdate:
                        maxUnavailable: 0
                        maxSurge: 1
                    topologySpreadConstraints:
                      maxSkew: 1
                      topologyKey: 'kubernetes.io/hostname'
                      whenUnsatisfiable: 'ScheduleAnyway'
                  store_gateway:
                    replicas: 3
                    resources:
                      requests:
                        cpu: '50m'
                        memory: '128Mi'
                    extraArgs:
                      store-gateway.sharding-ring.instance-id: '{{ .values.clusterName }}-mimir-{{ .values.tenant }}-store-gateway-$(HOSTNAME)'
                    zoneAwareReplication:
                      enabled: false
                    persistentVolume:
                      enabled: true
                      size: 2Gi
                      # Preserve the existing StatefulSet claim template. Despite
                      # its legacy name, this is a Longhorn XFS RWO class.
                      storageClass: 'core-fast-rwx'
                      enableRetentionPolicy: true
                      whenDeleted: Retain
                      whenScaled: Retain
                  compactor:
                    replicas: {{ .values.mimirCompactorReplicas }}
                    resources:
                      requests:
                        cpu: '500m'
                        memory: '256Mi'
                    extraArgs:
                      compactor.ring.instance-id: '{{ .values.clusterName }}-mimir-{{ .values.tenant }}-compactor-$(HOSTNAME)'
                    persistentVolume:
                      enabled: true
                      size: 2Gi
                      storageClass: longhorn
                      enableRetentionPolicy: true
                      whenDeleted: Retain
                      whenScaled: Retain
                  overrides_exporter:
                    resources:
                      requests:
                        cpu: '10m'
                        memory: '64Mi'
                    extraArgs:
                      overrides-exporter.ring.instance-id: '{{ .values.clusterName }}-mimir-{{ .values.tenant }}-overrides-exporter-$(HOSTNAME)'
                  ruler:
                    replicas: {{ .values.mimirRulerReplicas }}
                    resources:
                      requests:
                        cpu: '500m'
                        memory: '256Mi'
                    extraArgs:
                      ruler.ring.instance-id: '{{ .values.clusterName }}-mimir-{{ .values.tenant }}-ruler-$(HOSTNAME)'
                  mimir:
                    structuredConfig:
                      limits:
                        max_global_series_per_user: 5000000
                        accept_ha_samples: true
                        ha_cluster_label: cluster
                        ha_replica_label: __replica__
                        ingestion_rate: {{ .values.mimirIngestionRate }}
                        ingestion_burst_size: {{ .values.mimirIngestionBurstSize }}
                        out_of_order_time_window: 24h
                        results_cache_ttl: 1h
                        results_cache_ttl_for_cardinality_query: 5m
                        results_cache_ttl_for_labels_query: 5m
                        compactor_blocks_retention_period: {{ .values.mimirRetentionPeriod }}
                      common:
                        storage:
                          backend: s3
                          s3:
                            endpoint: '{{ if and (eq .values.mimirS3Backend "garage") (eq .values.region "yvr") }}observability-garage.core-prod.svc.{{ .values.clusterDomain }}:3900{{ else if eq .values.mimirS3Backend "garage" }}observability-garage-s3.core-prod.svc.{{ .values.clusterDomain }}:443{{ else }}s3.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space:443{{ end }}'
                            region: '{{ if eq .values.mimirS3Backend "garage" }}garage{{ else }}us-east-1{{ end }}'
                            access_key_id: ${AWS_ACCESS_KEY_ID}
                            secret_access_key: ${AWS_SECRET_ACCESS_KEY}
                            session_token: ${AWS_SESSION_TOKEN}
                            insecure: {{ if eq .values.region "yvr" }}true{{ else }}false{{ end }}
                            http:
                              max_idle_connections: 200
                              max_idle_connections_per_host: 200
                      blocks_storage:
                        backend: s3
                        s3:
                          bucket_name: 'mimir-blocks'
                      alertmanager_storage:
                        backend: s3
                        s3:
                          bucket_name: mimir-alertmanager
                      ruler_storage:
                        backend: s3
                        s3:
                          bucket_name: mimir-ruler
                      compactor:
                        data_dir: /data
                      ingester:
                        ring:
                          # Use one active owner across the global ring. The
                          # three replicas per site remain available for local
                          # capacity and rollout redundancy, while Garage is
                          # the cross-site durability layer.
                          replication_factor: 1
                          zone_awareness_enabled: true
                          instance_availability_zone: '{{ .values.region }}'
                          unregister_on_shutdown: {{ if eq .values.region "yvr" }}true{{ else }}false{{ end }}
                      distributor:
                        remote_timeout: '30s'
                        ring:
                          instance_availability_zone: '{{ .values.region }}'
                        ha_tracker:
                          enable_ha_tracker: true
                          kvstore:
                            store: memberlist
                      querier:
                        prefer_availability_zones: '{{ .values.region }}'
                      memberlist:
                        cluster_label: core-observability-mimir
                        zone_aware_routing:
                          enabled: true
                          instance_availability_zone: '{{ .values.region }}'
                          role: member
                        join_members:
                          - dns+core-mimir-gossip-ring-global.core-{{ .values.environment }}.svc.{{ .values.clusterDomain }}.:7946
                      store_gateway:
                        sharding_ring:
                          instance_availability_zone: '{{ .values.region }}'
                          zone_awareness_enabled: true
                      ruler:
                        rule_path: /data
                      alertmanager:
                        data_dir: /data
                  # Ruler limits are reloadable. Keep them in runtime config so
                  # rule-set growth does not restart the entire Mimir ring.
                  runtimeConfig:
                    overrides:
                      '{{ .values.tenant }}':
                        ruler_max_rules_per_rule_group: {{ .values.mimirMaxRulesPerRuleGroup }}
                s3User:
                  enabled: true
                garage:
                  enabled: {{ .values.mimirGarageEnabled }}
                  clusterName: '{{ if eq .values.region "yvr" }}observability-garage-yxl-credentials{{ else }}observability-garage{{ end }}'
                  resourceSuffix: '{{ if eq .values.region "yvr" }}-yxl{{ else }}{{ end }}'
                  useUserCredentials: {{ if eq .values.region "yvr" }}true{{ else }}false{{ end }}
                mimirBridge:
                  enabled: true
                  queryFilter:
                    enabled: true
                  routeName: core-mimir
                  upstream:
                    service: core-mimir
                    port: 8080
                mimir:
                  service:
                    name: core-mimir
                    annotations:
                      service.cilium.io/affinity: '{{ .values.mimirGlobalAffinity }}'
                      service.cilium.io/global: 'true'
                      service.cilium.io/global-sync-endpoint-slices: 'true'
                      service.cilium.io/shared: '{{ .values.mimirGlobalShared }}'
                gateway:
                  enabled: {{ .values.mimirEnabled }}
                  routeName: core-mimir
                  labels:
                    lan-mode: private
                  parentRefs:
                    - group: gateway.networking.k8s.io
                      kind: Gateway
                      namespace: core-prod
                      name: main-gw
                  hostnames:
                    - metrics.mylogin.space
                k8gb:
                  enabled: true
                  domain: 'gslb.mylogin.space'
                  strategy: 'roundRobin'
                  dnsTtlSeconds: 30
                securityPolicy:
                  enabled: {{ .values.mimirEnabled }}
                  jwt:
                    optional: false
                    providers:
                      - name: grafana
                        issuer: https://idp.mylogin.space/application/o/grafana-test/
                        remoteJWKS:
                          cacheDuration: 3600s
                          uri: https://idp.mylogin.space/application/o/grafana-test/jwks/
                        claimToHeaders:
                          - header: x-scope-orgid
                            claim: orgID
                        extractFrom:
                          cookies:
                            - core-token
                      - name: mimir
                        issuer: https://idp.mylogin.space/application/o/mimir-test/
                        remoteJWKS:
                          cacheDuration: 3600s
                          uri: https://idp.mylogin.space/application/o/mimir-test/jwks/
                        claimToHeaders:
                          - header: x-scope-orgid
                            claim: orgID
                        extractFrom:
                          headers:
                            - name: Authorization
                              valuePrefix: 'Bearer '
                          cookies:
                            - session_access_token
                          params:
                            - token
                {{- end }}

            - name: 'LOVELY_KUSTOMIZE_MERGE'
              value: |-
                patches:
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      name: 'core-mimir-distributor'
                    patch: |-
                      - op: add
                        path: /spec/revisionHistoryLimit
                        value: 3
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      name: 'core-mimir-nginx'
                    patch: |-
                      - op: add
                        path: /spec/revisionHistoryLimit
                        value: 3
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      name: 'core-mimir-overrides-exporter'
                    patch: |-
                      - op: add
                        path: /spec/revisionHistoryLimit
                        value: 3
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      name: 'core-mimir-querier'
                    patch: |-
                      - op: add
                        path: /spec/revisionHistoryLimit
                        value: 3
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      name: 'core-mimir-query-frontend'
                    patch: |-
                      - op: add
                        path: /spec/revisionHistoryLimit
                        value: 3
                  - target:
                      group: apps
                      version: v1
                      kind: Deployment
                      name: 'core-mimir-query-scheduler'
                    patch: |-
                      - op: add
                        path: /spec/revisionHistoryLimit
                        value: 3
                  - target:
