apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 'core-backplane-network-analysis'
  namespace: 'argocd'
  annotations:
    argocd.argoproj.io/sync-wave: '30'
spec:
  goTemplate: true
  goTemplateOptions:
    - 'missingkey=error'
  generators:
    - merge:
        mergeKeys:
          - 'name'
        generators:
          - list:
              elements:
                - name: 'core-home1-talos-prod'
                  values:
                    databaseSecretName: 'core-network-analysis-ivre'
                    hostname: 'ivre.core-home1-talos-prod.home1.yvr.mylogin.space'
                    web:
                      enabled: true
                    client:
                      enabled: false
                    scanner:
                      enabled: false
          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
                  resolvemy.host/nodetype: 'infra'
              values:
                clusterName: '{{ .name }}'
                environment: '{{ index .metadata.labels "resolvemy.host/env" }}'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'
  syncPolicy:
    preserveResourcesOnDeletion: true
  template:
    metadata:
      name: '{{ .values.clusterName }}-network-analysis-{{ .values.environment }}'
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '.'
      labels:
        resolvemy.host/env: '{{ .values.environment }}'
    spec:
      project: 'core'
      syncPolicy:
        syncOptions:
          - 'CreateNamespace=true'
          - 'ServerSideApply=true'
      source:
        path: 'Network/Analysis'
        repoURL: 'https://github.com/K-FOSS/CoRE-Backplane.git'
        targetRevision: 'HEAD'
        plugin:
          name: 'argocd-lovely-plugin'
          env:
            - name: 'LOVELY_HELM_MERGE'
              value: |-
                database:
                  connectionSecretName: '{{ .values.databaseSecretName }}'

                web:
                  enabled: {{ .values.web.enabled }}

                client:
                  enabled: {{ .values.client.enabled }}

                scanner:
                  enabled: {{ .values.scanner.enabled }}

                gateway:
                  hostname: '{{ .values.hostname }}'
                  parentRef:
                    name: 'main-gw'
                    namespace: 'core-{{ .values.environment }}'
      destination:
        server: '{{ .server }}'
        namespace: 'core-net-{{ .values.environment }}'
