
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-backplane-storage-base
  namespace: argocd

spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - name
        generators:
          - matrix:
              generators:
                - list:
                    elements:
                      - clusters:
                          - name: core-dc1-talos-prod
                            values:
                              backupTargets:
                                - targetCluster: 'core-dc1-talos-prod'
                                  name: 'local'
                                  bucket: 'longhorn-core-dc1-talos-prod-backups'
                                  datacenter: 'dc1'
                                  region: 'yxl'
                                  s3Region: 'us-east-1'
                                  provider: 's3-yxl-dc1-core'
                                  local: true
                                - targetCluster: 'core-home1-talos-prod'
                                  name: 'peer-home1'
                                  bucket: 'longhorn-core-dc1-talos-prod-backups'
                                  datacenter: 'home1'
                                  region: 'yvr'
                                  s3Region: 'us-east-1'
                                  provider: 's3-core-home1-talos-prod'
                                  local: false
                          - name: core-home1-talos-prod
                            values:
                              backupTargets:
                                - targetCluster: 'core-home1-talos-prod'
                                  name: 'local'
                                  bucket: 'longhorn-core-home1-talos-prod-backups'
                                  datacenter: 'home1'
                                  region: 'yvr'
                                  s3Region: 'us-east-1'
                                  provider: 's3-yvr-home1-core'
                                  local: true
                                - targetCluster: 'core-dc1-talos-prod'
                                  name: 'peer-dc1'
                                  bucket: 'longhorn-core-home1-talos-prod-backups'
                                  datacenter: 'dc1'
                                  region: 'yxl'
                                  s3Region: 'us-east-1'
                                  provider: 's3-core-dc1-talos-prod'
                                  local: false
                - list:
                    elementsYaml: '{{ .clusters | toJson }}'
          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
                  resolvemy.host/nodetype: 'infra'
              values:
                clusterName: '{{ .name }}'
                environment: '{{ index .metadata.labels "resolvemy.host/env" }}'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'


  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-storage-base'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

    spec:
      project: core

      syncPolicy:
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true

      source:
        path: Storage/Base
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD
        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |- # yaml
                cluster:
                  name: {{ .values.clusterName }}
                  domain: {{ .values.clusterDomain }}

                datacenter: {{ .values.datacenter }}

                region: {{ .values.region }}

                backupTargets:
                  {{- range .values.backupTargets }}
                  - name: {{ .name }}
                    targetCluster: {{ .targetCluster }}
                    bucket: {{ .bucket }}
                    datacenter: {{ .datacenter }}
                    region: {{ .region }}
                    s3Region: {{ .s3Region }}
                    provider: {{ .provider }}
                    local: {{ .local }}
                  {{- end }}

                longhorn:
                  defaultBackupStore:
                    backupTarget: s3://{{ (index .values.backupTargets 0).bucket }}@{{ (index .values.backupTargets 0).s3Region }}/
                    backupTargetCredentialSecret: longhorn-backup-{{ .values.clusterName }}-credentials

      destination:
        server: '{{ .server }}'
        namespace: longhorn-system
