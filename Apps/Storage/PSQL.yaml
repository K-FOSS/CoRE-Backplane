apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-backplane-storage-db-psql
  namespace: argocd

  labels:
    resolvemy.host/env: 'prod'

  annotations:
    argocd.argoproj.io/sync-wave: '5'

spec:
  goTemplate: true
  goTemplateOptions:
    - 'missingkey=error'
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - matrix:
              generators:
                - list:
                    elements:
                      - clusters:
                          - name: 'dc1-k3s-node1'
                            values:
                              hub: false
                              datacenter: 'dc1'
                              region: 'yxl'
                              ldapServer: 'ldap-dc1.mylogin.space'

                              pooler:
                                peers:
                                  - hostname: 'psql-int.core-dc1-talos-prod.dc1.yxl.mylogin.space'
                                    port: 5432

                          - name: 'core-dc1-talos-prod'
                            values:
                              hub: true
                              datacenter: 'dc1'
                              region: 'yxl'
                              ldapServer: 'ldap-dc1-talos.mylogin.space'

                              pooler:
                                peers:
                                  - hostname: 'psql-int.dc1-k3s-node1.dc1.yxl.mylogin.space'
                                    port: 5432

                          - name: 'core-home1-talos-prod'
                            values:
                              hub: false
                              datacenter: 'home1'
                              region: 'yvr'
                              ldapServer: 'ldap-home1.mylogin.space'

                              pooler:
                                peers:
                                  - hostname: 'psql-int.core-dc1-talos-prod.dc1.yxl.mylogin.space'
                                    port: 5432

                - list:
                    elementsYaml: '{{ .clusters | toJson }}'

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'

              values:
                clusterName: '{{ .name }}'
                environment: '{{ index .metadata.labels "resolvemy.host/env" }}'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'

  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-db-psql'

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

    spec:
      project: core

      source:
        path: Databases/PSQL
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD
        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |-
                {{- $hub := dict }}
                {{- $hubCount := 0 }}
                {{- range .clusters }}
                {{- if .values.hub }}
                {{- $hub = . }}
                {{- $hubCount = add1 $hubCount }}
                {{- end }}
                {{- end }}
                {{- if ne $hubCount 1 }}
                {{- fail "exactly one core PostgreSQL ApplicationSet entry must set values.hub=true" }}
                {{- end }}
                env: '{{ .values.environment }}'

                cluster:
                  name: '{{ .values.clusterName }}'
                  domain: '{{ .values.clusterDomain }}'

                datacenter: '{{ .values.datacenter }}'

                region: '{{ .values.region }}'

                pgadmin:
                  domain: 'pgadmin.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'

                ldap:
                  server: '{{ .values.ldapServer }}'

                  postgres:
                    server: '{{ .values.ldapServer }}'

                  pooler:
                    server: '{{ .values.ldapServer }}'

                  pgadmin:
                    serverURI: 'ldap://{{ .values.ldapServer }}:389'

                psql:
                  controllerID: 'psql.{{ .values.tenant }}/{{ .values.environment }}'
                  hub: {{ .values.hub }}
                  standby: {{ not .values.hub }}
                  standbyHost: 'psql-int.{{ $hub.name }}.{{ $hub.values.datacenter }}.{{ $hub.values.region }}.mylogin.space'

                pooler:
                  peers:
                    {{ nindent 4 (toYaml .values.pooler.peers) }}

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
