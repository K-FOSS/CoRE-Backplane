
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 'core-backplane-rabbitmq'
  namespace: 'argocd'

spec:
  goTemplate: true
  goTemplateOptions:
    - 'missingkey=error'

  generators:
    - clusters:
        selector:
          matchLabels:
            mylogin.space/tenant: 'core.mylogin.space'
            resolvemy.host/env: 'prod'
            resolvemy.host/dc: 'home1'

  syncPolicy:
    preserveResourcesOnDeletion: true
  
  template:
    metadata:
      name: '{{ .name }}-rabbitmq'
    
      annotations:
        argocd.argoproj.io/manifest-generate-paths: '.'

    spec:
      project: 'core'
      syncPolicy:
        syncOptions:
          - 'CreateNamespace=true'
          - 'ServerSideApply=true'

      source:
        path: 'EventStream/RabbitMQ/Main'
        repoURL: 'https://slop.writemy.codes/CoRE/CoRE-Backplane.git'
        targetRevision: 'HEAD'

        plugin:
          name: 'argocd-lovely-plugin'

      destination:
        server: '{{ .server }}'
        namespace: 'core-prod'
