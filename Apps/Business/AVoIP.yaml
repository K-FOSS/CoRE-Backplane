apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 'core-backplane-business-avoip'
  namespace: 'argocd'

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  goTemplateOptions:
    - 'missingkey=error'

  generators:
    - merge:
        mergeKeys:
          - 'name'

        generators:
          - matrix:
              generators:
                - list:
                    elements:
                      - tenant: 'core.mylogin.space'
                        clusters:
                          - name: 'core-dc1-talos-prod'
                            values:
                              type: 'hub'
                              hubCluster: 'core-dc1-talos-prod'
                              hubDatacenter: 'dc1'
                              hubRegion: 'yxl'
                              rtpengineMediaAddress: '66.165.222.103'
                              rtpengineMediaPortMin: 11000
                              rtpengineMediaPortMax: 11300
                              asteriskEnabled: true
                              asterisk:
                                voicemail:
                                  enabled: false
                              freeswitchEnabled: true
                              externalIP: '66.165.222.103'
                              asteriskDID: '<path:CORE0_SITE1/data/AVoIP/YXL/DC1#FaxNumber>'
                              ivrDID: '<path:CORE0_SITE1/data/AVoIP/YXL/DC1#AVoIPNumber>'
                              egressIP: '66.165.222.103'
                              ciliumEgressGatewayEnabled: false
                              kamailio:
                                enabled: true
                                publicExposure:
                                  enabled: true
                                  sip:
                                    enabled: true
                                    tcpEnabled: false
                                    udpEnabled: false
                                    directService:
                                      enabled: false
                                    udpRoute:
                                      enabled: false
                                instances:
                                  - name: 'carrier'
                                    enabled: true
                                    role: 'carrier-sbc'
                                    replicas: 3
                                    carrierOutbound:
                                      enabled: true
                                      gatewayServiceHost: 'envoy-core-prod-main-gw-38cc5b72.kube-system.svc.k3s.dc1.resolvemy.host'
                                      sniHost: 'sip-outbound.core-dc1-talos-prod.dc1.yxl.resolvemy.host'
                                      clientIdentity:
                                        enabled: true
                                        issuerName: 'core-tls-vault'
                                      peer:
                                        cidr: '172.20.48.0/22'
                                        sanHostname: 'core-dc1-talos-prod-business-avoip-prod-avoip-kamailio-internal.core-prod.svc.k3s.dc1.resolvemy.host'
                                        serviceHost: 'core-dc1-talos-prod-business-avoip-prod-avoip-kamailio-internal.core-prod.svc.k3s.dc1.resolvemy.host'
                                        controller: 'kamailio-internal'
                                        secretName: 'core-dc1-talos-prod-business-avoip-p-kamailio-internal-sip-mtls'
                                    interSite:
                                      peers:
                                        - name: 'yvr'
                                          cidr: '172.20.56.0/21'
                                          sanHostname: 'core-home1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k8s.home1.resolvemy.host'
                                          serviceIP: '10.44.7.136'
                                          serviceHost: 'core-home1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k8s.home1.resolvemy.host'
                                          serverName: 'sip-outbound.core-home1-talos-prod.home1.yvr.resolvemy.host'
                                          allowedUsers: []
                                    publicExposure:
                                      enabled: true
                                      sip:
                                        enabled: true
                                        tcpEnabled: false
                                        udpEnabled: false
                                        directService:
                                          enabled: false
                                        udpRoute:
                                          enabled: false
                                  - name: 'internal'
                                    enabled: true
                                    role: 'private-sbc'
                                    replicas: 1
                                    topology:
                                      redis:
                                        database: 52
                                        secretName: 'avoip-kamailio-internal-topos'
                                    carrierOutbound:
                                      enabled: true
                                      gatewayServiceHost: 'envoy-core-prod-main-gw-38cc5b72.kube-system.svc.k3s.dc1.resolvemy.host'
                                      sniHost: 'sip-outbound.core-dc1-talos-prod.dc1.yxl.resolvemy.host'
                                      clientIdentity:
                                        enabled: true
                                        issuerName: 'core-tls-vault'
                                      peer:
                                        cidr: '172.20.48.0/22'
                                        sanHostname: 'core-dc1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k3s.dc1.resolvemy.host'
                                        serviceHost: 'core-dc1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k3s.dc1.resolvemy.host'
                                        controller: 'kamailio'
                                        secretName: 'core-dc1-talos-prod-business-avoip-prod-avoip-kamailio-sip-mtls'
                                    privateRouting:
                                      peers:
                                        - name: 'carrier'
                                          controller: 'kamailio'
                                          cidr: '172.20.48.0/22'
                                          sanHostname: 'core-dc1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k3s.dc1.resolvemy.host'
                                          allowedUsers: []
                              serviceOptions:
                                kamailio-pub:
                                  type: 'LoadBalancer'
                                  labels:
                                    wan-mode: 'public'
                                    lan-mode: 'private'
                                  annotations:
                                    purelb.io/allow-local: 'true'
                                    purelb.io/service-group: 'core-public'
                                  loadBalancerClass: ''
                          - name: 'core-home1-talos-prod'
                            values:
                              type: 'spoke'
                              hubCluster: 'core-dc1-talos-prod'
                              hubDatacenter: 'dc1'
                              hubRegion: 'yxl'
                              rtpengineMediaAddress: '24.86.197.63'
                              rtpengineMediaPortMin: 11000
                              rtpengineMediaPortMax: 11280
                              asteriskEnabled: true
                              freeswitchSipCoreAllowCryptoInAvp: true
                              asterisk:
                                voicemail:
                                  enabled: true
                                sipCore:
                                  enabled: true
                                  registrarBackend: 'kamailio'
                                  externalCallback:
                                    enabled: false
                                  hostname: 'sipcore.mylogin.space'
                                  gatewaySectionName: 'https-myloginspace'

                                  allowedOrigins:
                                    - 'https://home.mylogin.space'

                                  httpPort: 8088
                                  kamailioInstance: 'internal'
                                  ingressKamailioInstance: 'internal-websocket'
                                  echoExtension: '9090'
                                  inboundVoiceExtension: '7101'

                                  secretStoreRef:
                                    kind: 'ClusterSecretStore'
                                    name: 'corevault-rootsecrets'

                                  extensions:
                                    - number: '7101'
                                      maxContacts: 8
                                      secret:
                                        remoteKey: 'AVoIP/SIPCore/YVR/Home1/7101'
                                        property: 'Password'

                                      allowCallsTo:
                                        - '9090'
                                        - '66'
                              freeswitchEnabled: true
                              asteriskDID: '<path:CORE0_SITE1/data/AVoIP/YVR/Home1#FaxNumber>'
                              ivrDID: '<path:CORE0_SITE1/data/AVoIP/YVR/Home1#AVoIPNumber>'
                              ciliumEgressGatewayEnabled: false
                              kamailio:
                                enabled: true
                                publicExposure:
                                  enabled: true

                                  sip:
                                    udpEnabled: false
                                    directService:
                                      enabled: false
                                instances:
                                  - name: 'carrier'
                                    enabled: true
                                    role: 'carrier-sbc'
                                    replicas: 3
                                    carrierOutbound:
                                      enabled: true
                                      gatewayServiceHost: 'envoy-core-prod-main-gw-38cc5b72.kube-system.svc.k8s.home1.resolvemy.host'
                                      sniHost: 'sip-outbound.core-home1-talos-prod.home1.yvr.resolvemy.host'
                                      clientIdentity:
                                        enabled: true
                                        issuerName: 'core-tls-vault'
                                      peer:
                                        cidr: '172.20.56.0/21'
                                        sanHostname: 'core-home1-talos-prod-business-avoip-prod-avo-kamailio-internal.core-prod.svc.k8s.home1.resolvemy.host'
                                        serviceHost: 'core-home1-talos-prod-business-avoip-prod-avo-kamailio-internal.core-prod.svc.k8s.home1.resolvemy.host'
                                        controller: 'kamailio-internal'
                                        secretName: 'core-home1-talos-prod-business-avoip-kamailio-internal-sip-mtls'
                                    interSite:
                                      peers:
                                        - name: 'yxl'
                                          cidr: '172.20.48.0/22'
                                          sanHostname: 'core-dc1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k3s.dc1.resolvemy.host'
                                          serviceIP: '10.44.3.190'
                                          serviceHost: 'core-dc1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k3s.dc1.resolvemy.host'
                                          serverName: 'sip-outbound.core-dc1-talos-prod.dc1.yxl.resolvemy.host'
                                          allowedUsers:
                                            - '7101'
                                            - '7102'
                                    publicExposure:
                                      enabled: true
                                      sip:
                                        udpEnabled: false
                                        directService:
                                          enabled: false
                                  - name: 'internal'
                                    enabled: true
                                    role: 'private-sbc'
                                    replicas: 1
                                    registrar:
                                      database:
                                        enabled: true
                                        host: 'psql-local.core-home1-talos-prod.home1.yvr.mylogin.space'
                                        username: 'kamailio-internal'
                                        secretName: 'avoip-kamailio-internal-registrar-db'
                                    topology:
                                      redis:
                                        database: 52
                                        secretName: 'avoip-kamailio-internal-topos'
                                    carrierOutbound:
                                      enabled: true
                                      gatewayServiceHost: 'envoy-core-prod-main-gw-38cc5b72.kube-system.svc.k8s.home1.resolvemy.host'
                                      sniHost: 'sip-outbound.core-home1-talos-prod.home1.yvr.resolvemy.host'
                                      clientIdentity:
                                        enabled: true
                                        issuerName: 'core-tls-vault'
                                      peer:
                                        cidr: '172.20.56.0/21'
                                        sanHostname: 'core-home1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k8s.home1.resolvemy.host'
                                        serviceHost: 'core-home1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k8s.home1.resolvemy.host'
                                        controller: 'kamailio'
                                        secretName: 'core-home1-talos-prod-business-avoip-prod-avoip-kamailio-sip-mtls'
                                    privateRouting:
                                      peers:
                                        - name: 'carrier'
                                          controller: 'kamailio'
                                          cidr: '172.20.56.0/21'
                                          sanHostname: 'core-home1-talos-prod-business-avoip-prod-avoip-kamailio.core-prod.svc.k8s.home1.resolvemy.host'
                                          allowedUsers: []
                                  - name: 'internal-websocket'
                                    enabled: true
                                    role: 'private-sbc'
                                    replicas: 3
                                    # Prefer distinct hosts, but the third site's allocatable CPU
                                    # is exhausted; keep three replicas on the available hosts.
                                    scheduling:
                                      affinity:
                                        podAntiAffinity:
                                          preferredDuringSchedulingIgnoredDuringExecution:
                                            - weight: 100
                                              podAffinityTerm:
                                                labelSelector:
                                                  matchLabels:
                                                    app.kubernetes.io/controller: 'kamailio-internal-websocket'
                                                    app.kubernetes.io/instance: 'core-home1-talos-prod-business-avoip-prod'
                                                topologyKey: 'kubernetes.io/hostname'
                                      topologySpreadConstraints:
                                        - maxSkew: 1
                                          topologyKey: 'kubernetes.io/hostname'
                                          whenUnsatisfiable: 'ScheduleAnyway'
                                          labelSelector:
                                            matchLabels:
                                              app.kubernetes.io/controller: 'kamailio-internal-websocket'
                                              app.kubernetes.io/instance: 'core-home1-talos-prod-business-avoip-prod'
                                    sipLogging:
                                      rawInbound: false
                                      postToposResponses: false
                                      carrierTraffic: false
                                      diagnostics:
                                        enabled: false
                                        sdp: false
                                    privateRouting:
                                      peers:
                                        - name: 'freeswitch-registrar'
                                          controller: 'freeswitch'
                                          cidr: '172.20.56.0/21'
                                          sanHostname: 'core-home1-talos-prod-business-avoip-prod-avoip-freeswitch.core-prod.svc.k8s.home1.resolvemy.host'
                                          allowedUsers: []
                                    registrar:
                                      enabled: true
                                      realm: 'sipcore.mylogin.space'
                                      accessPeerName: 'freeswitch-registrar'
                                      inboundPeerName: 'freeswitch-registrar'
                                      allowedUsers: ['7101']
                                      maxContacts: 8
                                      credentialSync:
                                        enabled: true
                                      database:
                                        enabled: true
                                        host: 'psql-local.core-home1-talos-prod.home1.yvr.mylogin.space'
                                        username: 'kamailio-internal-ws'
                                        secretName: 'avoip-kamailio-internal-ws-registrar-db'
                                    topology:
                                      redis:
                                        database: 53
                                        secretName: 'avoip-kamailio-internal-ws-topos'
                                    websocketHA:
                                      enabled: true
                                      pilot: true
                                      compatibility:
                                        lfOnlyHeartbeat:
                                          enabled: true
                                          image:
                                            repository: 'slop.writemy.codes/core/core-business/kamailio-lf-heartbeat'
                                            tag: '6.1.4-lf-heartbeat-b5c741cfb5979353ff60268dbfb16a0a0c6bc2e1'
                                            digest: 'sha256:f0542b27fc2e521fd1d4a12b3a7ced0d9d1ef69e6a60493c2a190adb7bdefd81'
                                  - name: 'internal-ha'
                                    enabled: true
                                    role: 'private-sbc'
                                    replicas: 3
                                    # Retain CPU requests while allowing a second pod on a host.
                                    scheduling:
                                      affinity:
                                        podAntiAffinity:
                                          preferredDuringSchedulingIgnoredDuringExecution:
                                            - weight: 100
                                              podAffinityTerm:
                                                labelSelector:
                                                  matchLabels:
                                                    app.kubernetes.io/controller: 'kamailio-internal-ha'
                                                    app.kubernetes.io/instance: 'core-home1-talos-prod-business-avoip-prod'
                                                topologyKey: 'kubernetes.io/hostname'
                                      topologySpreadConstraints:
                                        - maxSkew: 1
                                          topologyKey: 'kubernetes.io/hostname'
                                          whenUnsatisfiable: 'ScheduleAnyway'
                                          labelSelector:
                                            matchLabels:
                                              app.kubernetes.io/controller: 'kamailio-internal-ha'
                                              app.kubernetes.io/instance: 'core-home1-talos-prod-business-avoip-prod'
                                    frontendHA:
                                      enabled: true
                                      pilot: true
                                    topology:
                                      redis:
                                        database: 54
                                        secretName: 'avoip-kamailio-internal-ha-topos'
                              serviceOptions:
                                kamailio-pub:
                                  type: 'LoadBalancer'
                                  labels:
                                    wan-mode: 'public'
                                    lan-mode: 'private'
                                  annotations:
                                    kube-vip.io/forwardUPNP: 'true'
                                  loadBalancerClass: 'kube-vip.io/kube-vip-class'
                          - name: 'dc1-k3s-node1'
                            values:
                              type: 'spoke'
                              hubCluster: 'core-dc1-talos-prod'
                              hubDatacenter: 'dc1'
                              hubRegion: 'yxl'
                              rtpengineMediaAddress: '66.165.222.103'
                              rtpengineMediaPortMin: 11000
                              rtpengineMediaPortMax: 11250
                              asteriskEnabled: false
                              freeswitchEnabled: false
                              ciliumEgressGatewayEnabled: false

                - list:
                    elementsYaml: '{{ .clusters | toJson }}'

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/env: 'prod'
              values:
                clusterName: '{{ .name }}'
                environment: '{{ index .metadata.labels "resolvemy.host/env" }}'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'

  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ if eq .values.clusterName "dc1-k3s-node1" }}{{ .values.clusterName }}-business-avoip{{ else }}{{ .values.clusterName }}-business-avoip-{{ .values.environment }}{{ end }}'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: '.'

      labels:
        resolvemy.host/env: '{{ .values.environment }}'

    spec:
      project: 'core'

      syncPolicy:
        syncOptions:
          - 'CreateNamespace=true'
          - 'ServerSideApply=true'

      source:
        repoURL: 'https://slop.writemy.codes/CoRE/CoRE-Business.git'
        path: 'AVoIP'
        targetRevision: 'HEAD'

        plugin:
          name: 'argocd-lovely-plugin'
          env:
            - name: 'LOVELY_HELM_MERGE'
              value: |- # yaml
                env: '{{ .values.environment }}'

                datacenter: '{{ .values.datacenter }}'

                region: '{{ .values.region }}'

                cluster:
                  name: '{{ .values.clusterName }}'
                  domain: '{{ .values.clusterDomain }}'
                  type: '{{ .values.type }}'

                asterisk:
                {{- if hasKey .values "asterisk" }}
                {{- with .values.asterisk }}
                {{- toYaml . | nindent 2 }}
                {{- end }}
                {{- end }}
                  enabled: {{ .values.asteriskEnabled }}

                freeswitch:
                  enabled: {{ .values.freeswitchEnabled }}
                  sipCore:
                    allowCryptoInAvp: {{ default false .values.freeswitchSipCoreAllowCryptoInAvp }}
                  highAvailability:
                    enabled: {{ and .values.freeswitchEnabled (or (eq .values.region "yxl") (eq .values.region "yvr")) }}
                    replicas: 2
                    minAvailable: 1
                  flowrouteOutbound:
                    enabled: {{ and .values.freeswitchEnabled (or (eq .values.region "yxl") (eq .values.region "yvr")) }}
                    regionalHost: '{{ if eq .values.region "yxl" }}us-east-va.sip.flowroute.com{{ else }}us-west-or.sip.flowroute.com{{ end }}'
                  interSite:
                    enabled: {{ eq .values.region "yvr" }}
                    peerName: 'yxl'
                    extension: '7101'
                    ivrExtension: '7102'
                  ivr:
                    enabled: {{ ne .values.region "yxl" }}
                    extensions: {{ if eq .values.region "yvr" }}['7101', '9090', '66']{{ else }}['7101']{{ end }}
                    greeting: '/usr/share/freeswitch/sounds/avoip-shared/IVRGreet.wav'
                  fax:
                    ident: '{{ upper .values.region }}-CoRE'

                flowrouteSMS:
                  enabled: {{ eq .values.clusterName "core-home1-talos-prod" }}
                  {{- if eq .values.region "yxl" }}
                  # YXL Admin/SMS media uses the peered YVR TenantLab S3
                  # service. The credential Secret is reconciled by the
                  # TenantLab peer, not generated by the AVoIP User claim.
                  media:
                    endpoint: 'https://s3.core-home1-talos-prod.home1.yvr.mylogin.space'
                    region: 'yvr'
                    credentialsSecretName: 'core-dc1-talos-prod-core-storage-s3-tenant-prod-core-home1-talos-prod-providercreds'
                    accessKeyKey: 'AWS_ACCESS_KEY_ID'
                    secretKeyKey: 'AWS_SECRET_ACCESS_KEY'
                    existingCredentials: true
                  {{- end }}
                  {{ if and .values.freeswitchEnabled (or (eq .values.clusterName "core-home1-talos-prod") (eq .values.clusterName "core-dc1-talos-prod")) }}
                  providerCredentials:
                    SMS_PROVIDER_TWILIO_ACCOUNT:
                      name: 'avoip-sms-twilio'
                      key: 'AccountSID'
                      remoteRef:
                        key: 'AVoIP/SIP/Twilio'
                        property: 'AccountSID'
                    SMS_PROVIDER_TWILIO_TOKEN:
                      name: 'avoip-sms-twilio'
                      key: 'AuthToken'
                      remoteRef:
                        key: 'AVoIP/SIP/Twilio'
                        property: 'Token'
                  {{ end }}

                avoipAdmin:
                  enabled: {{ and .values.freeswitchEnabled (or (eq .values.clusterName "core-home1-talos-prod") (eq .values.clusterName "core-dc1-talos-prod")) }}
                  {{- if eq .values.clusterName "core-home1-talos-prod" }}
                  image:
                    tag: '1-91edafbb8d465c0da14ab3e8fa086e0a8b58c03f'
                    digest: 'sha256:df2102b41dc5dbd0cf5bba87cd925ad4d56503335d1e7621bdf9262b69e8efaf'
                  {{- end }}
                  telephony:
                    enabled: {{ and .values.freeswitchEnabled (eq .values.clusterName "core-home1-talos-prod") }}
                    managementSecret:
                      remoteKey: 'AVoIP/Telephony/{{ upper .values.region }}/{{ if eq .values.clusterName "core-home1-talos-prod" }}Home1{{ else }}DC1{{ end }}'
                    asteriskManager:
                      username: 'avoip-admin-{{ .values.region }}'
                    freeswitchEventSocket:
                      listenAddress: '0.0.0.0'
                      allowedCIDRs:
                        - '172.20.56.0/21'
                  bridgedCalls:
                    enabled: {{ and .values.freeswitchEnabled (eq .values.clusterName "core-home1-talos-prod") }}
                  {{- if eq .values.region "yvr" }}
                  upstreams:
                    - name: 'twilio-west'
                      host: 'coreinc-yvr.pstn.umatilla.twilio.com'
                      authentication: 'ip-acl'
                      register: false
                  {{- end }}
                  dns:
                    enabled: {{ and .values.freeswitchEnabled (or (eq .values.clusterName "core-home1-talos-prod") (eq .values.clusterName "core-dc1-talos-prod")) }}
                    target: 'nsadmin.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.resolvemy.host'
                  routing:
                    enabled: {{ and .values.freeswitchEnabled (or (eq .values.clusterName "core-home1-talos-prod") (eq .values.clusterName "core-dc1-talos-prod")) }}
                    {{- if eq .values.region "yvr" }}
                    upstreamCIDRs:
                      - '54.244.51.0/30'
                    {{- end }}

                talkHpb:
                  enabled: {{ eq .values.region "yvr" }}
                  clusterName: '{{ .values.clusterName }}'

                livekit:
                  enabled: {{ eq .values.region "yvr" }}
                  hostname: 'livekit-{{ .values.region }}.mylogin.space'
                  redis:
                    remoteRef:
                      key: 'Storage/DragonFly/CoRE/{{ .values.region }}/{{ .values.datacenter }}/{{ .values.clusterName }}/Creds'
                  media:
                    service:
                      loadBalancerClass: '{{ if eq .values.region "yvr" }}kube-vip.io/kube-vip-class{{ end }}'
                      annotations:
                        kube-vip.io/forwardUPNP: 'true'

                livekit-server:
                  livekit:
                    redis:
                      address: 'dragonfly.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space:6379'
                      tls:
                        server_name: 'dragonfly.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'

                {{- if hasKey .values "ivrDID" }}
                avoip:
                  did: '{{ .values.ivrDID }}'
                {{- end }}

                {{- if hasKey .values "asteriskDID" }}
                fax:
                  did: '{{ .values.asteriskDID }}'
                {{- end }}

                kamailio:
                {{- if hasKey .values "kamailio" }}
                {{- with .values.kamailio }}
                {{- toYaml . | nindent 2 }}
                {{- end }}
                {{- end }}
                  advertisedHost: 'sip.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.resolvemy.host'

                network:
                  ciliumEgressGateway:
                    enabled: {{ .values.ciliumEgressGatewayEnabled }}
                {{- if hasKey .values "externalIP" }}
                  externalIP: '{{ .values.externalIP }}'
                  egressIP: '{{ .values.egressIP }}'
                {{- end }}

                rtpengine:
                  media:
                    address: '{{ .values.rtpengineMediaAddress }}'
                    min: {{ .values.rtpengineMediaPortMin }}
                    max: {{ .values.rtpengineMediaPortMax }}

                serviceOptions:
                {{- if hasKey .values "serviceOptions" }}
                {{- with .values.serviceOptions }}
                {{- toYaml . | nindent 2 }}
                {{- end }}
                {{- end }}
                {{- if eq .values.region "yxl" }}
                {{- toYaml (dict "rtpengine-media" (dict "annotations" (dict "purelb.io/addresses" .values.rtpengineMediaAddress "purelb.io/allow-local" "true" "purelb.io/service-group" "core-public"))) | nindent 2 }}
                {{- else if eq .values.region "yvr" }}
                {{- toYaml (dict "rtpengine-media" (dict "loadBalancerClass" "kube-vip.io/kube-vip-class" "annotations" (dict "kube-vip.io/forwardUPNP" "true"))) | nindent 2 }}
                {{- end }}

                {{- if eq .values.type "spoke" }}
                hub:
                  cluster:
                    name: '{{ .values.hubCluster }}'
                    datacenter: '{{ .values.hubDatacenter }}'
                    region: '{{ .values.hubRegion }}'
                {{- end }}

                gateway:
                  name: 'main-gw'
                  namespace: 'core-{{ .values.environment }}'
                  sectionName: 'https-myloginspace'

                jitsi:
                  domain: 'meet.mylogin.space'
                  tls:
                    secretName: 'myloginspace-default-certificates'

      destination:
        server: '{{ .server }}'
        namespace: 'core-{{ .values.environment }}'
