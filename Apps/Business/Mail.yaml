apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 'core-business-mail'
  namespace: 'argocd'

  labels:
    resolvemy.host/env: 'prod'

spec:
  goTemplate: true
  goTemplateOptions:
    - 'missingkey=error'

  generators:
    - merge:
        mergeKeys:
          - 'name'

        generators:
          - list:
              elements:
                - name: 'dc1-k3s-node1'
                  values:
                    dragonflySecretKey: 'Storage/DragonFly/CoRE/Creds'
                    ldapServer: 'ldap-dc1.mylogin.space'
                    psqlProvider: 'psql-dc1-yxl'
                    s3Provider: 's3-yxl-dc1-core'

                - name: 'core-dc1-talos-prod'
                  values:
                    dragonflySecretKey: 'Storage/DragonFly/CoRE/yxl/dc1/core-dc1-talos-prod/Creds'
                    ldapServer: 'ldap-dc1-talos.mylogin.space'
                    psqlProvider: 'psql-dc1-yxl'
                    s3Provider: 's3-yxl-dc1-core'

                - name: 'core-home1-talos-prod'
                  values:
                    dragonflySecretKey: 'Storage/DragonFly/CoRE/yvr/home1/core-home1-talos-prod/Creds'
                    ldapServer: 'ldap-home1.mylogin.space'
                    psqlProvider: 'psql-home1-yvr'
                    s3Provider: 's3-yvr-home1-core'

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/env: 'prod'

              values:
                clusterName: '{{ .name }}'
                environment: '{{ index .metadata.labels "resolvemy.host/env" }}'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'

  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-business-mail'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: '.'

      labels:
        resolvemy.host/env: '{{ .values.environment }}'
        resolvemy.host/priority: 'critical'

    spec:
      project: 'core'

      syncPolicy:
        syncOptions:
          - 'ServerSideApply=true'

      source:
        repoURL: 'https://github.com/K-FOSS/CoRE-Business.git'
        path: 'Mail'
        targetRevision: 'HEAD'

        plugin:
          name: 'argocd-lovely-plugin'
          env:
            - name: 'LOVELY_HELM_MERGE'
              value: |- # yaml
                clusterDNS: '{{ .values.clusterDomain }}'

                site:
                  ldap:
                    hostname: '{{ .values.ldapServer }}'

                  psql:
                    hostname: 'psql-local.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'
                    crossplaneProvider: '{{ .values.psqlProvider }}'
                    terraformProvider: '{{ .values.psqlProvider }}'

                  dragonfly:
                    hostname: 'dragonfly.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'
                    remoteRef:
                      key: '{{ .values.dragonflySecretKey }}'

                  s3:
                    crossplaneProvider: '{{ .values.s3Provider }}'
                    terraformProvider: '{{ .values.s3Provider }}'

      destination:
        server: '{{ .server }}'
        namespace: 'core-{{ .values.environment }}'
