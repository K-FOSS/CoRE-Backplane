apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 'core-backplane-business-personal-travel'
  namespace: 'argocd'

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  goTemplateOptions:
    - 'missingkey=error'

  generators:
    - merge:
        mergeKeys:
          - 'name'

        generators:
          - list:
              elements:
                - name: 'core-home1-talos-prod'

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
                  resolvemy.host/nodetype: 'infra'
                  topology.kubernetes.io/region: 'yvr'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'

  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-business-personal-travel-{{ .values.environment }}'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: '.'

      labels:
        resolvemy.host/env: '{{ .values.environment }}'

    spec:
      project: 'core'

      syncPolicy:
        syncOptions:
          - 'CreateNamespace=true'
          - 'ServerSideApply=true'

      source:
        repoURL: 'https://github.com/K-FOSS/CoRE-Business.git'
        path: 'Personal/Travel'
        targetRevision: 'HEAD'

        plugin:
          name: 'argocd-lovely-plugin'
          env:
            - name: 'LOVELY_HELM_MERGE'
              value: |- # yaml
                cluster:
                  name: '{{ .values.clusterName }}'

                datacenter: '{{ .values.datacenter }}'

                region: '{{ .values.region }}'

                adventurelog:
                  image:
                    tag: 'latest'
                    frontendDigest: 'sha256:74e3972ecbd2a9708af4996f22acb6cca8e2fabe1c91d5fe60f6510d2ca490ec'
                    backendDigest: 'sha256:22447c533ed843287f1b578e7624d551b2770a75c4eefc4b69b7cfb91b6d5586'
                  database:
                    crossplaneProvider: 'psql-{{ .values.datacenter }}-{{ .values.region }}'
                    terraformProvider: 'psql-{{ .values.datacenter }}-{{ .values.region }}'

      destination:
        server: '{{ .server }}'
        namespace: 'core-{{ .values.environment }}'
