apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: 'core-backplane-business-social-fediverse'
  namespace: 'argocd'

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  goTemplate: true
  goTemplateOptions:
    - 'missingkey=error'

  generators:
    - merge:
        mergeKeys:
          - 'name'

        generators:
          - list:
              elements:
                - name: 'core-home1-talos-prod'

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
                  resolvemy.host/nodetype: 'infra'
                  topology.kubernetes.io/region: 'yvr'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'

  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-business-social-fediverse-{{ .values.environment }}'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: '.'

      labels:
        resolvemy.host/env: '{{ .values.environment }}'

    spec:
      project: 'core'

      syncPolicy:
        syncOptions:
          - 'CreateNamespace=true'
          - 'ServerSideApply=true'

      source:
        repoURL: 'https://github.com/K-FOSS/CoRE-Business.git'
        path: 'Social/Fediverse'
        targetRevision: 'HEAD'

        plugin:
          name: 'argocd-lovely-plugin'
          env:
            - name: 'LOVELY_HELM_MERGE'
              value: |- # yaml
                env: '{{ .values.environment }}'

                datacenter: '{{ .values.datacenter }}'

                region: '{{ .values.region }}'

                cluster:
                  name: '{{ .values.clusterName }}'
                  domain: '{{ .values.clusterDomain }}'

                gateway:
                  name: 'main-gw'
                  namespace: 'core-{{ .values.environment }}'
                  sectionName: 'https-myloginspace'

                mastodon:
                  domain: 'mastodon.mylogin.space'
                  existingSecret: 'social-fediverse-mastodon'
                  psql:
                    crossplaneProvider: 'psql-{{ .values.datacenter }}-{{ .values.region }}'
                    terraformProvider: 'psql-{{ .values.datacenter }}-{{ .values.region }}'
                  s3:
                    crossplaneProvider: 's3-{{ .values.region }}-{{ .values.datacenter }}-core'
                    terraformProvider: 's3-{{ .values.region }}-{{ .values.datacenter }}-core'

      destination:
        server: '{{ .server }}'
        namespace: 'core-{{ .values.environment }}'
