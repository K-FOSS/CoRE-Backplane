apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-backplane-ops-crossplane
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: '0'

spec:
  goTemplate: true

  goTemplateOptions:
    - 'missingkey=error'

  generators:
    - clusters:
        selector:
          matchLabels:
            mylogin.space/tenant: 'core.mylogin.space'
        values:
          clusterName: '{{ .name }}'
          clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
          environment: '{{ index .metadata.labels "resolvemy.host/env" }}'
          crossplanens: '{{ index .metadata.labels "mylogin.space/crossplanens" }}'

  template:
    metadata:
      name: '{{ .values.clusterName }}-ops-crossplane'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

    spec:
      project: core

      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true

      source:
        path: Operations/Crossplane
        repoURL: https://slop.writemy.codes/CoRE/CoRE-Backplane.git
        targetRevision: HEAD
        plugin:
          name: argocd-lovely-plugin
          env:
            - name: 'LOVELY_HELM_MERGE'
              value: |-
                garagePermissions:
                  enabled: {{ if or (eq .name "core-dc1-talos-prod") (eq .name "core-home1-talos-prod") }}true{{ else }}false{{ end }}
                providerTerraform:
                  maxReconcileRate: '1'
                  {{- if eq .name "dc1-k3s-node1" }}
                  package: 'registry.writemy.codes/library/terraform:v0.20.1'
                  {{- end }}
                  {{- if or (eq .name "core-home1-talos-prod") (eq .name "core-dc1-talos-prod") }}
                  resources:
                    requests:
                      cpu: '1'
                      memory: '1Gi'
                    limits:
                      cpu: '8'
                      memory: '8Gi'
                  {{- end }}

      destination:
        server: '{{ .server }}'
        namespace: '{{ .values.crossplanens }}'
