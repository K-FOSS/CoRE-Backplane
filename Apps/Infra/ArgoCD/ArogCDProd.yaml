apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-argocd
  namespace: argocd

spec:
  goTemplate: true
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - list:
              elements:
                # YVR hosts the fleet control plane for the local cluster and
                # the two registered remote clusters (about 200 Applications).
                - name: core-home1-talos-prod
                  values:
                    processors:
                      status: 25
                      operations: 10
                    reposerver:
                      parallelism: 5
                    controllerCache:
                      # Batch watch events to avoid amplifying API traffic over
                      # the roughly 100 ms inter-site links.
                      interval: 500ms
                    monitoring:
                      enabled: true

          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/computetype: 'baremetal'
                  resolvemy.host/nodetype: 'infra'
              values:
                clusterName: '{{ .name }}'
                environment: 'prod'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                region: '{{ index .metadata.labels "topology.kubernetes.io/region" }}'
                zone: '{{ index .metadata.labels "topology.kubernetes.io/zone" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'


  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-argocd-{{ .values.environment }}'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

    spec:
      project: core

      syncPolicy:
        syncOptions:
          - ServerSideApply=true
          - CreateNamespace=true

      source:
        path: ArgoCD
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD
        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |- # yaml
                env: {{ .values.environment }}

                cluster:
                  name: {{ .values.clusterName }}
                  domain: {{ .values.clusterDomain }}

                datacenter: {{ .values.datacenter }}

                region: {{ .values.region }}

                argo-cd:
                  controller:
                    replicas: 2

                    pdb:
                      enabled: true
                      minAvailable: 1

                    resources:
                      requests:
                        cpu: 500m
                        memory: 1Gi
                      limits:
                        cpu: '2'
                        memory: 4Gi

                    metrics:
                      enabled: {{ .values.monitoring.enabled }}
                      serviceMonitor:
                        enabled: {{ .values.monitoring.enabled }}

                  repoServer:
                    replicas: 2

                    pdb:
                      enabled: true
                      minAvailable: 1

                    resources:
                      requests:
                        cpu: 250m
                        memory: 4Gi
                      limits:
                        cpu: '2'
                        memory: 4Gi

                    metrics:
                      enabled: {{ .values.monitoring.enabled }}
                      serviceMonitor:
                        enabled: {{ .values.monitoring.enabled }}

                  applicationSet:
                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: 500m
                        memory: 512Mi

                    metrics:
                      enabled: {{ .values.monitoring.enabled }}
                      serviceMonitor:
                        enabled: {{ .values.monitoring.enabled }}

                  notifications:
                    resources:
                      requests:
                        cpu: 50m
                        memory: 128Mi
                      limits:
                        cpu: 300m
                        memory: 256Mi

                    metrics:
                      enabled: {{ .values.monitoring.enabled }}
                      serviceMonitor:
                        enabled: {{ .values.monitoring.enabled }}

                  externalRedis:
                    # -- External Redis server host
                    host: 'dragonfly.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.mylogin.space'
                    # -- External Redis server port
                    port: 6379
                    # -- The name of an existing secret with Redis (must contain key `redis-password`. And should contain `redis-username` if username is not `default`) and Sentinel credentials.
                    # When it's set, the `externalRedis.username` and `externalRedis.password` parameters are ignored
                    existingSecret: argocd-redis-password

                  server:
                    replicas: 2

                    pdb:
                      enabled: true
                      minAvailable: 1

                    resources:
                      requests:
                        cpu: 100m
                        memory: 256Mi
                      limits:
                        cpu: '1'
                        memory: 1Gi

                    metrics:
                      enabled: {{ .values.monitoring.enabled }}
                      serviceMonitor:
                        enabled: {{ .values.monitoring.enabled }}

                    httproute:
                      enabled: true

                      hostnames:
                        - argocd.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.writemy.codes

                      parentRefs:
                        - group: gateway.networking.k8s.io
                          kind: Gateway
                          namespace: core-{{ .values.environment }}
                          name: main-gw
                          sectionName: https-myloginspace
                        
                    grpcroute:
                      parentRefs:
                        - group: gateway.networking.k8s.io
                          kind: Gateway
                          namespace: core-{{ .values.environment }}
                          name: main-gw
                          sectionName: https-myloginspace

                      hostnames:
                        - argocd.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.writemy.codes

                  global:
                    domain: argocd.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.writemy.codes
                  configs:
                    params:
                      controller.status.processors: {{ .values.processors.status }}
                      controller.operation.processors: {{ .values.processors.operations }}

                      repo.server: 'argocd-repo-server.argocd.svc.{{ .values.clusterDomain }}:8081'

                      reposerver.parallelism.limit: "{{ .values.reposerver.parallelism }}"
                      controller.cluster.cache.events.processing.interval: "{{ .values.controllerCache.interval }}"

                    cm:
                      url: https://argocd.{{ .values.clusterName }}.{{ .values.datacenter }}.{{ .values.region }}.writemy.codes

            - name: LOVELY_KUSTOMIZE_MERGE
              value: |-
                patches:
                  - path: argocd-lovely-plugin.yaml
                    target:
                      kind: Deployment
                      name: argocd-repo-server

                  - target:
                      kind: Deployment
                      name: argocd-repo-server

                    patch: |-
                      apiVersion: apps/v1
                      kind: Deployment
                      metadata:
                        name: argocd-repo-server
                      spec:
                        template:
                          spec:
                            containers:
                              - name: lovely-plugin
                                resources:
                                  requests:
                                    cpu: 100m
                                    memory: 256Mi
                                  limits:
                                    cpu: '4'
                                    memory: 12Gi

                  - target:
                      kind: Secret
                      name: argocd-secret

                    patch: |
                      - op: replace
                        path: /type
                        value: connection.crossplane.io/v1alpha1

      destination:
        server: '{{ .server }}'
        namespace: argocd
