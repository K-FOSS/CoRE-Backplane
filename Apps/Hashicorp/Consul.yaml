apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-backplane-consul-main
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  goTemplate: true
  # goTemplateOptions:
  #   - 'missingkey=error'
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
              values:
                clusterName: '{{ .name }}'
                environment: '{{ index .metadata.labels "resolvemy.host/env" }}'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'
                domain: '{{ .name }}.{{ index .metadata.labels "resolvemy.host/dc" }}.{{ index .metadata.labels "topology.kubernetes.io/region" }}.mylogin.space'
                replicas: '1'
                bootstrapExpect: '1'
                updatePartition: '0'

          # Cluster generators keep values as the same map type under Go templates.
          # Match the existing Home1 registration without affecting other sites.
          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
                  resolvemy.host/clusterId: '1'
                  topology.kubernetes.io/region: 'yvr'
              values:
                replicas: '3'
                bootstrapExpect: '3'
                updatePartition: '2'

  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-consul'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

    spec:
      project: core
          
      source:
        path: Mesh/Service/Consul
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD
        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |-
                consul:
                  global:
                    name: {{ .name }}

                    datacenter: {{ .values.datacenter }}

                    domain: consul.{{ .values.tenant }}
                  
                  dns:
                    enabled: false

                  {{- if eq .values.clusterName "dc1-k3s-node1" }}
                  global:
                    enabled: false

                  client:
                    enabled: true
                    join:
                      - 'consul.core-dc1-talos-prod.dc1.yxl.mylogin.space'
                    resources:
                      requests:
                        cpu: '100m'
                        memory: '100Mi'
                      limits:
                        cpu: '100m'

                  externalServers:
                    enabled: true
                    hosts:
                      - 'consul.core-dc1-talos-prod.dc1.yxl.mylogin.space'

                  ui:
                    enabled: false
                  {{- end }}

                  server:
                    {{- if eq .values.clusterName "dc1-k3s-node1" }}
                    enabled: false
                    {{- end }}
                    {{- if eq .values.clusterName "core-dc1-talos-prod" }}
                    affinity: |-
                      nodeAffinity:
                        preferredDuringSchedulingIgnoredDuringExecution:
                          - weight: 100
                            preference:
                              matchExpressions:
                                - key: 'kubernetes.io/hostname'
                                  operator: 'In'
                                  values: ['srv7']
                    {{- end }}
                    {{- if eq .values.clusterName "core-home1-talos-prod" }}
                    resources:
                      requests:
                        cpu: '100m'
                        memory: '1Gi'
                    nodeSelector: ''
                    tolerations: |-
                      - key: 'load'
                        operator: 'Equal'
                        value: 'testing'
                        effect: 'NoSchedule'
                    affinity: |-
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: 'kubernetes.io/hostname'
                                  operator: 'In'
                                  values: ['srv2', 'srv3', 'hpc2']
                      podAntiAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          - labelSelector:
                              matchLabels:
                                app: 'consul'
                                component: 'server'
                                release: '{{ .values.clusterName }}-consul'
                            topologyKey: 'kubernetes.io/hostname'
                    {{- end }}
                    replicas: {{ .values.replicas }}
                    bootstrapExpect: {{ .values.bootstrapExpect }}
                    updatePartition: {{ if eq .values.clusterName "core-dc1-talos-prod" }}1{{ else }}{{ .values.updatePartition }}{{ end }}

            - name: LOVELY_KUSTOMIZE_MERGE
              value: |-
                patches:
                  {{- if eq .values.clusterName "dc1-k3s-node1" }}
                  - target:
                      group: apps
                      version: v1
                      kind: DaemonSet
                      name: '{{ .values.clusterName }}-client'
                    patch: |-
                      - op: remove
                        path: '/spec/template/spec/containers/0/resources/limits/memory'
                  {{- end }}
                  {{- if eq .values.clusterName "core-dc1-talos-prod" }}
                  - target:
                      group: apps
                      version: v1
                      kind: StatefulSet
                      name: '{{ .values.clusterName }}-server'
                    patch: |-
                      - op: remove
                        path: '/spec/template/spec/containers/0/resources/limits/memory'
                  {{- end }}
                  {{- if eq .values.clusterName "core-home1-talos-prod" }}
                  - target:
                      kind: StatefulSet
                      name: '{{ .values.clusterName }}-server'
                    patch: |-
                      - op: add
                        path: '/spec/template/spec/nodeSelector'
                        value: null
                  {{- end }}
                  {{- if ne .values.clusterName "dc1-k3s-node1" }}
                  - target:
                      kind: Service
                      name: {{ .values.clusterName }}-server

                    patch: |
                      - op: add
                        path: /metadata/labels/wan-mode
                        value: public

                      - op: add
                        path: /metadata/annotations
                        value:
                          external-dns.kubernetes.io/hostname: 'consul.{{ .values.domain }}'
                          # TODO(external-dns-012): Remove the legacy annotation after upgrading ExternalDNS.
                          external-dns.alpha.kubernetes.io/hostname: consul.{{ .values.domain }}
                  {{- end }}

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
