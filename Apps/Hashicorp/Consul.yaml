apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: core-backplane-consul-main
  namespace: argocd

  annotations:
    argocd.argoproj.io/sync-wave: '5'
spec:
  goTemplate: true
  # goTemplateOptions:
  #   - 'missingkey=error'
  generators:
    - merge:
        mergeKeys:
          - name

        generators:
          - clusters:
              selector:
                matchLabels:
                  mylogin.space/tenant: 'core.mylogin.space'
              values:
                clusterName: '{{ .name }}'
                environment: '{{ index .metadata.labels "resolvemy.host/env" }}'
                clusterDomain: '{{ index .metadata.labels "cluster.kubernetes.io/domain" }}'
                tenant: '{{ index .metadata.labels "mylogin.space/tenant" }}'
                datacenter: '{{ index .metadata.labels "resolvemy.host/dc" }}'
                domain: '{{ .name }}.{{ index .metadata.labels "resolvemy.host/dc" }}.{{ index .metadata.labels "topology.kubernetes.io/region" }}.mylogin.space'
                replicas: '1'
                bootstrapExpect: '1'
                updatePartition: '0'

          # Per-cluster Consul server overrides. Values here take precedence
          # over the defaults from the cluster generator above.
          - list:
              elements:
                - name: 'core-home1-talos-prod'
                  values:
                    replicas: '3'
                    bootstrapExpect: '3'
                    updatePartition: '3'

                - name: core-dc1-talos-prod
                  values:
                    replicas: '1'
                    bootstrapExpect: '1'
                    updatePartition: '0'

  syncPolicy:
    preserveResourcesOnDeletion: true

  template:
    metadata:
      name: '{{ .values.clusterName }}-consul'

      annotations:
        argocd.argoproj.io/manifest-generate-paths: .

    spec:
      project: core
          
      source:
        path: Mesh/Service/Consul
        repoURL: https://github.com/K-FOSS/CoRE-Backplane.git
        targetRevision: HEAD
        plugin:
          name: argocd-lovely-plugin
          env:
            - name: LOVELY_HELM_MERGE
              value: |-
                consul:
                  global:
                    name: {{ .name }}

                    datacenter: {{ .values.datacenter }}

                    domain: consul.{{ .values.tenant }}
                  
                  dns:
                    enabled: false

                  server:
                    {{- if eq .values.clusterName "core-home1-talos-prod" }}
                    resources:
                      requests:
                        cpu: '1'
                        memory: '8G'
                    # Preserve the current reservation during expansion.
                    # Roll out the published smaller requests after quorum is healthy.
                    nodeSelector: ''
                    tolerations: |-
                      - key: 'load'
                        operator: 'Equal'
                        value: 'testing'
                        effect: 'NoSchedule'
                    affinity: |-
                      nodeAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          nodeSelectorTerms:
                            - matchExpressions:
                                - key: 'kubernetes.io/hostname'
                                  operator: 'In'
                                  values: ['srv2', 'srv3', 'hpc3']
                      podAntiAffinity:
                        requiredDuringSchedulingIgnoredDuringExecution:
                          - labelSelector:
                              matchLabels:
                                app: 'consul'
                                component: 'server'
                                release: '{{ .values.clusterName }}-consul'
                            topologyKey: 'kubernetes.io/hostname'
                    {{- end }}
                    replicas: {{ .values.replicas }}
                    bootstrapExpect: {{ .values.bootstrapExpect }}
                    updatePartition: {{ .values.updatePartition }}

            - name: LOVELY_KUSTOMIZE_MERGE
              value: |-
                patches:
                  {{- if eq .values.clusterName "core-home1-talos-prod" }}
                  - target:
                      kind: StatefulSet
                      name: '{{ .values.clusterName }}-server'
                    patch: |-
                      - op: add
                        path: '/spec/template/spec/nodeSelector'
                        value: null
                  {{- end }}
                  - target:
                      kind: Service
                      name: {{ .values.clusterName }}-server

                    patch: |
                      - op: add
                        path: /metadata/labels/wan-mode
                        value: public

                      - op: add
                        path: /metadata/annotations
                        value:
                          external-dns.kubernetes.io/hostname: 'consul.{{ .values.domain }}'
                          # TODO(external-dns-012): Remove the legacy annotation after upgrading ExternalDNS.
                          external-dns.alpha.kubernetes.io/hostname: consul.{{ .values.domain }}

      destination:
        server: '{{ .server }}'
        namespace: core-{{ .values.environment }}
