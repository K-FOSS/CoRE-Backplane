  data:
    - match:
        secretKey: 'client_id'
        remoteRef:
          remoteKey: {{ .Values.ui.oidc.secretSync.remoteKey | squote }}
          property: 'client_id'
    - match:
        secretKey: 'client_secret'
        remoteRef:
          remoteKey: {{ .Values.ui.oidc.secretSync.remoteKey | squote }}
