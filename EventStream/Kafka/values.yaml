strimzi-kafka-operator:
  # Default values for strimzi-kafka-operator.

  replicas: 1

  # If you set `watchNamespaces` to the same value as ``.Release.Namespace` (e.g. `helm ... --namespace $NAMESPACE`),
  # the chart will fail because duplicate RoleBindings will be attempted to be created in the same namespace
  watchNamespaces: []
  watchAnyNamespace: false

  defaultImageRegistry: quay.io
  defaultImageRepository: strimzi
  defaultImageTag: '0.45.2'

  image:
    registry: ""
    repository: ""
    name: operator
    tag: ""

  logVolume: co-config-volume

  logConfigMap: strimzi-cluster-operator

  logConfiguration: ""
  logLevel: ${env:STRIMZI_LOG_LEVEL:-INFO}
  fullReconciliationIntervalMs: 120000
  operationTimeoutMs: 300000
  kubernetesServiceDnsDomain: cluster.local
  featureGates: ""
  tmpDirSizeLimit: 1Mi

  # Example on how to configure extraEnvs
  # extraEnvs:
  #   - name: JAVA_OPTS
  #     value: "-Xms256m -Xmx256m"

  extraEnvs: []

  tolerations: []
  affinity: {}
  annotations: {}
  labels: {}
  nodeSelector: {}
  priorityClassName: ""

  podSecurityContext: {}
  securityContext: {}

  rbac:
    create: true
    serviceAccountCreate: true
    serviceAccount: 'strimzi-cluster-operator'

  leaderElection:
    enable: true

  # Docker images that operator uses to provision various components of Strimzi. To use your own registry prefix the
  # repository name with your registry URL.
  # Ex) repository: registry.xyzcorp.com/strimzi/kafka
  kafka:
    image:
      registry: ""
      repository: ""
      name: kafka
      tagPrefix: ""

  kafkaConnect:
    image:
      registry: ""
      repository: ""
      name: kafka
      tagPrefix: ""

  topicOperator:
    image:
      registry: ""
      repository: ""
      name: operator
      tag: ""

  userOperator:
    image:
      registry:
      repository:
      name: operator
      tag: ""

  kafkaInit:
    image:
      registry: ""
      repository: ""
      name: operator
      tag: ""

  tlsSidecarEntityOperator:
    image:
      registry: ""
      repository: ""
      name: kafka
      tagPrefix: ""

  kafkaMirrorMaker:
    image:
      registry: ""
      repository: ""
      name: kafka
      tagPrefix: ""

  kafkaBridge:
    image:
      registry: ""
      repository:
      name: kafka-bridge
      tag: '0.31.2'

  kafkaExporter:
    image:
      registry: ""
      repository: ""
      name: kafka
      tagPrefix: ""

  jmxTrans:
    image:
      registry: ""
      repository: ""
      name: jmxtrans
      tag: ""

  kafkaMirrorMaker2:
    image:
      registry: ""
      repository: ""
      name: kafka
      tagPrefix: ""

  cruiseControl:
    image:
      registry: ""
      repository: ""
      name: kafka
      tagPrefix: ""

  kanikoExecutor:
    image:
      registry: ""
      repository: ""
      name: kaniko-executor
      tag: ""

  mavenBuilder:
    image:
      registry: ""
      repository: ""
      name: maven-builder
      tag: ""


  resources:
    limits:
      memory: 384Mi
      cpu: 1000m
    requests:
      memory: 384Mi
      cpu: 200m

  livenessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30

  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 30

  createGlobalResources: true

  createAggregateRoles: false

  # Override the exclude pattern for exclude some labels
  labelsExclusionPattern: ""

  # Controls whether Strimzi generates network policy resources (By default true)
  generateNetworkPolicy: true

  # Override the value for Connect build timeout
  connectBuildTimeoutMs: 300000

  generatePodDisruptionBudget: true

oidc:
  enabled: true
  providerConfigRef: 'authentik'
  providerName: 'Core Kafka'
  applicationName: 'Core Kafka'
  applicationSlug: 'core-kafka'
  clientId: 'core-kafka'
  authentikUrl: 'https://idp.mylogin.space'
  authorizationFlowSlug: 'default-provider-authorization-explicit-consent'
  invalidationFlowSlug: 'default-provider-invalidation-flow'
  signingCertificateName: 'tls'
  secretSync:
    enabled: true
    secretStoreName: 'mainvault-core'
    remoteKey: 'EventStream/Kafka/OIDC'

external:
  enabled: false
  hostname: ''
  brokerHostname: ''
  tls:
    secretName: 'myloginspace-default-certificates'
    certificate: 'tls.crt'
    key: 'tls.key'

kafka-ui:
  enabled: true
  fullnameOverride: 'core-kafka-ui'
  image:
    tag: 'v1.5.0'
  replicaCount: 1
  service:
    type: 'ClusterIP'
    port: 80
  ingress:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi
  yamlApplicationConfig:
    kafka:
      clusters:
        - name: 'core-kafka'
          bootstrapServers: 'core-kafka-kafka-bootstrap:9093'
          properties:
            security.protocol: 'SASL_SSL'
            sasl.mechanism: 'PLAIN'
            sasl.jaas.config: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_UI_KAFKA_CLIENT_ID}" password="${KAFKA_UI_KAFKA_CLIENT_SECRET}";'
            ssl.truststore.type: 'PEM'
            ssl.truststore.certificates: '${KAFKA_UI_KAFKA_CA_CERT}'
    auth:
      type: 'OAUTH2'
      oauth2:
        client:
          authentik:
            clientId: '${KAFKA_UI_OIDC_CLIENT_ID}'
            clientSecret: '${KAFKA_UI_OIDC_CLIENT_SECRET}'
            scope:
              - 'openid'
              - 'profile'
              - 'email'
            client-name: 'Authentik'
            provider: 'authentik'
            redirect-uri: '${KAFKA_UI_PUBLIC_URL}/login/oauth2/code/authentik'
            authorization-grant-type: 'authorization_code'
            issuer-uri: 'https://idp.mylogin.space/application/o/core-kafka-ui/'
            jwk-set-uri: 'https://idp.mylogin.space/application/o/core-kafka-ui/jwks/'
            user-name-attribute: 'preferred_username'
            custom-params:
              type: 'oauth'
    server:
      forward-headers-strategy: 'native'
  envs:
    config:
      KAFKA_UI_PUBLIC_URL: 'https://kafka-ui.core-home1-talos-prod.home1.yxl.mylogin.space'
    secretMappings:
      KAFKA_UI_OIDC_CLIENT_ID:
        name: 'core-kafka-oidc'
        keyName: 'ui_client_id'
      KAFKA_UI_OIDC_CLIENT_SECRET:
        name: 'core-kafka-oidc'
        keyName: 'ui_client_secret'
      KAFKA_UI_KAFKA_CLIENT_ID:
        name: 'core-kafka-oidc'
        keyName: 'client_id'
      KAFKA_UI_KAFKA_CLIENT_SECRET:
        name: 'core-kafka-oidc'
        keyName: 'client_secret'
      KAFKA_UI_KAFKA_CA_CERT:
        name: 'core-kafka-cluster-ca-cert'
        keyName: 'ca.crt'

ui:
  enabled: true
  hostname: 'kafka-ui.core-home1-talos-prod.home1.yxl.mylogin.space'
  gateway:
    name: 'main-gw'
    namespace: 'core-prod'
    sectionName: 'https-myloginspace'
  oidc:
    providerName: 'Core Kafka UI'
    applicationName: 'Core Kafka UI'
    applicationSlug: 'core-kafka-ui'
    clientId: 'core-kafka-ui'
    secretSync:
      enabled: true
      secretStoreName: 'mainvault-core'
      remoteKey: 'EventStream/Kafka/UI/OIDC'
