apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xusers.mylogin.space
spec:
  group: mylogin.space

  names:
    kind: XUser
    plural: xusers

  claimNames:
    kind: User
    plural: users

  connectionSecretKeys:
    - username
    - password
    - database

    #
    # LDAP
    #
    - ldapsHostname
    - ldapsBIND
    - ldapsPort
    - ldapsURI

    #
    # SIP
    #
    - sipsHostname
    - sipsPort
    - sipsURI
    
    # PSQL
    - psqlHostname
    - psqlPort
    - psqlURI

    #
    # MySQL
    #
    - mysqlHostname
    - mysqlPort
    - mysqlURI

    #
    # MongoDB
    #
    - mongoHostname
    - mongoURI
    - mongoPort

    # 
    # MQTT
    #
    - mqttHostname
    - mqttPort

    - miscJSON

    # S3
    - S3Hostname
    - S3Port
    - S3URI
    - bucket
    - S3AccessKey
    - S3SecretKey

  versions:
    - name: v1alpha1
      served: true
      referenceable: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                name:
                  type: string

                username:
                  type: string

                email:
                  type: string

                serviceAccount:
                  type: boolean
                  default: true

                psql:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    createUserDatabase:
                      type: boolean
                      default: true

                    crossplane:
                      type: object

                      default: {}

                      properties:
                        terraformProvider:
                          type: string
                          
                          default: {{ .Values.psql.terraform.provider }}

                        crossplaneProvider:
                          type: string
                          
                          default: {{ .Values.psql.crossplane.provider }}

                    uri:
                      type: string
                      default: postgres://

                    databases:
                      type: array
                      items:
                        type: string

                mysql:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                
                    uri:
                      type: string
                      default: mysql://

                    databases:
                      type: array
                      items:
                        type: string

                mongodb:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false

                    uri:
                      type: string
                      default: mongodb://

                    databases:
                      type: array
                      items:
                        type: string

                ldaps:
                  type: object
                  properties:
                    uri:
                      type: string
                      default: ldaps://

                s3:
                  type: object

                  x-kubernetes-validations:
                    - rule: '!has(self.createCredentials) || !self.createCredentials || has(self.writeCredentialsSecretRef)'
                      message: 'writeCredentialsSecretRef is required when createCredentials is true'
                    - rule: '!has(self.createServiceAccount) || !self.createServiceAccount || has(self.writeServiceAccountCredentialsSecretRef)'
                      message: 'writeServiceAccountCredentialsSecretRef is required when createServiceAccount is true'

                  properties:
                    enabled:
                      type: boolean
                      default: false

                    region:
                      type: string
                      default: us-east-1


                    crossplane:
                      type: object

                      default: {}
                      properties:
                        terraformProvider:
                          type: string
                          
                          default: {{ .Values.s3.terraform.provider }}

                        crossplaneProvider:
                          type: string
                          
                          default: {{ .Values.s3.crossplane.provider }}

                    createUserBucket:
                      type: boolean

                      description: Optionally disable the autocreation of a bucket under the username of the account

                    createBuckets:
                      type: boolean

                      description: Optionally disable the autocreation of the buckets within the buckets field

                    createCredentials:
                      type: boolean

                      default: false

                      description: Create and store access keys using the LDAP authentication

                    createServiceAccount:
                      type: 'boolean'

                      default: false

                      description: 'Create a long-lived MinIO service account access key and secret key for the LDAP identity'

                    buckets:
                      type: array

                      default: []

                      items:
                        type: string

                    additionalPolicyStatements:
                      type: 'array'

                      default: []

                      description: 'Additional IAM policy statements appended to the generated bucket access statement'

                      items:
                        type: 'object'

                        properties:
                          sid:
                            type: 'string'

                          effect:
                            type: 'string'

                            enum:
                              - 'Allow'
                              - 'Deny'

                          actions:
                            type: 'array'

                            minItems: 1

                            items:
                              type: 'string'

                          resources:
                            type: 'array'

                            minItems: 1

                            items:
                              type: 'string'

                          conditions:
                            type: 'object'

                            x-kubernetes-preserve-unknown-fields: true

                        required:
                          - 'effect'
                          - 'actions'
                          - 'resources'

                    writeCredentialsSecretRef:      
                      type: object

                      description: Secret to store the S3 AccessKey and Secret Access Key in instead of the main output secret


                      properties:
                        namespace:
                          type: string

                          minLength: 1
                  
                        name:
                          type: string

                          minLength: 1

                      required:
                        - 'namespace'
                        - 'name'

                    writeServiceAccountCredentialsSecretRef:
                      type: 'object'

                      description: 'Secret to store the long-lived MinIO service account AccessKey and SecretAccessKey'

                      properties:
                        namespace:
                          type: 'string'

                          minLength: 1

                        name:
                          type: 'string'

                          minLength: 1

                      required:
                        - 'namespace'
                        - 'name'

                groups:
                  type: array

                  items:
                    type: string

                #
                # AVoIP
                #
                AVoIP:
                  type: object
                  properties:
                    voicemail:
                      type: object
                      properties:
                        password:
                          type: string
                    

              required:
                - name
            status:
              description: A Status represents the observed state
              properties:
                share:
                  description: Freeform field containing status information
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
              type: object
