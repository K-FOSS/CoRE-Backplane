env: prod

debug: true

crossplane:
  functionsRef:
    gotemplate:
      name: function-go-templating

s3:
  terraform:
    provider: s3-prod
  
  crossplane:
    provider: s3-prod

psql:
  terraform:
    provider: psql
  
  crossplane:
    provider: psql-main

mongodb:
  terraform:
    provider: mongodb-prod-tf
  hostname: ''
  port: '27017'
  replicaSet: 'rs0'

cluster:
  name: ''
  domain: ''

ldap:
  server: ldap.mylogin.space
