apiVersion: resolvemy.host/v1alpha1
kind: ClusterNode
metadata:
  name: srv2.home1.yvr.resolvemy.host

  namespace: core-prod

spec:
  name: srv2.home1.yvr.resolvemy.host

  description: home2.yvr.resolvemy.host Rack mount server2

  type: worker

  danger:
    warningdonotdounlessyouknowwhatyouaredoing:
      wipeOnReboot: false

  clusterRef:
    group: resolvemy.host
    kind: Cluster
    name: core-home1-talos
    namespace: core-prod

  tenantRef:
    group: mylogin.space
    kind: Tenant
    name: core.mylogin.space
    namespace: core-prod

  environment: prod

  networking:
    dns:
      servers:
        - '10.1.1.53'
        - '1.0.0.1'

  bgp:
    instances:
      - asn: 64512
        name: wan-gw
        type: cilium
        peers:
          - address: 172.31.193.16
            asn: 64567
            localAddress: 172.31.193.36
            name: cpe-sw1.home1.yvr.resolvemy.host

          - address: 2604:3d08:d174:2000::1C
            asn: 64567
            localAddress: 2604:3d08:d174:2000::26
            name: ipv6.cpe-sw1.home2.yvr.resolvemy.host

  storage:
    longhornDisks:
      - maxSize: 1100GB
        grow: true
        selector:
          wwid: naa.5000cca01da32bf8

  nics:
    - macAddress: 24:6e:96:38:84:60
      rings:
        rx: 4096
        tx: 4096
      offloads:
        rx-udp-gro-forwarding: true
        l2-fwd-offload: true

    - macAddress: 24:6e:96:38:84:62
      rings:
        rx: 4096
        tx: 4096
      offloads:
        rx-udp-gro-forwarding: true
        l2-fwd-offload: true
  networks:
    - macAddress: 24:6e:96:38:84:60
      bridge: false
      model: new
      type: link
      addresses:
        - 172.31.193.36/24
        - 2604:3d08:d174:2000::26/122

      routing:
        ospf:
          enabled: false

      routes:
        - network: 0.0.0.0/0
          gateway: 172.31.193.254
          metric: 1020

        - network: '::/0'
          gateway: 2604:3d08:d174:2000::1C
          metric: 1020

      mtu: 9000

      static: true
      dns:
        - 172.31.193.254

    - addresses: []
      bridge: false

      type: link

      dns:
        - 172.31.193.254

      macAddress: 24:6e:96:38:84:62
      model: new

      mtu: 9710

      routing:
        ospf:
          enabled: false

      static: false

  sysctls:
    - name: net.ipv6.conf.eno2.accept_ra
      value: '0'
    - name: net.ipv6.conf.eno2.accept_ra_defrtr
      value: '0'

  sysfs:
    - name: class.net.eno1.device.sriov_numvfs
      value: '16'
    - name: class.net.eno2.device.sriov_numvfs
      value: '16'
    - name: 'block.sda.queue.scheduler'
      value: 'none'
    - name: 'block.sda.queue.read_ahead_kb'
      value: '2048'
    - name: 'block.sda.queue.iosched.writes_starved'
      value: '16'

  overrides:
    cni:
      cilium:
        configOverrides:
          devices: eno1
          direct-routing-device: eno1
    pci:
      rebinds:
        - description: 'eno1 vf8'
          driver: 'vfio-pci'
          id: '0000:01:12.0'
        - description: 'eno1 vf9'
          driver: 'vfio-pci'
          id: '0000:01:12.2'
        - description: 'eno1 vf10'
          driver: 'vfio-pci'
          id: '0000:01:12.4'
        - description: 'eno1 vf11'
          driver: 'vfio-pci'
          id: '0000:01:12.6'
        - description: 'eno1 vf12'
          driver: 'vfio-pci'
          id: '0000:01:13.0'
        - description: 'eno1 vf13'
          driver: 'vfio-pci'
          id: '0000:01:13.2'
        - description: 'eno1 vf14'
          driver: 'vfio-pci'
          id: '0000:01:13.4'
        - description: 'eno1 vf15'
          driver: 'vfio-pci'
          id: '0000:01:13.6'
        - description: 'eno2 vf12'
          driver: 'vfio-pci'
          id: '0000:01:13.1'
        - description: 'eno2 vf13'
          driver: 'vfio-pci'
          id: '0000:01:13.3'
        - description: 'eno2 vf14'
          driver: 'vfio-pci'
          id: '0000:01:13.5'
        - description: 'eno2 vf15'
          driver: 'vfio-pci'
          id: '0000:01:13.7'
    kernel:
      parameters:
        - name: intel_iommu
          value: 'on'

        - name: iommu
          value: pt

        - name: numa_balancing
          value: enable
    talos:
      extensions:
        system:
          - binfmt-misc
          - intel-ucode
      kernel:
        modules:
          - name: 'vfio-pci'
          - name: 'vfio_iommu_type1'
