

apiVersion: resolvemy.host/v1alpha1
kind: ClusterNode
metadata:
  name: laptop2.home1.yvr.resolvemy.host

  namespace: core-prod

  labels:
    argocd.argoproj.io/instance: dc1-k3s-node1-ops-cluster

spec:
  name: laptop2.home1.yvr.resolvemy.host

  description: home1.yvr.resolvemy.host XPS 9310

  danger:
    warningdonotdounlessyouknowwhatyouaredoing:
      wipeOnReboot: false

  type: worker

  clusterRef:
    group: resolvemy.host
    kind: Cluster
    name: core-home1-talos
    namespace: core-prod

  tenantRef:
    group: mylogin.space
    kind: Tenant
    name: core.mylogin.space
    namespace: core-prod

  environment: prod

  bgp:
    instances:
      - asn: 64512
        name: wan-gw
        type: cilium
        peers:
          - address: 172.31.193.16
            asn: 64567
            localAddress: 172.31.193.15
            name: cpe-sw1.home1.yvr.resolvemy.host

          - address: 2604:3d08:d174:2000::1c
            asn: 64567
            localAddress: 2604:3d08:d174:2000::15
            name: ipv6.cpe-sw1.home2.yvr.resolvemy.host

  nics:
    - macAddress: f4:4d:ad:03:fb:0d
      rings:
        rx: 4096
      

  networks:
    - macAddress: f4:4d:ad:03:fb:0d
      bridge: false

      type: link
      
      addresses:
        - 172.31.193.15/24
        - 2604:3d08:d174:2000::15/122

      routes:
        - network: 0.0.0.0/0
          gateway: 172.31.193.254
          metric: 600

        - network: ::/0
          gateway: 2604:3D08:D174:2000::1C
          metric: 600

      mtu: 9000

      model: new

      routing:
        ospf:
          enabled: false

      static: true
      dns:
        - 1.1.1.1

  watchdog:
    enabled: false

    devicePath: /dev/watchdog0

    timeout: 5m

  overrides:
    cni:
      cilium:
        configOverrides:
          devices: enp0s13f0u1
          direct-routing-device: enp0s13f0u1
    kernel:
      parameters:
        - name: intel_iommu
          value: 'on'

        - name: iommu
          value: 'pt'

        - name: i915.enable_guc
          value: '3'

        - name: i915.max_vfs
          value: '7'

        - name: cpufreq.default_governor
          value: performance

    talos:
      extensions:
        system:
          - intel-ucode
          - i915
          - thunderbolt
          - nfsd
          - nfs-utils