apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: 'cluster-oidc-client-ids'
  namespace: 'core-prod'
  annotations:
    argocd.argoproj.io/sync-wave: '1'
spec:
  secretStoreRef:
    kind: 'ClusterSecretStore'
    name: 'mainvault-core'
  target:
    name: 'cluster-oidc-client-ids'
    creationPolicy: Owner
  data:
    - secretKey: 'che'
      remoteRef:
        key: 'IDE/Che/Authentik'
        property: 'ClientID'
