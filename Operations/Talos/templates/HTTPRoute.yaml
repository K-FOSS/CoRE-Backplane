apiVersion: gateway.networking.k8s.io/v1beta1
kind: HTTPRoute
metadata:
  name: 'talos-image-factory'
  labels:
    wan-mode: 'public'
    lan-mode: 'private'
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: '{{ .Values.gateway.namespace }}'
      name: '{{ .Values.gateway.name }}'
      sectionName: '{{ .Values.gateway.sectionName }}'
  hostnames:
    - 'tfactory.{{ .Values.cluster.name }}.{{ .Values.datacenter }}.{{ .Values.region }}.writemy.codes'
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: '/'
      backendRefs:
        - group: ''
          kind: Service
          name: '{{ include "talos-image-factory.name" . }}'
          port: 8080
