apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: 'talos-image-factory-cache-signing-key'
  annotations:
    argocd.argoproj.io/sync-options: 'Prune=false'
    argocd.argoproj.io/sync-wave: '-1'
    helm.sh/resource-policy: 'keep'
spec:
  secretName: '{{ .Values.imageFactory.cacheSigningKey.secretName }}'
  commonName: 'talos-image-factory-cache-signing-key'
  duration: '87600h'
  renewBefore: '720h'
  privateKey:
    algorithm: 'ECDSA'
    encoding: 'PKCS8'
    rotationPolicy: 'Never'
    size: 256
  issuerRef:
    name: 'talos-image-factory-cache-signing-key'
    kind: Issuer
    group: cert-manager.io
