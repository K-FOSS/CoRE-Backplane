hub: false

env: prod

cluster:
  name: k8s
  domain: cluster.local

# Public DNS suffix used for externally routed service hostnames.
domain: resolvemy.host

gateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

datacenter: dc1

region: yxl

authentik:
  autoconfigure: true

  route:
    enabled: true

tenant:
  name: core

oidc:
  enabled: true

  indexKey: argocd-dev

  scopes:
    - openid
    - profile
    - email

  groups:
    - Server Admins
    - Developers

  authentik:
    urlBase: https://idp.mylogin.space

goldilocks:
  # Use the upstream defaults except for installing the bundled VPA dependency.
  vpa:
    enabled: true

descheduler:
  kind: Deployment

  automountServiceAccountToken: false

  podSecurityContext:
    fsGroup: 1000

  cmdOptions:
    v: 3
    tls-cert-file: '/etc/descheduler/tls/tls.crt'
    tls-private-key-file: '/etc/descheduler/tls/tls.key'

  deploymentAnnotations:
    secret.reloader.stakater.com/reload: 'descheduler-metrics-tls'

  extraServiceAccountVolumeMounts:
    - name: kube-api-access
      mountPath: '/var/run/secrets/kubernetes.io/serviceaccount'
      readOnly: true
    - name: descheduler-metrics-tls
      mountPath: '/etc/descheduler/tls'
      readOnly: true

  extraServiceAccountVolumes:
    - name: kube-api-access
      projected:
        defaultMode: 0444
        sources:
          - serviceAccountToken:
              expirationSeconds: 3600
              path: token
          - configMap:
              name: kube-root-ca.crt
              items:
                - key: ca.crt
                  path: ca.crt
          - downwardAPI:
              items:
                - fieldRef:
                    apiVersion: v1
                    fieldPath: metadata.namespace
                  path: namespace
    - name: descheduler-metrics-tls
      secret:
        secretName: 'descheduler-metrics-tls'
        defaultMode: 0440
        items:
          - key: tls.crt
            path: tls.crt
          - key: tls.key
            path: tls.key

  service:
    enabled: true

  serviceMonitor:
    enabled: false

  podLabels:
    logs: 'loki-myloginspace'

  revisionHistoryLimit: 3

  resources:
    requests:
      cpu: 32m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # deschedulerPolicy contains the policies the descheduler will execute.
  deschedulerPolicy:
    # nodeSelector: "key1=value1,key2=value2"
    # maxNoOfPodsToEvictPerNode: 10
    # maxNoOfPodsToEvictPerNamespace: 10
    # metricsProviders:
    # - source: KubernetesMetrics
    # tracing:
    #   collectorEndpoint: otel-collector.observability.svc.cluster.local:4317
    #   transportCert: ""
    #   serviceName: ""
    #   serviceNamespace: ""
    #   sampleRate: 1.0
    #   fallbackToNoOpProviderOnError: true
    profiles:
      - name: default
        pluginConfig:
          - name: DefaultEvictor
            args:
              podProtections:
                defaultDisabled:
                - 'PodsWithLocalStorage'
                extraEnabled:
                - 'PodsWithPVC'
          - name: RemovePodsHavingTooManyRestarts
            args:
              podRestartThreshold: 100
              includingInitContainers: true
          - name: RemovePodsViolatingNodeAffinity
            args:
              nodeAffinityType:
              - requiredDuringSchedulingIgnoredDuringExecution
          - name: RemovePodsViolatingNodeTaints
          - name: RemovePodsViolatingInterPodAntiAffinity
          - name: RemovePodsViolatingTopologySpreadConstraint
          - name: LowNodeUtilization
            args:
              thresholds:
                cpu: 30
                memory: 20
                pods: 20
              targetThresholds:
                cpu: 65
                memory: 75
                pods: 70
        plugins:
          balance:
            enabled:
              - RemovePodsViolatingTopologySpreadConstraint
              - LowNodeUtilization
          deschedule:
            enabled:
              - RemovePodsHavingTooManyRestarts
              - RemovePodsViolatingNodeTaints
              - RemovePodsViolatingNodeAffinity
              - RemovePodsViolatingInterPodAntiAffinity

  priorityClassName: system-cluster-critical
