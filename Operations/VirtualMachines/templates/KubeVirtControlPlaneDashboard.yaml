{{- if eq .Values.env "prod" -}}
{{- $dashboard := .Files.Get "dashboards/kubevirt-control-plane-3b7d265.json" | fromJson -}}
{{- range $variable := $dashboard.templating.list -}}
  {{- if eq $variable.name "instance" -}}
    {{- $_ := set $variable "definition" "label_values(container_cpu_usage_seconds_total{job=\"kubelet\", metrics_path=\"/metrics/cadvisor\", cluster=\"$cluster\"}, instance)" -}}
    {{- $_ := set $variable "query" "label_values(container_cpu_usage_seconds_total{job=\"kubelet\", metrics_path=\"/metrics/cadvisor\", cluster=\"$cluster\"}, instance)" -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: 'grafana-dashboard-kubevirt-control-plane'
  namespace: 'core-prod'
  labels:
    grafana_dashboard: 'true'
  annotations:
    grafana_folder: 'KubeVirt'
data:
  kubevirt-control-plane.json: |-
{{ $dashboard | toPrettyJson | indent 4 }}
{{- end -}}
