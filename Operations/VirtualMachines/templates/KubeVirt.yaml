apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - 'HostDevices'
      disabledFeatureGates:
        - 'DeclarativeHotplugVolumes'
        - 'ExternalNetResourceInjection'
        - 'GPUsWithDRA'
        - 'HostDevicesWithDRA'
        - 'ImageVolume'
        - 'KubevirtSeccompProfile'
        - 'LibvirtHooksServerAndClient'
        - 'NodeRestriction'
        - 'OptOutRoleAggregation'
        - 'PasstBinding'
        - 'PodSecondaryInterfaceNamingUpgrade'
        - 'RebootPolicy'
        - 'Snapshot'
        - 'Template'
        - 'VmiMemoryOverheadReport'
        - 'WorkloadEncryptionSEV'
    smbios:
      sku: "TalosCloud"
      version: "v0.1.0"
      manufacturer: "Talos Virtualization"
      product: "talosvm"
      family: "ccio"
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
