apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  configuration:
    developerConfiguration:
      featureGates:
        - 'HostDevices'
        {{- if .Values.cpuDra.enabled }}
        - 'CPUsWithDRA'
        {{- end }}
      disabledFeatureGates:
        - 'ContainerPathVolumes'
        - 'DeclarativeHotplugVolumes'
        - 'GPUsWithDRA'
        - 'HostDevicesWithDRA'
        - 'ImageVolume'
        - 'IncrementalBackup'
        - 'NodeRestriction'
        - 'NetworkDevicesWithDRA'
        - 'OptOutRoleAggregation'
        - 'PasstBinding'
        - 'RebootPolicy'
        - 'Snapshot'
        - 'Template'
        - 'UtilityVolumes'
        - 'VSOCK'
        - 'WorkloadEncryptionSEV'
    smbios:
      sku: "TalosCloud"
      version: "v0.1.0"
      manufacturer: "Talos Virtualization"
      product: "talosvm"
      family: "ccio"
  # KubeVirt creates its ServiceMonitor in the observability namespace. The
  # Alloy services collector discovers that ServiceMonitor and already has the
  # permissions required to read the kubevirt metrics Service and Endpoints.
  monitorNamespace: 'core-prod'
  monitorAccount: 'core-collectors-alloy-services'
  serviceMonitorNamespace: 'core-prod'
  workloadUpdateStrategy:
    workloadUpdateMethods:
      - LiveMigrate
