apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: core-tls-vault
spec:
  vault:
    path: pki_int/sign/core
    # Resolve the Vault service inside the destination cluster. The TLS
    # ApplicationSet uses the cluster name as the Helm release name, so this
    # remains local for both Talos clusters instead of depending on DC1 DNS.
    server: 'http://{{ trimSuffix "-tls" .Release.Name }}-core-vault-prod.core-prod.svc.cluster.local:8200'
    auth:
      tokenSecretRef:
        name: certmanager-tls-vault-token
        key: token
