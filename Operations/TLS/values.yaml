cert-manager:
  fullnameOverride: cert-manager

  # Keep an available webhook and controller during a rolling upgrade on both
  # Talos clusters. cert-manager uses leader election, so the extra controller
  # replica is a standby rather than a second active reconciler.
  replicaCount: 2
  strategy:
    type: 'RollingUpdate'
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

  crds:
    enabled: true

  enableCertificateOwnerRef: true

  # Keep ACME propagation checks off cluster-local kube-dns. These resolvers
  # are used for both DNS-01 and HTTP-01 challenge checks.
  extraArgs:
    - '--dns01-recursive-nameservers-only'
    - '--dns01-recursive-nameservers=1.1.1.1:53,1.0.0.1:53,9.9.9.9:53'
    - '--acme-http01-solver-nameservers=1.1.1.1:53,1.0.0.1:53,9.9.9.9:53'

  config:
    apiVersion: controller.config.cert-manager.io/v1alpha1
    kind: ControllerConfiguration
    logging:
      verbosity: 2
      format: json
    featureGates:
      AdditionalCertificateOutputFormats: true
      ExperimentalGatewayAPISupport: true
      ServerSideApply: true

  prometheus:
    enabled: false

  webhook:
    replicaCount: 2
    strategy:
      type: 'RollingUpdate'
      rollingUpdate:
        maxUnavailable: 0
        maxSurge: 1
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    config:
      apiVersion: webhook.config.cert-manager.io/v1alpha1
      kind: WebhookConfiguration
      featureGates:
        AdditionalCertificateOutputFormats: true
