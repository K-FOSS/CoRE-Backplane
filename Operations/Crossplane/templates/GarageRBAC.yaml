{{- if .Values.garagePermissions.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: crossplane-observability-garage-reader
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
rules:
  - apiGroups:
      - 'garage.rajsingh.info'
    resources:
      - 'garagebuckets'
      - 'garagekeys'
    verbs:
      - 'get'
      - 'list'
      - 'watch'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: crossplane-observability-garage-reader
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crossplane-observability-garage-reader
subjects:
  - kind: ServiceAccount
    name: 'crossplane'
    namespace: {{ .Release.Namespace | squote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: crossplane-observability-garage-writer
  namespace: 'core-prod'
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
rules:
  - apiGroups:
      - 'garage.rajsingh.info'
    resources:
      - 'garagebuckets'
      - 'garagekeys'
    verbs:
      - 'create'
      - 'update'
      - 'patch'
      - 'delete'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: crossplane-observability-garage-writer
  namespace: 'core-prod'
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: crossplane-observability-garage-writer
subjects:
  - kind: ServiceAccount
    name: 'crossplane'
    namespace: {{ .Release.Namespace | squote }}
{{- end }}
