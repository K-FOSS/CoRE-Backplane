apiVersion: pkg.crossplane.io/v1beta1
kind: DeploymentRuntimeConfig
metadata:
  name: 'provider-terraform'
spec:
  serviceAccountTemplate:
    metadata:
      name: 'provider-terraform'
  deploymentTemplate:
    metadata:
      labels:
        logs: 'loki-myloginspace'
    spec:
      selector: {}
      template:
        metadata:
          labels:
            logs: 'loki-myloginspace'
        spec:
          containers:
            - name: 'package-runtime'
              args:
                - '-d'
                - '--log-encoding=json'
                - '--sync=2h'
                - '--poll=30m'
                - '--poll-jitter=15m'
                - '--max-reconcile-rate={{ .Values.providerTerraform.maxReconcileRate }}'
              {{- with .Values.providerTerraform.resources }}
              resources:
                requests:
                  cpu: {{ .requests.cpu | squote }}
                  memory: {{ .requests.memory | squote }}
                limits:
                  cpu: {{ .limits.cpu | squote }}
                  memory: {{ .limits.memory | squote }}
              {{- end }}
---
apiVersion: pkg.crossplane.io/v1
kind: Provider
metadata:
  name: 'provider-terraform'

  annotations:
    argocd.argoproj.io/sync-wave: '20'

spec:
  # TODO: Get this automated with Renovate
  package: '{{ .Values.providerTerraform.package }}'
  runtimeConfigRef:
    name: 'provider-terraform'
