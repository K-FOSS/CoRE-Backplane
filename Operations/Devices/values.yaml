devices:
  cpuDra:
    enabled: false
  sriovDra:
    enabled: false
    pools: []
  nvidia:
    enabled: true
  hami:
    enabled: true
  amd:
    enabled: true
  intel:
    enabled: true
  nodeFeatureDiscovery:
    enabled: true
  kepler:
    enabled: true

cpu-dra:
  fullnameOverride: 'cpu-dra'
  image:
    repository: 'registry.k8s.io/dra-driver-cpu/dra-driver-cpu'
    tag: 'v0.3.1'
    pullPolicy: 'IfNotPresent'
  driverConfig:
    apiVersion: 'v1alpha1'
    cpuDeviceMode: 'grouped'
    groupBy: 'numanode'
  nodeSelector:
    kubernetes.io/os: 'linux'

sriov-dra:
  fullnameOverride: 'sriov-dra'
  image:
    repository: 'ghcr.io/k8snetworkplumbingwg/dra-driver-sriov'
    tag: '5125c9d@sha256:719cc5763341243558194feafb2cfe755279dc8c930ece981bc6e4af5f8dc7ca'
    pullPolicy: 'IfNotPresent'
  kubeletPlugin:
    configurationMode: 'MULTUS'
    sriovCniInit:
      enabled: false

nvidia-device-plugin:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: nvidia.com/gpu.count
                operator: Gt
                values:
                  - '0'

  tolerations:
    - operator: Exists

  nfd:
    enabled: false

  gfd:
    enabled: true

  runtimeClassName: nvidia

nvidia-dra-driver-gpu:
  nvidiaDriverRoot: /usr/local

  gpuResourcesEnabledOverride: true
  
  kubeletPlugin:
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: feature.node.kubernetes.io/pci-0300_10de.present
                  operator: In
                  values:
                    - 'true'

            - matchExpressions:
              # On some Tegra-based systems NFD detects the CPU vendor ID as NVIDIA
                - key: feature.node.kubernetes.io/cpu-model.vendor_id
                  operator: In
                  values:
                    - 'NVIDIA'

            - matchExpressions:
                # We allow a GPU deployment to be forced by setting the following label to "true"
                - key: "nvidia.com/gpu.present"
                  operator: In
                  values:
                    - 'true'
  resources:
    gpus:
      enabled: true

    computeDomains:
      enabled: false

hami:
  fullnameOverride: hami-core

amd-gpu:
  nfd:
    enabled: false

  labeller:
    enabled: false

  dp:
    resources: {}
    # Set daemonsets updateStrategy for device plugin
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1

  lbl:
    serviceAccount:
      annotations: {}
    securityContext:
      privileged: true # Needed for /dev
      capabilities:
        drop:
          - ALL
        add:
          - CAP_SYS_ADMIN
      readOnlyRootFilesystem: false # true if -logtostderr flag set in labeller
    # If you do want to specify resources, uncomment the following lines, 
    # adjust them as necessary, and remove the curly braces after 'resources:'.
    resources: {}
      # limits:
      #   memory: 20Mi
      #   cpu: 100m
      # requests:
      #   memory: 30Mi
      #   cpu: 150m
    # Set daemonsets updateStrategy for labeller
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1

  imagePullSecrets: []

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
      - ALL

  tolerations:
    - key: CriticalAddonsOnly
      operator: Exists

  node_selector_enabled: true
  node_selector:
    feature.node.kubernetes.io/pci-0300_1002.present: "true"
    kubernetes.io/arch: amd64

node-feature-discovery:
  fullnameOverride: core-nfd

  worker:
    enabled: true

    tolerations:
      - key: load
        operator: Equal
        value: testing
        effect: NoSchedule

    config:
      sources:
        pci:
          deviceClassWhitelist:
            - '02'
            - '03'
            - '12'
            - '0200'
            - '0207'
            - '0300'
            - '0302'
          deviceLabelFields:
            - class
            - vendor

kepler-operator:
  fullnameOverride: kepler-operator


intel-device-plugins-gpu:
  tolerations:
    - key: load
      operator: Equal
      value: testing
      effect: NoSchedule
