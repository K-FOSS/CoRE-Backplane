---
{{- include "bjw-s.common.loader.init" . }}

{{- define "photos.redisProxyConfig" -}}
global
  log stdout format raw local0

defaults
  mode tcp
  timeout connect 5s
  timeout client 1h
  timeout server 1h

frontend redis
  bind 127.0.0.1:6379
  default_backend dragonfly

backend dragonfly
  option tcp-check
  server dragonfly dragonfly-core.core-prod.svc.cluster.local:6379 ssl verify required ca-file /etc/ssl/certs/ca-certificates.crt verifyhost dragonfly.{{ .Values.global.cluster.name }}.{{ .Values.global.datacenter }}.{{ .Values.global.region }}.mylogin.space sni str(dragonfly.{{ .Values.global.cluster.name }}.{{ .Values.global.datacenter }}.{{ .Values.global.region }}.mylogin.space)
{{- end }}

{{- define "photos.haproxyContainer" -}}
image:
  repository: 'docker.io/library/haproxy'
  tag: '3.2.23-alpine3.24'
  digest: 'sha256:57b361f7e5cec8279a5d82ea4d4941936d12cf35305146383b9cb01200017a40'
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - 'ALL'
  runAsNonRoot: true
  runAsUser: 99
  runAsGroup: 99
probes:
  readiness:
    enabled: true
    custom: true
    spec:
      exec:
        command:
          - 'sh'
          - '-c'
          - 'socat -T 1 - TCP:127.0.0.1:6379 </dev/null >/dev/null'
{{- end }}

{{- define "photos.mlControllerId" -}}
machine-learning-{{ required "mlrunner.name is required" .name }}
{{- end }}

{{- define "photos.mlResourceName" -}}
{{- if eq .name "intel" -}}
{{ .release }}-machine-learning
{{- else -}}
{{ .release }}-machine-learning-{{ required "mlrunner.name is required" .name }}
{{- end -}}
{{- end }}

{{- define "photos.mlImageTag" -}}
{{- if eq .type "intel" -}}
openvino
{{- else if eq .type "cuda" -}}
cuda
{{- else -}}
{{ fail (printf "Unsupported mlrunner.type %q; expected intel or cuda" .type) }}
{{- end -}}
{{- end }}

{{- define "photos.commonValues" -}}
{{- if not (len .Values.mlrunners) }}
{{- fail "mlrunners must contain at least one runner" }}
{{- end }}
global:
  nameOverride: 'photos'

controllers:
  server:
    strategy: Recreate
    containers:
      main:
        image:
          repository: 'ghcr.io/immich-app/immich-server'
          tag: {{ required "immich.version is required" .Values.immich.version | squote }}
        env:
          IMMICH_CONFIG_FILE: '/config/immich-config.yaml'
          IMMICH_MACHINE_LEARNING_URL: 'http://{{ include "photos.mlResourceName" (dict "name" (index .Values.mlrunners 0).name "release" .Values.global.nameOverride) }}:3003'
          DB_HOSTNAME: 'psql-local.{{ .Values.global.cluster.name }}.{{ .Values.global.datacenter }}.{{ .Values.global.region }}.mylogin.space'
          DB_PORT: '5432'
          DB_USERNAME:
            valueFrom:
              secretKeyRef:
                name: 'photos'
                key: 'username'
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: 'photos'
                key: 'password'
          DB_DATABASE_NAME:
            valueFrom:
              secretKeyRef:
                name: 'photos'
                key: 'username'
          DB_VECTOR_EXTENSION: 'pgvector'
          TZ: {{ .Values.global.timezone | squote }}
          REDIS_HOSTNAME: '127.0.0.1'
          REDIS_PORT: '6379'
          REDIS_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: 'dragonfly-core-password'
                key: 'password'
          REDIS_DBINDEX: '133'
        ports:
          - name: 'http'
            containerPort: 2283
        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '/api/server/ping'
                port: 'http'
          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '/api/server/ping'
                port: 'http'
      redis-proxy:
        {{- include "photos.haproxyContainer" . | nindent 8 }}

{{- range $runner := .Values.mlrunners }}
  {{- $controller := include "photos.mlControllerId" $runner }}
  {{ $controller }}:
    forceRename: '{{ include "photos.mlResourceName" (dict "name" $runner.name "release" $.Values.global.nameOverride) }}'
    strategy: Recreate
    pod:
      {{- with $runner.nodeSelector }}
      nodeSelector:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $runner.affinity }}
      affinity:
{{ toYaml . | nindent 8 }}
      {{- end }}
      {{- with $runner.tolerations }}
      tolerations:
{{ toYaml . | nindent 8 }}
      {{- end }}
      annotations:
        checksum/redis-proxy: {{ include "photos.redisProxyConfig" $ | sha256sum | squote }}
    containers:
      main:
        image:
          repository: 'ghcr.io/immich-app/immich-machine-learning'
          tag: {{ printf "%s-%s" $.Values.immich.version (include "photos.mlImageTag" $runner) | squote }}
        {{- with $runner.resources }}
        resources:
{{ toYaml . | nindent 10 }}
        {{- end }}
        env:
          TRANSFORMERS_CACHE: '/cache'
          HF_XET_CACHE: '/cache/huggingface-xet'
          MPLCONFIGDIR: '/cache/matplotlib-config'
          REDIS_HOSTNAME: '127.0.0.1'
          REDIS_PORT: '6379'
          REDIS_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: 'dragonfly-core-password'
                key: 'password'
        ports:
          - name: 'http'
            containerPort: 3003
      redis-proxy:
        {{- include "photos.haproxyContainer" $ | nindent 8 }}
{{- end }}

service:
  server:
    controller: 'server'
    primary: true
    ports:
      http:
        primary: true
        port: 2283
        targetPort: 'http'
        appProtocol: 'kubernetes.io/ws'
{{- range $runner := .Values.mlrunners }}
  {{ include "photos.mlControllerId" $runner }}:
    forceRename: '{{ include "photos.mlResourceName" (dict "name" $runner.name "release" $.Values.global.fullnameOverride) }}'
    controller: {{ include "photos.mlControllerId" $runner | squote }}
    ports:
      http:
        primary: true
        port: 3003
        targetPort: 'http'
{{- end }}

configMaps:
  redis-proxy:
    forceRename: '{{ printf "%s-redis-proxy" .Values.global.nameOverride }}'
    includeChecksumInControllers:
      - 'server'
{{- range $runner := .Values.mlrunners }}
      - {{ include "photos.mlControllerId" $runner | squote }}
{{- end }}
    data:
      haproxy.cfg: |
{{ include "photos.redisProxyConfig" . | nindent 8 }}

persistence:
  config:
    type: secret
    name: {{ required "immich.existingConfiguration is required" .Values.immich.existingConfiguration | squote }}
    items:
      - key: 'immich_config_yaml'
        path: 'immich-config.yaml'
    advancedMounts:
      server:
        main:
          - path: '/config'
            readOnly: true
  data:
    type: persistentVolumeClaim
    existingClaim: {{ required "immich.persistence.library.existingClaim is required" .Values.immich.persistence.library.existingClaim | squote }}
    advancedMounts:
      server:
        main:
          - path: '/data'
  cache:
    type: emptyDir
    advancedMounts:
{{- range $runner := .Values.mlrunners }}
      {{ include "photos.mlControllerId" $runner }}:
        main:
          - path: '/cache'
{{- end }}
  redis-proxy-config:
    type: configMap
    name: '{{ printf "%s-redis-proxy" .Values.global.nameOverride }}'
    advancedMounts:
      server:
        redis-proxy:
          - path: '/usr/local/etc/haproxy/haproxy.cfg'
            subPath: 'haproxy.cfg'
            readOnly: true
{{- range $runner := .Values.mlrunners }}
      {{ include "photos.mlControllerId" $runner }}:
        redis-proxy:
          - path: '/usr/local/etc/haproxy/haproxy.cfg'
            subPath: 'haproxy.cfg'
            readOnly: true
{{- end }}
  dri:
    type: hostPath
    hostPath: '/dev/dri'
    hostPathType: 'Directory'
    advancedMounts:
{{- range $runner := .Values.mlrunners }}
{{- if eq $runner.type "intel" }}
      {{ include "photos.mlControllerId" $runner }}:
        main:
          - path: '/dev/dri'
{{- end }}
{{- end }}

{{- end -}}

{{- $_ := mergeOverwrite .Values (include "photos.commonValues" . | fromYaml) -}}
{{ include "bjw-s.common.loader.generate" . }}
