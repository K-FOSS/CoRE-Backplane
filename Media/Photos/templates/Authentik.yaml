{{- if .Values.authentik.autoconfigure }}
{{- if not .Values.authentik.accessGroups }}
{{- fail "authentik.accessGroups must contain at least one group" }}
{{- end }}
apiVersion: tf.upbound.io/v1beta1
kind: Workspace
metadata:
  name: '{{ .Release.Name }}-authentik'
spec:
  providerConfigRef:
    name: 'authentik'
  writeConnectionSecretToRef:
    namespace: '{{ .Release.Namespace }}'
    name: 'photos-oidc'
  forProvider:
    source: 'Inline'
    module: | # hcl
      resource "random_password" "client_id" {
        length  = 64
        lower   = true
        numeric = true
        upper   = true
        special = false
      }

      resource "random_password" "client_secret" {
        length  = 128
        lower   = true
        numeric = true
        upper   = true
        special = true
      }

      data "authentik_flow" "authorization" {
        slug = "default-provider-authorization-implicit-consent"
      }
      data "authentik_flow" "invalidation" {
        slug = "default-provider-invalidation-flow"
      }
      data "authentik_property_mapping_provider_scope" "scopes" {
        managed_list = [
          "goauthentik.io/providers/oauth2/scope-email",
          "goauthentik.io/providers/oauth2/scope-openid",
          "goauthentik.io/providers/oauth2/scope-profile",
        ]
      }
      data "authentik_certificate_key_pair" "signing" {
        name = "tls"
      }
      resource "authentik_provider_proxy" "app" {
        name               = "{{ .Release.Name }}"
        mode               = "forward_single"
        external_host      = "{{ required "authentik.application.externalHost is required" .Values.authentik.application.externalHost }}"
        authorization_flow = data.authentik_flow.authorization.id
        invalidation_flow  = data.authentik_flow.invalidation.id
      }
      resource "authentik_application" "app" {
        name              = "{{ required "authentik.application.displayName is required" .Values.authentik.application.displayName }}"
        slug              = "{{ .Release.Name }}"
        group             = "{{ required "authentik.application.group is required" .Values.authentik.application.group }}"
        protocol_provider = authentik_provider_proxy.app.id
      }
      resource "authentik_provider_oauth2" "oidc" {
        name          = "{{ .Values.authentik.application.displayName }} OIDC"
        client_id     = random_password.client_id.result
        client_secret = random_password.client_secret.result
        client_type   = "confidential"
        signing_key   = data.authentik_certificate_key_pair.signing.id
        allowed_redirect_uris = [
          {
            matching_mode = "strict"
            url           = "https://photos.mylogin.space/auth/login"
          },
          {
            matching_mode = "strict"
            url           = "https://photos.mylogin.space/user-settings"
          },
          {
            matching_mode = "strict"
            url           = "app.immich:///oauth-callback"
          },
        ]
        property_mappings     = data.authentik_property_mapping_provider_scope.scopes.ids
        authorization_flow    = data.authentik_flow.authorization.id
        invalidation_flow     = data.authentik_flow.invalidation.id
        access_token_validity = "hours=8"
      }
      resource "authentik_application" "oidc" {
        name              = "{{ .Values.authentik.application.displayName }} OIDC"
        slug              = "photos-oidc"
        group             = "{{ required "authentik.application.group is required" .Values.authentik.application.group }}"
        meta_launch_url   = "https://photos.mylogin.space"
        protocol_provider = authentik_provider_oauth2.oidc.id
      }
      resource "authentik_application_entitlement" "access" {
        name        = "media-access"
        application = authentik_application.app.uuid
      }
      {{- range $index, $group := .Values.authentik.accessGroups }}
      data "authentik_group" "access_{{ $index }}" {
        name = "{{ $group }}"
      }
      resource "authentik_policy_binding" "entitlement_{{ $index }}" {
        target = authentik_application_entitlement.access.id
        group  = data.authentik_group.access_{{ $index }}.id
        order  = {{ $index }}
      }
      resource "authentik_policy_binding" "application_{{ $index }}" {
        target = authentik_application.app.uuid
        group  = data.authentik_group.access_{{ $index }}.id
        order  = {{ $index }}
      }
      resource "authentik_policy_binding" "oidc_{{ $index }}" {
        target = authentik_application.oidc.uuid
        group  = data.authentik_group.access_{{ $index }}.id
        order  = {{ $index }}
      }
      {{- end }}
      output "client_id" {
        value     = authentik_provider_oauth2.oidc.client_id
        sensitive = true
      }

      output "client_secret" {
        value     = random_password.client_secret.result
        sensitive = true
      }

      output "immich_config_yaml" {
        value = <<-EOT
          machineLearning:
            clip:
              modelName: '{{ required "immich.smartSearch.modelName is required" .Values.immich.smartSearch.modelName }}'
          oauth:
            enabled: true
            issuerUrl: 'https://idp.mylogin.space/application/o/photos-oidc/'
            clientId: '${random_password.client_id.result}'
            clientSecret: '${random_password.client_secret.result}'
            scope: 'openid email profile'
            tokenEndpointAuthMethod: 'client_secret_post'
            signingAlgorithm: 'RS256'
            profileSigningAlgorithm: 'none'
            autoRegister: true
            autoLaunch: false
            buttonText: 'Sign in with Authentik'
            storageLabelClaim: 'preferred_username'
            roleClaim: 'immich_role'
            mobileOverrideEnabled: false
        EOT
        sensitive = true
      }
{{- end }}
