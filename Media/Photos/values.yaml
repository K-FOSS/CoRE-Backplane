global:
  timezone: 'America/Vancouver'
  nameOverride: 'photos'
  fullnameOverride: 'photos'

mlrunners:
  - name: 'cuda'
    type: 'cuda'
    runtimeClassName: 'nvidia'
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: 'nvidia.com/gpu.count'
                  operator: 'Gt'
                  values:
                    - '0'
    tolerations:
      - operator: 'Exists'
    resources:
      limits:
        'nvidia.com/gpu': '1'
  - name: 'intel'
    type: 'intel'
    nodeSelector:
      'kubernetes.io/hostname': 'laptop2'

pubgateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

authentik:
  autoconfigure: true

  application:
    displayName: 'Immich Photos'
    externalHost: 'https://photos.mylogin.space'
    group: 'Media'

  accessGroups:
    - 'Media Consumers'

  route:
    # Immich must receive /auth/login and its callback directly so its native
    # OIDC flow can complete; do not place the route behind Authentik's Envoy
    # forward-auth policy.
    enabled: false
    backend:
      name: 'aaa-myloginspace-proxy'
      namespace: 'core-prod'
      port: 80

immich:
  version: 'v3.4.1'
  imageDigest: 'sha256:7c489add298fc2f92cda4c777de6462aa206877e04087b815f62c7664af0b53b'
  mlImageDigests:
    intel: 'sha256:97f60b06c5938c326d3ba416bcf24bc94d233f34554c05f3b76336f98ffd5ea9'
    cuda: 'sha256:a45780b161de250f49784d58c01f7c91c5a82542f50f1dd1956b5c11ebe5c7c6'
  smartSearch:
    modelName: 'ViT-SO400M-16-SigLIP2-384__webli'
  persistence:
    library:
      existingClaim: 'photos-library'
