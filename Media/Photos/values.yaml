global:
  timezone: 'America/Vancouver'

pubgateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

authentik:
  autoconfigure: true

  application:
    displayName: 'Immich Photos'
    externalHost: 'https://photos.mylogin.space'
    group: 'Media'

  accessGroups:
    - 'Media Consumers'

  route:
    enabled: true
    backend:
      name: 'aaa-myloginspace-proxy'
      namespace: 'core-prod'
      port: 80

immich:
  image:
    tag: 'v2.6.3'

  controllers:
    main:
      containers:
        main:
          env:
            DB_HOSTNAME: 'psql-local.{{ .Values.global.cluster.name }}.{{ .Values.global.datacenter }}.{{ .Values.global.region }}.mylogin.space'
            DB_PORT: '5432'
            DB_USERNAME:
              valueFrom:
                secretKeyRef:
                  name: 'photos'
                  key: 'username'
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: 'photos'
                  key: 'password'
            DB_DATABASE_NAME:
              valueFrom:
                secretKeyRef:
                  name: 'photos'
                  key: 'database'
            DB_VECTOR_EXTENSION: 'pgvector'
            TZ: '{{ .Values.global.timezone }}'
            REDIS_HOSTNAME: 'dragonfly-core.core-media.svc.cluster.local'
            REDIS_PORT: '6379'
            REDIS_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: 'dragonfly-core-password'
                  key: 'password'
            REDIS_DBINDEX: '133'

  immich:
    persistence:
      library:
        existingClaim: 'photos-library'

  valkey:
    enabled: false

  server:
    enabled: true

  machine-learning:
    enabled: true
