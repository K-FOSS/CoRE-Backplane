---
{{- include "bjw-s.common.loader.init" . }}

{{- define "app-template.hardcodedValues" -}}
# Set the nameOverride based on the release name if no override has been set
{{ if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{ end }}

defaultPodOptions:
  labels:
    logs: loki-myloginspace

controllers:
  #
  # SABnzbd
  #
  {{- if $.Values.sabnzbd.enabled }}
  sabnzbd:
    # For Deployments, valid values are Recreate (default) and RollingUpdate.
    # For StatefulSets, valid values are OnDelete and RollingUpdate (default).
    # DaemonSets/CronJobs ignore this.
    strategy: RollingUpdate

    name: sabnzbd

    containers:
      sabnzbd:
        image:
          repository: {{ $.Values.sabnzbd.image }}
          tag: {{ default "latest" $.Values.sabnzbd.tag }}
          pullPolicy: IfNotPresent

        {{- if $.Values.networks.rogers.enabled }}
        resources:
          limits:
            {{ required "networks.rogers.sriov.device is required when the Rogers network is enabled" $.Values.networks.rogers.sriov.device | squote }}: '1'
        {{- end }}

        ports:
          - name: http
            containerPort: 8080
  {{- end }}

  {{- if $.Values.prowlarr.enabled }}
  prowlarr:
    # For Deployments, valid values are Recreate (default) and RollingUpdate.
    # For StatefulSets, valid values are OnDelete and RollingUpdate (default).
    # DaemonSets/CronJobs ignore this.
    strategy: RollingUpdate

    name: prowlarr

    containers:
      prowlarr:
        image:
          repository: {{ $.Values.prowlarr.image }}
          tag: {{ default "latest" $.Values.prowlarr.tag }}
          pullPolicy: IfNotPresent

        ports:
          - name: http
            containerPort: 9696
  {{- end }}

  {{- if $.Values.filebrowser.enabled }}
  filebrowser:
    strategy: RollingUpdate

    name: filebrowser

    pod:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault

    containers:
      filebrowser:
        image:
          repository: {{ $.Values.filebrowser.image | squote }}
          tag: {{ required "filebrowser.tag is required" $.Values.filebrowser.tag | squote }}
          pullPolicy: IfNotPresent

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
          runAsNonRoot: true
          runAsUser: 911
          runAsGroup: 911

        env:
          FILEBROWSER_CONFIG: '/etc/filebrowser/config.yaml'
          FILEBROWSER_DATABASE: '/tmp/filebrowser/database.db'

        ports:
          - name: http
            containerPort: 8080
  {{- end }}

configMaps:
  {{- if $.Values.filebrowser.enabled }}
  filebrowser:
    enabled: true
    data:
      config.yaml: |
        server:
          port: 8080
          cacheDir: '/tmp/filebrowser/cache'
          sources:
            - path: '/downloads'
              name: 'Downloads'
              config:
                defaultEnabled: true
                private: true
        auth:
          methods:
            proxy:
              enabled: true
              header: 'X-authentik-username'
            password:
              enabled: false
  {{- end }}

persistence:
  {{- if .Values.sabnzbd.volumes.config.enabled }}
  sabnzbd-config:
    enabled: true
    type: persistentVolumeClaim 
    accessMode: ReadWriteOnce
    size: 2G
    advancedMounts:
      sabnzbd:
        sabnzbd:
          - path: /config
  {{- end }}

  {{- if .Values.prowlarr.volumes.config.enabled }}
  prowlarr-config:
    enabled: true
    type: persistentVolumeClaim 
    accessMode: ReadWriteOnce
    size: 2G
    advancedMounts:
      prowlarr:
        prowlarr:
          - path: /config
  {{- end }}

  {{- if .Values.filebrowser.enabled }}
  filebrowser-config:
    enabled: true
    type: configMap
    identifier: filebrowser
    advancedMounts:
      filebrowser:
        filebrowser:
          - path: /etc/filebrowser/config.yaml
            subPath: config.yaml
            readOnly: true
  {{- end }}

  {{- if .Values.sabnzbd.volumes.downloads.enabled }}
  downloads:
    enabled: true
    type: persistentVolumeClaim

    existingClaim: {{ .Values.tenant.name }}-downloads

    advancedMounts:
      sabnzbd: # the controller with the "main" identifier
        sabnzbd: # the container with the "main" identifier
          - path: /downloads
      {{- if and .Values.filebrowser.enabled .Values.filebrowser.volumes.downloads.enabled }}
      filebrowser:
        filebrowser:
          - path: /downloads
            readOnly: true
      {{- end }}
  {{- end }}

service:
  {{- if $.Values.sabnzbd.enabled }}
  sabnzbd:
    # -- Enables or disables the service
    enabled: true

    # -- Configure which controller this service should target
    controller: sabnzbd

    # -- Make this the primary service for this controller (used in probes, notes, etc...).
    # If there is more than 1 service targeting the controller, make sure that only 1 service is
    # marked as primary.
    primary: true

    # -- Set the service type
    type: ClusterIP

    # -- Specify the externalTrafficPolicy for the service. Options: Cluster, Local
    # -- [[ref](https://kubernetes.io/docs/tutorials/services/source-ip/)]
    #externalTrafficPolicy: Local

    # -- Specify the ip policy. Options: SingleStack, PreferDualStack, RequireDualStack
    ipFamilyPolicy:
    # -- The ip families that should be used. Options: IPv4, IPv6
    ipFamilies: []

    # -- Provide additional annotations which may be required.
    #annotations:

    # -- Provide additional labels which may be required.
    labels: {}

    # -- Allow adding additional match labels
    extraSelectorLabels: {}

    ports:
      http:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 service, make sure that only 1 port is marked as primary.
        primary: true

        # -- The port number
        port: 80

        targetPort: http

        # -- Port protocol.
        # Support values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        # HTTP and HTTPS spawn a TCP service and get used for internal URL and name generation
        protocol: TCP

        # -- Specify the appProtocol value for the Service.
        # [[ref]](https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol)
        appProtocol:  
  {{- end }}

  {{- if $.Values.prowlarr.enabled }}
  prowlarr:
    # -- Enables or disables the service
    enabled: true

    # -- Configure which controller this service should target
    controller: prowlarr

    # -- Make this the primary service for this controller (used in probes, notes, etc...).
    # If there is more than 1 service targeting the controller, make sure that only 1 service is
    # marked as primary.
    primary: false

    # -- Set the service type
    type: ClusterIP

    # -- Specify the externalTrafficPolicy for the service. Options: Cluster, Local
    # -- [[ref](https://kubernetes.io/docs/tutorials/services/source-ip/)]
    #externalTrafficPolicy: Local

    # -- Specify the ip policy. Options: SingleStack, PreferDualStack, RequireDualStack
    ipFamilyPolicy:
    # -- The ip families that should be used. Options: IPv4, IPv6
    ipFamilies: []

    # -- Provide additional annotations which may be required.
    #annotations:

    # -- Provide additional labels which may be required.
    labels: {}

    # -- Allow adding additional match labels
    extraSelectorLabels: {}

    ports:
      http:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 service, make sure that only 1 port is marked as primary.
        primary: true

        # -- The port number
        port: 80

        targetPort: http

        # -- Port protocol.
        # Support values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        # HTTP and HTTPS spawn a TCP service and get used for internal URL and name generation
        protocol: TCP

        # -- Specify the appProtocol value for the Service.
        # [[ref]](https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol)
        appProtocol:  
  {{- end }}

  {{- if $.Values.filebrowser.enabled }}
  filebrowser:
    enabled: true
    controller: filebrowser
    primary: false
    type: ClusterIP
    ports:
      http:
        enabled: true
        primary: true
        port: 80
        targetPort: http
        protocol: TCP
  {{- end }}


route:
  {{- if .Values.sabnzbd.enabled }}
  sabnzbd:
    # -- Enables or disables the route
    enabled: true

    # Preserve the existing route identity when additional routes are enabled.
    forceRename: '{{ .Release.Name }}'

    # -- Set the route kind
    # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
    kind: HTTPRoute

    # -- Provide additional labels which may be required.
    labels:
      wan-mode: 'public'
      lan-mode: 'private'

    hostnames:
      - 'nzb.mylogin.space'

    # -- Configure the resource the route attaches to.
    parentRefs:
      - # Group of the referent resource.
        group: gateway.networking.k8s.io

        # Kind of the referent resource.
        kind: Gateway

        # Name of the referent resource
        name: {{ $.Values.pubgateway.name }}

        sectionName: {{ $.Values.pubgateway.sectionName }}

        # Namespace of the referent resource
        namespace: {{ $.Values.pubgateway.namespace }}

    # -- Configure rules for routing. Defaults to the primary service.
    rules:
      - backendRefs:
          - kind: Service
            port: 80
            identifier: sabnzbd
            weight: 1
  {{- end }}

  {{- if .Values.prowlarr.enabled }}
  prowlarr:
    enabled: true
    kind: HTTPRoute

    labels:
      wan-mode: 'public'
      lan-mode: 'private'

    hostnames:
      - 'prowlarr.mylogin.space'

    parentRefs:
      - group: 'gateway.networking.k8s.io'
        kind: Gateway
        name: '{{ $.Values.pubgateway.name }}'
        sectionName: '{{ $.Values.pubgateway.sectionName }}'
        namespace: '{{ $.Values.pubgateway.namespace }}'

    rules:
      - backendRefs:
          - kind: Service
            port: 80
            identifier: 'prowlarr'
            weight: 1
  {{- end }}

  {{- if .Values.filebrowser.enabled }}
  filebrowser:
    enabled: true
    kind: HTTPRoute

    labels:
      wan-mode: 'public'
      lan-mode: 'private'

    hostnames:
      - {{ required "filebrowser.host is required" .Values.filebrowser.host | squote }}

    parentRefs:
      - group: 'gateway.networking.k8s.io'
        kind: Gateway
        name: '{{ $.Values.pubgateway.name }}'
        sectionName: '{{ $.Values.pubgateway.sectionName }}'
        namespace: '{{ $.Values.pubgateway.namespace }}'

    rules:
      - backendRefs:
          - kind: Service
            port: 80
            identifier: 'filebrowser'
            weight: 1
  {{- end }}

{{- end -}}
{{- $_ := mergeOverwrite .Values (include "app-template.hardcodedValues" . | fromYaml) -}}

{{/* Render the templates */}}
{{ include "bjw-s.common.loader.generate" . }}
