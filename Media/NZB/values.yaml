pubgateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

authentik:
  autoconfigure: true

  application:
    displayName: 'SABnzbd'
    externalHost: 'https://nzb.mylogin.space'
    group: 'Media'

  applications:
    prowlarr:
      enabled: true
      displayName: 'Prowlarr'
      externalHost: 'https://prowlarr.mylogin.space'
      group: 'Media'

    filebrowser:
      enabled: true
      displayName: 'Downloads'
      externalHost: 'https://downloads.mylogin.space'
      group: 'Media'

  accessGroups:
    - 'Media Consumers'

  route:
    enabled: true

    backend:
      name: 'aaa-myloginspace-proxy'
      namespace: 'core-prod'
      port: 80

tenant:
  name: example-tenant

sabnzbd:
  enabled: true

  image: linuxserver/sabnzbd
  tag: latest


  volumes:
    config:
      enabled: true

    downloads:
      enabled: true

prowlarr:
  enabled: true

  image: linuxserver/prowlarr
  tag: latest

  volumes:
    config:
      enabled: true

filebrowser:
  enabled: true

  image: 'gtstef/filebrowser'
  tag: '1.5.3-stable@sha256:e2ac55ccbe53d63b3f1d7d5ea5b82edf589b005a4b747b59912f97c6ba4f969e'

  host: 'downloads.mylogin.space'

  volumes:
    downloads:
      enabled: true

networks:
  rogers:
    enabled: true
    sriov:
      device: 'intel.com/intel_x540_netdevice_port0'
      vlan: 150
