pubgateway:
  name: main-gw
  namespace: core-prod
  sectionName: mylogin-https

authentik:
  autoconfigure: true

  application:
    displayName: 'SABnzbd'
    externalHost: 'https://nzb.mylogin.space'
    group: 'Media'

  accessGroups:
    - 'Media Consumers'

  route:
    enabled: true

    backend:
      name: 'aaa-myloginspace-proxy'
      namespace: 'core-prod'
      port: 80

tenant:
  name: example-tenant

sabnzbd:
  enabled: true

  image: linuxserver/sabnzbd
  tag: latest


  volumes:
    config:
      enabled: true

    downloads:
      enabled: true

prowlarr:
  enabled: true

  image: linuxserver/prowlarr
  tag: latest

  volumes:
    config:
      enabled: true

networks:
  rogers:
    enabled: true
    sriov:
      device: 'intel.com/intel_x540_netdevice_port0'
      vlan: 150
