pubgateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

authentik:
  autoconfigure: true

  application:
    displayName: 'SABnzbd'
    externalHost: 'https://nzb.mylogin.space'
    group: 'Media'

  applications:
    prowlarr:
      enabled: true
      displayName: 'Prowlarr'
      externalHost: 'https://prowlarr.mylogin.space'
      group: 'Media'

    filebrowser:
      enabled: true
      displayName: 'Downloads'
      externalHost: 'https://downloads.mylogin.space'
      group: 'Media'

  accessGroups:
    - 'Media Consumers'

  route:
    enabled: true

    backend:
      name: 'aaa-myloginspace-proxy'
      namespace: 'core-prod'
      port: 80

tenant:
  name: example-tenant

sabnzbd:
  enabled: true

  image: linuxserver/sabnzbd
  tag: '5.1.3-ls278@sha256:3ac1c9ea03bafa2588dd8acdcb809857bae305e71d2d90e11d689c78076a9c01'

  userId: '911'
  groupId: '911'

  health:
    enabled: true
    path: '/api?mode=version'

    startup:
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 60

    readiness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

    liveness:
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

  volumes:
    config:
      enabled: true

    downloads:
      enabled: true

prowlarr:
  enabled: true

  image: linuxserver/prowlarr
  tag: '2.6.5.5623-ls165@sha256:b3b00047ed20f6ce2b16780145cb6a0acb51c9e28ea6aa6f5dcd33c7034f1797'

  health:
    enabled: true
    path: '/ping'

    startup:
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 60

    readiness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6

    liveness:
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3

  userId: '911'
  groupId: '911'

  volumes:
    config:
      enabled: true

filebrowser:
  enabled: true

  image: 'gtstef/filebrowser'
  tag: '1.5.3-stable@sha256:e2ac55ccbe53d63b3f1d7d5ea5b82edf589b005a4b747b59912f97c6ba4f969e'

  host: 'downloads.mylogin.space'

  volumes:
    downloads:
      enabled: true

networks:
  rogers:
    enabled: true
    sriov:
      device: 'intel.com/intel_x540_netdevice_port0'
      vlan: 150
