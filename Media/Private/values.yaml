tenant:
  name: example-tenant

pubgateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

authentik:
  autoconfigure: true

  application:
    displayName: 'MeTube'
    externalHost: 'https://metube.accessmyporn.download'
    group: 'Media'

  applications:
    whisparr:
      displayName: 'Whisparr'
      externalHost: 'https://whisparr.accessmyporn.download'
      group: 'Media'

  accessGroups:
    - 'Media Consumers'

  route:
    enabled: true

    backend:
      name: 'aaa-myloginspace-proxy'
      namespace: 'core-prod'
      port: 80

whisparr:
  enabled: true

  image: 'ghcr.io/hotio/whisparr'

  tag: '3.6.5-release.1886@sha256:c21ee73285865bb89ccea37aa01bc403744bb2697898689aed03f24e85ff58cf'

  userId: 911
  groupId: 911

  volumes:
    config:
      enabled: true

      size: 5G

    downloads:
      enabled: true

      external: true

    media:
      enabled: true

      external: true

metube:
  enabled: true

  image: 'ghcr.io/alexta69/metube'

  tag: '2025.12.05@sha256:fe87482a11a86071093438cfb53f6cdcd9c648c248bccc88f3535bd275166fc8'

  userId: 911
  groupId: 911

  volumes:
    config:
      enabled: false

      size: 5G

    media:
      enabled: true

      external: true
