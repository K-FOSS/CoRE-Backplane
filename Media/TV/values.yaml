tenant:
  name: example-tenant

pubgateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

authentik:
  autoconfigure: true

  application:
    displayName: 'Sonarr'
    externalHost: 'https://tv.mylogin.space'
    group: 'Media'

  accessGroups:
    - 'Media Consumers'

  route:
    enabled: true

    backend:
      name: 'aaa-myloginspace-proxy'
      namespace: 'core-prod'
      port: 80

user:
  uid: 911
  gid: 911

global:
  timezone: America/Vancouver

sonarr:
  enabled: true

  image: mdhiggins/sonarr-sma

  digest: sha256:95c3587445db1a2cea7ddee6a3ad0dd8c13f3c4131fdfbc828ffbe846f4ed7c4

  tag: latest

  volumes:
    config:
      enabled: true

      size: 5G

    media:
      enabled: true

      external: true

    downloads:
      enabled: true

      external: true

crossplane:
  enabled: true

  jellyfin:
    enabled: true

    provider:
      name: test

prefetcharr:
  enabled: true

  image: phueber/prefetcharr

  tag: '1.3.0'
