tenant:
  name: example-tenant

pubgateway:
  name: main-gw
  namespace: core-prod
  sectionName: 'https-myloginspace'

authentik:
  autoconfigure: true
  application:
    displayName: 'Chaptarr'
    externalHost: 'https://books.mylogin.space'
    group: 'Media'
  accessGroups:
    - 'Media Consumers'
  route:
    enabled: true
    backend:
      name: 'aaa-myloginspace-proxy'
      namespace: core-prod
      port: 80

user:
  uid: 911
  gid: 911

global:
  timezone: 'America/Vancouver'

chaptarr:
  enabled: true
  image: 'docker.io/chaptarr/chaptarr'
  tag: 'latest'
  digest: 'sha256:bb00d67cbe1485d1cd61ef178362a29b42aa08f86b290841aab4b115ad2647a6'
  volumes:
    config:
      enabled: true
    media:
      enabled: true
    downloads:
      enabled: true
    books:
      enabled: false
      size: ''
