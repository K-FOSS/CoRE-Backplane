tenant:
  name: example-tenant

pubgateway:
  name: main-gw
  namespace: core-prod
  sectionName: https-myloginspace

authentik:
  autoconfigure: true

  application:
    displayName: 'Radarr'
    externalHost: 'https://movies.mylogin.space'
    group: 'Media'

  accessGroups:
    - 'Media Consumers'

  route:
    enabled: true

    backend:
      name: 'aaa-myloginspace-proxy'
      namespace: 'core-prod'
      port: 80

radarr:
  enabled: true

  image: 'linuxserver/radarr'

  tag: '6.4.4.10685-ls324@sha256:084b3b2ab1d0ef930660727259546a241f2bdf67c9ed085d54bf1486a6887c9b'

  volumes:
    config:
      enabled: true

      size: 2G

    downloads:
      enabled: true

      external: true

    media:
      enabled: true

      external: true
