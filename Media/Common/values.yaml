tenant:
  name: example-tenant

pubgateway:
  name: 'main-gw'
  namespace: 'core-prod'
  sectionName: 'https-myloginspace'

authentik:
  autoconfigure: true

  application:
    displayName: 'Bazarr'
    externalHost: 'https://bazarr.mylogin.space'
    group: 'Media'

  applications:
    unmanic:
      displayName: 'Unmanic'
      externalHost: 'https://unmanic.mylogin.space'
      group: 'Media'

  accessGroups:
    - 'Media Consumers'

  route:
    enabled: true

    backend:
      name: 'aaa-myloginspace-proxy'
      namespace: 'core-prod'
      port: 80

volumes:
  enabled: true

  downloads:
    enabled: true

    size: '200001191936'

  media:
    enabled: true

    size: '300001787904'

flaresolverr:
  enabled: true

  image: ghcr.io/flaresolverr/flaresolverr
  tag: latest

  volumes:
    config:
      enabled: true

      size: 5G

bazarr:
  enabled: true

  image: 'lscr.io/linuxserver/bazarr'
  tag: 'latest@sha256:a20fb11a440d704a9d61c283aa26462aad33dc63223b173f8d8c77d33e8e9d59'

  volumes:
    config:
      enabled: true

      size: 5G

unmanic:
  enabled: true
  image: 'josh5/unmanic'
  tag: '0.4.1'
  volumes:
    config:
      enabled: true
      size: 5G
    cache:
      enabled: true
      size: 20G

scraparr:
  enabled: true

  image: 'ghcr.io/thecfu/scraparr'
  tag: '3.1.0'

  # This Secret must contain SONARR_API_KEY, RADARR_API_KEY,
  # PROWLARR_API_KEY, and BAZARR_API_KEY. It is provisioned outside Git.
  apiKeysSecret: 'scraparr-api-keys'

  monitoring:
    enabled: true
    interval: '5m'
