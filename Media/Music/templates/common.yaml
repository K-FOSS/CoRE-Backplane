---
{{- include "bjw-s.common.loader.init" . }}

{{- define "app-template.hardcodedValues" -}}
# Set the nameOverride based on the release name if no override has been set
{{ if not .Values.global.nameOverride }}
global:
  nameOverride: "{{ .Release.Name }}"
{{ end }}

controllers:
  #
  # Lidarr
  #
  {{- if $.Values.lidarr.enabled }}
  lidarr:
    # For Deployments, valid values are Recreate (default) and RollingUpdate.
    # For StatefulSets, valid values are OnDelete and RollingUpdate (default).
    # DaemonSets/CronJobs ignore this.
    strategy: Recreate

    name: lidarr

    pod:
      labels:
        mylogin.space/media-volume-affinity: {{ .Values.tenant.name | squote }}
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    mylogin.space/media-volume-affinity: {{ .Values.tenant.name | squote }}
                topologyKey: 'kubernetes.io/hostname'

    containers:
      lidarr:
        image:
          repository: {{ $.Values.lidarr.image }}
          tag: {{ default "latest" $.Values.lidarr.tag }}
          pullPolicy: IfNotPresent

        ports:
          - name: http
            containerPort: 8686

        env:
          - name: PUID
            value: '{{ .Values.user.uid }}'

          - name: PGID
            value: '{{ .Values.user.gid }}'

          - name: TZ
            value: '{{ .Values.global.timezone }}'
  {{- end }}

  #
  # YouTube trusted session generator
  #
  {{- if $.Values.youtubeSessionGenerator.enabled }}
  yt-session:
    strategy: 'RollingUpdate'

    name: 'yt-session'

    pod:
      automountServiceAccountToken: false

      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: 'RuntimeDefault'

    containers:
      yt-session:
        image:
          repository: '{{ required "youtubeSessionGenerator.image.repository is required" $.Values.youtubeSessionGenerator.image.repository }}'
          tag: '{{ required "youtubeSessionGenerator.image.tag is required" $.Values.youtubeSessionGenerator.image.tag }}'
          pullPolicy: 'IfNotPresent'

        ports:
          - name: 'http'
            containerPort: {{ $.Values.youtubeSessionGenerator.port }}

        probes:
          liveness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '/ping'
                port: 'http'
              periodSeconds: 30
              timeoutSeconds: 5
              failureThreshold: 3

          readiness:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '/ping'
                port: 'http'
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 3

          startup:
            enabled: true
            custom: true
            spec:
              httpGet:
                path: '/ping'
                port: 'http'
              periodSeconds: 5
              timeoutSeconds: 5
              failureThreshold: 30

        resources:
          requests:
            cpu: '10m'
            memory: '64Mi'
          limits:
            memory: '256Mi'

        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - 'ALL'
          readOnlyRootFilesystem: true
  {{- end }}

persistence:
  {{- if .Values.lidarr.volumes.config.enabled }}
  lidarr-config:
    enabled: true
    type: persistentVolumeClaim 
    accessMode: ReadWriteOnce
    size: 2G
    advancedMounts:
      lidarr:
        lidarr:
          - path: /config
  {{- end }}

  {{- if .Values.lidarr.volumes.media.enabled }}
  media:
    enabled: true
    type: persistentVolumeClaim

    existingClaim: {{ .Values.tenant.name }}-media

    advancedMounts:
      lidarr:
        lidarr:
          - path: /Media
  {{- end }}

  {{- if .Values.lidarr.volumes.downloads.enabled }}
  downloads:
    enabled: true
    type: persistentVolumeClaim

    existingClaim: {{ .Values.tenant.name }}-downloads

    advancedMounts:
      lidarr:
        lidarr:
          - path: /downloads
  {{- end }}

service:
  {{- if $.Values.lidarr.enabled }}
  lidarr:
    # -- Enables or disables the service
    enabled: true

    # -- Configure which controller this service should target
    controller: lidarr

    # -- Make this the primary service for this controller (used in probes, notes, etc...).
    # If there is more than 1 service targeting the controller, make sure that only 1 service is
    # marked as primary.
    primary: true

    # -- Set the service type
    type: ClusterIP

    # -- Specify the externalTrafficPolicy for the service. Options: Cluster, Local
    # -- [[ref](https://kubernetes.io/docs/tutorials/services/source-ip/)]
    #externalTrafficPolicy: Local

    # -- Specify the ip policy. Options: SingleStack, PreferDualStack, RequireDualStack
    ipFamilyPolicy:
    # -- The ip families that should be used. Options: IPv4, IPv6
    ipFamilies: []

    # -- Provide additional annotations which may be required.
    #annotations:

    # -- Provide additional labels which may be required.
    labels: {}

    # -- Allow adding additional match labels
    extraSelectorLabels: {}

    ports:
      http:
        # -- Enables or disables the port
        enabled: true

        # -- Make this the primary port (used in probes, notes, etc...)
        # If there is more than 1 service, make sure that only 1 port is marked as primary.
        primary: true

        # -- The port number
        port: 80

        targetPort: http

        # -- Port protocol.
        # Support values are `HTTP`, `HTTPS`, `TCP` and `UDP`.
        # HTTP and HTTPS spawn a TCP service and get used for internal URL and name generation
        protocol: TCP

        # -- Specify the appProtocol value for the Service.
        # [[ref]](https://kubernetes.io/docs/concepts/services-networking/service/#application-protocol)
        appProtocol:  
  {{- end }}

  {{- if $.Values.youtubeSessionGenerator.enabled }}
  yt-session:
    enabled: true
    controller: 'yt-session'
    primary: true
    type: 'ClusterIP'

    ports:
      http:
        enabled: true
        primary: true
        port: {{ $.Values.youtubeSessionGenerator.port }}
        targetPort: 'http'
        protocol: 'HTTP'
        appProtocol: 'http'
  {{- end }}

route:
  {{- if .Values.lidarr.enabled }}
  lidarr:
    # -- Enables or disables the route
    enabled: true

    # -- Set the route kind
    # Valid options are GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
    kind: HTTPRoute

    # -- Provide additional labels which may be required.
    labels:
      wan-mode: 'public'
      lan-mode: 'private'

    hostnames:
      - 'music.mylogin.space'

    # -- Configure the resource the route attaches to.
    parentRefs:
      - # Group of the referent resource.
        group: gateway.networking.k8s.io

        # Kind of the referent resource.
        kind: Gateway

        # Name of the referent resource
        name: {{ $.Values.pubgateway.name }}

        sectionName: {{ $.Values.pubgateway.sectionName }}

        # Namespace of the referent resource
        namespace: {{ $.Values.pubgateway.namespace }}

    # -- Configure rules for routing. Defaults to the primary service.
    rules:
      - backendRefs:
          - kind: Service
            port: 80
            identifier: lidarr
            weight: 1
  {{- end }}

{{- end -}}
{{- $_ := mergeOverwrite .Values (include "app-template.hardcodedValues" . | fromYaml) -}}

{{/* Render the templates */}}
{{ include "bjw-s.common.loader.generate" . }}
