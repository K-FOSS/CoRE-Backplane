apiVersion: v1
kind: ConfigMap
metadata:
  name: '{{ .Release.Name }}-file-browser'
  labels:
    app.kubernetes.io/name: '{{ .Chart.Name }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/component: 'file-browser'
data:
  nginx.conf: |
    events {}

    http {
      server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        location / {
          try_files $uri $uri/ =404;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: '{{ .Release.Name }}-file-browser'
  labels:
    app.kubernetes.io/name: '{{ .Chart.Name }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/component: 'file-browser'
spec:
  replicas: {{ .Values.fileBrowser.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: '{{ .Chart.Name }}'
      app.kubernetes.io/instance: '{{ .Release.Name }}'
      app.kubernetes.io/component: 'file-browser'
  template:
    metadata:
      labels:
        app.kubernetes.io/name: '{{ .Chart.Name }}'
        app.kubernetes.io/instance: '{{ .Release.Name }}'
        app.kubernetes.io/component: 'file-browser'
    spec:
      containers:
        - name: 'file-browser'
          image: '{{ .Values.fileBrowser.image }}'
          imagePullPolicy: 'IfNotPresent'
          args: ['nginx', '-c', '/etc/nginx/nginx.conf', '-g', 'daemon off;']
          ports:
            - name: 'http'
              containerPort: {{ .Values.fileBrowser.port }}
              protocol: 'TCP'
          readinessProbe:
            tcpSocket:
              port: 'http'
          livenessProbe:
            tcpSocket:
              port: 'http'
          volumeMounts:
            - name: 'data'
              mountPath: '{{ .Values.fileBrowser.mountPath }}'
              readOnly: true
            - name: 'config'
              mountPath: '/etc/nginx/nginx.conf'
              subPath: 'nginx.conf'
              readOnly: true
      volumes:
        - name: 'data'
          persistentVolumeClaim:
            claimName: '{{ .Release.Name }}'
        - name: 'config'
          configMap:
            name: '{{ .Release.Name }}-file-browser'
---
apiVersion: v1
kind: Service
metadata:
  name: '{{ .Release.Name }}-file-browser'
  labels:
    app.kubernetes.io/name: '{{ .Chart.Name }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/component: 'file-browser'
spec:
  type: 'ClusterIP'
  selector:
    app.kubernetes.io/name: '{{ .Chart.Name }}'
    app.kubernetes.io/instance: '{{ .Release.Name }}'
    app.kubernetes.io/component: 'file-browser'
  ports:
    - name: 'http'
      port: {{ .Values.fileBrowser.port }}
      targetPort: 'http'
      protocol: 'TCP'
