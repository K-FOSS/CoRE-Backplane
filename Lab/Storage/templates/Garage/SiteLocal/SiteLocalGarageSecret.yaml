{{- if .Values.siteLocalGarage.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-bootstrap" .Values.siteLocalGarage.name | squote }}
  namespace: {{ .Release.Namespace | squote }}
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  refreshInterval: '1h'
  secretStoreRef:
    kind: {{ .Values.siteLocalGarage.secretStoreRef.kind | squote }}
    name: {{ .Values.siteLocalGarage.secretStoreRef.name | squote }}
  target:
    name: {{ printf "%s-bootstrap" .Values.siteLocalGarage.name | squote }}
    creationPolicy: 'Owner'
  data:
    - secretKey: 'admin-token'
      remoteRef:
        key: {{ .Values.siteLocalGarage.remoteKey | squote }}
        property: {{ .Values.siteLocalGarage.adminTokenProperty | squote }}
    - secretKey: 'rpc-secret'
      remoteRef:
        key: {{ .Values.siteLocalGarage.remoteKey | squote }}
        property: {{ .Values.siteLocalGarage.rpcSecretProperty | squote }}
{{- end }}
{{- include "lab-storage.values.init" . -}}
